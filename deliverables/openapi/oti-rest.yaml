openapi: 3.1.0
info:
  title: OTI — Search offers, Lock offer & Get package (REST)
  version: 0.1.0-draft
  description: >-
    OSDM 3.7.1-compatible REST variant of the OTI API.
    Exposes three endpoints:
    - POST /offers — search for available offers
    - POST /locked-offers — lock a previously found offer
    - GET  /packages/{packageId} — retrieve a package with optional policy context

    Request and response schemas are shared with the OGC variant via oti.yaml.
  contact:
    name: OTI working group
    url: https://github.com/UnionInternationalCheminsdeFer/OSDM
  license:
    name: EUPL-1.2
    url: https://eupl.eu/1.2/en/

servers: []

security:
  - BearerAuth: []

tags:
  - name: Search offers
    description: Search for available offers for a given trip and set of travelling entities.
  - name: Lock offer
    description: Lock a previously found offer to reserve it pending confirmation.
  - name: Get package
    description: Retrieve a package by its identifier, with policy-controlled attribute context.

paths:
  /offers:
    post:
      summary: Search offers
      description: >-
        OSDM 3.7.1 — POST /offers.
        Returns SALES OFFER PACKAGEs matching the traveller's trip context,
        PASSENGER TYPEs, and FARE CONDITIONS.
      operationId: searchOffers
      tags:
        - Search offers
      parameters:
        - $ref: ./components/parameters/acceptLanguage.yaml
        - $ref: ./components/parameters/traceState.yaml
      requestBody:
        $ref: ./components/requestBodies/SearchOfferRequest.yaml
      responses:
        '200':
          $ref: ./components/responses/SearchOfferDelivery.yaml
        '400':
          description: Bad request — the request body is invalid or missing required fields.
          content:
            application/json:
              schema:
                $ref: ./components/schemas/WarningList.yaml
        '401':
          description: Unauthorized — missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: ./components/schemas/WarningList.yaml
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: ./components/schemas/WarningList.yaml
        default:
          $ref: ./components/responses/WarningList.yaml

  /locked-offers:
    post:
      summary: Lock offer
      description: >-
        Locks a previously found offer, reserving it for a limited time pending confirmation.
        Optionally selects specific allocations and ancillary services.
        Returns the locked offer with a lock expiry time.
      operationId: lockOffer
      tags:
        - Lock offer
      parameters:
        - $ref: ./components/parameters/acceptLanguage.yaml
        - $ref: ./components/parameters/traceState.yaml
      requestBody:
        $ref: ./components/requestBodies/LockOfferRequest.yaml
      responses:
        '201':
          $ref: ./components/responses/LockOfferDelivery.yaml
        '400':
          description: Bad request — the request body is invalid or missing required fields.
          content:
            application/json:
              schema:
                $ref: ./components/schemas/WarningList.yaml
        '401':
          description: Unauthorized — missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: ./components/schemas/WarningList.yaml
        '404':
          description: The referenced offer does not exist or has already expired.
          content:
            application/json:
              schema:
                $ref: ./components/schemas/WarningList.yaml
        '409':
          description: Conflict — the offer has already been locked or is no longer available.
          content:
            application/json:
              schema:
                $ref: ./components/schemas/WarningList.yaml
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: ./components/schemas/WarningList.yaml
        default:
          $ref: ./components/responses/WarningList.yaml

  /packages/{packageId}:
    get:
      summary: Get package
      description: >-
        Retrieves a specific package by its identifier.

        The optional `context` query parameter controls which attribute groups are included
        in the response:
        - `offer`     — travel rights, ancillaries, allocations, selectable options,
                        required information.
        - `operation` — sections, trip patterns, travelling entities, guarantees.
        - `financial` — prices, fees, taxes.
        - `full`      — all attribute groups (default when the parameter is absent).

        Multiple context values may be combined.
      operationId: getPackage
      tags:
        - Get package
      parameters:
        - $ref: ./components/parameters/acceptLanguage.yaml
        - $ref: ./components/parameters/traceState.yaml
        - name: packageId
          in: path
          required: true
          description: Identifier of the package to retrieve.
          schema:
            type: string
        - name: version
          in: query
          required: false
          description: >-
            Version of the package to retrieve.
            If omitted, the latest version is returned.
          schema:
            type: string
        - name: context
          in: query
          required: false
          description: >-
            Comma-separated list of attribute-group contexts to include in the response.
            Allowed values: offer, operation, financial, full.
            Defaults to full when absent.
          schema:
            type: array
            items:
              type: string
              enum:
                - offer
                - operation
                - financial
                - full
            uniqueItems: true
            default:
              - full
          style: form
          explode: false
      responses:
        '200':
          $ref: ./components/responses/PackageDelivery.yaml
        '400':
          description: Bad request — invalid path or query parameters.
          content:
            application/json:
              schema:
                $ref: ./components/schemas/WarningList.yaml
        '401':
          description: Unauthorized — missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: ./components/schemas/WarningList.yaml
        '404':
          description: No package with the given identifier exists.
          content:
            application/json:
              schema:
                $ref: ./components/schemas/WarningList.yaml
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: ./components/schemas/WarningList.yaml
        default:
          $ref: ./components/responses/WarningList.yaml

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT Bearer token. Supply as "Authorization: Bearer <token>" on every request.
