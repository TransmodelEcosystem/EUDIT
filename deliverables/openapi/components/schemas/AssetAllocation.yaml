allOf:
- $ref: ./Allocation.yaml
- type: object
  additionalProperties: false
  description: ASSET ALLOCATION — a package element for an allocation to an addressable asset (e.g. a specific vehicle, parking spot, ...).
  required:
  - packageElementType
  - assetRef
  properties:
    packageElementType:
      type: string
      const: assetAllocation
    assetRef:
      type: string
      description: Reference to the addressable asset being allocated.
    typeOfAsset:
      type: string
      description: Category of the asset (operator-defined lookup).