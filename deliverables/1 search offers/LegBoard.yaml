type: object
required:
  - stopPointRef
  - stopPointName
  - serviceDepartureTime
properties:
  pickupLocation:
    type: string
    format: place-ref
    description: Reference to the pickup location for the leg
  serviceDepartureTime:
    type: string
    format: date-time
    description: The departure time from the pickup location. Local time zone should be used.
  stopPointName:
    type: string
    description: Name of the stop point where the leg starts
  stopPointRef:
    type: string
    format: stop-point-ref
    description: Reference to the stop point where the leg starts
  trainNumbers:
    type: array
    items:
      type: string
      format: train-number
    description: List of train numbers associated with this leg, if applicable
examples:
- {
    "pickupLocation": "PLACE-123",
    "serviceDepartureTime": "2024-06-15T14:00:00Z",
    "stopPointName": "Central Station",
    "stopPointRef": "STOP-456",
    "trainNumbers": ["1234", "5678"]
  }