allOf:
  - $ref: ./Package.yaml
  - type: object
    properties:
      status:
        type: string
        const: offered
      placeHolders:
        type: array
        items:
          oneOf:
            - $ref: .\PersonalDetailPlaceHolder.yaml
            - $ref: .\AncillaryPlaceHolder.yaml
            - $ref: .\AllocationPlaceHolder.yaml
          discriminator:
            propertyName: placeHolderType
            mapping:
              personalDetail: .\PersonalDetailPlaceHolder.yaml
              ancillary: .\AncillaryPlaceHolder.yaml
              allocation: .\AllocationPlaceHolder.yaml
example:
  { 
    "packageId": "pkg-123",
    "summary": "This is a sample offered package.",
    "name": "Sample Package",
    "status": "offered",
    "minimumPrice": { "amount": 100.00, "currency": "USD" },
    "trip": { 
      "tripId": "trip-456",
      "legs": [
        { "legType": "timed",
          "journeyRef": "journey-789",
          "operatingDayRef": "Monday",
          "start": { "stopPointRef": "stop-001", "scheduledTime": "2024-06-01T08:00:00Z" },
          "end": { "stopPointRef": "stop-002", "scheduledTime": "2024-06-01T09:00:00Z" } 
        }
      ]
    },
    "placeHolders": [
      {
        "placeHolderType": "personalDetail",
        "travellingEntity": "Traveller-01",
        "fieldName": "fullName",
        "required": true
      }
    ]
  }

