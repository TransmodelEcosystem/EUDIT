type: object
required:
  - stopPointRef
  - stopPointName
  - serviceArrivalTimetabledTime
properties:
  setDownLocation:
    type: string
    format: place-ref
    description: Reference to the drop-off location for the leg
  serviceArrivalTimetabledTime:
    type: string
    format: date-time
    description: The arrival time at the drop-off location. Local time zone should be used.
  stopPointName:
    type: string
    description: Name of the stop point where the leg ends
  stopPointRef:
    type: string
    format: stop-point-ref
    description: Reference to the stop point where the leg ends
examples:
- {
    "setDownLocation": "PLACE-456",
    "serviceArrivalTimetabledTime": "2024-06-15T14:30:00Z",
    "stopPointName": "Central Station",
    "stopPointRef": "STOP-789"
  }