allOf:
  - $ref: .\Leg.yaml
  - type: object
    properties:
      legType:
        type: string
        description: discriminator for the leg type
        const: continuous
      continuousMode:
        type: string
        enum: []
      duration:
        type: integer
        description: Duration of the leg in minutes
      individualMode:
        type: string
        enum: []
      startPlace:
        type: string
        format: place-ref
      endPlace:
        type: string
        format: place-ref
examples:
- {
    "legType": "continuous",
    "duration": 120,
    "startPlace": "PLACE-123",
    "endPlace": "PLACE-456"
  }