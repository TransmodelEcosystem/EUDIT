allOf:
- $ref: .\Request.yaml
- type: object
  properties:
    trip:
      $ref: .\Trip.yaml
    context:
      $ref: .\TripContext.yaml
    requestedSections:
      type: array
      items:
        $ref: .\TripPatternSection.yaml
    travellingEntities:
      type: array
      description: A list of travelling entities associated with the package.
      items:
        $ref: .\TravellingEntity.yaml
    filters:
      type: array
      items:
        oneOf:
          - $ref: .\ServiceFilter.yaml
          - $ref: .\DistributionFilter.yaml
          # - $ref: .\PriceFilter.yaml
          # - $ref: .\AreaFilter.yaml
          # - $ref: .\TimeFilter.yaml
          # - $ref: .\AccessibilityFilter.yaml
          # - $ref: .\OperatorFilter.yaml
          - $ref: .\FlexibilityFilter.yaml
        discriminator:
          propertyName: filterType