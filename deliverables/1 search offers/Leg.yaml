type: object
required:
  - legId
  - mode
  - legType
properties:
  legType:
    type: string
    description: discriminator for the leg type
    enum: [timed, continuous, transfer]
  legId:
    type: string
    description: Unique identifier for the leg
    format: leg-ref
  mode:
    $ref: .\Mode.yaml
  sequenceNumber:
    type: integer
    description: >-
      The order of the leg in the overall journey. In case of parallel legs, the sequence number should be the same for those legs.
      When not supplied, the order within the list of legs determines the sequence number.
    default: 1
    minimum: 1
  tripPattern:
    type: string
    format: trip-pattern-ref
    description: Reference to the trip pattern that this leg is part of, if applicable. There is no tripPattern object in the data model,
      so legs with the same tripPattern reference are considered to be part of the same trip pattern.
    examples:
      - "inbound-1234"
      - "outbound-5678"
examples:
- {
    "legId": "LEG-123",
    "legType": "timed",
    "mode": "TRAIN",
    "tripPattern": "inbound-1234"
  }