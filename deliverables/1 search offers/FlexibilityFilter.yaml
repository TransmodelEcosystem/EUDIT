allOf:
  - $ref: .\SearchOfferFilter.yaml
  - type: object
    required:
      - filterType
      - afterSalesCondition
    properties:
      filterType:
        type: string
        const: flexibility
      afterSalesCondition:
        type: string
        enum:
        - cancellable
        - exchangeable
        - refundable
examples:
