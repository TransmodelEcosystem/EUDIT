type: object
required:
  - elementId
  - elementType
  - coverage
properties:
  elementId:
    description: Unique identifier for the package element
    type: string
  elementType:
    description: The type of the package element, which can be used to determine the specific schema to use for validation.
    type: string
    enum: [travelRight, ancillary, allocation, afterSalesFee]
  available:
    description: The number of available items at the moment of request
    type: integer
    minimum: 0
  coverage:
    type: array
    description: A list of trip sections that are covered by this package element. If absent, the package element is considered to be valid for the entire requested trip.
    items:
      $ref: .\TripSection.yaml
  price:
    description: The price of this package element
    $ref: .\Cost.yaml
  product:
    description: The product associated with this package element
    $ref: .\Product.yaml
  travellingEntities:
    type: array
    description: A list of travelling entities associated with this package element. If absent, the package element is considered to be valid for all travelling entities.
    items:
      type: string
      format: travelling-entity-ref
examples:
  - { "elementId": "PE-123", 
      "elementType": "travelRight",
      "coverage": [ { "startLeg": "L-789", "endLeg": "L-789" } ], 
      "price": { "amount": 23.20, "currency": "EUR" }, 
      "travellingEntities": [ "TE-123", "TE-456" ]
    }
