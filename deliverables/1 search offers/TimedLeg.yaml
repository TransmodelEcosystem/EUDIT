allOf:
  - $ref: .\Leg.yaml
  - type: object
    properties:
      legType:
        type: string
        description: discriminator for the leg type
        const: timed
      journeyRef:
        type: string
        description: Reference to the journey associated with this leg
        format: journey-ref
      lineRef:
        type: string
        description: Reference to the line associated with this leg
        format: line-ref
      operatingDayRef:
        type: string
        description: Reference to the operating day associated with this leg
        format: day-of-week
        enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
      privateMode:
        type: string
        enum: []
      ptMode:
        type: string
        enum: []
      start:
        $ref: .\LegBoard.yaml
      end:
        $ref: .\LegAlight.yaml
      intermediateStops:
        type: array
        description: List of intermediate stops for this leg
        items:
          $ref: .\LegIntermediate.yaml
examples:
  - {
      legType: "timed",
      journeyRef: "journey123",
      lineRef: "line456",
      operatingDayRef: "Monday",
      privateMode: "bus",
      ptMode: "bus",
      start:
        {
          "pickupLocation": "PLACE-123",
          "departureTime": "2024-06-15T14:00:00Z",
          "stopPointName": "Central Station",
          "stopPointRef": "STOP-456",
          "trainNumbers": ["1234", "5678"],
        },
      end:
        {
          "setDownLocation": "PLACE-456",
          "arrivalTime": "2024-06-15T14:30:00Z",
          "stopPointName": "Central Station",
          "stopPointRef": "STOP-789",
        },
      intermediateStops:
        [
          {
            "arrivalTime": "2024-06-15T14:00:00Z",
            "departureTime": "2024-06-15T14:06:00Z",
            "stopPointName": "Central Station",
            "stopPointRef": "STOP-456",
          },
        ],
    }
