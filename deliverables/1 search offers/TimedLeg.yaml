allOf:
  - $ref: .\Leg.yaml
  - type: object
    properties:
      legType:
        type: string
        description: discriminator for the leg type
        const: timed
      journeyRef:
        type: string
        description: Reference to the journey associated with this leg
        format: journey-ref
      lineRef:
        type: string
        description: Reference to the line associated with this leg
        format: line-ref
      operatingDayRef:
        type: string
        description: Reference to the operating day associated with this leg
        format: day-of-week
        enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
      privateMode:
        type: string
        enum: []
      ptMode:
        type: string
        enum: []
      start:
        $ref: .\LegBoard.yaml
      end:
        $ref: .\LegAlight.yaml
      intermediateStops:
        type: array
        description: List of intermediate stops for this leg
        items:
          $ref: .\LegIntermediate.yaml