allOf:
  - $ref: ./Package.yaml
  - type: object
    required:
      - expiryTime
    properties:
      expiryTime:
        type: string
        format: date-time
        description: The time at which this locked offer expires and is no longer available for purchase.
      status:
        type: string
        enum: [locked, released, expired]
examples:
- {
    "packageId": "PKG-123",
    "expiryTime": "2024-06-15T12:00:00Z",
    "status": "locked"
  }