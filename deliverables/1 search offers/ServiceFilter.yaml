allOf:
  - $ref: .\SearchOfferFilter.yaml
  - type: object
    required:
      - filterType
    properties:
      filterType:
        type: string
        const: mode    
      mode:
        $ref: .\Mode.yaml
      class:
        type: string
        x-enum-values:
          - FIRST # equals BUSINESS, PREMIUM, BEST
          - SECOND # equals ECONOMY, STANDARD, BASIC
          - ANY_CLASS