        type: string
        x-semantics:
          Transmodel:
            concepts:
              - "SCHEDULED STOP POINT.Id (TP Service Pattern MODEL)"
            definition: "Identifier of a SCHEDULED STOP POINT."
            conditions:
              - "Exact match to SCHEDULED STOP POINT.Id: the stopId is the network identifier of the stop, directly corresponding to SCHEDULED STOP POINT.Id in Transmodel."
