            definition: "A 0-dimensional node of the network used for the spatial description of the network. POINTs may be located by a LOCATION in a given LOCATING SYSTEM."
            conditions:
              - "Exact match to POINT.locating → LOCATION: the coordinate provides the geographic WGS84 position of the place, corresponding to the LOCATION associated with a POINT subtype in Transmodel."
  geoPosition:
    description: Geopos (WGS84 decimal)
    x-semantics:
      Transmodel:
        concepts:
