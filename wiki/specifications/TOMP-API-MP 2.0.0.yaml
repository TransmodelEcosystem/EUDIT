openapi: 3.0.0
info:
  title: Transport Operator MaaS Provider API - Extension notifications
  description: Notifications extension on the TOMP-API
  version: "2.0.0"
  contact:
    name: TOMP working group
    url: https://github.com/TOMP-WG/TOMP-API
  license:
    name: Apache 2.0
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"

tags:
  - name: notifications
    description: This part of the API facilitates communication from the TO to the MP.

paths:
  /processes/notification/execution:
    post:
      operationId: postNotification
      summary: "Notification endpoint"
      description: "Notification endpoint. Communication from TO to MP will be done using this endpoint"
      parameters:
        - $ref: "./TOMP-API 2.0.0.yaml#/components/parameters/acceptLanguage"
        - $ref: "./TOMP-API 2.0.0.yaml#/components/parameters/authorization"
      tags:
        - notifications
      requestBody:
        $ref: "#/components/requestBodies/notificationRequest"
      responses:
        "204":
          description: Notification processed
        default:
          $ref: "./TOMP-API 2.0.0.yaml#/components/responses/errorResponse"

  /processes/request-confirmation/execution:
    post:
      operationId: postConfirmation
      summary: "Confirmation endpoint"
      description: "Confirmation endpoint. Requesting confirmations from TO to MP will be done using this endpoint"
      parameters:
        - $ref: "./TOMP-API 2.0.0.yaml#/components/parameters/acceptLanguage"
        - $ref: "./TOMP-API 2.0.0.yaml#/components/parameters/authorization"
      tags:
        - notifications
      requestBody:
        $ref: "#/components/requestBodies/notificationRequest"
      responses:
        "204":
          description: Postive response on the request
        default:
          description: Negative response on the request, details in the error object
          $ref: "./TOMP-API 2.0.0.yaml#/components/responses/errorResponse"          

  /processes/request-payment/execution:
    post:
      operationId: paymentRequest
      summary: "Payment request endpoint"
      parameters:
        - $ref: "./TOMP-API 2.0.0.yaml#/components/parameters/acceptLanguage"
        - $ref: "./TOMP-API 2.0.0.yaml#/components/parameters/authorization"
      tags:
        - notifications
      requestBody:
        $ref: "#/components/requestBodies/paymentRequest"
      responses:
        "204":
          description: Payment request received
        default:
          $ref: "./TOMP-API 2.0.0.yaml#/components/responses/errorResponse"

components:
  requestBodies:
    notificationRequest:
      content:
        application/json:
          schema:    
            type: object
            required:
            - inputs
            properties:
              inputs:
                $ref: "#/components/schemas/notificationInput"
    
    confirmationRequest:
      content:
        application/json:
          schema:    
            type: object
            required:
            - inputs
            properties:
              inputs:
                $ref: "#/components/schemas/confirmationInput"

    paymentRequest:
      content:
        application/json:
          schema:    
            type: object
            required:
            - inputs
            properties:
              inputs:
                $ref: "../TOMP-API-6-AFTER-SALES.yaml#/components/schemas/financialDetail"

  schemas:
    notificationInput:
      x-semantics:
        Transmodel:
          concepts:
            - "DATED VEHICLE JOURNEY (DJ Dated Journey MODEL)"
            - "SALES TRANSACTION (ST Sales Transaction MODEL)"
          definition: "A particular journey on a particular date. / A sale of a SALES OFFER PACKAGE."
          conditions:
            - "Partial match to DATED VEHICLE JOURNEY lifecycle events: the notificationType enum values PREPARING/PREPARED/STARTED/PAUSED/RESUMED/ENDED correspond to execution-state transitions of a DATED VEHICLE JOURNEY (or leg thereof)."
            - "Partial match to SALES TRANSACTION: PRICE_FINAL indicates the finalisation of the fare for the leg, analogous to the completion of a SALES TRANSACTION."
            - "No direct equivalent for LOCKED/UNLOCKED (vehicle access-control states), USER_ACTION/USER_NO_SHOW/VEHICLE_ARRIVED/VEHICLE_NO_SHOW/ETA/USER_OUT_OF_LIMITS/WARNING/INFORMATION/OTHER/PROGRESS/SUPPORT/ACCEPTED/NOT_ACCEPTED/SUCCESS/FAILURE: these are MaaS operational-messaging concepts with no direct Transmodel counterpart."
        ERA:
          concepts:
            - "Vehicle"
          definition: "A specific vehicle or wagon able and allowed to operate over railway infrastructure."
          conditions:
            - "Partial match: notification lifecycle events (PREPARING/STARTED/ENDED) track the operational state of an ERA Vehicle."
        GBFS:
          concepts:
            - vehicle_status
          definition: "GBFS feed describing the real-time state of individual vehicles, including current status, location, and availability."
          conditions:
            - "Partial match: notificationInput lifecycle values (PREPARING/STARTED/ENDED/LOCKED/UNLOCKED) correspond to vehicle_status.is_reserved and is_disabled state transitions for a GBFS vehicle."
        GTFS:
          concepts:
            - booking_rules.booking_type
          definition: "GTFS-Flex booking_rules.booking_type defines the type of on-demand booking event required before a trip."
          conditions:
            - "Partial match: USER_ACTION and USER_NO_SHOW notifications align with GTFS-Flex on-demand booking event types where traveller interaction is required."
        OCPI:
          concepts:
            - Command
          definition: "An OCPI Command is a remote instruction sent to a charge point or mobility asset (e.g. START_SESSION, STOP_SESSION, RESERVE_NOW)."
          conditions:
            - "Partial match: a notificationInput as a lifecycle control event sent to a mobility asset (PREPARING/STARTED/ENDED) corresponds to an OCPI Command initiating or terminating an asset session."
        APDS:
          concepts:
            - OccupancyEvent
          definition: "An APDS OccupancyEvent records the start or end of an occupancy period at a place, such as arrival or departure."
          conditions:
            - "Partial match: a notificationInput signalling lifecycle transitions (STARTED/ENDED) of a mobility leg corresponds to an APDS OccupancyEvent marking the start or end of occupancy."
      type: object
      required:
        - notificationType
      properties:
        source:
          type: string
          description:
            This operation can be done on behalf of another party. The MP can act on behalf of the CUSTOMER (cancel this package for me); to override the default source.<br>
            In case this field is missing, it must be assumed that the MP is requesting the operations.<br>
            _TO_ the TO requests this operation<br>
            _DRIVER_ the driver triggered this request<br>
            _OTHER_ unknown source<br>
            <br>
            <b>IMPORTANT</b> The messages send should be in the requested language of the purchase!
          x-semantics:
            Transmodel:
              concepts:
                - "No direct Transmodel equivalent"
              definition: "No direct Transmodel equivalent."
              conditions:
                - "No direct equivalent: the source field identifies which actor (Transport Operator, Driver, or other) initiated the notification. Transmodel does not model API-level notification source roles."
          enum: [TO, DRIVER, OTHER]
        destination:
          type: string
          description: the destination of the notification
          x-semantics:
            Transmodel:
              concepts:
                - "No direct Transmodel equivalent"
              definition: "No direct Transmodel equivalent."
              conditions:
                - "No direct equivalent: the destination field identifies the intended recipient of the notification (MaaS Platform, Traveller, or Customer). Transmodel does not model notification routing destinations."
          enum: [MP, TRAVELLER, CUSTOMER]
        notificationType:
          type: string
          description: <br>
            * _USER_ACTION_ Request to show the actions (links) to the end user<br>
            * _USER_NO_SHOW_ The traveller didn't show up on the departure location & time  <br>
            * _ETA_ Estimated time of arrival at the departure location [others] at the destination location. User friendly message is in **comment**  <br>
            * _USER_OUT_OF_LIMITS_ indication to signal to the driver/traveller(s) they are (about to get) out of limits. Text is in **comment**  <br>

            * _INFORMATION_ information to the user, e.g. the asset is ready for pickup. Text is in **comment**<br>
            * _WARNING_ warning to the user, e.g. it is almost time to return the asset. Text is in **comment**<br>
            * _OTHER_ unspecified. Text is in **comment**<br>

            * _LOCKED_ asset is locked  <br>
            * _UNLOCKED_ asset is unlocked  <br><br>

            * _PROGRESS_ report progress <br><br>
            * _SUPPORT_ report support progress <br><br>

            * _PREPARING_ the leg is in preparation  <br>
            * _PREPARED_ the leg is ready to get started  <br>
            * _STARTED_ leg has started  <br>
            * _PAUSED_ leg is paused  <br>
            * _RESUMED_ leg is resumed  <br>
            * _ENDED_ leg is in finishing state  <br><br>

            Financial notifications<br>
            * _PRICE_FINAL_ the final price is known, the fare can be retrieved using the link in the links section<br>

            TO Process notifications<br>
            When a call to the TO responds with a 202 (accepted), an asynchronous process starts<br>
            and the TO will notify with SUCCESS or FAILURE to indicate that the process has been completed<br>
            * _SUCCESS_ The requested process is completed (e.g. the purchase of a package, responding with HTTP code 202)<br>
                The links object must contain a link to retrieve the processed object (e.g. GET /collections/packages/items/34243)<br>
            * _FAILURE_ The requested process ended in a failure (e.g. payment processing incomplete)<br><br>

            * _ACCEPTED_ <br>
            * _NOT_ACCEPTED_ In case of an a-sync purchase, the TO can respond to the MP wether the purchase has been accepted or not<br>
          x-semantics:
            Transmodel:
              concepts:
                - "DATED VEHICLE JOURNEY (DJ Dated Journey MODEL)"
                - "SALES TRANSACTION (ST Sales Transaction MODEL)"
              definition: "A particular journey on a particular date. / A sale of a SALES OFFER PACKAGE."
              conditions:
                - "Partial match to DATED VEHICLE JOURNEY lifecycle: PREPARING/PREPARED/STARTED/PAUSED/RESUMED/ENDED correspond to execution-state transitions of a DATED VEHICLE JOURNEY leg."
                - "Partial match to SALES TRANSACTION: PRICE_FINAL signals finalisation of the fare, analogous to completing a SALES TRANSACTION."
                - "No direct equivalent for LOCKED/UNLOCKED (asset access states), USER_ACTION/USER_NO_SHOW/VEHICLE_ARRIVED/VEHICLE_NO_SHOW/ETA/USER_OUT_OF_LIMITS/WARNING/INFORMATION/OTHER/PROGRESS/SUPPORT/SUCCESS/FAILURE/ACCEPTED/NOT_ACCEPTED."
          enum:
            [
              USER_ACTION,
              USER_NO_SHOW,
              VEHICLE_ARRIVED,
              VEHICLE_NO_SHOW,
              ETA,
              USER_OUT_OF_LIMITS,
              WARNING,
              INFORMATION,
              OTHER,

              LOCKED,
              UNLOCKED,

              PROGRESS,
              SUPPORT,
                                
              PREPARING,
              PREPARED,
              STARTED,
              PAUSED,
              RESUMED,
              ENDED, 

              PRICE_FINAL,

              SUCCESS,
              FAILURE,

              ACCEPTED,
              NOT_ACCEPTED
            ]
            
        context:
          type: object
          x-semantics:
            Transmodel:
              concepts:
                - "DATED VEHICLE JOURNEY (DJ Dated Journey MODEL)"
                - "SALES OFFER PACKAGE (ST Sales Transaction MODEL)"
              definition: "A particular journey on a particular date. / A packaged combination of FARE PRODUCTS."
              conditions:
                - "Partial match: the context object groups references to the asset (vehicle), leg (journey segment), product, and package relevant to the notification. This corresponds to the contextual identifiers of a DATED VEHICLE JOURNEY and its associated SALES OFFER PACKAGE."
          properties:
            asset:
              $ref: "./TOMP-API 2.0.0.yaml#/components/schemas/assetReference"    
            leg:
              $ref: "./TOMP-API 2.0.0.yaml#/components/schemas/legReference"    
            product:
              $ref: "./TOMP-API 2.0.0.yaml#/components/schemas/productReference"    
            package:
              $ref: "./TOMP-API 2.0.0.yaml#/components/schemas/packageReference"

        assetInfo:
          type: object
          x-semantics:
            Transmodel:
              concepts:
                - "VEHICLE (RC Resource Capacity MODEL)"
                - "DATED VEHICLE JOURNEY (DJ Dated Journey MODEL)"
              definition: "A vehicle used for the purpose of carrying passengers. / A particular journey on a particular date."
              conditions:
                - "Partial match to VEHICLE: assetInfo describes the current state of the transport asset (vehicle), including its location, active/paused state, distance travelled, and charge level."
                - "Partial match to DATED VEHICLE JOURNEY: the distance and duration fields correspond to execution metrics of a DATED VEHICLE JOURNEY."
            ERA:
              concepts:
                - "Vehicle"
              definition: "A specific vehicle or wagon able and allowed to operate over railway infrastructure."
              conditions:
                - "Partial match: assetInfo identifies the specific vehicle used in the journey, corresponding to an ERA Vehicle."
            GBFS:
              concepts:
                - vehicle_status
              definition: "GBFS vehicle_status describes the real-time state of an individual vehicle, including its current location, charge level, and availability."
              conditions:
                - "Exact match: assetInfo.location, currentCharge, and assetState directly mirror the vehicle_status fields current_range_meters, is_reserved/is_disabled, and current_fuel_percent."
            DATEX-II:
              concepts:
                - Vehicle
                - VehicleCharacteristics
              definition: "DATEX-II Vehicle is a road vehicle; VehicleCharacteristics describes its operational properties including fuel type, load capacity, and vehicle type."
              conditions:
                - "Partial match: assetInfo describes operational vehicle state (charge, usage state, location) corresponding to a DATEX-II Vehicle with VehicleCharacteristics."
          properties:
            location:
              $ref: "./TOMP-API 2.0.0.yaml#/components/schemas/placeReference"
            assetState:
              type: string
              description: in case the fare is dependent on being in use or being paused, this field must be used. Default IN_USE
              x-semantics:
                Transmodel:
                  concepts:
                    - "No direct Transmodel equivalent"
                  definition: "No direct Transmodel equivalent."
                  conditions:
                    - "No direct equivalent: IN_USE/PAUSED are operational states of a shared-mobility asset during a leg. Transmodel does not model asset usage states at this granularity."
              enum: [IN_USE, PAUSED]
              default: IN_USE
            distance:
              $ref: "./TOMP-API 2.0.0.yaml#/components/schemas/float"
              description: the travelled distance, in km. Only if applicable.
            distanceUnits:
              type: string
              enum: [KM, MILE]
            duration:
              $ref: "./TOMP-API 2.0.0.yaml#/components/schemas/normalInt"
              description: the time in seconds that the assed is used OR to reach the pickup location (ETA). Only if applicable.
            currentCharge:
              type: integer
              minimum: 0
              maximum: 100
              description: percentage of charge available

        links:
          $ref: "./TOMP-API 2.0.0.yaml#/components/schemas/links"
        message:
          type: string

    confirmationInput:
      x-semantics:
        Transmodel:
          concepts:
            - "DATED VEHICLE JOURNEY (DJ Dated Journey MODEL)"
            - "VEHICLE (RC Resource Capacity MODEL)"
          definition: "A particular journey on a particular date. / A vehicle used for the purpose of carrying passengers."
          conditions:
            - "Partial match to DATED VEHICLE JOURNEY: START_LEG requests the start of a leg, corresponding to the initiation of a DATED VEHICLE JOURNEY execution."
            - "No direct equivalent for REPLACE_ASSET: substituting one vehicle asset for another during a leg has no direct counterpart in the Transmodel information model."
        ERA:
          concepts:
            - "Vehicle"
          definition: "A specific vehicle or wagon able and allowed to operate over railway infrastructure."
          conditions:
            - "Partial match: confirmation input tracks vehicle journey completion states, corresponding to an ERA Vehicle's operational lifecycle."
        GBFS:
          concepts:
            - vehicle_status
          definition: "GBFS vehicle_status describes the real-time state of a vehicle including reservation and rental state."
          conditions:
            - "Partial match: START_LEG confirmation corresponds to initiating a GBFS vehicle rental (is_reserved transitioning to active use); REPLACE_ASSET has no GBFS equivalent."
        OCPI:
          concepts:
            - Session
          definition: "An OCPI Session represents an active charging or mobility session, tracking state from PENDING through ACTIVE to COMPLETED."
          conditions:
            - "Partial match: a confirmationInput triggering START_LEG corresponds to initiating an OCPI Session, transitioning the asset from reserved to active use."
        APDS:
          concepts:
            - AssignedRight
          definition: "An APDS AssignedRight is the activation of a right specification for a specific occupancy period; it represents a confirmed booking in effect."
          conditions:
            - "Partial match: a START_LEG confirmationInput activating a journey leg corresponds to an APDS AssignedRight confirming the occupancy of a mobility slot."
      type: object
      required:
        - confirmationType
      properties:
        confirmationType:
          type: string
          x-semantics:
            Transmodel:
              concepts:
                - "DATED VEHICLE JOURNEY (DJ Dated Journey MODEL)"
              definition: "A particular journey on a particular date."
              conditions:
                - "Partial match to DATED VEHICLE JOURNEY start event: START_LEG corresponds to initiating the execution of a journey leg, analogous to the start of a DATED VEHICLE JOURNEY."
                - "No direct equivalent for REPLACE_ASSET: Transmodel does not model mid-leg vehicle substitution as a typed confirmation operation."
          enum:
            [ REPLACE_ASSET, START_LEG ]
            
        context:
          type: object
          x-semantics:
            Transmodel:
              concepts:
                - "DATED VEHICLE JOURNEY (DJ Dated Journey MODEL)"
                - "SALES OFFER PACKAGE (ST Sales Transaction MODEL)"
              definition: "A particular journey on a particular date. / A packaged combination of FARE PRODUCTS."
              conditions:
                - "Partial match: the context object groups references to the asset, leg, product, and package relevant to the confirmation request. Same structural role as the context in notificationInput."
          properties:
            asset:
              $ref: "./TOMP-API 2.0.0.yaml#/components/schemas/assetReference"    
            leg:
              $ref: "./TOMP-API 2.0.0.yaml#/components/schemas/legReference"    
            product:
              $ref: "./TOMP-API 2.0.0.yaml#/components/schemas/productReference"    
            package:
              $ref: "./TOMP-API 2.0.0.yaml#/components/schemas/packageReference"