openapi: 3.0.3
info:
  title: EUDIT Unified Mobility API – Ferry-Specific (REST)
  description: >
    RESTful resources specific to ferry transport, integrating **FerryGateway**
    semantics (the Nordic ferry booking XML standard) with the EUDIT unified API
    model.

    Ferry bookings differ from standard public transport in that passengers
    typically book accommodation (cabins), meals, onboard services (spa, shop,
    entertainment), and land-side services (car rental, hotel transfers) as part
    of a single reservation. This module exposes these as distinct sub-resources
    under the base PACKAGE established by the `03-offers.yaml` sailing search
    and `05-purchase.yaml` purchase flows.

    Resources:
    - `GET /sailings` — list available ferry sailings
    - `GET /sailings/{sailingId}` — get a single sailing
    - `GET /sailings/{sailingId}/manifest` — vessel passenger/vehicle manifest
    - `POST /sailings/{sailingId}/manifest/entries` — add a manifest entry
    - `DELETE /sailings/{sailingId}/manifest/entries/{manifestEntryId}` — remove entry
    - `GET /sailings/{sailingId}/cabin-types` — cabin/accommodation types
    - `GET /sailings/{sailingId}/onboard-services` — onboard service catalog
    - `GET /sailings/{sailingId}/land-services` — land-side service catalog
    - `GET /packages/{packageId}/ferry-details` — ferry booking details
    - `PATCH /packages/{packageId}/ferry-details` — update ferry details
    - `POST /packages/{packageId}/cabin-bookings` — book a cabin
    - `GET /packages/{packageId}/cabin-bookings` — list cabin bookings
    - `GET /packages/{packageId}/cabin-bookings/{cabinBookingId}` — get booking
    - `PATCH /packages/{packageId}/cabin-bookings/{cabinBookingId}` — update booking
    - `DELETE /packages/{packageId}/cabin-bookings/{cabinBookingId}` — cancel booking
    - `POST /packages/{packageId}/meal-bookings` — book meals
    - `GET /packages/{packageId}/meal-bookings` — list meal bookings
    - `DELETE /packages/{packageId}/meal-bookings/{mealBookingId}` — cancel meal
    - `POST /packages/{packageId}/service-bookings` — book onboard/land/bus-transfer
    - `GET /packages/{packageId}/service-bookings` — list service bookings
    - `DELETE /packages/{packageId}/service-bookings/{serviceBookingId}` — cancel

    Transmodel references: SERVICE JOURNEY (ferry), VEHICLE (vessel), PLACE OF
    BOARDING, BOARDING FACILITY, SALES OFFER PACKAGE.
    FerryGateway source: ferrygateway.xsd, wiki/use-cases/ferrygateway.md.
  version: 0.1.0

servers:
  - url: https://api.eudit.example.com/v1

tags:
  - name: Ferry Sailings
    description: Available sailings and vessel information
  - name: Ferry Manifest
    description: Vessel passenger and vehicle manifest (operator/admin)
  - name: Ferry Catalog
    description: Cabin types, onboard and land services
  - name: Ferry Package Details
    description: Ferry-specific details and bookings within a PACKAGE

security:
  - BearerAuth: []
  - OAuth: [write]

components:

  securitySchemes:
    BearerAuth:
      $ref: './components.yaml#/components/securitySchemes/BearerAuth'
    OAuth:
      $ref: './components.yaml#/components/securitySchemes/OAuth'
    OAuthPKI:
      $ref: './components.yaml#/components/securitySchemes/OAuthPKI'
    OpenData:
      $ref: './components.yaml#/components/securitySchemes/OpenData'

  schemas:

    # ── Sailing Reference ─────────────────────────────────────────

    sailingReference:
      type: object
      description: >
        Reference to a specific ferry sailing (departure).
        Transmodel: SERVICE JOURNEY for WATER mode.
        FerryGateway: sailing identifier.
      x-tm: SERVICE JOURNEY
      x-semantics:
        transmodel: SERVICE JOURNEY
        ferrygateway: sailingId
        gtfs: trip_id
      required: [sailingId]
      properties:
        sailingId:
          type: string
          description: >
            Sailing identifier (e.g. departure date + vessel code +
            route code: `2026-06-15_MS-VIKING-GRACE_HEL-STO`).
        departureDate:
          type: string
          format: date
        departurePort:
          type: string
          description: UN/LOCODE or operator port code for the departure port.
        arrivalPort:
          type: string
          description: UN/LOCODE or operator port code for the arrival port.

    # ── Cabin / Accommodation ─────────────────────────────────────

    cabinType:
      type: object
      description: >
        A type of cabin or accommodation unit available on a vessel.
        Transmodel: FACILITY SET / ACCOMMODATION FACILITY.
        FerryGateway: cabinType.
      x-tm: FACILITY SET
      x-semantics:
        transmodel: ACCOMMODATION FACILITY
        ferrygateway: cabinType
      required: [cabinTypeId, name, maxOccupancy, deckLevel]
      properties:
        cabinTypeId:
          type: string
        name:
          type: string
          description: >
            Human-readable name (e.g. "Deluxe Sea View Cabin", "Inside Cabin 2-bed").
        description:
          type: string
        maxOccupancy:
          type: integer
          minimum: 1
          description: Maximum number of passengers for this cabin type.
        deckLevel:
          type: string
          description: Deck number or label (e.g. "7", "UPPER", "PROMENADE").
        amenities:
          type: array
          items:
            type: string
          description: >
            List of amenity codes (e.g. `SEA_VIEW`, `BALCONY`, `ENSUITE`,
            `ACCESSIBLE`, `PET_FRIENDLY`).
        images:
          type: array
          items:
            type: string
            format: uri
        priceFrom:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/amountOfMoney'
          description: Starting price for this cabin type on the sailing.
        availability:
          type: integer
          description: Number of cabins of this type still available.

    cabinTypeCollection:
      type: object
      description: Paginated collection of available cabin types for a sailing.
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/cabinType'
        pageInfo:
          $ref: './components.yaml#/components/schemas/pageInfo'

    bookCabinRequest:
      type: object
      description: >
        Request body for reserving a cabin or accommodation unit on a ferry
        sailing. The sailing and package must already exist.
        Transmodel: BOOKING of ACCOMMODATION FACILITY.
        FerryGateway: cabin booking.
      x-tm: BOOKING
      x-semantics:
        transmodel: ACCOMMODATION FACILITY
        ferrygateway: cabinBooking
      required: [sailingId, cabinTypeId, occupants]
      properties:
        sailingId:
          type: string
        cabinTypeId:
          type: string
        occupants:
          type: array
          minItems: 1
          description: List of passengers occupying this cabin.
          items:
            type: object
            required: [travellerRef]
            properties:
              travellerRef:
                type: string
                format: uuid
                description: Reference to a traveller already added to the PACKAGE.
              bedPreference:
                type: string
                enum: [LOWER_BUNK, UPPER_BUNK, DOUBLE, TWIN, SOFA_BED, ANY]
        specialRequests:
          type: string
          description: Free-text special requests (e.g. extra pillow, adjacent cabins).
        accessibilityRequirements:
          type: array
          items:
            type: string
          description: >
            Accessibility requirement codes (e.g. `WHEELCHAIR`, `HEARING_LOOP`,
            `VISUAL_AID`).

    cabinBookingPatch:
      type: object
      description: >
        JSON Merge Patch body for updating a cabin booking.
        RFC 7396 — send only the fields that need changing.
      properties:
        cabinTypeId:
          type: string
          description: Change the cabin type (subject to availability).
        occupants:
          type: array
          items:
            type: object
            required: [travellerRef]
            properties:
              travellerRef:
                type: string
                format: uuid
              bedPreference:
                type: string
                enum: [LOWER_BUNK, UPPER_BUNK, DOUBLE, TWIN, SOFA_BED, ANY]
        specialRequests:
          type: string
        accessibilityRequirements:
          type: array
          items:
            type: string

    # ── Meal Booking ──────────────────────────────────────────────

    mealType:
      type: string
      description: >
        Type of meal service on a ferry.
        FerryGateway: mealType.
      enum:
        - BREAKFAST
        - LUNCH
        - DINNER
        - BUFFET
        - A_LA_CARTE
        - BREAKFAST_BUFFET
        - DINNER_BUFFET
        - SNACK
        - CHILDREN_MENU

    bookMealRequest:
      type: object
      description: >
        Request body for reserving meals at the onboard restaurant.
        Transmodel: FARE PRODUCT for onboard catering.
        FerryGateway: meal booking.
      x-tm: FARE PRODUCT
      x-semantics:
        transmodel: FARE PRODUCT
        ferrygateway: mealBooking
      required: [sailingId, mealType, date, diners]
      properties:
        sailingId:
          type: string
        mealType:
          $ref: '#/components/schemas/mealType'
        date:
          type: string
          format: date
          description: Date of the meal (relevant for multi-night sailings).
        preferredTime:
          type: string
          description: >
            Preferred seating time (e.g. `18:00`, `20:30`). The server confirms
            availability.
        diners:
          type: array
          minItems: 1
          description: Passengers to book meals for.
          items:
            type: object
            required: [travellerRef]
            properties:
              travellerRef:
                type: string
                format: uuid
              dietaryRequirements:
                type: array
                items:
                  type: string
                description: >
                  Dietary requirement codes (e.g. `VEGETARIAN`, `VEGAN`,
                  `GLUTEN_FREE`, `HALAL`, `KOSHER`, `NUT_ALLERGY`).
        restaurantRef:
          type: string
          description: >
            Identifier of the specific restaurant if the vessel has multiple
            dining venues.

    # ── Service Booking (onboard + land + bus transfer) ───────────

    serviceBookingType:
      type: string
      description: Discriminator for the type of service being booked.
      enum:
        - ONBOARD_SERVICE
        - LAND_SERVICE
        - BUS_TRANSFER

    onboardServiceType:
      type: string
      description: Category of onboard service.
      enum:
        - SPA
        - MASSAGE
        - BEAUTY_TREATMENT
        - GYM
        - CINEMA
        - THEATRE
        - CASINO
        - KIDS_CLUB
        - EXCURSION
        - WIFI
        - PARKING_ON_DECK
        - LOUNGE_ACCESS
        - OTHER

    landServiceType:
      type: string
      description: Category of land-side service.
      enum:
        - CAR_RENTAL
        - HOTEL
        - BUS_TRANSFER
        - TAXI_TRANSFER
        - AIRPORT_TRANSFER
        - TOUR
        - PARKING
        - LUGGAGE_STORAGE
        - OTHER

    onboardService:
      type: object
      description: >
        An available onboard service product for a sailing.
        FerryGateway: onboardService.
        Transmodel: ANCILLARY SERVICE.
      x-tm: ANCILLARY SERVICE
      x-semantics:
        transmodel: ANCILLARY SERVICE
        ferrygateway: onboardService
      required: [serviceId, serviceType, name, price]
      properties:
        serviceId:
          type: string
        serviceType:
          $ref: '#/components/schemas/onboardServiceType'
        name:
          type: string
        description:
          type: string
        price:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/amountOfMoney'
        pricePerPerson:
          type: boolean
          description: >
            `true` if the price is per person; `false` if it is a flat booking fee.
        availability:
          type: integer
          description: Remaining slots/capacity for this service.
        requiresPreBooking:
          type: boolean
          description: Whether this service must be booked in advance (vs. walk-up).

    onboardServiceCollection:
      type: object
      description: Paginated collection of available onboard services for a sailing.
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/onboardService'
        pageInfo:
          $ref: './components.yaml#/components/schemas/pageInfo'

    landService:
      type: object
      description: >
        A land-side service available at a ferry port.
        FerryGateway: landService.
        Transmodel: SUPPLEMENTARY SERVICE.
      x-tm: SUPPLEMENTARY SERVICE
      x-semantics:
        transmodel: SUPPLEMENTARY SERVICE
        ferrygateway: landService
      required: [serviceId, serviceType, name, portRef]
      properties:
        serviceId:
          type: string
        serviceType:
          $ref: '#/components/schemas/landServiceType'
        name:
          type: string
        description:
          type: string
        portRef:
          type: string
          description: Port where this land service is available.
        priceFrom:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/amountOfMoney'
        provider:
          type: string
          description: Name of the service provider.

    landServiceCollection:
      type: object
      description: Paginated collection of available land services at a port.
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/landService'
        pageInfo:
          $ref: './components.yaml#/components/schemas/pageInfo'

    bookServiceRequest:
      type: object
      description: >
        Unified request body for booking an onboard service, land-side service,
        or bus/shuttle transfer. The `serviceBookingType` discriminator determines
        which additional fields are relevant.
        Transmodel: BOOKING of ANCILLARY SERVICE / SUPPLEMENTARY SERVICE /
        CONNECTING JOURNEY.
        FerryGateway: onboardServiceBooking, landServiceBooking, busTransfer.
      required: [sailingId, serviceBookingType, serviceId]
      properties:
        sailingId:
          type: string
        serviceBookingType:
          $ref: '#/components/schemas/serviceBookingType'
        serviceId:
          type: string
          description: >
            Identifier of the service to book (from the catalog endpoints).
        travellerRefs:
          type: array
          items:
            type: string
            format: uuid
          description: >
            Travellers to book the service for. If omitted, the booking covers
            the whole party.
        preferredDate:
          type: string
          format: date
        preferredTime:
          type: string
          description: Preferred time slot (e.g. `18:30`).
        portRef:
          type: string
          description: >
            Port where the land/bus service is to be used (required for
            LAND_SERVICE and BUS_TRANSFER types).
        serviceDate:
          type: string
          format: date
          description: Date of the land/bus service (required for LAND_SERVICE).
        direction:
          type: string
          enum: [TO_PORT, FROM_PORT]
          description: >
            Transfer direction — required for BUS_TRANSFER:
            `TO_PORT` = city → terminal; `FROM_PORT` = terminal → city.
        pickupRef:
          type: string
          description: >
            Identifier of the pick-up/drop-off location (bus stop, hotel, etc.).
            Used for BUS_TRANSFER.
        vehicleReg:
          type: string
          description: Vehicle registration plate (for car rental/parking services).
        specialRequests:
          type: string

    serviceBookingCancelResult:
      type: object
      description: Result of a service booking cancellation.
      required: [cancelled, refundEligible]
      properties:
        cancelled:
          type: boolean
        serviceBookingId:
          type: string
        refundEligible:
          type: boolean
        refundAmount:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/amountOfMoney'

    mealBookingCancelResult:
      type: object
      description: Result of a meal booking cancellation.
      required: [cancelled, refundEligible]
      properties:
        cancelled:
          type: boolean
        mealBookingId:
          type: string
        refundEligible:
          type: boolean
        refundAmount:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/amountOfMoney'

    # ── Manifest Entry ────────────────────────────────────────────

    manifestEntry:
      $ref: './components.yaml#/components/schemas/manifestEntry'

    addManifestEntryRequest:
      type: object
      description: >
        Request body for adding an entry to the vessel manifest.
        Operator/admin only.
      required: [passengerName, bookingRef]
      properties:
        passengerName:
          type: string
        bookingRef:
          type: string
        cabinNumber:
          type: string
        vehicleReg:
          type: string
        specialRequirements:
          type: array
          items:
            type: string

    # ── Sailing ───────────────────────────────────────────────────

    sailingCollection:
      type: object
      description: >
        Paginated collection of available ferry sailings.
        Transmodel: SERVICE JOURNEYs for WATER mode.
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: '../ogcapi-eudit/components.yaml#/components/schemas/sailing'
        pageInfo:
          $ref: './components.yaml#/components/schemas/pageInfo'

    cabinBookingCollection:
      type: object
      description: Paginated collection of cabin bookings for a PACKAGE.
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: '../ogcapi-eudit/components.yaml#/components/schemas/cabinBooking'
        pageInfo:
          $ref: './components.yaml#/components/schemas/pageInfo'

    mealBookingCollection:
      type: object
      description: Paginated collection of meal bookings for a PACKAGE.
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: '../ogcapi-eudit/components.yaml#/components/schemas/mealBooking'
        pageInfo:
          $ref: './components.yaml#/components/schemas/pageInfo'

    serviceBookingCollection:
      type: object
      description: >
        Paginated collection of service bookings (onboard, land, and bus
        transfer) for a PACKAGE.
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: '../ogcapi-eudit/components.yaml#/components/schemas/onboardServiceBooking'
        pageInfo:
          $ref: './components.yaml#/components/schemas/pageInfo'

paths:

  # ─────────────────────────────────────────────────────────────────
  # Sailings
  # ─────────────────────────────────────────────────────────────────

  /sailings:
    get:
      operationId: listSailings
      summary: List Ferry Sailings
      description: >
        Returns available ferry sailings matching the specified route and date
        criteria. Results include vessel details, departure/arrival times, and
        summary pricing.

        For passenger-specific offer search with pricing, use the
        `POST /offer-searches` endpoint in `03-offers.yaml`.

        Transmodel: SERVICE JOURNEYs for WATER mode.
        FerryGateway: sailing list.
      tags: [Ferry Sailings]
      security:
        - OpenData: []
        - BearerAuth: []
      parameters:
        - name: departurePort
          in: query
          required: false
          schema:
            type: string
          description: UN/LOCODE or operator port code for departure port.
        - name: arrivalPort
          in: query
          required: false
          schema:
            type: string
          description: UN/LOCODE or operator port code for arrival port.
        - name: departureDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter sailings departing on this exact date.
        - name: departureDateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter sailings departing on or after this date.
        - name: departureDateUntil
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter sailings departing on or before this date.
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: Paginated list of ferry sailings.
          headers:
            Link:
              $ref: './components.yaml#/components/headers/Link'
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
            Content-Language:
              $ref: './components.yaml#/components/headers/Content-Language'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sailingCollection'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'

  /sailings/{sailingId}:
    get:
      operationId: getSailing
      summary: Get Sailing
      description: >
        Returns the details of a specific ferry sailing by its identifier.
        Transmodel: SERVICE JOURNEY for WATER mode.
        FerryGateway: sailing detail.
      tags: [Ferry Sailings]
      security:
        - OpenData: []
        - BearerAuth: []
      parameters:
        - $ref: './components.yaml#/components/parameters/sailingId'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: Sailing details.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Content-Language:
              $ref: './components.yaml#/components/headers/Content-Language'
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/sailing'
        '304':
          $ref: './components.yaml#/components/responses/304NotModified'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  # ─────────────────────────────────────────────────────────────────
  # Vessel Manifest
  # ─────────────────────────────────────────────────────────────────

  /sailings/{sailingId}/manifest:
    get:
      operationId: getVesselManifest
      summary: Get Vessel Manifest
      description: >
        Returns the passenger and vehicle manifest for a specific sailing.
        Access is restricted to operators and port authorities. The manifest
        lists all confirmed bookings with passenger names, cabin assignments,
        vehicle registrations, and special requirements.

        Transmodel: VEHICLE JOURNEY manifest / boarding list.
        FerryGateway: vesselManifest.
      tags: [Ferry Manifest]
      security:
        - BearerAuth: []
        - OAuth: [admin]
      parameters:
        - $ref: './components.yaml#/components/parameters/sailingId'
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
      responses:
        '200':
          description: Vessel manifest.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Link:
              $ref: './components.yaml#/components/headers/Link'
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/vesselManifest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/403Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /sailings/{sailingId}/manifest/entries:
    post:
      operationId: addManifestEntry
      summary: Add Manifest Entry
      description: >
        Adds a passenger or vehicle entry to the vessel manifest for a sailing.
        Operator/admin only.
        Transmodel: VEHICLE JOURNEY manifest entry.
        FerryGateway: manifest entry.
      tags: [Ferry Manifest]
      security:
        - BearerAuth: []
        - OAuth: [admin]
      parameters:
        - $ref: './components.yaml#/components/parameters/sailingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/addManifestEntryRequest'
      responses:
        '201':
          description: Manifest entry created.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/manifestEntry'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/403Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /sailings/{sailingId}/manifest/entries/{manifestEntryId}:
    delete:
      operationId: deleteManifestEntry
      summary: Remove Manifest Entry
      description: >
        Removes an entry from the vessel manifest. Operator/admin only.
      tags: [Ferry Manifest]
      security:
        - BearerAuth: []
        - OAuth: [admin]
      parameters:
        - $ref: './components.yaml#/components/parameters/sailingId'
        - $ref: './components.yaml#/components/parameters/manifestEntryId'
      responses:
        '204':
          $ref: './components.yaml#/components/responses/204NoContent'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/403Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  # ─────────────────────────────────────────────────────────────────
  # Ferry Catalog
  # ─────────────────────────────────────────────────────────────────

  /sailings/{sailingId}/cabin-types:
    get:
      operationId: getCabinTypes
      summary: Get Cabin Types
      description: >
        Returns available cabin/accommodation types for a sailing, with
        pricing and availability.
        Transmodel: ACCOMMODATION FACILITY types.
        FerryGateway: cabinType catalog.
      tags: [Ferry Catalog]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/sailingId'
        - name: accessible
          in: query
          required: false
          schema:
            type: boolean
          description: If `true`, return only wheelchair-accessible cabin types.
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: Paginated list of cabin types.
          headers:
            Link:
              $ref: './components.yaml#/components/headers/Link'
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cabinTypeCollection'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /sailings/{sailingId}/onboard-services:
    get:
      operationId: getOnboardServices
      summary: Get Onboard Services
      description: >
        Returns available onboard service products for a sailing (spa,
        restaurant slots, entertainment, excursions, etc.).
        Transmodel: ANCILLARY SERVICE catalog.
        FerryGateway: onboard service catalog.
      tags: [Ferry Catalog]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/sailingId'
        - name: serviceType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/onboardServiceType'
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: Paginated list of available onboard services.
          headers:
            Link:
              $ref: './components.yaml#/components/headers/Link'
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/onboardServiceCollection'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /sailings/{sailingId}/land-services:
    get:
      operationId: getLandServices
      summary: Get Land Services
      description: >
        Returns available land-side services at a ferry port associated with
        a sailing (car rental, hotel packages, tours, transfers).
        Transmodel: SUPPLEMENTARY SERVICE catalog.
        FerryGateway: land service catalog.
      tags: [Ferry Catalog]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/sailingId'
        - name: portRef
          in: query
          required: false
          schema:
            type: string
          description: >
            Port code to filter land services (departure or arrival port).
            If omitted, services for all ports on this sailing are returned.
        - name: serviceDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: serviceType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/landServiceType'
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: Paginated list of available land services.
          headers:
            Link:
              $ref: './components.yaml#/components/headers/Link'
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/landServiceCollection'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  # ─────────────────────────────────────────────────────────────────
  # Ferry Package Details
  # ─────────────────────────────────────────────────────────────────

  /packages/{packageId}/ferry-details:
    get:
      operationId: getFerryDetails
      summary: Get Ferry Booking Details
      description: >
        Returns the ferry-specific booking details for a PACKAGE (cabin
        assignments, meal reservations, vehicle bookings, etc.).
        Transmodel: ferry BOOKING details within a SALES OFFER PACKAGE.
        FerryGateway: ferryBookingDetails.
      tags: [Ferry Package Details]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: Ferry booking details.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/ferryBookingDetails'
        '304':
          $ref: './components.yaml#/components/responses/304NotModified'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

    patch:
      operationId: patchFerryDetails
      summary: Update Ferry Booking Details
      description: >
        Partially updates ferry-specific details for a PACKAGE (e.g. change
        cabin assignment, update vehicle registration, modify meal preferences).
        Uses JSON Merge Patch (RFC 7396). Optimistic concurrency via `If-Match`.
        Transmodel: update of ferry BOOKING details.
        FerryGateway: ferryDetailsPatch.
      tags: [Ferry Package Details]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - $ref: './components.yaml#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: './components.yaml#/components/schemas/ferryDetailsPatch'
      responses:
        '200':
          description: Ferry details updated.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/ferryBookingDetails'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
        '409':
          $ref: './components.yaml#/components/responses/409Conflict'
        '412':
          $ref: './components.yaml#/components/responses/412PreconditionFailed'

  # ─────────────────────────────────────────────────────────────────
  # Cabin Bookings
  # ─────────────────────────────────────────────────────────────────

  /packages/{packageId}/cabin-bookings:
    post:
      operationId: createCabinBooking
      summary: Book Cabin
      description: >
        Reserves a cabin or accommodation unit on a ferry sailing for the
        specified occupants. The sailing must already be part of a confirmed or
        pending PACKAGE.

        The server checks availability, assigns a specific cabin if available,
        and returns the cabin booking record. An additional charge is added to
        the PACKAGE's financial detail.

        Returns `201 Created` with a `Location` header pointing to the new
        cabin booking resource.

        Transmodel: BOOKING of ACCOMMODATION FACILITY on SERVICE JOURNEY.
        FerryGateway: cabinBooking.
      tags: [Ferry Package Details]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bookCabinRequest'
      responses:
        '201':
          description: Cabin booking created.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/cabinBooking'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
        '409':
          description: >
            Conflict — no cabins of the requested type are available, or the
            PACKAGE is in a state that does not allow modifications.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'

    get:
      operationId: listCabinBookings
      summary: List Cabin Bookings
      description: >
        Returns all cabin bookings associated with a PACKAGE.
        Transmodel: ACCOMMODATION FACILITY BOOKINGs within a SALES OFFER PACKAGE.
      tags: [Ferry Package Details]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
      responses:
        '200':
          description: List of cabin bookings.
          headers:
            Link:
              $ref: './components.yaml#/components/headers/Link'
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cabinBookingCollection'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /packages/{packageId}/cabin-bookings/{cabinBookingId}:
    get:
      operationId: getCabinBooking
      summary: Get Cabin Booking
      description: Returns the details of a specific cabin booking.
      tags: [Ferry Package Details]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: cabinBookingId
          in: path
          required: true
          schema:
            type: string
          description: Identifier of the cabin booking.
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: Cabin booking details.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/cabinBooking'
        '304':
          $ref: './components.yaml#/components/responses/304NotModified'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

    patch:
      operationId: patchCabinBooking
      summary: Update Cabin Booking
      description: >
        Partially updates a cabin booking (e.g. change cabin type, occupants,
        or special requests). Subject to availability and fare conditions.
        Uses JSON Merge Patch (RFC 7396). Optimistic concurrency via `If-Match`.
        If a higher-grade cabin is requested, an additional charge applies.
        FerryGateway: cabin reservation update.
      tags: [Ferry Package Details]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: cabinBookingId
          in: path
          required: true
          schema:
            type: string
        - $ref: './components.yaml#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/cabinBookingPatch'
      responses:
        '200':
          description: Cabin booking updated.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/cabinBooking'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
        '409':
          description: No availability for the requested cabin change.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'
        '412':
          $ref: './components.yaml#/components/responses/412PreconditionFailed'

    delete:
      operationId: cancelCabinBooking
      summary: Cancel Cabin Booking
      description: >
        Cancels a specific cabin booking without cancelling the whole PACKAGE.
        Subject to the fare conditions of the cabin. A refund may be applicable
        depending on the cancellation policy.

        Transmodel: cancellation of individual ACCOMMODATION FACILITY booking.
        FerryGateway: cancel-ferry-add-on (CABIN type).
      tags: [Ferry Package Details]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: cabinBookingId
          in: path
          required: true
          schema:
            type: string
        - $ref: './components.yaml#/components/parameters/ifMatch'
      responses:
        '204':
          $ref: './components.yaml#/components/responses/204NoContent'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
        '409':
          description: Cancellation not permitted by fare conditions.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'
        '412':
          $ref: './components.yaml#/components/responses/412PreconditionFailed'

  # ─────────────────────────────────────────────────────────────────
  # Meal Bookings
  # ─────────────────────────────────────────────────────────────────

  /packages/{packageId}/meal-bookings:
    post:
      operationId: createMealBooking
      summary: Book Meal
      description: >
        Reserves meals at the onboard restaurant for the specified passengers
        and date. For multi-night sailings, one booking is required per dinner
        service.

        Returns `201 Created` with a `Location` header.

        Transmodel: BOOKING of CATERING FACILITY.
        FerryGateway: mealBooking.
      tags: [Ferry Package Details]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bookMealRequest'
      responses:
        '201':
          description: Meal booking created.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/mealBooking'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
        '409':
          description: Restaurant fully booked for the requested time.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'

    get:
      operationId: listMealBookings
      summary: List Meal Bookings
      description: Returns all meal bookings associated with a PACKAGE.
      tags: [Ferry Package Details]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
      responses:
        '200':
          description: List of meal bookings.
          headers:
            Link:
              $ref: './components.yaml#/components/headers/Link'
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mealBookingCollection'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /packages/{packageId}/meal-bookings/{mealBookingId}:
    delete:
      operationId: cancelMealBooking
      summary: Cancel Meal Booking
      description: >
        Cancels a specific meal booking without cancelling the whole PACKAGE.
        Subject to fare conditions. A refund may apply.
        FerryGateway: cancel-ferry-add-on (MEAL type).
      tags: [Ferry Package Details]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: mealBookingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          $ref: './components.yaml#/components/responses/204NoContent'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
        '409':
          description: Cancellation not permitted by fare conditions.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'

  # ─────────────────────────────────────────────────────────────────
  # Service Bookings (onboard + land + bus transfer)
  # ─────────────────────────────────────────────────────────────────

  /packages/{packageId}/service-bookings:
    post:
      operationId: createServiceBooking
      summary: Book Service
      description: >
        Books an onboard service (spa, entertainment, excursion), a land-side
        service (car rental, hotel, tour), or a bus/shuttle transfer to/from
        the ferry terminal — all via a single unified endpoint discriminated
        by `serviceBookingType`.

        Returns `201 Created` with a `Location` header.

        Transmodel: BOOKING of ANCILLARY SERVICE / SUPPLEMENTARY SERVICE /
        CONNECTING JOURNEY.
        FerryGateway: onboardServiceBooking, landServiceBooking, busTransfer.
      tags: [Ferry Package Details]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bookServiceRequest'
      responses:
        '201':
          description: Service booking created.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/onboardServiceBooking'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
        '409':
          description: Service unavailable or fully booked for the requested time/date.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'

    get:
      operationId: listServiceBookings
      summary: List Service Bookings
      description: >
        Returns all service bookings (onboard, land, and bus transfer)
        associated with a PACKAGE.
      tags: [Ferry Package Details]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: serviceBookingType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/serviceBookingType'
          description: Filter by service booking type.
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
      responses:
        '200':
          description: List of service bookings.
          headers:
            Link:
              $ref: './components.yaml#/components/headers/Link'
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceBookingCollection'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /packages/{packageId}/service-bookings/{serviceBookingId}:
    delete:
      operationId: cancelServiceBooking
      summary: Cancel Service Booking
      description: >
        Cancels a specific service booking (onboard service, land service, or
        bus transfer) without cancelling the whole PACKAGE. Subject to fare
        conditions. A refund may apply.
        FerryGateway: cancel-ferry-add-on (ONBOARD_SERVICE, LAND_SERVICE,
        BUS_TRANSFER types).
      tags: [Ferry Package Details]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: serviceBookingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          $ref: './components.yaml#/components/responses/204NoContent'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
        '409':
          description: Cancellation not permitted by fare conditions.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'
