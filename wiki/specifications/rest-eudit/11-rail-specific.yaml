openapi: 3.0.3
info:
  title: EUDIT Unified Mobility API – Rail-Specific / OSDM (REST)
  description: >
    RESTful resources specific to rail transport, integrating **OSDM (Open Sales
    and Distribution Model)** semantics with the EUDIT unified API model.

    Rail bookings have specific requirements not covered by the core offer/purchase
    modules: graphical seat and coach layout selection, on-hold offers (extending
    the booking TTL for a fee), exchange of purchased fulfillments, back-office
    reimbursement claims, and travel account queries (loyalty cards, multi-ride
    passes, reduction cards).

    Resources:
    - `GET /seat-maps/{serviceJourneyId}` — graphical seat availability map
    - `GET /coach-layouts` — static coach deck layouts
    - `POST /packages/{packageId}/legs/{legId}/seat-reservations` — reserve seat
    - `GET /packages/{packageId}/legs/{legId}/seat-reservations` — list reservations
    - `GET /packages/{packageId}/legs/{legId}/seat-reservations/{reservationId}` — get
    - `DELETE /packages/{packageId}/legs/{legId}/seat-reservations/{reservationId}` — cancel
    - `POST /packages/{packageId}/on-hold` — place package on hold
    - `GET /packages/{packageId}/on-hold` — get on-hold records
    - `DELETE /packages/{packageId}/on-hold/{onHoldId}` — cancel on-hold
    - `POST /packages/{packageId}/exchange-searches` — search exchange offers
    - `GET /packages/{packageId}/exchange-searches/{exchangeSearchId}` — get results
    - `POST /packages/{packageId}/exchange-operations` — initiate exchange
    - `GET /packages/{packageId}/exchange-operations` — list exchanges
    - `GET /packages/{packageId}/exchange-operations/{exchangeOperationId}` — get
    - `PATCH /packages/{packageId}/exchange-operations/{exchangeOperationId}` — confirm
    - `DELETE /packages/{packageId}/exchange-operations/{exchangeOperationId}` — cancel
    - `POST /packages/{packageId}/reimbursements` — submit reimbursement claim
    - `GET /packages/{packageId}/reimbursements` — list reimbursements
    - `GET /packages/{packageId}/reimbursements/{reimbursementId}` — get claim
    - `POST /packages/{packageId}/travel-account-applications` — link/query account
    - `GET /travel-accounts` — list linked travel accounts

    Transmodel references: TRAIN ELEMENT, VEHICLE TYPE, TRAIN COMPONENT,
    BOOKING, FULFILLMENT, REIMBURSEMENT.
    OSDM source: OSDM 3.7.1.yaml.
  version: 0.1.0

servers:
  - url: https://api.eudit.example.com/v1

tags:
  - name: Rail Seat Maps
    description: Coach layouts and graphical seat availability
  - name: Rail Seat Reservations
    description: Seat reservation management within a PACKAGE leg
  - name: Rail On-Hold
    description: On-hold offer management (TTL extension and deposit)
  - name: Rail Exchange
    description: Ticket exchange and rebooking
  - name: Rail Reimbursement
    description: Back-office reimbursement claims
  - name: Rail Account
    description: Travel account (loyalty, passes, multi-ride)

security:
  - BearerAuth: []
  - OAuth: [write]

components:

  securitySchemes:
    BearerAuth:
      $ref: './components.yaml#/components/securitySchemes/BearerAuth'
    OAuth:
      $ref: './components.yaml#/components/securitySchemes/OAuth'
    OAuthPKI:
      $ref: './components.yaml#/components/securitySchemes/OAuthPKI'
    OpenData:
      $ref: './components.yaml#/components/securitySchemes/OpenData'

  schemas:

    # ── Seat Map / Coach Layout ────────────────────────────────────

    deckLevel:
      type: string
      description: >
        Level of a double-deck coach.
        OSDM: CoachDeckLevel.
        Transmodel: DECK LEVEL (SP Deck Plan MODEL).
      x-tm: DECK LEVEL
      x-semantics:
        transmodel: DECK LEVEL
        osdm: CoachDeckLevel
      enum:
        - SINGLE_DECK
        - LOWER_DECK
        - MIDDLE_DECK
        - UPPER_DECK

    gridDimension:
      type: object
      description: >
        Width × height of the coach grid (number of columns × number of rows).
        OSDM: GridDimension.
      required: [width, height]
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1

    placeAvailabilityStatus:
      type: string
      description: Availability status of an individual seat/place.
      enum:
        - AVAILABLE
        - RESERVED
        - BLOCKED
        - OCCUPIED
        - OUT_OF_SERVICE
        - PRE_SELECTED

    coachPlace:
      type: object
      description: >
        A single seat or standing place within a coach deck layout.
        OSDM: Place (within PlaceGroup).
        Transmodel: SEAT.
      x-tm: SEAT
      x-semantics:
        transmodel: SEAT
        osdm: Place
      required: [placeNumber, column, row]
      properties:
        placeNumber:
          type: string
          description: Seat number or label (e.g. `12A`, `42`).
        column:
          type: integer
          description: Column index in the coach grid (0-based).
        row:
          type: integer
          description: Row index in the coach grid (0-based).
        availabilityStatus:
          $ref: '#/components/schemas/placeAvailabilityStatus'
        serviceClass:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/classOfUse'
        accommodationType:
          type: string
          description: >
            Accommodation type code (e.g. `SEAT`, `COUCHETTE`, `SLEEPER`,
            `RECLINER`, `COMPARTMENT`).
        accommodationSubTypes:
          type: array
          items:
            type: string
          description: >
            Sub-type codes (e.g. `WINDOW`, `AISLE`, `MIDDLE`, `FACING`,
            `SIDE_TABLE`, `POWER_SOCKET`, `SILENT_ZONE`).
        accessible:
          type: boolean
          description: Whether this place is wheelchair-accessible.
        gender:
          type: string
          enum: [FEMALE, MALE, MIXED]
          description: >
            Gender restriction for this place (applicable in compartment coaches).
        direction:
          type: string
          enum: [FORWARD, BACKWARD]
          description: Direction of travel this seat faces.

    placeGroup:
      type: object
      description: >
        A group of seats within a deck sharing the same service class and
        accommodation type.
        OSDM: PlaceGroup.
      required: [serviceClass, places]
      properties:
        serviceClass:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/classOfUse'
        accommodationType:
          type: string
        accommodationSubTypes:
          type: array
          items:
            type: string
        places:
          type: array
          items:
            $ref: '#/components/schemas/coachPlace'

    coachDeckLayout:
      type: object
      description: >
        Graphical layout of a single coach deck, including all seats and
        decorative elements (walls, doors, toilets).
        OSDM: CoachDeckLayout.
        Transmodel: DECK LEVEL / TRAIN COMPONENT layout.
      x-tm: TRAIN COMPONENT
      x-semantics:
        transmodel: TRAIN COMPONENT
        osdm: CoachDeckLayout
      required: [id, name, deckLevel, dimension]
      properties:
        id:
          type: string
        name:
          type: string
        deckLevel:
          $ref: '#/components/schemas/deckLevel'
        dimension:
          $ref: '#/components/schemas/gridDimension'
        lowFloorEntry:
          type: boolean
          description: True on the lowest deck (ground-level boarding on some trains).
        placeGroups:
          type: array
          items:
            $ref: '#/components/schemas/placeGroup'
        coachNumber:
          type: string
          description: Coach/carriage number in the train composition.
        vehicleRef:
          type: string
          description: Reference to the VEHICLE TYPE assigned to this coach.

    coachDeckLayoutCollection:
      type: object
      description: Paginated collection of coach deck layouts for a train.
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/coachDeckLayout'
        pageInfo:
          $ref: './components.yaml#/components/schemas/pageInfo'

    seatMapSearchRequest:
      type: object
      description: >
        Request body for retrieving the seat availability map for specific
        coaches/decks. The `reservationRef` ties the availability query to an
        existing offer or booking so the server applies the correct fare class
        constraints.
        OSDM equivalent: POST /availabilities/vehicle-place-map.
        Transmodel: SERVICE RESTRICTION / SEAT AVAILABILITY.
      x-tm: SEAT AVAILABILITY
      x-semantics:
        transmodel: SERVICE RESTRICTION
        osdm: PlaceAvailabilityMapRequest
      required: [packageId, placeRestrictions]
      properties:
        packageId:
          type: string
          format: uuid
        placeRestrictions:
          type: array
          minItems: 1
          description: >
            List of place restrictions — one per fare/booking part being reserved.
          items:
            type: object
            required: [reservationRef]
            properties:
              reservationRef:
                type: string
                description: >
                  OSDM ReservationReference: identifies the offer or fare being
                  reserved (e.g. offer ID, booking part ID).
              serviceClass:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/classOfUse'
              accommodationSubTypes:
                type: array
                items:
                  type: string

    seatMapResult:
      type: object
      description: >
        Seat availability map for a train, including per-coach availability.
        OSDM equivalent: PlaceAvailabilityMapResponse.
      required: [coaches]
      properties:
        coaches:
          type: array
          description: Coaches ordered by their physical position in the train.
          items:
            type: object
            required: [coachNumber, deckLayouts]
            properties:
              coachNumber:
                type: string
              deckLayouts:
                type: array
                items:
                  $ref: '#/components/schemas/coachDeckLayout'
        preSelectedPlaces:
          type: array
          description: Places pre-selected by the server (e.g. for group bookings).
          items:
            type: object
            properties:
              coachNumber:
                type: string
              placeNumber:
                type: string
              travellerRef:
                type: string
                format: uuid

    # ── Seat Reservation ──────────────────────────────────────────

    seatReservationRequest:
      $ref: './components.yaml#/components/schemas/seatReservationRequest'

    seatReservationCollection:
      type: object
      description: Paginated collection of seat reservations for a PACKAGE leg.
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: '../ogcapi-eudit/components.yaml#/components/schemas/leg'
        pageInfo:
          $ref: './components.yaml#/components/schemas/pageInfo'

    # ── On-Hold Offer ─────────────────────────────────────────────

    onHoldRequest:
      type: object
      description: >
        Request body for placing a booking on hold. This extends the booking's
        TTL by the specified number of minutes, typically for a fee and/or
        deposit. Useful when the customer needs more time to confirm payment.
        OSDM equivalent: POST /bookings/{id}/on-hold-offer.
        Transmodel: BOOKING reservation extension.
      x-tm: BOOKING
      x-semantics:
        transmodel: BOOKING
        osdm: OnHoldOfferRequest
      required: [increaseTTLMinutes]
      properties:
        increaseTTLMinutes:
          type: integer
          minimum: 1
          description: >
            Number of minutes by which to extend the booking's TTL.
            The maximum allowed value is operator-defined (typically 30–120 min).

    onHoldRecord:
      $ref: './components.yaml#/components/schemas/onHoldRecord'

    onHoldCollection:
      type: object
      description: Collection of on-hold records for a PACKAGE.
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: './components.yaml#/components/schemas/onHoldRecord'
        pageInfo:
          $ref: './components.yaml#/components/schemas/pageInfo'

    # ── Exchange ──────────────────────────────────────────────────

    exchangeStatus:
      type: string
      description: >
        Lifecycle status of an exchange operation.
        OSDM: ExchangeStatus.
      enum:
        - PREBOOKED
        - CONFIRMED
        - FULFILLED
        - CANCELLED
        - ERROR

    exchangeOfferSearchRequest:
      type: object
      description: >
        Request body for searching available exchange offers for one or more
        purchased fulfillments. The passenger specifies which fulfillments they
        wish to exchange and optionally provides new trip/offer criteria.
        OSDM equivalent: POST /bookings/{id}/exchange-offers.
        Transmodel: BOOKING exchange search.
      x-tm: BOOKING
      x-semantics:
        transmodel: BOOKING
        osdm: ExchangeOfferCollectionRequest
      required: [fulfillmentIds]
      properties:
        fulfillmentIds:
          type: array
          minItems: 1
          items:
            type: string
          description: >
            IDs of the fulfillments (travel documents / tickets) to exchange.
        origin:
          type: string
          description: New origin stop/station reference (if the route is changing).
        destination:
          type: string
          description: New destination stop/station reference.
        departureTime:
          type: string
          format: date-time
          description: Desired new departure time.
        arrivalTime:
          type: string
          format: date-time
          description: Desired latest arrival time.
        serviceClass:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/classOfUse'
          description: Desired service class for the new journey.
        overruleCode:
          type: string
          description: >
            Operator override code for waiving exchange fees or conditions
            (e.g. for disruption situations).

    exchangeOffer:
      type: object
      description: >
        A single exchange offer returned by a search. The offer describes the
        new journey and any price difference (surcharge or refund delta).
        OSDM equivalent: ExchangeOffer.
      required: [exchangeOfferId, summary]
      properties:
        exchangeOfferId:
          type: string
        summary:
          type: string
          description: Human-readable summary of the new journey.
        priceDifference:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/amountOfMoney'
          description: >
            Price difference: positive = surcharge to pay; negative = refund
            to receive.
        validUntil:
          type: string
          format: date-time
          description: Expiry time for this exchange offer.
        newLeg:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/leg'
          description: The new LEG that would replace the exchanged fulfillment.

    exchangeOfferSearchResult:
      type: object
      description: Result of an exchange offer search.
      required: [exchangeSearchId, exchangeOffers, pageInfo]
      properties:
        exchangeSearchId:
          type: string
          description: Server-assigned identifier for this search result resource.
        exchangeOffers:
          type: array
          items:
            $ref: '#/components/schemas/exchangeOffer'
        pageInfo:
          $ref: './components.yaml#/components/schemas/pageInfo'
        validUntil:
          type: string
          format: date-time
          description: When these exchange offers expire.

    exchangeOperationRequest:
      type: object
      description: >
        Request body for initiating an exchange operation (provisional rebooking).
        The passenger selects one or more exchange offers returned by a search.
        OSDM equivalent: POST /bookings/{id}/exchange-operations.
      required: [selectedExchangeOfferIds]
      properties:
        selectedExchangeOfferIds:
          type: array
          minItems: 1
          items:
            type: string
          description: IDs of the exchange offers selected by the passenger.

    exchangeOperationPatch:
      type: object
      description: >
        JSON Merge Patch body for confirming a PREBOOKED exchange operation.
        Set `state` to `CONFIRMED` to confirm the exchange. Optionally specify
        `fulfillmentMediaPreference` for the new travel documents.
        RFC 7396 — send only the fields that need changing.
      properties:
        state:
          type: string
          enum: [CONFIRMED]
          description: Set to `CONFIRMED` to confirm the provisional exchange.
        fulfillmentMediaPreference:
          type: string
          description: >
            Preferred fulfillment medium for the new travel documents (e.g.
            `PDF`, `AZTEC`, `NFC`, `BARCODE`).

    exchangeOperation:
      type: object
      description: >
        An exchange operation record. Initially in `PREBOOKED` state; moves to
        `CONFIRMED` after confirmation and `FULFILLED` when travel documents
        are issued.
        OSDM equivalent: ExchangeOperation schema.
        Transmodel: BOOKING exchange.
      x-tm: BOOKING
      x-semantics:
        transmodel: BOOKING
        osdm: ExchangeOperation
      required: [exchangeOperationId, status]
      properties:
        exchangeOperationId:
          type: string
        packageId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/exchangeStatus'
        exchangeOffers:
          type: array
          items:
            $ref: '#/components/schemas/exchangeOffer'
        ticketTimeLimit:
          type: string
          format: date-time
          description: >
            Deadline for confirming this exchange. After this time the
            exchange operation expires.
        newFulfillmentIds:
          type: array
          items:
            type: string
          description: >
            IDs of the new travel documents/fulfillments issued after
            confirmation.
        issuedVoucherIds:
          type: array
          items:
            type: string
          description: >
            IDs of any vouchers issued as part of the exchange (e.g. refund
            voucher if the exchange resulted in a credit).

    exchangeOperationCollection:
      type: object
      description: Paginated collection of exchange operations for a PACKAGE.
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/exchangeOperation'
        pageInfo:
          $ref: './components.yaml#/components/schemas/pageInfo'

    # ── Reimbursement ─────────────────────────────────────────────

    reimbursementStatus:
      type: string
      description: >
        Processing mode for a reimbursement claim.
        OSDM: ReimbursementStatus.
      enum:
        - IMMEDIATE
        - DELAYED

    backOfficeStatus:
      type: string
      description: >
        Processing status of a back-office reimbursement.
        OSDM: BackOfficeStatus.
      enum:
        - RECEIVED
        - IN_REVIEW
        - ADDITIONAL_INFO_NEEDED
        - APPROVED
        - REJECTED
        - PAID

    reimbursementRequest:
      type: object
      description: >
        Request body for submitting a back-office reimbursement claim. Used when
        the standard online cancellation/refund flow does not apply — e.g.
        goodwill gestures, manual disruption claims, or delayed reimbursement
        requests.
        OSDM equivalent: POST /bookings/{id}/reimbursements.
        Transmodel: REIMBURSEMENT CLAIM / EU PASSENGER RIGHTS.
      x-tm: REIMBURSEMENT CLAIM
      x-semantics:
        transmodel: REIMBURSEMENT CLAIM
        osdm: ReimbursementRequest
      required: [reimbursementReason, fulfillmentIds, passengerIds]
      properties:
        reimbursementReason:
          type: string
          description: Free-text description of why the reimbursement is requested.
        fulfillmentIds:
          type: array
          minItems: 1
          items:
            type: string
          description: >
            IDs of the fulfillments (tickets) for which reimbursement is claimed.
        passengerIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: Traveller references for whom the claim applies.
        reimbursementDate:
          type: string
          format: date-time
          description: Date of the incident/travel failure that triggered this claim.
        supportingDocuments:
          type: array
          description: >
            Scanned receipts, delay certificates, or other supporting evidence.
          items:
            type: object
            required: [url, mimeType]
            properties:
              url:
                type: string
                format: uri
              mimeType:
                type: string
              documentType:
                type: string
                description: >
                  Type of document (e.g. `DELAY_CERTIFICATE`, `RECEIPT`,
                  `PASSENGER_RIGHTS_FORM`).

    reimbursement:
      type: object
      description: >
        A reimbursement claim record with status and back-office decision.
        OSDM equivalent: Reimbursement schema.
        Transmodel: REIMBURSEMENT CLAIM.
      x-tm: REIMBURSEMENT CLAIM
      x-semantics:
        transmodel: REIMBURSEMENT CLAIM
        osdm: Reimbursement
      required: [reimbursementId, status, backOfficeStatus]
      properties:
        reimbursementId:
          type: string
        packageId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/reimbursementStatus'
        backOfficeStatus:
          $ref: '#/components/schemas/backOfficeStatus'
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        missingInformation:
          type: array
          items:
            type: string
          description: >
            Additional information items the back-office requires (present when
            `backOfficeStatus` is `ADDITIONAL_INFO_NEEDED`).
        approvedAmount:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/amountOfMoney'
          description: Amount approved for reimbursement (when APPROVED or PAID).
        rejectionReason:
          type: string
          description: Reason for rejection (when REJECTED).
        paymentReference:
          type: string
          description: Payment reference number (when PAID).

    reimbursementCollection:
      type: object
      description: Paginated collection of reimbursement claims for a PACKAGE.
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/reimbursement'
        pageInfo:
          $ref: './components.yaml#/components/schemas/pageInfo'

    # ── Travel Account ─────────────────────────────────────────────

    travelAccountType:
      type: string
      description: >
        Type of travel account.
        OSDM: TravelAccountType.
        Transmodel: TRANSPORT CUSTOMER ACCOUNT TYPE.
      x-tm: TRANSPORT CUSTOMER ACCOUNT
      x-semantics:
        transmodel: TRANSPORT CUSTOMER ACCOUNT
        osdm: TravelAccountType
      enum:
        - LINKED_TICKET
        - LOYALTY_CARD
        - MULTI_RIDE
        - REDUCTION_CARD
        - TRAVEL_PASS

    travelAccountConsumption:
      type: object
      description: >
        A consumption event on a travel account (e.g. one ride used from a
        multi-ride card, or points earned/spent on a loyalty card).
        OSDM: TravelAccountConsumption.
      properties:
        consumedAt:
          type: string
          format: date-time
        description:
          type: string
        amount:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/amountOfMoney'
        points:
          type: integer
          description: Points earned or spent (for loyalty accounts).
        remainingBalance:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/amountOfMoney'
        remainingRides:
          type: integer
          description: Remaining rides (for multi-ride accounts).

    travelAccount:
      type: object
      description: >
        A passenger's travel account. May be a loyalty card (points/miles),
        a multi-ride card (stored rides), a reduction card (entitling to
        discounted fares), a travel pass (unlimited travel in a zone/period),
        or a linked ticket (tied to a specific journey).
        OSDM equivalent: AbstractTravelAccount + subtypes.
        Transmodel: TRANSPORT CUSTOMER ACCOUNT.
      x-tm: TRANSPORT CUSTOMER ACCOUNT
      x-semantics:
        transmodel: TRANSPORT CUSTOMER ACCOUNT
        osdm: AbstractTravelAccount
      required: [accountType, issuer, number, validFrom, validUntil]
      properties:
        accountType:
          $ref: '#/components/schemas/travelAccountType'
        issuer:
          type: string
          description: Name or code of the issuing operator.
        number:
          type: string
          description: Account/card number.
        holderName:
          type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        currentBalance:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/amountOfMoney'
          description: Current monetary balance (for value-based accounts).
        currentPoints:
          type: integer
          description: Current loyalty points.
        remainingRides:
          type: integer
          description: Remaining rides (for multi-ride accounts).
        regionalConstraint:
          type: string
          description: >
            Zone or regional validity constraint (e.g. `ZONE_AB`,
            `NATIONAL`, `INTERNATIONAL`).
        consumptions:
          type: array
          description: Recent consumption events. Present when `embed=consumptions`.
          items:
            $ref: '#/components/schemas/travelAccountConsumption'

    travelAccountCollection:
      type: object
      description: Paginated collection of travel accounts for the authenticated customer.
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/travelAccount'
        pageInfo:
          $ref: './components.yaml#/components/schemas/pageInfo'

    travelAccountApplicationRequest:
      $ref: './components.yaml#/components/schemas/travelAccountApplication'

paths:

  # ─────────────────────────────────────────────────────────────────
  # Seat Maps (read-only, availability per service journey)
  # ─────────────────────────────────────────────────────────────────

  /seat-maps/{serviceJourneyId}:
    post:
      operationId: getSeatMap
      summary: Get Seat Map
      description: >
        Retrieves the graphical seat/place availability map for the coaches of
        a specific train service. The result shows which seats are available,
        reserved, or blocked, taking into account the passenger's fare class
        and accommodation type preferences.

        Although this is a GET-by-nature query, it uses `POST` because the
        request carries a complex body (`placeRestrictions`) that cannot
        easily be expressed as query parameters.

        Use this endpoint to display a visual seat picker in the booking UI.
        Once a seat is selected, use `POST .../seat-reservations` to actually
        assign the seat to a traveller.

        Transmodel: SEAT AVAILABILITY for SERVICE JOURNEY.
        OSDM equivalent: POST /availabilities/vehicle-place-map.
      tags: [Rail Seat Maps]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/serviceJourneyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/seatMapSearchRequest'
      responses:
        '200':
          description: Seat map retrieved successfully.
          headers:
            Content-Language:
              $ref: './components.yaml#/components/headers/Content-Language'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/seatMapResult'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  # ─────────────────────────────────────────────────────────────────
  # Coach Layouts (static definitions)
  # ─────────────────────────────────────────────────────────────────

  /coach-layouts:
    get:
      operationId: listCoachLayouts
      summary: List Coach Deck Layouts
      description: >
        Returns the static graphical coach deck layouts for a train service or
        vehicle type. These layouts define the physical arrangement of seats,
        compartments, and graphic elements.

        For per-departure seat availability, use `POST /seat-maps/{serviceJourneyId}`
        instead.

        Transmodel: TRAIN COMPONENT layout.
        OSDM equivalent: GET /coach-deck-layouts.
      tags: [Rail Seat Maps]
      security:
        - OpenData: []
        - BearerAuth: []
      parameters:
        - name: vehicleTypeRef
          in: query
          required: false
          schema:
            type: string
          description: Filter by vehicle type reference.
        - $ref: './components.yaml#/components/parameters/serviceJourneyId'
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: Paginated list of coach deck layouts.
          headers:
            Link:
              $ref: './components.yaml#/components/headers/Link'
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coachDeckLayoutCollection'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'

  # ─────────────────────────────────────────────────────────────────
  # Seat Reservations (per PACKAGE / LEG)
  # ─────────────────────────────────────────────────────────────────

  /packages/{packageId}/legs/{legId}/seat-reservations:
    post:
      operationId: createSeatReservation
      summary: Create Seat Reservation
      description: >
        Reserves specific seats for a traveller on a particular leg of a
        PACKAGE. The seats must be identified via a prior seat map query.

        Returns `201 Created` with a `Location` header.

        Transmodel: SEAT RESERVATION on SERVICE JOURNEY.
        OSDM equivalent: POST /bookings/{bookingId}/seat-reservations.
      tags: [Rail Seat Reservations]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - $ref: './components.yaml#/components/parameters/legId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/seatReservationRequest'
      responses:
        '201':
          description: Seat reservation created.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/leg'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
        '409':
          description: >
            Conflict — requested seat(s) no longer available, or the PACKAGE
            state does not allow modification.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'

    get:
      operationId: listSeatReservations
      summary: List Seat Reservations
      description: >
        Returns all seat reservations for the specified leg of a PACKAGE.
        Transmodel: SEAT RESERVATIONs within a BOOKING LEG.
      tags: [Rail Seat Reservations]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - $ref: './components.yaml#/components/parameters/legId'
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
      responses:
        '200':
          description: List of seat reservations.
          headers:
            Link:
              $ref: './components.yaml#/components/headers/Link'
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/seatReservationCollection'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /packages/{packageId}/legs/{legId}/seat-reservations/{reservationId}:
    get:
      operationId: getSeatReservation
      summary: Get Seat Reservation
      description: Returns the details of a specific seat reservation.
      tags: [Rail Seat Reservations]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - $ref: './components.yaml#/components/parameters/legId'
        - $ref: './components.yaml#/components/parameters/reservationId'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: Seat reservation details.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/leg'
        '304':
          $ref: './components.yaml#/components/responses/304NotModified'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

    delete:
      operationId: cancelSeatReservation
      summary: Cancel Seat Reservation
      description: >
        Cancels a specific seat reservation on a leg. The leg remains in the
        PACKAGE but the seat is released. A fee may apply depending on
        fare conditions.
        Transmodel: cancel SEAT RESERVATION within BOOKING LEG.
      tags: [Rail Seat Reservations]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - $ref: './components.yaml#/components/parameters/legId'
        - $ref: './components.yaml#/components/parameters/reservationId'
      responses:
        '204':
          $ref: './components.yaml#/components/responses/204NoContent'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
        '409':
          description: Cancellation not permitted by fare conditions.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'

  # ─────────────────────────────────────────────────────────────────
  # On-Hold
  # ─────────────────────────────────────────────────────────────────

  /packages/{packageId}/on-hold:
    post:
      operationId: placeOnHold
      summary: Place Package On-Hold
      description: >
        Extends the TTL of a PACKAGE booking by placing it on hold. A fee
        and/or deposit may be charged. Returns the on-hold record including
        the new expiry timestamp.

        Useful when the passenger needs extra time to complete a group booking
        or arrange payment but does not want to lose the reserved seats.

        Returns `201 Created` with a `Location` header.

        Transmodel: BOOKING reservation extension.
        OSDM equivalent: POST /bookings/{bookingId}/on-hold-offer.
      tags: [Rail On-Hold]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/onHoldRequest'
      responses:
        '201':
          description: On-hold record created. Booking TTL extended.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/onHoldRecord'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
        '409':
          description: >
            Conflict — on-hold not permitted (e.g. booking already confirmed,
            or the maximum extension limit has been reached).
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'

    get:
      operationId: listOnHolds
      summary: List On-Hold Records
      description: >
        Returns on-hold records for a PACKAGE (active and historical).
        Transmodel: BOOKING reservation extensions.
      tags: [Rail On-Hold]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
      responses:
        '200':
          description: List of on-hold records.
          headers:
            Link:
              $ref: './components.yaml#/components/headers/Link'
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/onHoldCollection'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /packages/{packageId}/on-hold/{onHoldId}:
    delete:
      operationId: cancelOnHold
      summary: Cancel On-Hold
      description: >
        Cancels a pending on-hold offer without charging the fee. The booking
        returns to its original TTL. Cannot be called after the on-hold has
        been fully committed.

        OSDM equivalent: DELETE /bookings/{bookingId}/on-hold-offer/{id}.
      tags: [Rail On-Hold]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - $ref: './components.yaml#/components/parameters/onHoldId'
      responses:
        '204':
          $ref: './components.yaml#/components/responses/204NoContent'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
        '409':
          description: On-hold already committed; cannot cancel.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'

  # ─────────────────────────────────────────────────────────────────
  # Exchange Searches
  # ─────────────────────────────────────────────────────────────────

  /packages/{packageId}/exchange-searches:
    post:
      operationId: createExchangeSearch
      summary: Search Exchange Offers
      description: >
        Creates an exchange offer search resource. Searches for available
        alternative journeys to which the passenger can exchange one or more
        purchased fulfillments. Returns a list of exchange offers with price
        differences.

        Results are stored as a search resource for subsequent retrieval
        (`GET .../exchange-searches/{exchangeSearchId}`).

        Returns `201 Created` with a `Location` header.

        Transmodel: BOOKING exchange offer search.
        OSDM equivalent: POST /bookings/{bookingId}/exchange-offers.
      tags: [Rail Exchange]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/exchangeOfferSearchRequest'
      responses:
        '201':
          description: Exchange search created with results.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exchangeOfferSearchResult'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /packages/{packageId}/exchange-searches/{exchangeSearchId}:
    get:
      operationId: getExchangeSearch
      summary: Get Exchange Search Results
      description: >
        Returns the results of a previously created exchange offer search,
        including available alternative journeys and price differences.
        OSDM equivalent: GET /bookings/{bookingId}/exchange-offers/{id}.
      tags: [Rail Exchange]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: exchangeSearchId
          in: path
          required: true
          schema:
            type: string
          description: Identifier of the exchange search resource.
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: Exchange search results.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exchangeOfferSearchResult'
        '304':
          $ref: './components.yaml#/components/responses/304NotModified'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  # ─────────────────────────────────────────────────────────────────
  # Exchange Operations
  # ─────────────────────────────────────────────────────────────────

  /packages/{packageId}/exchange-operations:
    post:
      operationId: createExchangeOperation
      summary: Initiate Exchange
      description: >
        Initiates a provisional exchange operation by selecting one or more
        exchange offers. The exchange enters `PREBOOKED` state. No fulfillments
        are issued yet. The passenger must PATCH the operation with
        `state: CONFIRMED` to finalise.

        Returns `201 Created` with a `Location` header.

        Transmodel: provisional BOOKING exchange.
        OSDM equivalent: POST /bookings/{bookingId}/exchange-operations.
      tags: [Rail Exchange]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/exchangeOperationRequest'
      responses:
        '201':
          description: Exchange operation initiated (PREBOOKED).
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exchangeOperation'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '409':
          description: Exchange not permitted by fare conditions or availability.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'

    get:
      operationId: listExchangeOperations
      summary: List Exchange Operations
      description: >
        Returns active or historical exchange operations for a PACKAGE.
        Transmodel: BOOKING exchange history.
        OSDM equivalent: GET /bookings/{bookingId}/exchange-operations.
      tags: [Rail Exchange]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/exchangeStatus'
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
      responses:
        '200':
          description: List of exchange operations.
          headers:
            Link:
              $ref: './components.yaml#/components/headers/Link'
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exchangeOperationCollection'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /packages/{packageId}/exchange-operations/{exchangeOperationId}:
    get:
      operationId: getExchangeOperation
      summary: Get Exchange Operation
      description: Returns the details of a specific exchange operation.
      tags: [Rail Exchange]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: exchangeOperationId
          in: path
          required: true
          schema:
            type: string
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: Exchange operation details.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exchangeOperation'
        '304':
          $ref: './components.yaml#/components/responses/304NotModified'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

    patch:
      operationId: confirmExchangeOperation
      summary: Confirm Exchange
      description: >
        Confirms a provisional exchange operation by patching its state to
        `CONFIRMED`. The original fulfillments are revoked and new travel
        documents are issued. The exchange transitions from `PREBOOKED` to
        `CONFIRMED` → `FULFILLED`.

        Uses JSON Merge Patch (RFC 7396). Optimistic concurrency via `If-Match`.

        Transmodel: confirmed BOOKING exchange with FULFILLMENT issuance.
        OSDM equivalent: PATCH /bookings/{bookingId}/exchange-operations/{id}.
      tags: [Rail Exchange]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: exchangeOperationId
          in: path
          required: true
          schema:
            type: string
        - $ref: './components.yaml#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/exchangeOperationPatch'
      responses:
        '200':
          description: Exchange confirmed. New fulfillments issued.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exchangeOperation'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
        '409':
          description: Exchange already confirmed or expired.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'
        '412':
          $ref: './components.yaml#/components/responses/412PreconditionFailed'

    delete:
      operationId: cancelExchangeOperation
      summary: Cancel Exchange Operation
      description: >
        Cancels a provisional exchange operation in `PREBOOKED` state without
        committing to the new itinerary. The original fulfillments remain valid.

        Cannot be called after confirmation (`CONFIRMED` state or beyond).

        OSDM equivalent: DELETE /bookings/{bookingId}/exchange-operations/{id}.
      tags: [Rail Exchange]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: exchangeOperationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          $ref: './components.yaml#/components/responses/204NoContent'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
        '409':
          description: Exchange already confirmed; cannot cancel.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'

  # ─────────────────────────────────────────────────────────────────
  # Reimbursements
  # ─────────────────────────────────────────────────────────────────

  /packages/{packageId}/reimbursements:
    post:
      operationId: createReimbursement
      summary: Submit Reimbursement Claim
      description: >
        Submits a back-office reimbursement claim for a passenger who did not
        travel, only partially travelled, or is entitled to compensation under
        EU Passenger Rights Regulations (PRR).

        The claim is processed asynchronously by the operator's back-office
        team. Track status via `GET .../reimbursements/{reimbursementId}`.

        Returns `201 Created` with a `Location` header.

        Transmodel: REIMBURSEMENT CLAIM / EU PASSENGER RIGHTS.
        OSDM equivalent: POST /bookings/{bookingId}/reimbursements.
      tags: [Rail Reimbursement]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/reimbursementRequest'
      responses:
        '201':
          description: Reimbursement claim submitted.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reimbursement'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

    get:
      operationId: listReimbursements
      summary: List Reimbursement Claims
      description: >
        Returns reimbursement claims submitted for a PACKAGE, with current
        back-office status.
        OSDM equivalent: GET /bookings/{bookingId}/reimbursements.
      tags: [Rail Reimbursement]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: backOfficeStatus
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/backOfficeStatus'
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
      responses:
        '200':
          description: List of reimbursement claims.
          headers:
            Link:
              $ref: './components.yaml#/components/headers/Link'
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reimbursementCollection'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /packages/{packageId}/reimbursements/{reimbursementId}:
    get:
      operationId: getReimbursement
      summary: Get Reimbursement Claim
      description: >
        Returns the details and current back-office status of a specific
        reimbursement claim.
      tags: [Rail Reimbursement]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: reimbursementId
          in: path
          required: true
          schema:
            type: string
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: Reimbursement claim details.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reimbursement'
        '304':
          $ref: './components.yaml#/components/responses/304NotModified'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  # ─────────────────────────────────────────────────────────────────
  # Travel Account Applications
  # ─────────────────────────────────────────────────────────────────

  /packages/{packageId}/travel-account-applications:
    post:
      operationId: applyTravelAccount
      summary: Apply Travel Account to Package
      description: >
        Links a travel account (loyalty card, multi-ride card, reduction card,
        or travel pass) to a PACKAGE for discount application or consumption.

        The server verifies the account with the issuing operator and applies
        any eligible discounts or reductions to the PACKAGE pricing.

        Returns `201 Created` with a `Location` header.

        Transmodel: TRANSPORT CUSTOMER ACCOUNT application to BOOKING.
        OSDM equivalent: travel account application within booking flow.
      tags: [Rail Account]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/travelAccountApplicationRequest'
      responses:
        '201':
          description: Travel account applied to package.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/travelAccount'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          description: >
            Package not found, or travel account not found for the given
            issuer and number.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'
        '422':
          $ref: './components.yaml#/components/responses/422UnprocessableEntity'

  # ─────────────────────────────────────────────────────────────────
  # Travel Accounts
  # ─────────────────────────────────────────────────────────────────

  /travel-accounts:
    get:
      operationId: listTravelAccounts
      summary: List Travel Accounts
      description: >
        Returns travel accounts linked to the authenticated passenger's profile.
        Supports filtering by account type, issuer, and optional consumption
        history embedding.

        Transmodel: TRANSPORT CUSTOMER ACCOUNT collection.
        OSDM equivalent: GET /travel-accounts.
      tags: [Rail Account]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - name: accountType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/travelAccountType'
        - name: issuer
          in: query
          required: false
          schema:
            type: string
          description: Filter by issuing operator code (e.g. `DB`, `SBB`, `SNCF`).
        - name: embed
          in: query
          required: false
          schema:
            type: string
            enum: [consumptions]
          description: >
            Set to `consumptions` to include recent consumption events in each
            travel account response.
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
      responses:
        '200':
          description: Paginated list of travel accounts.
          headers:
            Link:
              $ref: './components.yaml#/components/headers/Link'
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/travelAccountCollection'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
