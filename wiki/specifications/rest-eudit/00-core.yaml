openapi: 3.0.3
info:
  title: EUDIT Unified Mobility API – Core / Discovery
  description: >
    Strictly RESTful discovery and health endpoints for the EUDIT unified
    mobility API. These endpoints are unauthenticated and expose the API's
    capabilities and health status.

    Standards covered: OMSA, TOMP-API, OSDM, BoB, FerryGateway, InterMOD.
    Aligned to: Transmodel.
  version: 0.1.0
  contact:
    name: EUDIT Working Group (CEN TC278)
  license:
    name: European Union Public Licence (EUPL) 1.2
    url: https://joinup.ec.europa.eu/collection/eupl/eupl-text-eupl-12

servers:
  - url: https://api.eudit.example.com/v1
    description: Reference implementation server (example)

tags:
  - name: Discovery
    description: Landing page, API definition, and conformance declaration
  - name: Health
    description: Liveness and readiness probes

paths:

  /:
    get:
      operationId: getLandingPage
      summary: Landing page
      description: >
        Returns the API landing page with links to the API definition,
        conformance declaration, and all module root URLs.
      tags: [Discovery]
      security:
        - OpenData: []
      parameters:
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        "200":
          description: Landing page returned successfully.
          headers:
            Content-Language:
              $ref: './components.yaml#/components/headers/Content-Language'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/landingPage'
              example:
                title: EUDIT Unified Mobility API
                description: >
                  A strictly RESTful unified mobility API harmonising OSDM,
                  TOMP-API, BoB, FerryGateway, OMSA, and InterMOD under a
                  single Transmodel-compliant interface.
                version: "0.1.0"
                links:
                  - rel: self
                    href: https://api.eudit.example.com/v1/
                    type: application/json
                    title: This document
                  - rel: service-desc
                    href: https://api.eudit.example.com/v1/api
                    type: application/vnd.oai.openapi+json;version=3.0
                    title: API definition
                  - rel: conformance
                    href: https://api.eudit.example.com/v1/conformance
                    type: application/json
                    title: Conformance declaration
                  - rel: https://api.eudit.example.com/rel/offer-searches
                    href: https://api.eudit.example.com/v1/offer-searches
                    type: application/json
                    title: Offer searches
                  - rel: https://api.eudit.example.com/rel/packages
                    href: https://api.eudit.example.com/v1/packages
                    type: application/json
                    title: Packages (bookings)
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /api:
    get:
      operationId: getApiDefinition
      summary: API definition
      description: Returns the OpenAPI 3.0 definition of this API.
      tags: [Discovery]
      security:
        - OpenData: []
      responses:
        "200":
          description: OpenAPI definition returned successfully.
          content:
            application/vnd.oai.openapi+json;version=3.0:
              schema:
                type: object
                description: OpenAPI 3.0 document.
            application/json:
              schema:
                type: object
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /conformance:
    get:
      operationId: getConformanceDeclaration
      summary: Conformance declaration
      description: >
        Declares the EUDIT REST API conventions implemented by this server,
        expressed as conformance class URIs.
      tags: [Discovery]
      security:
        - OpenData: []
      responses:
        "200":
          description: Conformance declaration returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conformanceDeclaration'
              example:
                conformsTo:
                  - "https://api.eudit.example.com/spec/rest/1.0/conf/core"
                  - "https://api.eudit.example.com/spec/rest/1.0/conf/offers"
                  - "https://api.eudit.example.com/spec/rest/1.0/conf/presales"
                  - "https://api.eudit.example.com/spec/rest/1.0/conf/purchase"
                  - "https://api.eudit.example.com/spec/rest/1.0/conf/aftersales"
                  - "https://api.eudit.example.com/spec/rest/1.0/conf/execution"
                  - "https://api.eudit.example.com/spec/rest/1.0/conf/support"
                  - "https://api.eudit.example.com/spec/rest/1.0/conf/bob"
                  - "https://api.eudit.example.com/spec/rest/1.0/conf/ferry"
                  - "https://api.eudit.example.com/spec/rest/1.0/conf/rail"
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: >
        Liveness probe. Returns `{ "status": "ok" }` when the server is
        accepting requests. Used by load balancers and orchestration platforms.
      tags: [Health]
      security:
        - OpenData: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/healthStatus'
              example:
                status: ok
                version: "0.1.0"
                uptime: 86423
        "503":
          description: Service is unavailable or initialising.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/healthStatus'
              example:
                status: degraded
                version: "0.1.0"

components:
  securitySchemes:
    BearerAuth:
      $ref: './components.yaml#/components/securitySchemes/BearerAuth'
    OAuth:
      $ref: './components.yaml#/components/securitySchemes/OAuth'
    OAuthPKI:
      $ref: './components.yaml#/components/securitySchemes/OAuthPKI'
    OpenData:
      $ref: './components.yaml#/components/securitySchemes/OpenData'

  schemas:

    landingPage:
      type: object
      description: API landing page with metadata and navigation links.
      required: [title, links]
      properties:
        title:
          type: string
          example: EUDIT Unified Mobility API
        description:
          type: string
        version:
          type: string
          example: "0.1.0"
        links:
          type: array
          items:
            $ref: '../ogcapi-eudit/components.yaml#/components/schemas/link'

    conformanceDeclaration:
      type: object
      description: List of conformance class URIs implemented by this server.
      required: [conformsTo]
      properties:
        conformsTo:
          type: array
          items:
            type: string
            format: uri
          example:
            - "https://api.eudit.example.com/spec/rest/1.0/conf/core"

    healthStatus:
      type: object
      description: Service health report.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        version:
          type: string
        uptime:
          type: integer
          description: Server uptime in seconds.
        checks:
          type: object
          additionalProperties:
            type: string
          description: >
            Optional map of sub-system names to their health status strings
            (e.g. `{ "database": "ok", "cache": "degraded" }`).
          example:
            database: ok
            cache: ok
