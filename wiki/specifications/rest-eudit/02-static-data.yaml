  /entitlements/{entitlementId}:
    parameters:
      - $ref: './components.yaml#/components/parameters/entitlementId'
    get:
      operationId: getEntitlement
      summary: Get an ENTITLEMENT PRODUCT
      description: Returns detail of a single ENTITLEMENT PRODUCT.
      tags: [Entitlements]
      security:
        - OpenData: []
      responses:
        "200":
          description: Entitlement product returned.
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/entitlementProduct'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /fare-products:
    get:
      operationId: listFareProducts
      summary: List FARE PRODUCTs
      description: >
        Returns a paginated list of available FARE PRODUCTs (passes,
        subscriptions, point-to-point fares, etc.).
      tags: [FareProducts]
      security:
        - OpenData: []
        - BearerAuth: []
      parameters:
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
        - $ref: './components.yaml#/components/parameters/filterMode'
        - $ref: './components.yaml#/components/parameters/filterOperator'
      responses:
        "200":
          description: Fare products returned.
          headers:
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
            Link:
              $ref: './components.yaml#/components/headers/Link'
          content:
            application/json:
              schema:
                type: object
                required: [data, pageInfo]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../ogcapi-eudit/components.yaml#/components/schemas/fareProduct'
                  pageInfo:
                    $ref: './components.yaml#/components/schemas/pageInfo'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /fare-products/{fareProductId}:
    parameters:
      - $ref: './components.yaml#/components/parameters/fareProductId'
    get:
      operationId: getFareProduct
      summary: Get a FARE PRODUCT
      description: Returns detail of a single FARE PRODUCT.
      tags: [FareProducts]
      security:
        - OpenData: []
        - BearerAuth: []
      responses:
        "200":
          description: Fare product returned.
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/fareProduct'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

components:
  securitySchemes:
    BearerAuth:
      $ref: './components.yaml#/components/securitySchemes/BearerAuth'
    OAuth:
      $ref: './components.yaml#/components/securitySchemes/OAuth'
    OpenData:
      $ref: './components.yaml#/components/securitySchemes/OpenData'
