openapi: 3.0.3
info:
  title: EUDIT Unified Mobility API – Static Data (MMTIS)
  description: >
    Read-only reference data endpoints exposing the multimodal transport
    information network — stop places, lines, operators, zones, card types,
    entitlement products, and fare products.

    All endpoints are public (no authentication required) and support
    `If-None-Match` / `ETag` conditional requests for efficient caching.

    Transmodel concepts: STOP PLACE, LINE, ORGANISATION, TARIFF ZONE,
    FARE PRODUCT, ENTITLEMENT PRODUCT.
    MMTIS regulation reference: Regulation (EU) 2017/1926.
  version: 0.1.0
  contact:
    name: EUDIT Working Group (CEN TC278)
  license:
    name: European Union Public Licence (EUPL) 1.2
    url: https://joinup.ec.europa.eu/collection/eupl/eupl-text-eupl-12

servers:
  - url: https://api.eudit.example.com/v1

tags:
  - name: StopPlaces
    description: STOP PLACE reference data
  - name: Lines
    description: LINE reference data
  - name: Operators
    description: ORGANISATION (operator) reference data
  - name: Zones
    description: TARIFF ZONE reference data
  - name: CardTypes
    description: CARD TYPE catalogue
  - name: Entitlements
    description: ENTITLEMENT PRODUCT catalogue
  - name: FareProducts
    description: FARE PRODUCT catalogue

paths:

  /stop-places:
    get:
      operationId: listStopPlaces
      summary: List STOP PLACEs
      description: >
        Returns a paginated list of STOP PLACEs. Supports free-text search
        and filtering by mode and operator.
      tags: [StopPlaces]
      security:
        - OpenData: []
      parameters:
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
        - $ref: './components.yaml#/components/parameters/filterMode'
        - $ref: './components.yaml#/components/parameters/filterOperator'
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Free-text search on stop name or code.
        - name: bbox
          in: query
          required: false
          schema:
            type: string
            example: "4.8,52.3,5.0,52.4"
          description: >
            Bounding box filter: `minLon,minLat,maxLon,maxLat` (WGS84).
      responses:
        "200":
          description: Stop places returned.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
            Link:
              $ref: './components.yaml#/components/headers/Link'
            Content-Language:
              $ref: './components.yaml#/components/headers/Content-Language'
          content:
            application/json:
              schema:
                type: object
                required: [data, pageInfo]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../ogcapi-eudit/components.yaml#/components/schemas/stopPlace'
                  pageInfo:
                    $ref: './components.yaml#/components/schemas/pageInfo'
        "304":
          $ref: './components.yaml#/components/responses/304NotModified'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /stop-places/{stopPlaceId}:
    parameters:
      - $ref: './components.yaml#/components/parameters/stopPlaceId'
    get:
      operationId: getStopPlace
      summary: Get a STOP PLACE
      description: Returns the full detail of a single STOP PLACE by its identifier.
      tags: [StopPlaces]
      security:
        - OpenData: []
      parameters:
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        "200":
          description: Stop place returned.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Content-Language:
              $ref: './components.yaml#/components/headers/Content-Language'
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/stopPlace'
        "304":
          $ref: './components.yaml#/components/responses/304NotModified'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /lines:
    get:
      operationId: listLines
      summary: List LINEs
      description: Returns a paginated list of LINEs, optionally filtered by mode or operator.
      tags: [Lines]
      security:
        - OpenData: []
      parameters:
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
        - $ref: './components.yaml#/components/parameters/filterMode'
        - $ref: './components.yaml#/components/parameters/filterOperator'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        "200":
          description: Lines returned.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
            Link:
              $ref: './components.yaml#/components/headers/Link'
          content:
            application/json:
              schema:
                type: object
                required: [data, pageInfo]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../ogcapi-eudit/components.yaml#/components/schemas/lineReference'
                  pageInfo:
                    $ref: './components.yaml#/components/schemas/pageInfo'
        "304":
          $ref: './components.yaml#/components/responses/304NotModified'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /lines/{lineId}:
    parameters:
      - $ref: './components.yaml#/components/parameters/lineId'
    get:
      operationId: getLine
      summary: Get a LINE
      description: Returns full detail of a single LINE.
      tags: [Lines]
      security:
        - OpenData: []
      responses:
        "200":
          description: Line returned.
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/lineReference'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /operators:
    get:
      operationId: listOperators
      summary: List ORGANISATIONs (operators)
      description: Returns a paginated list of transport operators.
      tags: [Operators]
      security:
        - OpenData: []
      parameters:
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
        - $ref: './components.yaml#/components/parameters/filterMode'
      responses:
        "200":
          description: Operators returned.
          headers:
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
            Link:
              $ref: './components.yaml#/components/headers/Link'
          content:
            application/json:
              schema:
                type: object
                required: [data, pageInfo]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../ogcapi-eudit/components.yaml#/components/schemas/organisationReference'
                  pageInfo:
                    $ref: './components.yaml#/components/schemas/pageInfo'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /operators/{operatorId}:
    parameters:
      - $ref: './components.yaml#/components/parameters/operatorId'
    get:
      operationId: getOperator
      summary: Get an ORGANISATION (operator)
      description: Returns the detail of a single operator.
      tags: [Operators]
      security:
        - OpenData: []
      responses:
        "200":
          description: Operator returned.
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/organisationReference'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /zones:
    get:
      operationId: listZones
      summary: List TARIFF ZONEs
      description: Returns a paginated list of TARIFF ZONEs.
      tags: [Zones]
      security:
        - OpenData: []
      parameters:
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
        - $ref: './components.yaml#/components/parameters/filterOperator'
      responses:
        "200":
          description: Zones returned.
          headers:
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
            Link:
              $ref: './components.yaml#/components/headers/Link'
          content:
            application/json:
              schema:
                type: object
                required: [data, pageInfo]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../ogcapi-eudit/components.yaml#/components/schemas/zoneReference'
                  pageInfo:
                    $ref: './components.yaml#/components/schemas/pageInfo'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /zones/{zoneId}:
    parameters:
      - $ref: './components.yaml#/components/parameters/zoneId'
    get:
      operationId: getZone
      summary: Get a TARIFF ZONE
      description: Returns detail of a single TARIFF ZONE.
      tags: [Zones]
      security:
        - OpenData: []
      responses:
        "200":
          description: Zone returned.
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/zoneReference'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /card-types:
    get:
      operationId: listCardTypes
      summary: List CARD TYPEs
      description: >
        Returns a paginated list of CARD TYPEs accepted by the system
        (e.g. senior railcards, youth cards, loyalty cards).
      tags: [CardTypes]
      security:
        - OpenData: []
      parameters:
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        "200":
          description: Card types returned.
          headers:
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
            Link:
              $ref: './components.yaml#/components/headers/Link'
          content:
            application/json:
              schema:
                type: object
                required: [data, pageInfo]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../ogcapi-eudit/components.yaml#/components/schemas/cardTypeReference'
                  pageInfo:
                    $ref: './components.yaml#/components/schemas/pageInfo'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /card-types/{cardTypeId}:
    parameters:
      - $ref: './components.yaml#/components/parameters/cardTypeId'
    get:
      operationId: getCardType
      summary: Get a CARD TYPE
      description: Returns detail of a single CARD TYPE.
      tags: [CardTypes]
      security:
