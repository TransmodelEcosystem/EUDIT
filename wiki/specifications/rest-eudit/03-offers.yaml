openapi: 3.0.3
info:
  title: EUDIT Unified Mobility API – Offers
  description: >
    Offer search and retrieval resources. Offer searches are modelled as
    first-class resources (POST /offer-searches creates a search record
    and returns results synchronously or can be polled if async).

    Resources:
    - `POST /offer-searches` — create an offer search (trip, non-trip, or location-based)
    - `GET  /offer-searches/{offerSearchId}` — re-fetch results of a previous search
    - `GET  /offers/{offerId}` — fetch a single SALES OFFER PACKAGE by ID
    - `GET  /offers/{offerId}/ancillaries` — list ancillaries available for an offer

    Transmodel concepts: SALES OFFER PACKAGE, FARE PRODUCT.
    Cross-standard mapping: OSDM POST /trips + POST /offers;
    TOMP-API POST /bookings; OMSA searchOffers; FerryGateway sailing search.
  version: 0.1.0
  contact:
    name: EUDIT Working Group (CEN TC278)
  license:
    name: European Union Public Licence (EUPL) 1.2
    url: https://joinup.ec.europa.eu/collection/eupl/eupl-text-eupl-12

servers:
  - url: https://api.eudit.example.com/v1

tags:
  - name: OfferSearches
    description: Create and retrieve offer search results
  - name: Offers
    description: Individual SALES OFFER PACKAGE resources

paths:

  /offer-searches:
    post:
      operationId: createOfferSearch
      summary: Create an offer search
      description: >
        Creates a new offer search resource and immediately returns the result
        set. If the server cannot compute all results within the request timeout,
        it returns `status: pending` and the client should poll
        `GET /offer-searches/{offerSearchId}` until `status: complete`.

        Supports three search modes via `searchType`:
        - `trip` — multimodal origin-to-destination trip search
        - `non-trip` — passes, subscriptions, zone products (no specific trip)
        - `at-location` — shared/on-demand assets near a geographic location

        Returns `201 Created` with a `Location` header pointing to the
        search result resource.
      tags: [OfferSearches]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/offerSearch'
      responses:
        "201":
          description: Offer search created and result set returned.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/offerSearchResult'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "422":
          $ref: './components.yaml#/components/responses/422UnprocessableEntity'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /offer-searches/{offerSearchId}:
    parameters:
      - $ref: './components.yaml#/components/parameters/offerSearchId'
    get:
      operationId: getOfferSearch
      summary: Get offer search results
      description: >
        Returns the current state and results of a previous offer search.
        Poll until `status: complete`. Results expire at `expiresAt`.
      tags: [OfferSearches]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
        - $ref: './components.yaml#/components/parameters/filterMode'
      responses:
        "200":
          description: Offer search result returned.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/offerSearchResult'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "410":
          description: >
            The offer search has expired. Create a new search via
            `POST /offer-searches`.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /offers/{offerId}:
    parameters:
      - $ref: './components.yaml#/components/parameters/offerId'
    get:
      operationId: getOffer
      summary: Get a single SALES OFFER PACKAGE
      description: >
        Returns the full detail of a specific offer identified by `offerId`.
        Can be used to refresh offer data (price, availability, conditions)
        before adding it to a PACKAGE. Returns `410 Gone` if the offer has
        expired.
      tags: [Offers]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        "200":
          description: Offer returned.
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/offer'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "410":
          description: Offer has expired. Search again via `POST /offer-searches`.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /offers/{offerId}/ancillaries:
    parameters:
      - $ref: './components.yaml#/components/parameters/offerId'
    get:
      operationId: listOfferAncillaries
      summary: List ancillaries for an offer
      description: >
        Returns the ANCILLARY items available for a specific offer
        (e.g. seat reservations, luggage, meals, bicycle spaces).
        These can be added to a PACKAGE leg.
      tags: [Offers]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/page'
        - $ref: './components.yaml#/components/parameters/pageSize'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        "200":
          description: Ancillaries returned.
          headers:
            X-Total-Count:
              $ref: './components.yaml#/components/headers/X-Total-Count'
            Link:
              $ref: './components.yaml#/components/headers/Link'
          content:
            application/json:
              schema:
                type: object
                required: [data, pageInfo]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../ogcapi-eudit/components.yaml#/components/schemas/ancillary'
                  pageInfo:
                    $ref: './components.yaml#/components/schemas/pageInfo'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

components:
  securitySchemes:
    BearerAuth:
      $ref: './components.yaml#/components/securitySchemes/BearerAuth'
    OAuth:
      $ref: './components.yaml#/components/securitySchemes/OAuth'
    OpenData:
      $ref: './components.yaml#/components/securitySchemes/OpenData'
