openapi: 3.0.3
info:
  title: EUDIT Unified Mobility API – After Sales
  description: >
    Post-purchase lifecycle management: cancellations, refunds, exchanges,
    and disruption compensation claims.

    Resources:
    - `POST/GET /packages/{packageId}/cancellations` — cancel a PACKAGE
    - `GET      /packages/{packageId}/cancellations/{cancellationId}` — cancellation detail
    - `GET      /packages/{packageId}/refund-options` — available refund methods
    - `POST/GET/detail /packages/{packageId}/refunds` — refund claims
    - `GET      /packages/{packageId}/exchange-options` — available exchange options
    - `POST/GET/detail /packages/{packageId}/exchanges` — exchange requests
    - `POST/GET/detail /packages/{packageId}/disruption-claims` — disruption compensation

    Cancellation is modelled as a sub-resource (not DELETE on the package)
    to support request body (reason, comment) and side-effect tracking.

    Transmodel concepts: FARE CONTRACT CANCELLATION, REFUND, EXCHANGE,
    DISRUPTION COMPENSATION.
  version: 0.1.0
  contact:
    name: EUDIT Working Group (CEN TC278)
  license:
    name: European Union Public Licence (EUPL) 1.2
    url: https://joinup.ec.europa.eu/collection/eupl/eupl-text-eupl-12

servers:
  - url: https://api.eudit.example.com/v1

tags:
  - name: Cancellations
    description: Package cancellation management
  - name: Refunds
    description: Refund claims
  - name: Exchanges
    description: Ticket exchange requests
  - name: DisruptionClaims
    description: Disruption compensation claims

paths:

  /packages/{packageId}/cancellations:
    parameters:
      - $ref: './components.yaml#/components/parameters/packageId'

    get:
      operationId: listCancellations
      summary: List cancellations for a PACKAGE
      description: Returns all CANCELLATION records associated with the PACKAGE.
      tags: [Cancellations]
      security:
        - BearerAuth: []
        - OAuth: [read]
      responses:
        "200":
          description: Cancellations returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: './components.yaml#/components/schemas/cancellationResult'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

    post:
      operationId: cancelPackage
      summary: Cancel a PACKAGE
      description: >
        Initiates cancellation of a confirmed PACKAGE. The server processes
        the cancellation synchronously (or immediately queues it) and returns
        a CANCELLATION record with the resulting refund calculation.

        Returns `201 Created` with a `Location` header.

        If the PACKAGE is still `OPEN` (not yet paid), use
        `DELETE /packages/{packageId}` instead.
      tags: [Cancellations]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/cancellationRequest'
            example:
              reason: CUSTOMER_CANCELLATION
              comment: "Changed travel plans."
      responses:
        "201":
          description: Cancellation initiated.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/cancellationResult'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "409":
          description: PACKAGE is already cancelled or in a non-cancellable state.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'
        "422":
          $ref: './components.yaml#/components/responses/422UnprocessableEntity'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /packages/{packageId}/cancellations/{cancellationId}:
    parameters:
      - $ref: './components.yaml#/components/parameters/packageId'
      - $ref: './components.yaml#/components/parameters/cancellationId'

    get:
      operationId: getCancellation
      summary: Get a cancellation record
      description: Returns the full detail of a CANCELLATION record.
      tags: [Cancellations]
      security:
        - BearerAuth: []
        - OAuth: [read]
      responses:
        "200":
          description: Cancellation returned.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/cancellationResult'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /packages/{packageId}/refund-options:
    parameters:
      - $ref: './components.yaml#/components/parameters/packageId'

    get:
      operationId: getRefundOptions
      summary: Get refund options for a PACKAGE
      description: >
        Returns the refund methods and amounts available for the PACKAGE
        at the current point in time. Amounts may vary by operator policy
        and time to departure.
      tags: [Refunds]
      security:
        - BearerAuth: []
        - OAuth: [read]
      responses:
        "200":
          description: Refund options returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/refundOptions'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /packages/{packageId}/refunds:
    parameters:
      - $ref: './components.yaml#/components/parameters/packageId'

    get:
      operationId: listRefunds
      summary: List refund claims for a PACKAGE
      description: Returns all REFUND claims for the PACKAGE.
      tags: [Refunds]
      security:
        - BearerAuth: []
        - OAuth: [read]
      responses:
        "200":
          description: Refunds returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../ogcapi-eudit/components.yaml#/components/schemas/refund'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

    post:
      operationId: createRefund
      summary: Claim a refund for a PACKAGE
      description: >
        Submits a refund claim for a cancelled or disrupted PACKAGE.
        Returns `201 Created` with a `Location` header.
      tags: [Refunds]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/refundRequest'
            example:
              method: ORIGINAL_PAYMENT
      responses:
        "201":
          description: Refund claim submitted.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/refund'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "422":
          $ref: './components.yaml#/components/responses/422UnprocessableEntity'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /packages/{packageId}/refunds/{refundId}:
    parameters:
      - $ref: './components.yaml#/components/parameters/packageId'
      - $ref: './components.yaml#/components/parameters/refundId'

    get:
      operationId: getRefund
      summary: Get a refund claim
      description: Returns the current state of a REFUND claim.
      tags: [Refunds]
      security:
        - BearerAuth: []
        - OAuth: [read]
      responses:
        "200":
          description: Refund returned.
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/refund'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /packages/{packageId}/exchange-options:
    parameters:
      - $ref: './components.yaml#/components/parameters/packageId'

    get:
      operationId: getExchangeOptions
      summary: Get exchange options for a PACKAGE
      description: >
        Returns the exchange rules and any surcharge estimates applicable
        to the PACKAGE at the current point in time.
      tags: [Exchanges]
      security:
        - BearerAuth: []
        - OAuth: [read]
      responses:
        "200":
          description: Exchange options returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exchangeOptions'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /packages/{packageId}/exchanges:
    parameters:
      - $ref: './components.yaml#/components/parameters/packageId'

    get:
      operationId: listExchanges
      summary: List exchange requests for a PACKAGE
      description: Returns all EXCHANGE requests for the PACKAGE.
      tags: [Exchanges]
      security:
        - BearerAuth: []
        - OAuth: [read]
      responses:
        "200":
          description: Exchanges returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: './components.yaml#/components/schemas/exchangeResult'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

    post:
      operationId: requestExchange
      summary: Request an exchange for a PACKAGE
      description: >
        Submits an EXCHANGE request to re-book one or more legs on new travel
        details. Returns `201 Created` with a `Location` header and the
        exchange record (may be `pending` while the operator processes it).
      tags: [Exchanges]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/exchangeRequest'
      responses:
        "201":
          description: Exchange request submitted.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/exchangeResult'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "422":
          $ref: './components.yaml#/components/responses/422UnprocessableEntity'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /packages/{packageId}/exchanges/{exchangeId}:
    parameters:
      - $ref: './components.yaml#/components/parameters/packageId'
      - $ref: './components.yaml#/components/parameters/exchangeId'

    get:
      operationId: getExchange
      summary: Get an exchange request
      description: Returns the current state of an EXCHANGE request.
      tags: [Exchanges]
      security:
        - BearerAuth: []
        - OAuth: [read]
      responses:
        "200":
          description: Exchange returned.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/exchangeResult'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /packages/{packageId}/disruption-claims:
    parameters:
      - $ref: './components.yaml#/components/parameters/packageId'

    get:
      operationId: listDisruptionClaims
      summary: List disruption claims for a PACKAGE
      description: Returns all DISRUPTION COMPENSATION claims for the PACKAGE.
      tags: [DisruptionClaims]
      security:
        - BearerAuth: []
        - OAuth: [read]
      responses:
        "200":
          description: Disruption claims returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: './components.yaml#/components/schemas/disruptionClaimResult'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

    post:
      operationId: submitDisruptionClaim
      summary: Submit a disruption compensation claim
      description: >
        Submits a DISRUPTION COMPENSATION claim (delay, cancellation,
        missed connection, denied boarding). Returns `201 Created`.
      tags: [DisruptionClaims]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/disruptionClaim'
      responses:
        "201":
          description: Disruption claim submitted.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/disruptionClaimResult'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "422":
          $ref: './components.yaml#/components/responses/422UnprocessableEntity'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /packages/{packageId}/disruption-claims/{disruptionClaimId}:
    parameters:
      - $ref: './components.yaml#/components/parameters/packageId'
      - $ref: './components.yaml#/components/parameters/disruptionClaimId'

    get:
      operationId: getDisruptionClaim
      summary: Get a disruption claim
      description: Returns the current state and resolution of a DISRUPTION COMPENSATION claim.
      tags: [DisruptionClaims]
      security:
        - BearerAuth: []
        - OAuth: [read]
      responses:
        "200":
          description: Disruption claim returned.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/disruptionClaimResult'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

components:
  securitySchemes:
    BearerAuth:
      $ref: './components.yaml#/components/securitySchemes/BearerAuth'
    OAuth:
      $ref: './components.yaml#/components/securitySchemes/OAuth'

  schemas:

    refundOptions:
      type: object
      description: Available refund methods and estimated amounts.
      required: [options]
      properties:
        options:
          type: array
          items:
            type: object
            required: [method, estimatedAmount]
            properties:
              method:
                type: string
                enum: [ORIGINAL_PAYMENT, BANK_TRANSFER, VOUCHER, CASH, CREDIT_NOTE, OTHER]
              estimatedAmount:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/amountOfMoney'
              processingTimeDays:
                type: integer
              conditions:
                type: string

    refundRequest:
      type: object
      description: Request body for submitting a refund claim.
      required: [method]
      properties:
        method:
          type: string
          enum: [ORIGINAL_PAYMENT, BANK_TRANSFER, VOUCHER, CASH, CREDIT_NOTE, OTHER]
        bankAccountIban:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/normalString'
          description: Required when `method` is `BANK_TRANSFER`.
        comment:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/longString'

    exchangeOptions:
      type: object
      description: Exchange rules and surcharge estimates for the PACKAGE.
      required: [exchangeable]
      properties:
        exchangeable:
          type: boolean
        surchargeEstimate:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/amountOfMoney'
        conditions:
          type: string
        deadline:
          $ref: '../ogcapi-eudit/components.yaml#/components/schemas/dateTime'
          description: Last time at which an exchange is permitted.
