openapi: 3.0.3
info:
  title: EUDIT Unified Mobility API – Execution
  description: >
    Trip execution resources: leg state transitions, asset assignment,
    usage reporting, and travel document retrieval.

    Resources:
    - `PATCH  /packages/{packageId}/legs/{legId}` — state transition (board, alight, etc.)
    - `GET    /packages/{packageId}/legs/{legId}/asset` — assigned vehicle / asset
    - `PUT    /packages/{packageId}/legs/{legId}/asset` — assign or update the asset
    - `DELETE /packages/{packageId}/legs/{legId}/asset` — release the asset
    - `GET/POST /packages/{packageId}/legs/{legId}/usages` — usage events (pay-per-use)
    - `GET    /packages/{packageId}/travel-documents` — all travel documents
    - `GET    /packages/{packageId}/travel-documents/{travelDocumentId}` — single document

    Leg state machine (simplified):
    `OFFER_SELECTED → BOOKED → CONFIRMED → IN_USE → COMPLETED`
    Transitions are requested via PATCH with `{ "state": "<target>" }`.

    Transmodel concepts: DATED SERVICE JOURNEY (leg), VEHICLE (asset),
    TRAVEL DOCUMENT (ticket / barcode / QR code).
  version: 0.1.0
  contact:
    name: EUDIT Working Group (CEN TC278)
  license:
    name: European Union Public Licence (EUPL) 1.2
    url: https://joinup.ec.europa.eu/collection/eupl/eupl-text-eupl-12

servers:
  - url: https://api.eudit.example.com/v1

tags:
  - name: LegExecution
    description: Leg state transitions during trip execution
  - name: Assets
    description: Vehicle / asset assignment and release
  - name: Usages
    description: Usage event reporting (pay-per-use / open-ended legs)
  - name: TravelDocuments
    description: TRAVEL DOCUMENT retrieval

paths:

  /packages/{packageId}/legs/{legId}:
    parameters:
      - $ref: './components.yaml#/components/parameters/packageId'
      - $ref: './components.yaml#/components/parameters/legId'

    patch:
      operationId: transitionLegState
      summary: Transition a leg state
      description: >
        Requests a state transition for the LEG (JSON Merge Patch).
        Only the `state` field is accepted. Valid transitions depend on
        the current state and the transport mode (see state machine in
        the module description).

        Use `If-Match` for optimistic concurrency.

        Common transitions:
        - `CONFIRMED → IN_USE` (passenger boards / starts rental)
        - `IN_USE → COMPLETED` (passenger alights / ends rental)
        - `CONFIRMED → NO_SHOW` (missed service)
      tags: [LegExecution]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: './components.yaml#/components/schemas/legStatePatch'
      responses:
        "200":
          description: Leg state updated.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/leg'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "409":
          description: >
            State transition not allowed from the current leg state.
          content:
            application/problem+json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/errorResponse'
        "412":
          $ref: './components.yaml#/components/responses/412PreconditionFailed'
        "422":
          $ref: './components.yaml#/components/responses/422UnprocessableEntity'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /packages/{packageId}/legs/{legId}/asset:
    parameters:
      - $ref: './components.yaml#/components/parameters/packageId'
      - $ref: './components.yaml#/components/parameters/legId'

    get:
      operationId: getLegAsset
      summary: Get the asset assigned to a leg
      description: >
        Returns the VEHICLE or ASSET currently assigned to the LEG
        (e.g. a specific scooter, bicycle, or shared car).
      tags: [Assets]
      security:
        - BearerAuth: []
        - OAuth: [read]
      responses:
        "200":
          description: Asset returned.
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/asset'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

    put:
      operationId: assignLegAsset
      summary: Assign or update the asset for a leg
      description: >
        Assigns a VEHICLE or ASSET to the LEG (full replacement).
        Used when the operator allocates a specific vehicle to a booking,
        or when an asset swap is required.
      tags: [Assets]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../ogcapi-eudit/components.yaml#/components/schemas/asset'
      responses:
        "200":
          description: Asset assigned / updated.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/asset'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "412":
          $ref: './components.yaml#/components/responses/412PreconditionFailed'
        "422":
          $ref: './components.yaml#/components/responses/422UnprocessableEntity'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

    delete:
      operationId: releaseLegAsset
      summary: Release the asset from a leg
      description: >
        Releases the ASSET from the LEG (e.g. when a free-floating vehicle
        booking ends or is reassigned). Returns `204 No Content`.
      tags: [Assets]
      security:
        - BearerAuth: []
        - OAuth: [write]
      responses:
        "204":
          $ref: './components.yaml#/components/responses/204NoContent'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "409":
          $ref: './components.yaml#/components/responses/409Conflict'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /packages/{packageId}/legs/{legId}/usages:
    parameters:
      - $ref: './components.yaml#/components/parameters/packageId'
      - $ref: './components.yaml#/components/parameters/legId'

    get:
      operationId: listLegUsages
      summary: List usage events for a leg
      description: >
        Returns all USAGE events recorded for the LEG. Relevant for
        pay-per-use (distance or duration-based) and open-ended rentals.
      tags: [Usages]
      security:
        - BearerAuth: []
        - OAuth: [read]
      responses:
        "200":
          description: Usage events returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../ogcapi-eudit/components.yaml#/components/schemas/usageEvent'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

    post:
      operationId: reportLegUsage
      summary: Report a usage event for a leg
      description: >
        Reports a USAGE event for a pay-per-use or open-ended LEG.
        The server accumulates usage and calculates the final charge when
        the leg transitions to `COMPLETED`.

        Returns `201 Created` with a `Location` header.
      tags: [Usages]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../ogcapi-eudit/components.yaml#/components/schemas/usageEvent'
            example:
              type: DISTANCE
              value: 3.2
              unit: KM
              recordedAt: "2025-06-15T09:45:00Z"
      responses:
        "201":
          description: Usage event recorded.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/usageEvent'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "422":
          $ref: './components.yaml#/components/responses/422UnprocessableEntity'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /packages/{packageId}/travel-documents:
    parameters:
      - $ref: './components.yaml#/components/parameters/packageId'

    get:
      operationId: listTravelDocuments
      summary: List TRAVEL DOCUMENTs for a PACKAGE
      description: >
        Returns all TRAVEL DOCUMENTs (tickets, barcodes, QR codes, PDF
        documents) issued for the PACKAGE. Only available after the
        PACKAGE has been confirmed (status `CONFIRMED` or later).
      tags: [TravelDocuments]
      security:
        - BearerAuth: []
        - OAuth: [read]
      responses:
        "200":
          description: Travel documents returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../ogcapi-eudit/components.yaml#/components/schemas/travelDocument'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /packages/{packageId}/travel-documents/{travelDocumentId}:
    parameters:
      - $ref: './components.yaml#/components/parameters/packageId'
      - $ref: './components.yaml#/components/parameters/travelDocumentId'

    get:
      operationId: getTravelDocument
      summary: Get a TRAVEL DOCUMENT
      description: >
        Returns the full detail of a single TRAVEL DOCUMENT, including
        the barcode / QR payload, validity conditions, and any embedded
        security token.
      tags: [TravelDocuments]
      security:
        - BearerAuth: []
        - OAuth: [read]
      responses:
        "200":
          description: Travel document returned.
          content:
            application/json:
              schema:
                $ref: '../ogcapi-eudit/components.yaml#/components/schemas/travelDocument'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

components:
  securitySchemes:
    BearerAuth:
      $ref: './components.yaml#/components/securitySchemes/BearerAuth'
    OAuth:
      $ref: './components.yaml#/components/securitySchemes/OAuth'

  schemas:
    legStatePatch:
      $ref: './components.yaml#/components/schemas/legStatePatch'
