swagger: '2.0'
info:
  version: 3.4.0
  title: BoB.Validation.API
basePath: /api/v3
schemes:
  - https
paths:
  '/validation/{ticketId}':
    post:
      tags:
        - validation
      summary: Validate ticket by ticket identifier
      description: |
        Validate ticket by ticket identifier and return a reference to a ticket event.

        **Online validation** - If an eventResult is not provided, the result of
                             the validation is not known and the server is
                             requested to perform validation. In this case, the
                             MTB must be submitted via a query parameter.

        **Offline validation** - If an eventResult is provided, the result of the
                             validation is known and the server does not have to
                             perform validation. In this case, the MTB does not need
                             to be submitted via a query parameter.
      operationId: validateTicket
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - name: ticketId
          in: path
          description: Ticket Identifier
          required: true
          type: string
          format: string
        - name: validationEvent
          in: body
          description: Validation event
          required: true
          schema:
            $ref: '#/definitions/ticketEvent'
        - name: mtb
          in: query
          description: MTB
          required: false
          type: string
          format: base64url
      responses:
        '201':
          description: Created
          headers:
            location:
              description: "URI of the new ticketEvent, see RFC 2616 section 14.30"
              type: string
          schema:
            $ref: '#/definitions/ticketEventResult'
        '303':
          description: Ticket event already exists
          headers:
            location:
              description: "URI of the existing ticketEvent, see RFC 2616 section 14.30"
              type: string
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
  '/validation':
    post:
      tags:
        - validation
      summary: Report already performed validations
      description: |
        Already performed offline validations may be submitted in batch via
        validationReport. The entire batch must be accepted/rejected - there's
        no status reporting on individual events. Online validation is not
        supported.
      operationId: reportValidations
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - name: validationReport
          in: body
          description: Validation report
          required: true
          schema:
            $ref: '#/definitions/validationReport'
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthorised
  '/blacklist':
    get:
      tags:
        - blacklist
      summary: Get blacklist
      description: |
        Blacklists are used, as the name indicates, to block certain
        elements (tickets, travellers or tokens) from an otherwise
        successful validation. The current ticket/token/traveller
        blacklist is provided via the getBlacklist call. Only
        blacklist entries added since the provided blacklistEntryId
        will be returned. There's no guarantee that the entries will
        be provided in consecutive order nor that no blacklistEntryId
        will be skipped. Blacklist entries may contain an expire
        property. Expired entries may be discarded/ignored by the caller.
        To remove an element from the blacklist, add another blacklist entry
        for the same element id with expire set to current time (or earlier).
      operationId: getBlacklist
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - name: blacklistEntryId
          in: query
          description: Get blacklist entries added after blacklistEntryId
          required: true
          type: integer
          format: int64
        - name: limit
          in: query
          description: Number of entries per result
          required: false
          type: integer
          minimum: 1
        - name: skip
          in: query
          description: Number of entries to skip until result
          required: false
          type: integer
          minimum: 0
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/blacklist'
        '401':
          description: Unauthorised
        '404':
          description: Blacklist not found
  '/whitelist':
    get:
      tags:
        - whitelist
      summary: Get whitelist
      description: |
        The whitelist is a mechamism used with ID-based travelling
        where the travel entitlements tied to a certain token is
        distriubuted to the validating devices. The purpose of the
        whitelist function is to account for situations where online
        checks are unreliable. By having the validating devices
        looking up travel entitlements locally from the whitelist,
        validation can be performed reliably and securely even in
        offline scenarios or when connections to the validation
        endpoint is slow. Each whitelist entry contains the ticket
        information required to perform the same validation as had
        the ticket information been conveyed through the MTB.
      operationId: getWhitelist
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - name: whitelistEntryId
          in: query
          description: Get whitelist entries added after whitelistEntryId
          required: true
          type: integer
          format: int64
        - name: limit
          in: query
          description: Number of entries per result
          required: false
          type: integer
          minimum: 1
        - name: skip
          in: query
          description: Number of entries to skip until result
          required: false
          type: integer
          minimum: 0
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/whitelist'
        '401':
          description: Unauthorised
        '404':
          description: Whitelist not found
  '/ticklemacros':
    get:
      tags:
        - validation
      summary: Get all TICKLE macro sets
      description: |
        Retrieve all TICKLE macro sets. There is no expire mechanism
        and validators are expected to update TICKLE macros periodically.
      operationId: getAllTickleMacrosets
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: Successful operation, return TICKLE macro sets
          schema:
            type: array
            items:
              $ref: '#/definitions/tickleMacros'
        '404':
          description: No TICKLE macro sets found
  '/ticklemacros/{serial}':
    get:
      tags:
        - validation
      summary: Get TICKLE macros set
      description: |
        Retrieve a TICKLE macro set for a specific serial number. There is no expire
        mechanism and validators are expected to update TICKLE macros periodically.
      operationId: getTickleMacroset
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - name: serial
          in: path
          description: Get TICKLE macros with the specified serial number
          required: true
          type: integer
          format: int64
      responses:
        '200':
          description: Successful operation, return TICKLE macro set
          schema:
            $ref: '#/definitions/tickleMacros'
        '404':
          description: TICKLE macro set not found
  '/fraudcheck':
    get:
      tags:
        - fraudcheck
      summary: Get time and distance delta of last validation event
      description: |
        The fraudcheck call results in a velocity calculated as follows:
        - The caller provides a reference to a MTB, a time and
          a geographical position
        - The callee looks up the time and geographical position of the
          last ticket event for the given MTB
        - The callee returns the calculated velocity given the time/geopos
        The response must only be given once per validation event and client.
        Velocity less than 5 km/h or distances less than 1 km shall render 0 km/h.
        The resulting velocity is used to determine possible fraud. If the
        velocity is higher than any available mode of transportation, the
        ticket has most likely been copied and presented at different locations.
      operationId: fraudcheck
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - name: fraudcheckData
          in: body
          description: Validated MTB, time and position
          required: true
          schema:
            $ref: '#/definitions/fraudcheckData'
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/fraudcheckResponse'
        '401':
          description: Unauthorised
        '403':
          description: Forbidden, sent on more than one validation event per client
definitions:
  fraudcheckData:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "No direct Transmodel equivalent."
        conditions:
          - "No direct equivalent: fraudcheckData is a velocity-fraud check request containing a geographic position, MTB reference, and timestamp. BoB uses this to detect physically impossible travel between validation events. Transmodel does not model fraud detection inputs."
    description: N.B. - fraud check data MUST NOT be retained by respondent
    type: object
    required:
      - geo
      - mtbReference
    properties:
      time:
        description: Timestamp as ISO 8601:2004 profile extended format (MTS8, chapter 2.3)
        x-semantics:
          Transmodel:
            concepts:
              - "SALES TRANSACTION.Date (ST Sales Transaction MODEL)"
            definition: "The date and time of a SALES TRANSACTION."
            conditions:
              - "Partial match to SALES TRANSACTION.Date: the timestamp records when the fraud check was triggered, analogous to the date/time of a transaction event."
        format: date-time
        type: string
        example: "2021-08-17T09:15:00Z"
      geo:
        $ref: '#/definitions/geoPosition'
      mtbReference:
        $ref: '#/definitions/mtbReference'
  fraudcheckResponse:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "No direct Transmodel equivalent."
        conditions:
          - "No direct equivalent: fraudcheckResponse returns the computed travel velocity (km/h) between the two most recent validation events for a token, used to detect physically impossible journeys. Transmodel does not model fraud velocity checks."
    description: N.B. - response MUST only be given once per validation event and client. Velocity <= 5 km/h or distance <= 1 km shall render 0 km/h.
    type: object
    required:
      - velocity
    properties:
      velocity:
        description: Travel velocity in kilometers per hour based on most recent validation event (in time)
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: a computed travel velocity for fraud detection is a security-analytics metric with no Transmodel counterpart."
        type: number
        format: float
        example: 187.5
  blacklist:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "No direct Transmodel equivalent."
        conditions:
          - "No direct equivalent: a blacklist is an offline cache of revoked ticket, traveller, and token identifiers distributed to validators for fraud prevention. Transmodel does not model blacklists or revocation lists for tickets."
    type: array
    items:
      $ref: '#/definitions/blacklistEntry'
  blacklistEntry:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "No direct Transmodel equivalent."
        conditions:
          - "No direct equivalent: a blacklist entry records a revoked ticket/traveller/token identifier with validity bounds. This is a BoB-specific offline fraud-prevention construct with no Transmodel counterpart."
    type: object
    required:
      - blacklistEntryId
    properties:
      blacklistEntryId:
        description: Ever increasing blacklist entry identifier
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: a monotonically increasing blacklist entry identifier is a security list management mechanism with no Transmodel counterpart."
        type: integer
        format: int64
        example: 42
      ticketId:
        x-semantics:
          Transmodel:
            concepts:
              - "CUSTOMER PURCHASE PACKAGE.Id (ST Customer Purchase Package MODEL)"
            definition: "Identifier of a CUSTOMER PURCHASE PACKAGE."
            conditions:
              - "Partial match to CUSTOMER PURCHASE PACKAGE.Id: the blacklisted ticket identifier corresponds to the identifier of a CUSTOMER PURCHASE PACKAGE whose validity has been revoked."
        type: string
        example: "5f83125b-8c38-442d-ab8c-ac7f56541462"
      travellerId:
        x-semantics:
          Transmodel:
            concepts:
              - "TRANSPORT CUSTOMER.Id (ST Fare Contract MODEL)"
            definition: "Identifier of a TRANSPORT CUSTOMER."
            conditions:
              - "Partial match to TRANSPORT CUSTOMER.Id: the blacklisted traveller identifier corresponds to the identifier of a TRANSPORT CUSTOMER who has been barred from use."
        type: string
        example: "ABC123"
      tokenId:
        x-semantics:
          Transmodel:
            concepts:
              - "MEDIUM ACCESS DEVICE.Id (SD Medium Application MODEL)"
            definition: "Identifier of a MEDIUM ACCESS DEVICE."
            conditions:
              - "Partial match to MEDIUM ACCESS DEVICE.Id: the blacklisted token identifier corresponds to the identifier of a MEDIUM ACCESS DEVICE that has been revoked."
        type: string
        example: "69772de2-2761-475c-927d-3e7d25d46555"
      inception:
        description: Inception time stamp as ISO 8601:2004 profile extended format (MTS8, chapter 2.3)
        x-semantics:
          Transmodel:
            concepts:
              - "VALIDITY CONDITION.FromDate (ST Sales Transaction MODEL)"
            definition: "The start of a validity period."
            conditions:
              - "Partial match to VALIDITY CONDITION.FromDate: the inception timestamp marks when the blacklist entry becomes active, analogous to the start of a validity condition."
        format: date-time
        type: string
      expire:
        description: Expire timestamp as ISO 8601:2004 profile extended format (MTS8, chapter 2.3)
        x-semantics:
          Transmodel:
            concepts:
              - "VALIDITY CONDITION.ToDate (ST Sales Transaction MODEL)"
            definition: "The end of a validity period."
            conditions:
              - "Partial match to VALIDITY CONDITION.ToDate: the expiry timestamp marks when the blacklist entry should be purged, analogous to the end of a validity condition."
        format: date-time
        type: string
  whitelist:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "No direct Transmodel equivalent."
        conditions:
          - "No direct equivalent: a whitelist is an offline cache of pre-authorised MTBs distributed to validators for use when online fraud checks are unavailable. Transmodel does not model whitelists."
    type: array
    items:
      $ref: '#/definitions/whitelistEntry'
  whitelistEntry:
    x-semantics:
      Transmodel:
        concepts:
          - "TRAVEL DOCUMENT (ST Sales Transaction MODEL)"
        definition: "A document providing evidence of a right to travel."
        conditions:
          - "Partial match to TRAVEL DOCUMENT: a whitelist entry caches a pre-validated MTB (signed travel document) with its associated token public key thumbprint and validity period, providing offline proof of a right to travel analogous to a TRAVEL DOCUMENT."
    type: object
    required:
      - id
      - kid
      - mtb
      - val
    properties:
      id:
        description: Ever increasing whitelist entry identifier
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: a monotonically increasing whitelist entry identifier is a cache management mechanism with no Transmodel counterpart."
        type: integer
        format: int64
        example: 42
      kid:
        description: Whitelisted token public key thumbprint
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: a token public key thumbprint is cryptographic key identification infrastructure with no Transmodel counterpart."
        type: string
        example: "16:samtrafiken"
      mtb:
        description: Signed MTB
        x-semantics:
          Transmodel:
            concepts:
              - "TRAVEL DOCUMENT.IdentityToken (ST Sales Transaction MODEL)"
            definition: "A token that identifies a TRAVEL DOCUMENT."
            conditions:
              - "Partial match to TRAVEL DOCUMENT.IdentityToken: the signed MTB (Mobile Ticketing Barcode) is the encoded travel credential, analogous to the identity token of a TRAVEL DOCUMENT in Transmodel."
        type: string
        format: base64url
        example: "v2F2QmExYXBZAmSDWJ6_Y2FsZ2..."
      priority:
        description: MTB priority (a lower value has higher priority)
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: MTB priority ordering in a whitelist cache is a BoB-specific operational construct with no Transmodel counterpart."
        type: integer
        format: int64
        example: 1
      val:
        description: Entry validity period as ISO 8601:2004 time interval format (MTS8, chapter 2.5) in start/end or start/duration format
        x-semantics:
          Transmodel:
            concepts:
              - "USAGE VALIDITY PERIOD (ST Sales Transaction MODEL)"
            definition: "A period during which a FARE PRODUCT is valid for use."
            conditions:
              - "Exact match to USAGE VALIDITY PERIOD: the ISO 8601 time interval string directly encodes the start and end (or start and duration) of the whitelist entry's validity, corresponding to a USAGE VALIDITY PERIOD in Transmodel."
        type: string
        example: "20070301T1300/20080511T1530"
      ticketId:
        description: Unique identifier for ticket
        x-semantics:
          Transmodel:
            concepts:
              - "CUSTOMER PURCHASE PACKAGE.Id (ST Customer Purchase Package MODEL)"
            definition: "Identifier of a CUSTOMER PURCHASE PACKAGE."
            conditions:
              - "Partial match to CUSTOMER PURCHASE PACKAGE.Id: the ticket identifier identifies the underlying ticket (CUSTOMER PURCHASE PACKAGE) associated with this whitelist entry."
        type: string
        example: "5f83125b-8c38-442d-ab8c-ac7f56541462"
  validationReport:
    x-semantics:
      Transmodel:
        concepts:
          - "SALES TRANSACTION LOG (ST Sales Transaction MODEL)"
        definition: "A log of SALES TRANSACTIONs."
        conditions:
          - "Partial match to SALES TRANSACTION LOG: a validation report is an ordered collection of ticket validation events recorded by a validator device, analogous to a log of transaction events in Transmodel."
    type: array
    items:
      $ref: '#/definitions/ticketEvent'
  geoPosition:
    x-semantics:
      Transmodel:
        concepts:
          - "LOCATION (CG Generic Location MODEL)"
        definition: "A point or area in space."
        conditions:
          - "Exact match to LOCATION (CG): a WGS84 decimal latitude/longitude/altitude tuple is the standard representation of a geographic LOCATION in Transmodel."
    description: Geographical position (WGS84 decimal)
    type: object
    required:
      - lat
      - long
    properties:
      lat:
        description: Latitude
        x-semantics:
          Transmodel:
            concepts:
              - "LOCATION.Latitude (CG Generic Location MODEL)"
            definition: "The latitude coordinate of a LOCATION."
            conditions:
              - "Exact match to LOCATION.Latitude: the WGS84 decimal latitude directly corresponds to this Transmodel attribute."
        type: number
        format: double
        example: 59.329627
      long:
        description: Longitude
        x-semantics:
          Transmodel:
            concepts:
              - "LOCATION.Longitude (CG Generic Location MODEL)"
            definition: "The longitude coordinate of a LOCATION."
            conditions:
              - "Exact match to LOCATION.Longitude: the WGS84 decimal longitude directly corresponds to this Transmodel attribute."
        type: number
        format: double
        example: 18.059201
      alt:
        description: Altitude
        x-semantics:
          Transmodel:
            concepts:
              - "LOCATION.Altitude (CG Generic Location MODEL)"
            definition: "The altitude coordinate of a LOCATION."
            conditions:
              - "Exact match to LOCATION.Altitude: the altitude value directly corresponds to this Transmodel attribute."
        type: number
        format: double
        example: 10.2
  mtbReference:
    x-semantics:
      Transmodel:
        concepts:
          - "TRAVEL DOCUMENT.IdentityToken (ST Sales Transaction MODEL)"
        definition: "A token that identifies a TRAVEL DOCUMENT."
        conditions:
          - "Partial match to TRAVEL DOCUMENT.IdentityToken: mtbReference identifies an MTB by issuer participant identifier and issuer signature, analogous to the identity token that uniquely identifies a TRAVEL DOCUMENT in Transmodel."
    description: Reference to MTB identified by pid and issuer signature
    type: object
    required:
      - pid
      - issuerSignature
    properties:
      pid:
        description: Participant identifier
        x-semantics:
          Transmodel:
            concepts:
              - "OPERATOR.Id (TP Transport Organisation MODEL)"
            definition: "Identifier of an OPERATOR."
            conditions:
              - "Partial match to OPERATOR.Id: the participant identifier identifies the operator that issued the MTB, structurally analogous to an OPERATOR identifier in Transmodel."
        type: integer
        format: int64
        example: 1
      issuerSignature:
        description: MTB issuer signature
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: a cryptographic issuer signature is security infrastructure. Transmodel records TRAVEL DOCUMENTs but does not model their cryptographic signatures."
        type: string
        format: base64url
        example: "MEQCIGSYn88hmpE8h0zvFfn+Pvx..."
  deviceReference:
    x-semantics:
      Transmodel:
        concepts:
          - "MEDIUM ACCESS DEVICE (SD Medium Application MODEL)"
        definition: "A device used by a TRANSPORT CUSTOMER to access a service."
        conditions:
          - "Partial match to MEDIUM ACCESS DEVICE: deviceReference identifies a device-signed ticket's originating device by participant identifier and device identifier, analogous to the registration record of a MEDIUM ACCESS DEVICE."
    description: Device reference, unique reference for device that creates device signed tickets
    type: object
    required:
      - pid
      - did
    properties:
      pid:
        description: Participant identifier
        x-semantics:
          Transmodel:
            concepts:
              - "OPERATOR.Id (TP Transport Organisation MODEL)"
            definition: "Identifier of an OPERATOR."
            conditions:
              - "Partial match to OPERATOR.Id: the participant identifier identifies the operator responsible for the device."
        type: integer
        format: int64
        example: 1
      did:
        description: Device identifier
        x-semantics:
          Transmodel:
            concepts:
              - "MEDIUM ACCESS DEVICE.Id (SD Medium Application MODEL)"
            definition: "Identifier of a MEDIUM ACCESS DEVICE."
            conditions:
              - "Partial match to MEDIUM ACCESS DEVICE.Id: the base64url-encoded device identifier uniquely identifies the device."
        type: string
        format: base64url
        example: "U2FtdHJhZmlrZW4="
      ua:
        description: |
          User agent id.
          To get user agent information, use the user agent id to match an
          entry in the response from the endpoint GET /device/userAgent. 
          Or, use it in a request to the endpoint GET /device/userAgent/{ua}.
          Both of these endpoints are part of the Device API implemented by
          the participant identified by pid.
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: the user agent identifier references client software metadata with no Transmodel counterpart."
        type: integer
        example: 835
  ticketEventResult:
    x-semantics:
      Transmodel:
        concepts:
          - "SALES TRANSACTION (ST Sales Transaction MODEL)"
        definition: "A sale of a SALES OFFER PACKAGE."
        conditions:
          - "Partial match to SALES TRANSACTION result record: ticketEventResult encapsulates the outcome of a ticket validation/inspection event — status code, passenger message, inspector message, and associated metadata."
    description: |
      The result of a ticket inspection or validation operation registration
    type: object
    properties:
      ticketEventPassengerMessage:
        description: |
          Message to be presented to passenger when registering an inspection
          or validation event
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: a passenger-facing result message is a presentation-layer concern not modelled in Transmodel."
        type: string
        example: "Valid"
      ticketEventInspectMessage:
        description: |
          Message to be presented to inspector when registering an inspection event
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: an inspector-facing result message is a presentation-layer concern not modelled in Transmodel."
        type: string
        example: "Valid ticket"
      ticketEventStatus:
        description: |
          Status code for inspection or validation event
        x-semantics:
          Transmodel:
            concepts:
              - "CUSTOMER PURCHASE PACKAGE → CUSTOMER PURCHASE STATUS (ST Customer Purchase Package MODEL)"
            definition: "A classification of possible statuses of CUSTOMER PURCHASE PACKAGE."
            conditions:
              - "Partial match to CUSTOMER PURCHASE STATUS: the integer result code represents the validation outcome, analogous to a CUSTOMER PURCHASE STATUS value."
        type: integer
        format: int32
        example: 0
      ticketMetadata:
        $ref: '#/definitions/ticketMetadata'
      ticketEvent:
        $ref: '#/definitions/ticketEvent'
      ticketActivationStatus:
        $ref: '#/definitions/ticketActivationStatus'
  ticketActivationStatus:
    x-semantics:
      Transmodel:
        concepts:
          - "USAGE VALIDITY PERIOD (ST Sales Transaction MODEL)"
          - "VALIDITY CONDITION (ST Sales Transaction MODEL)"
        definition: "A period during which a FARE PRODUCT is valid for use. / A condition determining validity."
        conditions:
          - "Partial match to USAGE VALIDITY PERIOD: ticketActivationStatus describes the ticket's activation window (relativeValidity, latestActivation, latestActivationExpire), directly corresponding to USAGE VALIDITY PERIOD attributes."
          - "Partial match to VALIDITY CONDITION: the active boolean and activation counters represent validity constraints."
    description: Activation status
    type: object
    required:
      - active
    properties:
      active:
        description: True if ticket is active, otherwise false.
        x-semantics:
          Transmodel:
            concepts:
              - "VALIDITY CONDITION (ST Sales Transaction MODEL)"
            definition: "A condition determining validity."
            conditions:
              - "Partial match to VALIDITY CONDITION: the active boolean represents whether the current validity condition is satisfied."
        type: boolean
