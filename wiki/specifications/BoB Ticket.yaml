swagger: '2.0'
info:
  version: 3.4.0
  title: BoB.Ticket.API
basePath: /api/v3
schemes:
  - https
paths:
  '/ticket':
    get:
      tags:
        - ticket
      summary: Get issued tickets
      description: |
        Get all issued tickets that meets the requirements specified by the
        parameters. Which parameters you can filter on are described below.
      operationId: getAllTickets
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - name: pid
          in: query
          description: Filter on participant ID requesting the ticket
          required: False
          type: integer
          format: int64
        - name: requestId
          in: query
          description: Filter on request ID
          required: False
          type: string
        - name: travellerId
          in: query
          description: Filter on travellers ID
          required: False
          type: string
        - name: tokenId
          in: query
          description: Filter on token ID
          required: False
          type: string
        - name: active
          in: query
          description: Filter on active tickets
          required: False
          type: boolean
        - name: suspended
          in: query
          description: Filter on suspended tickets
          required: False
          type: boolean
        - name: refunded
          in: query
          description: Filter on refunded tickets
          required: False
          type: boolean
        - name: refundable
          in: query
          description: Filter on refundable tickets
          required: False
          type: boolean
        - name: hindered
          in: query
          description: Filter on tickets with hinderedStatus set
          required: False
          type: boolean
      responses:
        '200':
          description: |
            Successful operation, return list of tickets. If filter doesn't
            produce any matches an empty array will be returned.
          schema:
            type: array
            items:
              $ref: '#/definitions/ticket'
        '401':
          description: Unauthorised
    post:
      tags:
        - ticket
      summary: Issue tickets
      description: |
        Issue tickets from supplied manifest. The manifest should come from the
        product server for a matching participant id. Manifests from an unknown
        participants, expired manifest or with an illegal signature will be
        rejected.
      operationId: issueTickets
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - name: manifestCall
          in: body
          description: Manifest to issue tickets from
          required: true
          schema:
            $ref: '#/definitions/manifestCall'
      responses:
        '201':
          description: Successful operation, return identifiers for issued tickets
          headers:
            location:
              description: URI of created ticket bundle, see RFC 2616 section 14.30
              type: string
          schema:
            $ref: '#/definitions/ticketIssueResponse'
        '303':
          description: Ticket already exists
          headers:
            location:
              description: URI of the existing ticket, see RFC 2616 section 14.30
              type: string
        '400':
          description: Manifest is invalid or from unknown participant
        '401':
          description: Unauthorised
  '/ticket/{ticketId}':
    get:
      tags:
        - ticket
      summary: Get ticket data and information
      description: |
        Get data and information about ticket with specified ticket identifier,
        issued by this server
      operationId: getTicket
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - $ref: '#/parameters/ticketId'
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/ticket'
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
    patch:
      tags:
        - ticket
      summary: Update ticket information
      description: |
        Update information about ticket with specified ticket identifier.
      operationId: updateTicket
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - name: ticketId
          in: path
          description: Ticket identifier
          required: true
          type: string
        - name: ticketUpdateRequest
          in: body
          description: Ticket update
          required: true
          schema:
            $ref: '#/definitions/ticketUpdateRequest'
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/ticket'
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
  '/ticket/{ticketId}/refundableStatus':
    get:
      tags:
        - ticket
      summary: Get ticket refundable status
      description: |
        Get information if ticket specified with ticket identifier is
        refundable. If ticket is refundable also supply information
        about refundable amount and VAT.
      operationId: getTicketRefundableStatus
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - $ref: '#/parameters/ticketId'
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/refundableStatus'
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
  '/ticket/{ticketId}/refundStatus':
    get:
      tags:
        - ticket
      summary: Get ticket refund status
      description: |
        Get information if ticket specified with ticket identifier has
        been refunded or not. If ticket was refunded also supply information
        about refunded amount and VAT.
      operationId: getTicketRefundStatus
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - $ref: '#/parameters/ticketId'
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/refundStatus'
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
    put:
      tags:
        - ticket
      summary: Refund ticket
      description: |
        Refund ticket specified with ticket identifier
      operationId: setTicketRefundStatus
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - $ref: '#/parameters/ticketId'
      responses:
        '200':
          description: Successful operation, ticket was refunded
        '400':
          description: Ticket could not be refunded
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
  '/ticket/{ticketId}/recoverableStatus':
    get:
      tags:
        - ticket
      summary: Get ticket recoverable status
      description: |
        Get information if ticket specified with ticket identifier is
        recoverable. If ticket is refundable also supply information
        about recoverable amount and VAT.
      operationId: getTicketRecoverableStatus
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - $ref: '#/parameters/ticketId'
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/recoverableStatus'
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
  '/ticket/{ticketId}/recoverStatus':
    get:
      tags:
        - ticket
      summary: Get ticket recover status
      operationId: getTicketRecoverStatus
      description: |
        Get information if ticket specified with ticket identifier has
        been recovered or not. If ticket was recovered also supply information
        about recovered amount and VAT.
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - $ref: '#/parameters/ticketId'
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/recoverStatus'
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
    put:
      tags:
        - ticket
      summary: Recover ticket
      description: |
        Recover ticket specified with ticket identifier
      operationId: setTicketRecoverStatus
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - $ref: '#/parameters/ticketId'
      responses:
        '200':
          description: Successful operation, ticket recovered
        '400':
          description: Ticket could not be recovered
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
  '/ticket/{ticketId}/hinderedStatus':
    get:
      tags:
        - ticket
      summary: Get ticket hindered status
      description: |
        Get information if ticket specified with ticket identifier has
        hindered status set or not, e.g. there was a failure carrying out the
        services of the issued ticket.
      operationId: getTicketHinderedStatus
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - $ref: '#/parameters/ticketId'
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/hinderedStatus'
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
    put:
      tags:
        - ticket
      summary: Set ticket hindered
      description: |
        Set ticket hindered status to indicate that the traveller was unable (hindered) to use it. Detail about the
        cause should be set for the ticket that is marked as hindered when using this operation.
      operationId: setTicketHinderedStatus
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - $ref: '#/parameters/ticketId'
        - name: hinderedCause
          in: body
          description: Hindered details
          required: true
          schema:
            $ref: '#/definitions/hinderedCause'
      responses:
        '200':
          description: Successful operation, ticket hindered status set
        '400':
          description: Ticket hindered status could not be set
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
  '/ticket/{ticketId}/revoke':
    get:
      tags:
        - ticket
      summary: Get ticket revoke status
      description: |
        Get information if ticket specified with ticket identifier has
        been revoked or not. If ticket was revoked the response should
        tell when the ticket was revoked.
      operationId: getTicketRevokeStatus
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - name: ticketId
          in: path
          description: Ticket identifier
          required: true
          type: string
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/revokeStatus'
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
    put:
      tags:
        - ticket
      summary: Revoke ticket
      description: |
        Revoke is used to set the specified ticketId in revoked state and to add the ticketId to a blacklist used in validation/inspection.
        When a ticket is in revoked state it can not be used for travel. 
        Revocation of a ticket can occur for several reasons, for instance if a ticket is refunded, in cases of fraud, by request from the ticket owner, in cases of loss etc.
      operationId: setTicketRevokeStatus
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - $ref: '#/parameters/ticketId'
      responses:
        '200':
          description: Successful operation, ticket in revoked state
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
  '/ticket/{ticketId}/active':
    get:
      tags:
        - ticket
      summary: Get ticket active status
      description: |
        Get active status for ticket with specified ticket identifier
      operationId: getTicketActiveStatus
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - $ref: '#/parameters/ticketId'
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/ticketActiveStatus'
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
    put:
      tags:
        - ticket
      summary: Activate or deactivate ticket
      description: |
       Activate or deactivate ticket with specified ticket identifier
      operationId: setTicketActiveStatus
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - $ref: '#/parameters/ticketId'
        - name: activeStatus
          description: |
            Set to true to activate ticket, false to deactivate
          in: body
          required: true
          schema:
            $ref: '#/definitions/ticketActiveStatus'
      responses:
        '200':
          description: Successful operation, the status of the ticket is changed
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
  '/ticket/{ticketId}/activationStatus':
    get:
      tags:
        - ticket
      summary: Get ticket activation status
      description: |
        Get activation status for ticket with specified ticket identifier.
      operationId: getTicketActivationStatus
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: True
          type: string
        - name: ticketId
          in: path
          description: Ticket id
          required: True
          type: string
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/ticketActivationStatus'
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
  '/ticket/{ticketId}/suspendedStatus':
    get:
      tags:
        - ticket
      summary: Get ticket suspension status
      description: |
        Get suspension status for ticket with specified ticket identifier.
      operationId: getTicketSuspensionStatus
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: True
          type: string
        - name: ticketId
          in: path
          description: Ticket id
          required: True
          type: string
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/suspensionStatus'
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
  '/ticket/{ticketId}/event':
    get:
      tags:
        - ticket
      summary: Get ticket events
      description: |
        Get all ticket events for specified ticket identifier. If no
        events are available an empty list will be returned.
      operationId: ticketEvents
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - $ref: '#/parameters/ticketId'
      responses:
        '200':
          description: Successful operation, list of all events for specified ticket identifier
          schema:
            type: array
            items:
              $ref: '#/definitions/ticketEventResult'
        '401':
          description: Unauthorised
        '404':
          description: Ticket not found
  '/ticket/{ticketId}/event/{eventId}':
    get:
      tags:
        - ticket
      summary: Get ticket event
      description: |
        Get ticket event specified with event identifier and ticket identifier.
        Note! This is the server event identifier and not the local event identfier.
      operationId: ticketEvent
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - $ref: '#/parameters/ticketId'
        - name: eventId
          in: path
          description: Event identifier
          required: true
          type: string
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/ticketEventResult'
        '401':
          description: Unauthorised
        '404':
          description: Ticket and event combination not found
  '/ticketbundle':
    post:
      tags:
        - ticketbundle
      summary: Create new ticket bundle
      description: |
        Create a new ticket bundle. The tickets are specified in the
        request payload as a list of ticket identfiers. All tickets must
        have been previously issued using the same manifest.
      operationId: createTicketBundle
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - name: ticketBundleRequest
          in: body
          description: List of ticket identifiers of tickets to be included in ticket bundle
          required: true
          schema:
            $ref: '#/definitions/ticketBundleRequest'
      responses:
        '201':
          description: Successful operation
          headers:
            location:
              description: URI of created ticket bundle, see RFC 2616 section 14.30
              type: string
          schema:
            $ref: '#/definitions/ticketBundle'
        '400':
          description: All the tickets did not come from the same ticket bundle
        '401':
          description: Unauthorised
  '/ticketbundle/{ticketBundleId}':
    get:
      tags:
        - ticketbundle
      summary: Get ticket bundle
      description: Get ticket bundle specified by the ticket bundle identifier
      operationId: getTicketBundle
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - name: ticketBundleId
          in: path
          description: Ticket bundle id
          required: true
          type: string
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/ticketBundle'
        '401':
          description: Unauthorised
        '404':
          description: Ticket bundle not found
    patch:
      tags:
        - ticketbundle
      summary: Update ticket bundle
      description: Update ticket bundle specified by the ticket bundle identifier
      operationId: updateTicketBundle
      produces:
        - application/json
      parameters:
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - name: ticketBundleId
          in: path
          description: Ticket bundle id
          required: true
          type: string
        - name: ticketBundleUpdateRequest
          in: body
          description: Ticket bundle update
          required: true
          schema:
            $ref: '#/definitions/ticketBundleUpdateRequest'
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/ticketBundle'
        '401':
          description: Unauthorised
        '404':
          description: Ticket bundle not found
definitions:
  ticketEventResult:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "The result of registering a ticket inspection or validation event, containing status code, passenger/inspector messages, ticket metadata, and the event record."
        conditions:
          - "No direct Transmodel equivalent. ticketEventResult is a BoB-specific response artefact. The ticketMetadata field partially aligns with CUSTOMER PURCHASE PACKAGE attributes (SD); ticketEvent partially aligns with a SALES TRANSACTION event record."
    description: The result of a ticket inspection or validation operation registration
    type: object
    required:
      - ticketEvent
    properties:
      ticketEventPassengerMessage:
        description: |
          Message to be presented to passenger when registering an inspection
          or validation event
        type: string
        example: "Valid"
      ticketEventInspectMessage:
        description: |
          Message to be presented to inspector when registering an inspection event
        type: string
        example: "Valid ticket"
      ticketEventStatus:
        description: |
          Status code for inspection or validation event
        type: integer
        format: int32
        example: 0
      ticketMetadata:
        $ref: '#/definitions/ticketMetadata'
      ticketEvent:
        $ref: '#/definitions/ticketEvent'
  ticketBundleRequest:
    x-semantics:
      Transmodel:
        concepts:
          - "CUSTOMER PURCHASE PACKAGE (Sales Distribution MODEL)"
        definition: "A request to create a ticket bundle from a list of ticket identifiers, optionally binding them to a device and token."
        conditions:
          - "Partial match. ticketBundleRequest initiates the grouping of CUSTOMER PURCHASE PACKAGE instances (tickets) into a bundle. Device binding (deviceId/deviceSignatureIssuer) and token binding are BoB-specific security fields with no Transmodel counterpart."
    description: List of ticket identifiers of tickets to be included in ticket bundle
    type: object
    required:
      - ticketIds
    properties:
      ticketIds:
        description: List ticket identifiers
        type: array
        items:
          type: string
        example:
          - "a36136f3-be91-4a7f-a452-1c9066391dea"
          - "f4b99743-e4ff-4967-a5a2-5a1835996d0e"
      deviceId:
        description: |
          Identifier of the device to which the ticket will be bound. If set to null, 
          the ticket will not be bound any device.
        type: string
        x-nullable: true
        example: "nhiwXCelqdkeX"
      deviceSignatureIssuer:
        description: PID of device signature issuer
        type: integer
        format: int64
        example: 16
      signatureLifetime:
        description: Requested maximum issuer signature lifetime (seconds)
        type: integer
        format: int64
        example: 172800
      tokenIssuer:
        description: PID of token issuer
        type: integer
        format: int64
        example: 16
      tokenId:
        type: string
        example: "ABC12345"
      tokenPublicKey:
        $ref: '#/definitions/jwkPublic'
  ticketBundleUpdateRequest:
    x-semantics:
      Transmodel:
        concepts:
          - "CUSTOMER PURCHASE PACKAGE (Sales Distribution MODEL)"
        definition: "A request to update the device and/or token binding of an existing ticket bundle."
        conditions:
          - "Partial match. ticketBundleUpdateRequest updates security binding attributes of a CUSTOMER PURCHASE PACKAGE group in Transmodel (SD). The device/token fields are BoB-specific with no Transmodel counterpart."
    description: Update ticket bundle
    type: object
    properties:
      deviceId:
        description: |
          Identifier of the device to which the ticket will be bound. If set to null, 
          the ticket will not be bound any device.
        type: string
        x-nullable: true
        example: "nhiwXCelqdkeX"
      deviceSignatureIssuer:
        description: PID of device signature issuer
        type: integer
        format: int64
        example: 16
      signatureLifetime:
        description: Requested maximum issuer signature lifetime (seconds)
        type: integer
        format: int64
        example: 172800
      tokenIssuer:
        description: PID of token issuer
        type: integer
        format: int64
        x-nullable: true
      tokenId:
        type: string
        x-nullable: true
      tokenPublicKey:
        $ref: '#/definitions/jwkPublic'
        x-nullable: true
  ticketMetadata:
    x-semantics:
      Transmodel:
        concepts:
          - "CUSTOMER PURCHASE PACKAGE (Sales Distribution MODEL)"
        definition: "Metadata associated with a ticket, including the relative validity start time, a traveller photo URL, and a list of associated event identifiers."
        conditions:
          - "Partial match. ticketMetadata supplements CUSTOMER PURCHASE PACKAGE in Transmodel (SD). relativeValidityStart aligns with USAGE VALIDITY PERIOD start; travellerPhotoURL and ticketEventIds are BoB-specific operational fields with no Transmodel counterpart."
    description: Metadata associated with a ticket
    type: object
    properties:
      relativeValidityStart:
        description: Start of ticket relative validity as ISO 8601:2004 profile extended format (MTS8, chapter 2.3)
        format: date-time
        type: string
        example: "2021-08-17T09:15:00Z"
      travellerPhotoURL:
        description: URL to photo of traveller
        type: string
        example: "https://example.com/my-photo.jpg"
      ticketEventIds:
        description: List of all event identifiers associated with this ticket
        type: array
        items:
          type: string
        example:
          - "ce81fb07-5e91-4fcd-bdf5-4cf07c24d16f"
          - "a775bdcf-95ac-4e05-9af4-4a627e10ebbb"
  geoPosition:
    x-semantics:
      Transmodel:
        concepts:
          - "LOCATION (Common Geometry MODEL)"
        definition: "A WGS84 decimal coordinate triplet (latitude, longitude, optional altitude) representing a geographical position."
        conditions:
          - "Exact match. geoPosition corresponds to LOCATION in Transmodel (Common Geometry MODEL), representing a point in WGS84 coordinate space. The optional altitude field is an extension beyond the basic 2D Transmodel LOCATION."
    description: Geographical position (WGS84 decimal)
    type: object
    required:
      - lat
      - long
    properties:
      lat:
        description: Latitude
        type: number
        format: double
        example: 59.329627
      long:
        description: Longitude
        type: number
        format: double
        example: 18.059201
      alt:
        description: Altitude
        type: number
        format: double
        example: 10.2
  ticketEvent:
    x-semantics:
      Transmodel:
        concepts:
          - "SALES TRANSACTION (Sales Distribution MODEL)"
        definition: "A record of a ticket inspection or validation event, capturing timestamp, ticket identifier, event type, result code, zone/service/stop context, and device/inspector references."
        conditions:
          - "Partial match. ticketEvent aligns with a SALES TRANSACTION event record or a FARE CONTRACT status update in Transmodel (SD). Zone/service/stopArea fields partially align with TARIFF ZONE, SERVICE JOURNEY, and SCHEDULED STOP POINT (Transport Network MODEL)."
    description: Ticket event data from inspection or validator device
    type: object
    required:
      - time
      - ticketId
      - localEventId
    properties:
      time:
