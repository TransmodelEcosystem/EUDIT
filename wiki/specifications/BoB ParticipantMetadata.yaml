swagger: '2.0'
info:
  version: 2.3.1
  title: BoB.participantMetadata.API
  description: |
    The Participant Metadata API provides an interface for participants to manage metadata coordinated by an Administering Body (AB). An Administering Body is responsible for hosting the central register for participant public keys, interface endpoints, issuer signature constraints and domain names. The purpose of this API is to enable interoperability between participants by giving them access to each other's metadata. It is the participant's responsibility that the metadata in this register is correct and up-to-date. Every organisation that wants to issue MTBs must be a registered participant. This API does not support adding new participants or removing already existing participants, it only supports managing metadata for existing participants.

    More information about coordination and key management can be found in <a href="https://bitbucket.org/samtrafiken/bob-mts-4-coordination-and-key-management/src/master/mts4.pdf" target="_blank">MTS4</a>.
    Information about the current implementation hosted by Samtrafiken can be found in the <a href="https://bob.samtrafiken.se" target="_blank">BoB documentation</a>, section <a href="https://samtrafiken.atlassian.net/wiki/spaces/BOB/pages/115614537/Participant+Metadata" target="_blank">Participant Metadata</a>.
basePath: /api/v2
schemes:
  - https
tags:
  - name: participantMetadataFile
    description: |
      Get all metadata for all registered participants.
  - name: participantMetadata
    description: |
      Get all metadata for a certain participant.
  - name: domainName
    description: |
      A single domain name can be associated with each participant. The domain name is submitted to the metadata register in the participant registration process. It is used for dynamic key fetching via DNS (<a href="https://bitbucket.org/samtrafiken/bob-mts-1-mobile-ticket-format/src/master/mts1.pdf" target="_blank">MTS1</a> section 2.4).
  - name: mtbPublicKey
    description: |
      An MTB public key is used for validating the issuer signature attached to an MTB. MTB keys are immutable. More information about MTB key management and algorithms can be found in <a href="https://bitbucket.org/samtrafiken/bob-mts-4-coordination-and-key-management/src/master/mts4.pdf" target="_blank">MTS4</a>, <a href="https://bitbucket.org/samtrafiken/bob-mts-1-mobile-ticket-format/src/master/mts1.pdf" target="_blank">MTS1</a> section 2.4 and in the <a href="https://samtrafiken.atlassian.net/wiki/spaces/BOB/pages/116125179/5.+Key+Management" target="_blank">BoB Manual&#58; Key Management &rarr; 5.3. Ticketing keys</a>.
  - name: authtokenPublicKey
    description: |
      A authtoken public key is used for validating a JSON Web Token (JWT), as defined in <a href="https://tools.ietf.org/html/rfc7519" target="_blank">RFC 7519</a>, included in the request from a BoB Client. Authtoken keys are immutable. Information about authtoken keys, authentication and authorization within BoB can be found in <a href="https://samtrafiken.atlassian.net/wiki/spaces/BOB/pages/493617445/6.+API+Authentication+and+Authorization" target="_blank">Chapter 6&#58; API Authentication and Authorization</a> of the BoB Manual.
  - name: interfaceEndpoint
    description: |
      A participant API implementation is made accessible to other participants through interface endpoints. A general description of each type of endpoint can be found in the <a href="https://samtrafiken.atlassian.net/wiki/spaces/BOB/pages/110985249/How+does+it+work" target="_blank">BoB documentation&#58; How does it work &rarr; BoB-API and API endpoints</a>.
  - name: issuerSignatureConstraint
    description: |
      An issuer signature constraint lets a participant grant other participants (sales channels) permission to sign tickets issued by the participant. The purpose of issuer signature constraint is to control which participants that are allowed to sign tickets issued by other participants.
  - name: participantInfo
    description: Manage participant info for a participant
paths:
  /participantMetadata:
    get:
      tags:
        - participantMetadataFile
      summary: Get latest participant metadata file
      description: |
        Get the latest participant metadata file, signed using JSON Web Signature (JWS) as defined in <a href="https://tools.ietf.org/html/rfc7515" target="_blank">RFC 7515</a>. Metadata validity is specified in the JWS header.
      operationId: getParticipantMetadataFile
      produces:
        - application/json
      responses:
        '200':
          description: JWS JSON serialization (<a href="https://tools.ietf.org/html/rfc7515" target="_blank">RFC 7515</a>) of participant metadata. Payload is a Base64 for URL encoded string containing data of type participantMetadataFile.
          schema:
            $ref: '#/definitions/jws'
        '409':
          description: Server response unavailable due to numerous concurrent updates
  /participantMetadata/{pid}:
    get:
      tags:
        - participantMetadata
      summary: Get participant metadata by participant identifier
      operationId: getParticipantMetadata
      produces:
        - application/json
      parameters:
        - name: pid
          in: path
          description: Participant identifier
          required: true
          type: integer
          format: int64
      security:
        - Pop: []
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/participantMetadata'
        '401':
          description: unauthorised
        '404':
          description: pid not found
  /participantMetadata/{pid}/domainName:
    get:
      tags:
        - domainName
      summary: Get participant domain name by participant identifier
      operationId: getDomainName
      produces:
        - application/json
      parameters:
        - name: pid
          in: path
          description: Participant identifier
          required: true
          type: integer
          format: int64
      security:
        - Pop: []
      responses:
        '200':
          description: successful operation
          schema:
            description: Fully qualified domain name (FQDN)
            type: string
            example: sj.se
        '401':
          description: unauthorised
        '404':
          description: pid not found
    put:
      tags:
        - domainName
      summary: Update participant domain name
      operationId: updateDomainName
      consumes:
        - application/json
      parameters:
        - name: pid
          in: path
          description: Participant identifier
          required: true
          type: integer
          format: int64
        - name: domainName
          in: body
          description: Fully qualified domain name (FQDN)
          required: true
          schema:
            type: string
            example: sj.se
      security:
        - Pop: []
      responses:
        '204':
          description: successful operation
        '401':
          description: unauthorised
        '404':
          description: pid not found
    delete:
      tags:
        - domainName
      summary: Delete participant domain name
      operationId: deleteDomainName
      parameters:
        - name: pid
          in: path
          description: Participant identifier
          required: true
          type: integer
          format: int64
      security:
        - Pop: []
      responses:
        '204':
          description: successful operation
        '401':
          description: unauthorised
        '404':
          description: pid not found
  /participantMetadata/{pid}/mtbPublicKey:
    get:
      tags:
        - mtbPublicKey
      summary: Get MTB public keys by participant identifier
      description: Get the public component of all current MTB signing keys for a certain participant.
      operationId: getMtbPublicKeys
      produces:
        - application/json
      parameters:
        - name: pid
          in: path
          description: Participant identifier
          required: true
          type: integer
          format: int64
      security:
        - Pop: []
      responses:
        '200':
          description: successful operation
          schema:
            type: array
            items:
              $ref: '#/definitions/mtbJwkPublic'
        '401':
          description: unauthorised
        '404':
          description: pid not found
    post:
      tags:
        - mtbPublicKey
      summary: Add MTB public key to participant object
      operationId: addMtbPublicKey
      consumes:
        - application/json
      parameters:
        - name: pid
          in: path
          description: Participant identifier
          required: true
          type: integer
          format: int64
        - name: jwk
          in: body
          description: JWK object
          required: true
          schema:
            $ref: '#/definitions/mtbJwkPublic'
      security:
        - Pop: []
      responses:
        '201':
          description: successful operation
          headers:
            Location:
              description: URL of created key object
              type: string
        '401':
          description: unauthorised
        '403':
          description: kid re-used, which is not allowed
        '404':
          description: pid not found
  /participantMetadata/{pid}/mtbPublicKey/{kid}:
    get:
      tags:
        - mtbPublicKey
      summary: Get MTB public key by key identifier
      description: Get the public component of an MTB signing key.
      operationId: getMtbPublicKey
      produces:
        - application/json
      parameters:
        - name: pid
          in: path
          description: Participant identifier
          required: true
          type: integer
          format: int64
        - name: kid
          in: path
          description: Key identifier
          required: true
          type: string
      security:
        - Pop: []
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/mtbJwkPublic'
        '401':
          description: unauthorised
        '404':
          description: pid/kid not found
    put:
      tags:
        - mtbPublicKey
      summary: Update MTB public key by key identifier. WARNING - This endpoint is not part of normal use. It should only be used in rare cases when the key is erroneous and the key with same kid needs to be replaced.
      description: If you updated your keys, please follow these <a href="https://samtrafiken.atlassian.net/wiki/spaces/BOB/pages/3313500172/If+you+updated+your+keys" target="_blank">instructions</a>.
      operationId: updateMtbPublicKey
      consumes:
        - application/json
      parameters:
        - name: pid
          in: path
          description: Participant identifier
          required: true
          type: integer
          format: int64
        - name: kid
          in: path
          description: Key Identifier
          required: true
          type: string
        - name: jwk
          in: body
          description: JWK object
          required: true
          schema:
            $ref: '#/definitions/mtbJwkPublic'
      security:
        - Pop: []
      responses:
        '200':
          description: successful operation
          headers:
            Location:
              description: URL of created key object
              type: string
        '401':
          description: unauthorised
        '404':
          description: pid/kid not found
    delete:
      tags:
        - mtbPublicKey
      summary: Delete MTB public key by key identifier
      operationId: deleteMtbPublicKey
      parameters:
        - name: pid
          in: path
