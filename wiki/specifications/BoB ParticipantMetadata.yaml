        '201':
          description: successful operation
        '401':
          description: unauthorised
        '404':
          description: pid not found
    delete:
      tags:
        - participantInfo
      summary: Delete a participants participant info by participant identifier
      operationId: deleteParticipantInfo
      parameters:
        - name: pid
          in: path
          description: Participant identifier
          required: true
          type: integer
          format: int64
      security:
        - Pop: [ ]
      responses:
        '204':
          description: successful operation
        '401':
          description: unauthorised
        '404':
          description: pid or participants participant info not found
securityDefinitions:
  Pop:
    description: "OAuth 2.0 Proof-of-possession (pop) Token"
    type: apiKey
    name: Authorization
    in: header
definitions:
  authtokenJwkPublic:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "A cryptographic public key used to verify authentication token (JWT) signatures in the BoB ecosystem."
        conditions:
          - "No direct Transmodel equivalent. This is a PKI artefact (JWK per RFC 7517) specific to the BoB security infrastructure; Transmodel does not model cryptographic keys."
    type: object
    description: Public JSON Web Key (JWK) as defined in <a href="https://tools.ietf.org/html/rfc7517" target="_blank">RFC 7517</a>. Two algorithms are supported&#58; the primary algorithm is EC (kty=EC) and the fallback algorithm is RSA (kty=RSA).
    required:
      - kty
      - kid
    properties:
      kty:
        type: string
        description: JWA key type
        example: "EC"
      kid:
        type: string
        description: JWK key identifier
        example: "34:20190101_bob_mtb"
      crv:
        type: string
        description: Curve type (required for kty=EC)
        example: "P-256"
      x:
        type: string
        description: EC x coordinate (required for kty=EC)
        example: "MKBCTNIcKUSDii11ySs3526iDZ8AiTo7Tu6KPAqv7D4"
      y:
        type: string
        description: EC y coordinate (required for kty=EC)
        example: "4Etl6SRW2YiLUrN5vfvVHuhp7x8PxltmWWlbbM4IFyM"
      n:
        type: string
        description: RSA modulus parameter (required for kty=RSA)
        example: "0vx7agoebGcQSuuPiLJXZptN9nndrQmbXEps2aiAFbW..."
      e:
        type: string
        description: RSA exponent parameter (required for kty=RSA)
        example: AQAB
  mtbJwkPublic:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "A cryptographic public key used to verify Mobile Ticketing Barcode (MTB) signatures, optionally constrained to ID or Ticket type."
        conditions:
          - "No direct Transmodel equivalent. The bob_sc field (id/ticket) constrains the signing scope and partially aligns with TYPE OF TRAVEL DOCUMENT in Transmodel (SD), but the key object itself is a PKI artefact with no Transmodel counterpart."
    type: object
