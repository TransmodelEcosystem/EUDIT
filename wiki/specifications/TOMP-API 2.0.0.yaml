              conditions:
              - 'Partial match: start value of interval; GEOGRAPHICAL INTERVAL.StartGeographicalValue covers zone range start'
          $ref: '#/components/schemas/float'
          description: >-
            in case of scaling, this is the bottom value (f.x. in the first hour
            3 CAD, the `interval.from` should contain 0 and the `interval.units`
            HOUR). When `to` is used, but this field is missing, it should be
            assumed it is a 0.
        to:
          x-semantics:
            Transmodel:
              concepts:
              - GEOGRAPHICAL INTERVAL.EndGeographicalValue (FS Geographical Fare Structure MODEL)
              definition: End value for GEOGRAPHICAL INTERVAL.
              conditions:
              - 'Partial match: end value of interval; GEOGRAPHICAL INTERVAL.EndGeographicalValue covers zone range end'
          $ref: '#/components/schemas/float'
          description: >-
            the upper value of the scale (f.x. 3 CAD in the first hour, this
            field should contain 1, `interval.from` 0 and `interval.units` HOUR)
        units:
          x-semantics:
            Transmodel:
              concepts:
              - No direct Transmodel equivalent
              conditions:
              - 'No direct equivalent: unit of measurement for interval; no dedicated attribute on GEOGRAPHICAL INTERVAL'
          type: string
          description: >-
            the units is normally the same as the **interval.units**, but it
            doesn't have to be. For instance, you could pay 1 EUR per kilometer
