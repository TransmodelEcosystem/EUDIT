          - HOME_LEG
          - RETURN_TO_ORIGIN
          - ON_TIME_TRAVEL
          - TRIP_ON_TIME
          - FACILITIES_AVAILABLE
          - MOBILITY_ACCOMODATION
          - MOBILITY_ASSISTANCE
          - PASSENGER_SUPPORT
          - DISRUPTION_INFORMATION
          - REDRESS_INFORMATION
          - BEST_FARE_INFORMATION
          - GENERAL_TRAVEL
          - MEDIA_REPLACEMENT
          - REFUND_UNUSED_ANCILLARIES
          - REFUND_WHEN_CANCELLED
