    typeOfTravelDocument:
      x-semantics:
        - transmodel: TYPE OF TRAVEL DOCUMENT
      type: string
      description: >-
        A way to open/access the asset OR a proof of travel rights<br><br>
        _BARCODE_ a barcode can be retrieved from the links and used to access
        the purchased service<br> _QRCODE_ a QR code can be retrieved from the
        links<br> _AZTECCODE_ an Aztec code can be retrieved from the links<br>
        _REMOTE_ the /processes/start-leg/execution must be used to open the
        asset<br> _DEEP_LINK_ a deep link into a proprietary app is provided in
        the links to open the asset (NFC, Bluetooth)<br> _KEY_ a physical key
        must be obtained (see instructions) to open the asset<br>
      enum:
        - BARCODE
        - QRCODE
        - AZTECCODE
        - REMOTE
        - DEEP_LINK
        - KEY
        - OTHER
    organisationReference:
