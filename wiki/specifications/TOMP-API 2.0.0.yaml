    label:
      type: string
      enum:
        - REFUNDABLE
        - EXCHANGABLE
        - CANCELLABLE
        - TRANSFERABLE
        - DEPOSIT_REQUIRED
        - ANCILLARIES_INCLUDED
        - ANCILLARIES_REQUIRED
        - PAY_WHEN_FINISHED
        - PURCHASE_TO_BE_CONFIRMED
        - REQUIRES_PERSONAL_DATA
        - MANDATORY_ENTRY_INSTRUCTIONS
        - MANDATORY_EXIT_INSTRUCTIONS
        - MANDATORY_PAUSING_INSTRUCTIONS
        - ROUND_TRIP
        - UPFRONT_PAYMENT
    packageStatus:
      x-semantics:
        - transmodel: CUSTOMER PURCHASE STATUS
      type: string
      description: >-
        The life-cycle state of the package<br> _OFFERED_ the package is offered
        (pre-sales) <br> _PENDING_ the purchase of the package is not confirmed
        (the end user has shown intentions to purchase this offer), must be
        finalized with the package-confirm operation (purchase)<br> _CONFIRMED_
        a purchased package. Both parties agreed to deliver services in return
        of payment<br> _CANCELLED_ the package is cancelled before it is
        executed. The agreement will specify whether there is a refund, or under
        which conditions<br> _ROLLBACK_ the package is purchased, but before the
        Rollback-Expires timestamp has passed, therefore no financial
        consequences<br> _EXPIRED_ the MP didn't respond on time, the package
        offer has been expired<br> _STARTED_ the package is started, the <u>trip
        execution</u> module is needed now to manage the execution of the
        package<br> _ENDED_ the package has ended, the trip has been
        executed<br> _RELEASED_ for internal archiving, the package has not been
        purchased.<br> _SETTLED_ final exit state, services delivered &
        financial settlement succeeded.
      enum:
        - OFFERED
        - PENDING
        - CONFIRMED
        - ROLLBACK
        - RELEASED
        - EXPIRED
        - CANCELLED
        - STARTED
        - ENDED
        - SETTLED
    legStatus:
      type: string
      x-semantics:
        - transmodel: none
      description: >-
        status of a leg<br> _NOT_STARTED_ the leg is not started, initial
        state<br> _PREPARING_ the _PREPARE_ operation has been received<br>
        _READY_TO_USE_ the leg is ready to use<br> _IN_USE_ the travellers are
        on their way<br> _PAUSED_ the asset is paused<br> _ENDING_ the end-leg
        request is received, the offboarding process has is started<br> _ENDED_
        the travellers have arrived at their destination, leg is final<br>
        _ISSUE_REPORTED_ due to an issue, there is (temporarily) no progress to
        report, when the issue isn't solved, this is a final state<br>
        _CANCELLED_ the leg has been cancelled, before execution<br> _ABENDED_
        the leg is abnormally ended (e.g. due to an issue)
      enum:
        - NOT_STARTED
        - PREPARING
        - READY_TO_USE
        - IN_USE
        - PAUSED
        - ENDED
        - ISSUE_REPORTED
        - CANCELLED
        - ABENDED
