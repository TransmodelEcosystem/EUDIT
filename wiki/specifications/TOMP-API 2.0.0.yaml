openapi: 3.0.0
info:
  title: TOMP-API
  description: >-
    <h3>Technical interface between Transport Operators & MaaS Providers</h3>
    <hr> The TOMP-API facilitates (bi-directional) communication between
    Transport Operators (TO) and MaaS providers (MP, and other resellers), to
    fulfill a complete MaaS user journey.<br><hr>  More information: <ul><li><a
    href='https://github.com/TOMP-WG/TOMP-API/wiki/OpenAPI-entry-page'>Wiki
    pages </a></li><li><a
    href='https://github.com/TOMP-WG/TOMP-API/wiki/OpenAPI-code-convention'>Coding
    conventions</a></li> <li><a
    href="https://github.com/TOMP-WG/TOMP-API/blob/master/documents/TOMP-flows.png">High-level
    sequence diagrams</a></li> </ul> <hr> This version is released together with
    the founding of the House Of TOMP.  If you want to use the TOMP, become
    member of this cooperation,  help us establishing a uniform language between
    transport operators and resellers/MaaS providers,  creating a more
    sustainable world together.
  version: 2.0.0
  contact:
    name: TOMP working group
    url: https://github.com/TOMP-WG/TOMP-API
    email: TOMP-Secretary@maas-alliance.eu
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  x-modules:
  - offers
  - pre-sales
  - purchase
  - execution
  - support
  - after-sales
  - tech
  - customer management
  x-working-team-1:
  - Matthias Wirtz (Hacon)
  - Alberto Capponi (Nord-com)
  - Marcus Rosland Goplen (Entur)
  - Bas Matthee (Mobiliteitsfabriek)
  - Edwin van den Belt - SDG! (Goudappel/Dat.mobility)
tags:
- name: discovery
  description: URLS to comply to OGC, to describe the interface
- name: offer
  description: This part of the API facilitates in supplying offers.
- name: pre sales
  description: >-
    Module that can be used 'pre-sales'; in the pre-purchase state. Calling
    one of these endpoints, will put the package in a pre-purchased state
    (might reserve resources). The package must be released (when the
    intention of purchasing it is removed) or it expires. The result of each
    of these endpoints (except for the release) must contain an expiry date in
    the header.
- name: purchase
  description: >-
    This part of the API facilitates purchasing offer(s), a package, a product
    or start the usage of an asset.
- name: execution
  description: >-
    This part of the API facilitates changing operational parts of the trip,
    like starting, stopping legs or initiate new legs from a product. For
    modifications of the package (travellers, assignment of assets (seats),
    ancillaries), use the endpoint specified in the pre-sales module.
- name: support
  description: >-
    This part of the API facilitates in handling exceptions, like delays, flat
    tires, accidents or broken equipment reports.
- name: after sales
  description: >-
    This part of the API describes how the financial settlement should be
    done. All kinds of fares, fees, debits, and credits are described.
- name: tech
  description: technical functions of the API, also used in dataspaces
- name: customer management
  description: >-
    the <u>CUSTOMER MANAGEMENT MODULE</u> contains the functionality to
    explicitly manage the customer account on the TO side .
- name: travel information
  description: >-
    Traveller information that is not (yet) (completely) available in other
    standards
- name: core
  description: Core functions, used in multiple modules
paths:
  /:
    get:
      security:
      - OpenData: []
      tags:
      - discovery
      operationId: landingPage
      summary: Landing page
      description: >-
        Gives a (technical & human readable) output describing how this API must
        be used. If  the parameter f=html is supplied, a human readable page
        must be responded.
      externalDocs:
        url: https://app.swaggerhub.com/apis/OGC/ogcapi-features-1-example-1/1.0.1
      parameters:
      - $ref: '#/components/parameters/f'
      responses:
        '200':
          $ref: '#/components/responses/landingPageResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /api:
    get:
      description: This document
      parameters:
      - $ref: '#/components/parameters/f'
      responses:
        '200':
          description: General Success response.
        default:
          $ref: '#/components/responses/errorResponse'
      summary: This document
      operationId: openApi
      security:
      - OpenData: []
      tags:
      - discovery
  /conformance:
    get:
      description: >-
        A list of all conformance classes specified in a standard that the
        server conforms to.
      parameters:
      - $ref: '#/components/parameters/f'
      operationId: getConformanceDeclaration
      responses:
        '200':
          $ref: '#/components/responses/conformanceDeclarationResponse'
        default:
          $ref: '#/components/responses/errorResponse'
      summary: API conformance definition
      security:
      - OpenData: []
      tags:
      - discovery
  /collections:
    get:
      security:
      - OpenData: []
      tags:
      - discovery
      summary: the feature collections in the dataset
      description: >-
        returns a collection of available collection (like offers, packages,
        legs, support-requests and payments)
      operationId: getCollections
      responses:
        '200':
          description: A list of available collections
          headers:
            Content-Language:
              $ref: '#/components/headers/contentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/collections'
        default:
          $ref: '#/components/responses/errorResponse'
  /collections/{collectionId}:
    get:
      security:
      - OpenData: []
      tags:
      - discovery
      summary: describe the feature collection with id `collectionId`
      operationId: describeCollection
      description: a (machine or human) readable description of this collection
      parameters:
      - $ref: '#/components/parameters/collectionId'
      responses:
        '200':
          description: description of data delivered by this collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/collection'
            text/html:
              schema:
                type: string
        default:
          $ref: '#/components/responses/errorResponse'
  /processes:
    get:
      security:
      - OpenData: []
      tags:
      - discovery
      summary: retrieve the list of available processes
      description: >-
        The list of processes contains a summary of each process the OGC API -
        Processes offers, including the link to a more detailed description of
        the process. For more information, see <a
        href="https://docs.ogc.org/is/18-062/18-062.html#sc_process_list">Section
        7.9</a>.
      operationId: getProcesses
      responses:
        '200':
          description: Information about the available processes
          headers:
            Version:
              $ref: '#/components/headers/version'
            Content-Language:
              $ref: '#/components/headers/contentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/processList'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/{processId}:
    get:
      security:
      - OpenData: []
      tags:
      - discovery
      summary: retrieve a process description
      description: >-
        The process description contains information about inputs and outputs
        and a link to the execution-endpoint for the process. The Core does not
        mandate the use of a specific process description to specify the
        interface of a process. That said, the Core requirements class makes the
        following _recommendation_ implementations SHOULD consider supporting
        the OGC process description. For more information, see <a
        href="https://docs.ogc.org/is/18-062/18-062.html#sc_process_description">Section
        7.10</a>.
      operationId: getProcessDescription
      parameters:
      - name: processId
        in: path
        required: true
        description: >
          - search-offers: [offer] search for available offers based on a
          travel specification, products or assets and traveller information

          - update-traveller: [pre-sales] update traveller information, like
          personal data, cards and licenses

          - update-travel-specification: [pre-sales, execution] update travel
          specification (times, locations)

          - remove-offer: [pre-sales] remove an offer from a package

          - assign-asset: [pre-sales, execution] assign an asset to a package
          / leg. The asset can be a vehicle,
            a bike, a scooter, or any other physical object needed to execute the package
          - assign-ancillary: [pre-sales, execution] assign an ancillary to a
          package / leg

          - select-offers: [pre-sales] select one or more offers to be
          included in a package

          - purchase-offers: [purchase after offer] purchase an offer(s) to
          create a purchased (PENDING or CONFIRMED) package

          - release-package: [purchase] release a PENDING package 

          - purchase-package: [purchase after pre-sales] purchase a package 

          - confirm-purchase: [purchase] confirm a PENDING package

          - rollback-purchase: [purchase] rollback a PENDING package

          - extend-expiry-time: [purchase] extend the expiry time of a PENDING
          package

          - start-leg: [execution] start a leg

          - pause-leg: [execution] pause a leg

          - resume-leg: [execution] resume a leg

          - end-leg: [execution] end a leg

          - postpone-leg: [execution] postpone a leg

          - extend-leg: [execution] extend a leg

          - request-support: [support] request support

          - cancel-package: [after sales] cancel a package

          - claim-redress-option: [after sales] claim a redress option

          - confirm-redress-option: [after sales] confirm a redress option

          - refund-deposit: [after sales] refund a deposit

          - confirm-payment: [after sales] confirm a payment
        schema:
          type: string
          enum:
          - search-offers
          - update-traveller
          - update-travel-specification
          - remove-offer
          - assign-asset
          - assign-ancillary
          - select-offers
          - purchase-offers
          - release-package
          - purchase-package
          - confirm-purchase
          - rollback-purchase
          - extend-expiry-time
          - start-leg
          - pause-leg
          - resume-leg
          - end-leg
          - postpone-leg
          - extend-leg
          - request-support
          - cancel-package
          - claim-redress-option
          - confirm-redress-option
          - refund-deposit
          - confirm-payment
      responses:
        '200':
          description: A process description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/process'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/search-offers/execution:
    post:
      operationId: searchOffers
      summary: Search for offers
      description: >-
        Returns offers based on travel specification, trip pattern, location,
        asset, product and user preferences. In case of a shallow integration,
        can even be offered as an endpoint without authentication.
      security:
      - BearerAuth: []
      - OpenData: []
      x-semantics:
        Transmodel:
          concepts:
          - "FARE QUERY (Fare Management)"
          - "TRIP REQUEST (Journey Planning)"
          conditions:
          - "Exact match: queries offers based on travel specification including fare information"
          - "TRIP REQUEST when the result contains travel options; FARE QUERY when the result also includes fares"
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/bbox'
      tags:
      - offer
      requestBody:
        $ref: '#/components/requestBodies/searchOfferRequest'
      responses:
        '200':
          $ref: '#/components/responses/offersResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /collections/offers/items:
    get:
      operationId: requestOffer
      summary: Get offer details
      x-semantics:
        Transmodel:
          concepts:
          - "SALES OFFER PACKAGE QUERY (Fare Management)"
          conditions:
          - "Exact match: queries available SALES OFFER PACKAGEs based on an offerReference"
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/offerId'
      tags:
      - offer
      responses:
        '200':
          $ref: '#/components/responses/packageResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/select-offers/execution:
    post:
      operationId: selectOffersRequest
      summary: Select offer(s) into a package
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      tags:
      - pre sales
      x-semantics:
        Transmodel:
          concepts:
          - "TRAVEL PACKAGE CREATION REQUEST (Fare Management)"
          conditions:
          - "Exact match: converts one or more selected offers into a CUSTOMER PURCHASE PACKAGE"
      requestBody:
        $ref: '#/components/requestBodies/selectOffersRequest'
      responses:
        '200':
          $ref: '#/components/responses/packageResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /collections/assets/items:
    get:
      operationId: requestAssets
      summary: Request (available) assets for e.g. a leg
      x-semantics:
        Transmodel:
          concepts:
          - "TRAVEL PACKAGE SPOT AVAILABILITY QUERY (Fare Management)"
          conditions:
          - "Partial match: shared mobility assets are VEHICLE, PARKING BAY or SPOT in Transmodel"
          - "Exact match for querying asset availability for a specific leg"
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/bbox'
      - $ref: '#/components/parameters/packageId'
      - $ref: '#/components/parameters/legId'
      tags:
      - pre sales
      responses:
        '200':
          $ref: '#/components/responses/assetsResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /collections/ancillaries/items:
    get:
      operationId: requestAncillaries
      summary: Request available ancillaries for a leg
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/bbox'
      - $ref: '#/components/parameters/packageId'
      - $ref: '#/components/parameters/legId'
      tags:
      - pre sales
      x-semantics:
        Transmodel:
          concepts:
          - "No direct Transmodel equivalent"
          conditions:
          - "Partial match: closest concept is ANCILLARY PRODUCT (Fare Management)"
          - "Transmodel has no separate query for available ancillaries; SUPPLEMENT PRODUCT or THIRD PARTY PRODUCT are the closest concepts"
      responses:
        '200':
          $ref: '#/components/responses/ancillariesResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/update-traveller/execution:
    post:
      operationId: updateTravellerRequest
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      tags:
      - pre sales
      summary: update details of a traveller
      x-semantics:
        Transmodel:
          concepts:
          - "TRAVEL PACKAGE ALTERATION REQUEST (Fare Management)"
          conditions:
          - "Exact match: update of traveller details (characteristics, age) in an existing package"
      requestBody:
        $ref: '#/components/requestBodies/updateTravellerRequest'
      responses:
        '200':
          $ref: '#/components/responses/packageResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/update-travel-specification/execution:
    post:
      operationId: updateTravelSpecificationRequest
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      tags:
      - pre sales
      summary: update start/end location or start/end time
      x-semantics:
        Transmodel:
          concepts:
          - "TRAVEL PACKAGE ALTERATION REQUEST (Fare Management)"
          conditions:
          - "Exact match: update of start/end location or start/end time in an existing package"
      requestBody:
        $ref: '#/components/requestBodies/updateTravelSpecificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/packageResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/assign-asset/execution:
    post:
      operationId: assignAssetRequest
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      tags:
      - pre sales
      summary: >-
        Assign an asset to a package (and a leg). It could also replace another
        asset or remove one
      x-semantics:
        Transmodel:
          concepts:
          - "TRAVEL PACKAGE SPOT RESERVATION REQUEST (Fare Management)"
          - "TRAVEL PACKAGE SPOT CANCELLATION REQUEST (Fare Management)"
          conditions:
          - "TRAVEL PACKAGE SPOT RESERVATION REQUEST when an asset is assigned to a leg"
          - "TRAVEL PACKAGE SPOT CANCELLATION REQUEST when an existing assigned asset is removed"
      requestBody:
        $ref: '#/components/requestBodies/assignAssetRequest'
      responses:
        '200':
          $ref: '#/components/responses/packageResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/assign-ancillary/execution:
    post:
      operationId: assignAncillaryRequest
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      tags:
      - pre sales
      summary: >-
        Assign an ancillary to a package (and a leg). It could also replace
        another ancillary or remove one
      x-semantics:
        Transmodel:
          concepts:
          - "TRAVEL PACKAGE ALTERATION REQUEST (Fare Management)"
          conditions:
          - "Partial match: Transmodel has no direct ancillary assignment operation; closest equivalent is package alteration"
      requestBody:
        $ref: '#/components/requestBodies/assignAncillaryRequest'
      responses:
        '200':
          $ref: '#/components/responses/packageResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/release-package/execution:
    post:
      operationId: releasePackageRequest
      summary: Release the complete package
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      tags:
      - pre sales
      requestBody:
        $ref: '#/components/requestBodies/packageRequest'
      responses:
        '200':
          $ref: '#/components/responses/packageResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/remove-offer/execution:
    post:
      operationId: removeOfferRequest
      summary: Remove an offer from the package
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      tags:
      - pre sales
      x-semantics:
        Transmodel:
          concepts:
          - "TRAVEL PACKAGE ALTERATION REQUEST (Fare Management)"
          conditions:
          - "Exact match: removes a specific offer from an existing package"
      requestBody:
        $ref: '#/components/requestBodies/removeOfferRequest'
      responses:
        '200':
          $ref: '#/components/responses/packageResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/purchase-offers/execution:
    post:
      operationId: purchaseOffersRequest
      summary: Perform an purchase of offer(s)
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/digest'
      - $ref: '#/components/parameters/publicKey'
      - $ref: '#/components/parameters/signedDigest'
      tags:
      - purchase
      x-semantics:
        Transmodel:
          concepts:
          - "TRAVEL PACKAGE PURCHASE REQUEST (Fare Management)"
          conditions:
          - "Exact match: purchase of one or more selected offers"
      requestBody:
        $ref: '#/components/requestBodies/purchaseOfferRequest'
      responses:
        '200':
          $ref: '#/components/responses/purchaseResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/purchase-package/execution:
    post:
      operationId: purchasePackageRequest
      summary: Perform an purchase of a package
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/digest'
      - $ref: '#/components/parameters/publicKey'
      - $ref: '#/components/parameters/signedDigest'
      tags:
      - purchase
      requestBody:
        $ref: '#/components/requestBodies/packageRequest'
      x-semantics:
        Transmodel:
          concepts:
          - "TRAVEL PACKAGE PURCHASE REQUEST (Fare Management)"
          conditions:
          - "Exact match: purchase of a complete package"
      responses:
        '200':
          $ref: '#/components/responses/purchaseResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/purchase-product/execution:
    post:
      operationId: purchaseProductRequest
      summary: Perform an purchase of a product
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      security:
      - BearerAuth: []
      - OAuth: []
      tags:
      - purchase
      x-semantics:
        Transmodel:
          concepts:
          - "TRAVEL PACKAGE PURCHASE REQUEST (Fare Management)"
          conditions:
          - "Partial match: product purchase outside the context of a travel specification; closest Transmodel concept"
      requestBody:
        $ref: '#/components/requestBodies/purchaseProductRequest'
      responses:
        '200':
          $ref: '#/components/responses/purchaseResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/use-asset/execution:
    post:
      operationId: useAssetRequest
      summary: Request to use an asset
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      security:
      - BearerAuth: []
      - OAuth: []
      tags:
      - purchase
      x-semantics:
        Transmodel:
          concepts:
          - "TRAVEL PACKAGE PURCHASE REQUEST (Fare Management)"
          conditions:
          - "Partial match: direct asset use without a prior package; closest Transmodel concept for immediate activation"
      requestBody:
        $ref: '#/components/requestBodies/useAssetRequest'
      responses:
        '200':
          $ref: '#/components/responses/purchaseResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/rollback-purchase/execution:
    post:
      operationId: rollbackPurchaseRequest
      summary: Rollback a purchase, before the rollbackExpiryTime has ended
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      tags:
      - purchase
      requestBody:
        $ref: '#/components/requestBodies/packageRequest'
      responses:
        '200':
          $ref: '#/components/responses/packageResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/confirm-purchase/execution:
    post:
      operationId: confirmPurchaseRequest
      summary: Confirm the purchase, before the rollbackExpiryTime has ended
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      tags:
      - purchase
      requestBody:
        $ref: '#/components/requestBodies/packageRequest'
      responses:
        '200':
          $ref: '#/components/responses/purchaseResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/extend-expiry-time/execution:
    post:
      operationId: extendExpiryTimeRequest
      summary: Request additional time to complete the purchase
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      tags:
      - purchase
      requestBody:
        $ref: '#/components/requestBodies/extendExpiryTimeRequest'
      responses:
        '200':
          $ref: '#/components/responses/packageResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /collections/travel-documents/items:
    get:
      operationId: getTravelDocuments
      summary: Retrieve travel documents
      description: Returns travel documents for a package or leg
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/packageId'
      - $ref: '#/components/parameters/optionalLegId'
      tags:
      - purchase
      x-semantics:
        Transmodel:
          concepts:
          - "FULFILMENT (Fare Management)"
          conditions:
          - "Exact match: retrieval of travel documents after a successful purchase"
      responses:
        '200':
          $ref: '#/components/responses/travelDocumentsResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/{legOperation}-leg/execution:
    post:
      operationId: legOperation
      summary: Perform an operation on a leg
      description: >-
        This endpoint must be used to alter the state of a LEG, using OPERATION
        requests.
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - name: legOperation
        in: path
        description: OPERATION on a specified leg
        required: true
        schema:
          type: string
          description: the possible operations on a leg.
          enum:
          - start
          - pause
          - resume
          - end
          - extend
          - postpone
      security:
      - BearerAuth: []
      - OAuth: []
      tags:
      - execution
      requestBody:
        $ref: '#/components/requestBodies/legRequest'
      responses:
        '200':
          $ref: '#/components/responses/packageResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /processes/{assetOperation}-asset/execution:
    post:
      operationId: assetOperation
      summary: Perform an operation on a asset
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - name: assetOperation
        in: path
        description: OPERATION on a specified asset
        required: true
        schema:
          type: string
          description: >-
            Operations on an asset, the enlisted operations are default, you
            can extend (outside the TOMP-API).
          x-enum:
          - lock
          - unlock
          - open-trunk
      security:
      - BearerAuth: []
      - OAuth: []
