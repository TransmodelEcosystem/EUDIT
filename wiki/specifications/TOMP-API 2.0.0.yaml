components:
  parameters:
    collectionId:
      name: collectionId
      in: path
      required: true
      description: >
        - datasources: to get external data source definitions, used throughout
        the API (references)


        Operational collections:

        - packages: to get a single package (packageId is needed in the request)

        - offers: to get a single offer (offerId is needed in the request)

        - assets: to get (available) assets for a leg, like seats, vehicles,
        bikes or scooters

        - ancillaries: to get (available) ancillaries for a leg, like
        insurances, meals or extra luggage

        - travel-documents: to get travel documents, like tickets or boarding
        passes

        - customers: to get customer information

        - support-tickets: to get support tickets

        - payments: to get payment information

        - redress-options: to get redress options (vouchers, refunds)


        Travel information collections:

        - entitlements: to get entitlement definitions, like subscriptions,
        discounts or passes

        - card-types: to get supported card types for user profiles (like
        OV-chipkaart, bank-cards)

        - license-types: to get supported license types for user profiles (like
        driving licenses)

        - user-profiles: to get user profile definitions (age groups, special
        needs)

        - fares: to get a fare, based on origin, destination, time, and
        user-profile
      schema:
        type: string
        description: these are all collections exposed when fully implemented
        enum:
        - packages
        - offers
        - assets
        - ancillaries
        - travel-documents
        - customers
        - entitlements
        - card-types
        - license-types
        - user-profiles
        - fares
        - datasources
        - support-tickets
        - payments
        - redress-options
    supportTicketStatus:
      x-semantics:
        Transmodel:
          concepts:
          - No direct Transmodel equivalent
          conditions:
          - 'No direct equivalent: Enumeration of support ticket lifecycle states; no Transmodel equivalent'

      name: supportTicketStatus
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/supportTicketStatus'
    dateTime:
      in: query
      name: date_time
      description: >-
        Date time for which the information is requested. If provided the result
        becomes final and therefore MUST be cacheable.
      schema:
        type: string
    f:
      description: >-
        The optional f parameter indicates the output format that the server
        shall provide as part of the response document.  The default format is
        JSON.
      explode: false
      in: query
      name: f
      required: false
      schema:
        default: json
        enum:
        - json
        - html
        type: string
      style: form
    offerId:
      in: query
      name: offerId
      schema:
        type: string
      required: true
      description: the identifier of an offer
    packageId:
      in: query
      name: packageId
      schema:
        type: string
      required: true
      description: the identifier of a package
    acceptLanguage:
      in: header
      name: Accept-Language
      required: true
      schema:
        $ref: '#/components/schemas/shortString'
      x-externalDocs:
        description: >-
          A comma-separated list of BCP 47 (RFC 5646) language tags and optional
          weights as described in IETF RFC7231 section 5.3.5. A list of the
          languages/localizations the user would like to see the results in.  For user privacy and ease of use on the TO side, this list should be
          kept as short as possible
    authorization:
      in: header
      name: authorization
      required: true
      schema:
        type: string
      description: Header field, JWT must be supplied
    legId:
      in: query
      name: legId
      description: leg identifier
      required: true
      schema:
        $ref: '#/components/schemas/uuid'
    optionalLegId:
      in: query
      name: legId
      description: leg identifier
      required: false
      schema:
        $ref: '#/components/schemas/uuid'
    optionalProductId:
      in: query
      name: productId
      description: Product identifier
      required: false
      schema:
        $ref: '#/components/schemas/uuid'
    productId:
      in: query
      name: productId
      description: Product identifier
      required: true
      schema:
        $ref: '#/components/schemas/uuid'
    limit:
      in: query
      name: limit
      description: >-
        The optional limit parameter limits the number of items that are
        presented in the response document.


        Only items are counted that are on the first level of the collection in
        the response document.

        Nested objects contained within the explicitly requested items shall not
        be counted.


        Minimum = 1. Maximum = 10000. Default = 100.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 100
      style: form
      explode: false
    offset:
      name: offset
      in: query
      description: >-
        The optional offset parameter representing the starting index of the
        returned collection.


        Only items are counted that are on the first level of the collection in
        the response document.

        Nested objects contained within the explicitly requested items shall not
        be counted.


        Default = 0.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      style: form
      explode: false
    bbox:
      name: bbox
      in: query
      description: >-
        Only features that have a geometry that intersects the bounding box are
        selected.

        The bounding box is provided as four or six numbers, depending on
        whether the

        coordinate reference system includes a vertical axis (height or depth):


        * Lower left corner, coordinate axis 1

        * Lower left corner, coordinate axis 2

        * Minimum value, coordinate axis 3 (optional)

        * Upper right corner, coordinate axis 1

        * Upper right corner, coordinate axis 2

        * Maximum value, coordinate axis 3 (optional)


        If the value consists of four numbers, the coordinate reference system
        is

        WGS 84 longitude/latitude (http://www.opengis.net/def/crs/OGC/1.3/CRS84)

        unless a different coordinate reference system is specified in the
        parameter `bbox-crs`.


        If the value consists of six numbers, the coordinate reference system is
        WGS 84

        longitude/latitude/ellipsoidal height
        (http://www.opengis.net/def/crs/OGC/0/CRS84h)

        unless a different coordinate reference system is specified in the
        parameter `bbox-crs`.


        The query parameter `bbox-crs` is specified in OGC API - Features - Part
        2: Coordinate

        Reference Systems by Reference.


        For WGS 84 longitude/latitude the values are in most cases the sequence
        of

        minimum longitude, minimum latitude, maximum longitude and maximum
        latitude.

        However, in cases where the box spans the antimeridian the first value

        (west-most box edge) is larger than the third value (east-most box
        edge).


        If the vertical axis is included, the third and the sixth number are

        the bottom and the top of the 3-dimensional bounding box.


        If a feature has multiple spatial geometry properties, it is the
        decision of the

        server whether only a single spatial geometry property is used to
        determine

        the extent or all relevant geometries.
      required: false
      schema:
        type: array
        oneOf:
        - minItems: 4
          maxItems: 4
        - minItems: 6
          maxItems: 6
        items:
          type: number
      style: form
      explode: false
    digest:
      name: digest
      in: header
      description: the hash of the body, SHA-256 ("SHA-256=3q2+7w==:")
      schema:
        type: string
      required: false
    publicKey:
      name: publicKey
      in: header
      description: >-
        the public key of the sending party, can be used to validate the signed
        digest (it should deliver the digest)
      x-example:
        certificate: >-
          -----BEGIN
          CERTIFICATE-----MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAnZ5...-----END
          CERTIFICATE-----
      schema:
        type: string
      required: false
    signedDigest:
      name: signedDigest
      in: header
      description: >-
        the signed hash of complete response, using the private key, SHA-256
        base64 encoded
      schema:
        type: string
      required: false
    rollbackExpires:
      name: rollbackExpires
      in: header
      description: >-
        until this timestamp the rollback of the purchase is allowed to perform
        without financial consequences
      schema:
        $ref: '#/components/schemas/httpDate'
      required: false
