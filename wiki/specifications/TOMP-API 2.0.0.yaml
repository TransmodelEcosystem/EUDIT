            PARAMETER) _PASSENGER_SUPPORT_ - A TRAVEL QUALITY GUARANTEE that
            assistance will be provided, for example, if a disruption occurs or
            a that stations are staffed. (ALL REDRESSES)

            _DISRUPTION_INFORMATION_ - An INFORMATION QUALITY GUARANTEE that
            information on disruptions will be made available. (ALL REDRESSES)
            _REDRESS_INFORMATION_ - An INFORMATION QUALITY GUARANTEE that
            information on available compensation or other statutory and
            discretionary redress options will be made available to the
            passenger. (ALL REDRESSES) _BEST_FARE_INFORMATION_ - An INFORMATION
            QUALITY GUARANTEE that information on the best value fares will be
            made available (ALL REDRESSES)

            _GENERAL_TRAVEL_ - An arbitrary OTHER TRAVEL GUARANTEE describing
            some special guarantee not covered by the normal categories (ALL
            REDRESSES) _MEDIA_REPLACEMENT_ - An OTHER GUARANTEE that a
            replacement media will be provided if the original becomes unusable.
            _REFUND_UNUSED_ANCILLARIES_ - unused ancillaries will be refunded
            _REFUND_WHEN_CANCELLED_ - when cancelled before start, a refund will
            be scheduled
          enum:
