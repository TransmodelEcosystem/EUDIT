          $ref: '#/components/responses/packageResponse'
        default:
          $ref: '#/components/responses/errorResponse'
  /health:
    get:
      operationId: ping
      tags:
      - tech
      summary: is the API up and running?
      description: This is a healthcheck ENDPOINT
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '204':
          description: successful operation
  /oauth/token:
    post:
      summary: Token Endpoint
      operationId: getToken
      tags:
      - tech
      security:
      - BasicAuth: []
      - BearerAuth: []
      - OAuth: []
      - OAuthPKI: []
      description: >-
        This endpoint is used to obtain an access token and optionally an ID
        token through different OAuth 2.0 grant types, including Client
        Credentials Flow. Whenever the mTLS flow is taken, the properties will
        be ignored, and the access token will be generated based on the
        credentials in the certificate (O or CN).
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                  - client_credentials
                  - password
                  - refresh_token
                  description: >-
                    The grant type: 'client_credentials', 'password', or
                    'refresh_token'.
                  default: client_credentials
                username:
                  type: string
                  description: The username
                password:
                  type: string
                  description: The password
                client_id:
                  type: string
                  description: The client ID (Client Credentials Flow)
                client_secret:
                  type: string
                  description: The client secret (Client Credentials Flow)
      responses:
        '200':
          description: Successful token issuance.
          content:
            application/json:
              schema:
                type: object
                required:
                - access_token
                properties:
                  access_token:
                    type: string
                    description: The issued access token.
                  token_type:
                    type: string
                    description: The type of the token.
                    default: Bearer
                  expires_in:
                    type: integer
                    description: The lifetime of the access token in seconds.
        '400':
          description: 'Bad Request: Invalid request or wrong grant type.'
        '401':
          description: 'Unauthorized: Invalid client ID or secret.'
        '500':
          description: 'Internal Server Error: Something went wrong.'
