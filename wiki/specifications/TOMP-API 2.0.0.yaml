    basePoint:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
        format: float
        minimum: 0
    geojsonPoint:
      type: object
      description: Geojson Coordinate
      required:
        - coordinates
      properties:
        coordinates:
          $ref: '#/components/schemas/basePoint'
    geojsonLine:
      type: object
      description: An array of WGS84 coordinate pairs
      required:
        - coordinates
      properties:
        coordinates:
          type: array
          items:
            $ref: '#/components/schemas/basePoint'
    geojsonPolygon:
      type: object
      description: >-
        geojson representation of a polygon. First and last point must be equal.
        See also https://geojson.org/geojson-spec.html#polygon and example
        https://geojson.org/geojson-spec.html#id4. The order should be lon, lat
        [[[lon1, lat1], [lon2,lat2], [lon3,lat3], [lon1,lat1]]], the first point
        should match the last point.
      required:
        - coordinates
      properties:
        coordinates:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/basePoint'
    geojsonMultiPolygon:
      type: object
      description: >-
        geojson representation of a multi polygon. See also
        https://geojson.org/geojson-spec.html#multipolygon
      required:
        - coordinates
      properties:
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                $ref: '#/components/schemas/basePoint'
    geojsonGeometry:
      type: object
      description: geoJSON geometry
      required:
        - type
      properties:
        type:
          type: string
          pattern: ^(Point|LineString|Polygon|MultiPolygon)$
      oneOf:
        - $ref: '#/components/schemas/geojsonPoint'
        - $ref: '#/components/schemas/geojsonLine'
        - $ref: '#/components/schemas/geojsonPolygon'
        - $ref: '#/components/schemas/geojsonMultiPolygon'
      discriminator:
        propertyName: type
        mapping:
          Point: '#/components/schemas/geojsonPoint'
          LineString: '#/components/schemas/geojsonLine'
          Polygon: '#/components/schemas/geojsonPolygon'
          MultiPolygon: '#/components/schemas/geojsonMultiPolygon'
    geojsonFeature:
      type: object
      required:
        - type
        - properties
      properties:
        type:
          type: string
          pattern: ^(Feature)$
        id:
          $ref: '#/components/schemas/shortString'
        geometry:
          $ref: '#/components/schemas/geojsonGeometry'
        properties:
          $ref: '#/components/schemas/geojsonFeatureProperties'
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
    geojson:
      type: object
      properties:
        type:
          type: string
          pattern: ^(FeatureCollection)$
        features:
          type: array
          items:
            $ref: '#/components/schemas/geojsonFeature'
        properties:
          $ref: '#/components/schemas/geojsonCollectionProperties'
        numberMatched:
          type: number
        numberReturned:
          type: number
        links:
          type: array
          description: >-
            actions that can be performed on this package, but also alternative
            (rel=alternative+1, alternative+2) offers or references to other
            resources In case it is an alternative, specify clearly in the
            description what the financial consequences are.
          items:
            $ref: '#/components/schemas/link'
    links:
      type: object
      x-externalDocs:
        url: https://en.wikipedia.org/wiki/Hypertext_Application_Language
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
    link:
      type: object
      additionalProperties: false
      x-externalDocs:
        url: >-
          http://schemas.opengis.net/ogcapi/features/part1/1.0/openapi/schemas/link.yaml
      required:
        - href
        - rel
      properties:
        rel:
          type: string
          description: >-
            the action that can be performed OR part of the URI allowed values
            include the 'processId's, prefixes for the referenced data sources,
            prefixes for deeplinks ('apple' and 'android'), OGC compliant ones
            (alternative, next, etc)
        href:
          $ref: '#/components/schemas/url'
        type:
          $ref: '#/components/schemas/shortString'
          description: allowed values are described by IANA, ("application/geo+json")
        method:
          type: string
          description: to indicate the http method.
          default: GET
          enum:
            - POST
            - GET
            - DELETE
            - PATCH
        description:
          type: string
          description: the description of the external data source
        body:
          type: object
          description: the (prefilled) body for the request
        headers:
          type: object
          additionalProperties:
            type: string
        mandatory:
          description: is this link informative, or must it be used?
          type: boolean
        hash:
          description: to validate that the content of the link hasn`t been changed.
          type: string
        expires:
          $ref: '#/components/schemas/dateTime'
        availableFrom:
          $ref: '#/components/schemas/dateTime'
    amountOfMoney:
      type: object
      x-semantics:
        - transmodel: FARE PRICE
      description: >-
        an amount of money, usable in fares, fare calculations or in extra
        costs.
      required:
        - amount
      properties:
        amount:
          type: number
          format: float
          description: >-
            This should be in the base unit as defined by the ISO 4217 currency
            code with the appropriate number of decimal places and omitting the
            currency symbol. e.g. if the price is in US Dollars the price would
            be 9.95. This is inclusive VAT
        taxPercentageUsed:
          $ref: '#/components/schemas/float'
          description: value added tax rate (percentage of amount)
        currencyCode:
          $ref: '#/components/schemas/currencyCode'
        vatCountryCode:
          $ref: '#/components/schemas/country'
    country:
      type: string
      x-semantics:
        - transmodel: COUNTRY
      description: two-letter country codes according to ISO 3166-1
      maxLength: 2
      minLength: 2
      pattern: '[A-Z]{2}'
    currencyCode:
      type: string
      x-semantics:
        - transmodel: PRICE UNIT
      description: ISO 4217 currency code
      minLength: 3
      maxLength: 3
      pattern: '[a-zA-Z]{3}'
    customProperties:
      type: object
      description: dictionary for extra fields (bilatural agreements)
      additionalProperties:
        maxLength: 1000
        maxProperties: 20
    error:
      type: object
      additionalProperties: false
      description: >-
        An error that the service may send, e.g. in case of invalId input,
        missing authorization or internal service error. See
        https://github.com/TOMP-WG/TOMP-API/wiki/Error-handling-in-TOMP for
        further explanation of error code. JSON schema for exceptions based on
        RFC 7807
      required:
        - errorcode
        - title
      properties:
        errorcode:
          $ref: '#/components/schemas/tinyInt'
          description: >-
            The TOMP specific error code. See
            https://github.com/TOMP-WG/TOMP-API/wiki/Error-handling-in-TOMP for
            more details of this error.
        type:
          $ref: '#/components/schemas/tinyString'
          description: The category of this type of error.
        title:
          $ref: '#/components/schemas/shortString'
          description: >-
            A short, human-readable summary of the problem type.  It SHOULD NOT
            change from occurrence to occurrence of the problem, except to match
            Content-Language
        status:
          $ref: '#/components/schemas/tinyInt'
          description: >-
            The HTTP status code ([RFC7231], Section 6) generated by the origin
            server for this occurrence of the problem.
        detail:
          $ref: '#/components/schemas/longString'
          description: >-
            A human-readable explanation specific to this occurrence of the
            problem, matches Content-Language
        instance:
          $ref: '#/components/schemas/url'
          description: >-
            A URI reference that identifies the specific occurrence of the
            problem.  It may or may not yield further information if
            dereferenced.
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
    date:
      type: string
      format: full-date
      x-pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      description: >-
        https://www.rfc-editor.org/rfc/rfc3339#section-5.6, full-date
        (2019-10-12)
    dateTime:
      type: string
      format: date-time
      x-pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
      description: >-
        https://www.rfc-editor.org/rfc/rfc3339#section-5.6, date-time
        (2019-10-12T07:20:50.52Z)
    float:
      type: number
      description: the travelled distance. Only if applicable.
      format: float
      minimum: 0
    httpDate:
      type: string
      description: A HTTP date string
      x-format: http-date
      x-externalDocs:
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Expires
        description: http-date
    longString:
      type: string
      description: long string, memos etc (length 0-10.000)
      maxLength: 10000
    normalInt:
      type: integer
      description: default length for an integer (0-1000)
      default: 0
      minimum: 0
      maximum: 1000
    dateTimeRange:
      type: array
      minItems: 2
      maxItems: 2
      items:
        $ref: '#/components/schemas/dateTime'
    duration:
      description: duration, ISO 8601 compliant
      type: string
      pattern: >-
        /^(-?)P(?=\d|T\d)(?:(\d+)Y)?(?:(\d+)M)?(?:(\d+)([DW]))?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?)?$/
    normalString:
      type: string
      description: default string, full names etc (length 0-200)
      maxLength: 200
    shortInt:
      type: integer
      description: a bit short integer (0-100)
      default: 0
      minimum: 0
      maximum: 100
    shortString:
      type: string
      description: short string, display names (length 0-75)
      maxLength: 75
    tinyInt:
      type: integer
      description: for really small numbers (0-10)
      default: 0
      minimum: 0
      maximum: 10
    tinyString:
      type: string
      description: real short string, codes (length 0-10)
      maxLength: 10
    url:
      type: string
      description: valid URL
      format: uri
    uuid:
      type: string
      x-preferred-pattern: >-
        ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      description: >-
        https://en.wikipedia.org/wiki/Universally_unique_identifier see also
        https://www.ietf.org/rfc/rfc4122.txt
        (ae76f51c-a1a6-46af-b9ab-8233564adcae)
  requestBodies:
    searchOfferRequest:
      x-semantics:
        - transmodel: TRIP REQUEST
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                $ref: '#/components/schemas/searchOfferRequest'
    selectOffersRequest:
      x-semantics:
        - transmodel: TRAVEL PACKAGE CREATION REQUEST
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: '#/components/schemas/offerReference'
    updateTravellerRequest:
      x-semantics:
        - transmodel: TRAVEL PACKAGE ALTERATION REQUEST
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                required:
                  - traveller
                properties:
                  package:
                    $ref: '#/components/schemas/packageReference'
                  traveller:
                    $ref: '#/components/schemas/travellerReference'
                  age:
                    $ref: '#/components/schemas/shortInt'
                    description: Age of the traveller, may be approximate
                  fullName:
                    $ref: '#/components/schemas/normalString'
                    description: >-
                      the name of the traveller, can be used to validate against
                      ID cards
                  characteristics:
                    $ref: '#/components/schemas/travellerCharacteristics'
                    description: >-
                      the COMPLETE set of entitlements, replaces the previous
                      set of entitlements of this traveller
    updateTravelSpecificationRequest:
      x-semantics:
        - transmodel: TRAVEL PACKAGE ALTERATION REQUEST
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                required:
                  - package
                properties:
                  package:
                    $ref: '#/components/schemas/packageReference'
                  leg:
                    $ref: '#/components/schemas/legReference'
                  startTime:
                    $ref: '#/components/schemas/dateTime'
                    description: >-
                      The intended departure time. If left out and no endTime is
                      set, the current time should be assumed. If only the
                      arrival time is specified, this is an implicit request for
                      a guaranteed arrival at that time.
                  endTime:
                    $ref: '#/components/schemas/dateTime'
                    description: >-
                      The intended arrival time, at the `to place`. When the
                      **startTime** is not set, and **endTime** is set, it is an
                      implicit request for an arrival time guarantee.
    assignAssetRequest:
      x-semantics:
        - transmodel: >-
            TRAVEL PACKAGE SPOT RESERVATION REQUEST, TRAVEL PACKAGE SPOT
            CANCELLATION REQUEST, TRAVEL PACKAGE ALTERATION REQUEST
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                required:
                  - package
                  - leg
                  - asset
                description: >-
                  this can be used to assign an asset (/seat) to a leg, by using
                  the field `asset`. If you want to replace an asset, fill the
                  field `replacesAsset` with the asset to replace and `asset`
                  with the new one. If you want to remove an assigned asset from
                  a leg, fill `asset` with 'null' and fill `replacesAsset` with
                  the asset to remove.
                properties:
                  package:
                    $ref: '#/components/schemas/packageReference'
                  leg:
                    $ref: '#/components/schemas/legReference'
                  asset:
                    $ref: '#/components/schemas/assetReference'
                  replacesAsset:
                    $ref: '#/components/schemas/assetReference'
    assignAncillaryRequest:
      x-semantics:
        - transmodel: TRAVEL PACKAGE ALTERATION REQUEST
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                required:
                  - package
                  - leg
                description: >-
                  this can be used to assign an ancillary to a leg, by using the
                  field `ancillary`. If you want to replace an ancillary, fill
                  the field `replacesAncillary` with the ancillary to replace
                  and `ancillary` with the new one. If you want to remove an
                  assigned ancillary from a leg, fill `ancillary` with 'null'
                  and fill `replacesAncillary` with the ancillary to remove.
                properties:
                  package:
                    $ref: '#/components/schemas/packageReference'
                  leg:
                    $ref: '#/components/schemas/legReference'
                  ancillary:
                    $ref: '#/components/schemas/ancillaryReference'
                  replacesAncillary:
                    $ref: '#/components/schemas/ancillaryReference'
    removeOfferRequest:
      x-semantics:
        - transmodel: >-
            TRAVEL PACKAGE ALTERATION REQUEST, TRAVEL PACKAGE SPOT CANCELLATION
            REQUEST
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                properties:
                  package:
                    description: reference to the package to remove the offer of
                    $ref: '#/components/schemas/packageReference'
                  offer:
                    description: >-
                      reference to the offer to remove from the specified
                      package
                    $ref: '#/components/schemas/offerReference'
    purchaseOfferRequest:
      x-semantics:
        - transmodel: TRAVEL PACKAGE PURCHASE REQUEST (?)
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                required:
                  - offer
                properties:
                  customer:
                    $ref: '#/components/schemas/customer'
                  offer:
                    $ref: '#/components/schemas/packageReference'
                  paymentMethod:
                    $ref: '#/components/schemas/typeOfPaymentMethod'
                  distribution:
                    $ref: '#/components/schemas/distribution'
                  travellers:
                    type: array
                    items:
                      $ref: '#/components/schemas/traveller'
              subscriber:
                type: object
                required:
                  - successUrl
                properties:
                  successUri:
                    type: string
                    format: uri
                  inProgressUri:
                    type: string
                    format: uri
                  failedUri:
                    type: string
                    format: uri
    purchaseProductRequest:
      x-semantics:
        - transmodel: TRAVEL PACKAGE PURCHASE REQUEST (?)
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                required:
                  - products
                properties:
                  customer:
                    $ref: '#/components/schemas/customer'
                  location:
                    $ref: '#/components/schemas/placeReference'
                  products:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/productReference'
                  distribution:
                    $ref: '#/components/schemas/distribution'
                  traveller:
                    type: array
                    items:
                      $ref: '#/components/schemas/traveller'
              subscriber:
                type: object
                required:
                  - successUrl
                properties:
                  successUri:
                    type: string
                    format: uri
                  inProgressUri:
                    type: string
                    format: uri
                  failedUri:
                    type: string
                    format: uri
    useAssetRequest:
      x-semantics:
        - transmodel: none
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                required:
                  - assets
                properties:
                  customer:
                    $ref: '#/components/schemas/customer'
                  assets:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/assetReference'
                  distribution:
                    $ref: '#/components/schemas/distribution'
                  paymentMethod:
                    $ref: '#/components/schemas/typeOfPaymentMethod'
                  travellers:
                    type: array
                    items:
                      $ref: '#/components/schemas/traveller'
              subscriber:
                type: object
                required:
                  - successUrl
                properties:
                  successUri:
                    type: string
                    format: uri
                  inProgressUri:
                    type: string
                    format: uri
                  failedUri:
                    type: string
                    format: uri
    extendExpiryTimeRequest:
      x-semantics:
        - transmodel: none
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                properties:
                  package:
                    $ref: '#/components/schemas/packageReference'
                  reason:
                    type: string
                    description: >-
                      in case operation is EXTEND_EXPIRY_TIME, the reason for
                      extension must be supplied here.<br> _PURCHASE_PENDING_ -
                      The internal purchase process on the MP side is not yet
                      finished<br> _PAYMENT_PENDING_ - The customer is in the
                      payment process<br> _OTHER_ - unspecified
                    enum:
                      - PURCHASE_PENDING
                      - PAYMENT_PENDING
                      - OTHER
                  origin:
                    type: string
                    description: >-
                      This operation can be done on behalf of another party. The
                      MP can act on behalf of the END_USER (cancel this booking
                      for me); to override the default origin. In case this
                      field is missing, it must be assumed that the events the
                      MP is sending, this field should contain "MP". And in case
                      the TO is sending, "TO".
                    enum:
                      - TO
                      - MP
                      - END_USER
                      - OTHER
              subscriber:
                type: object
                required:
                  - successUrl
                properties:
                  successUri:
                    type: string
                    format: uri
                  inProgressUri:
                    type: string
                    format: uri
                  failedUri:
                    type: string
                    format: uri
    legRequest:
      x-semantics:
        - transmodel: none
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                required:
                  - leg
                properties:
                  timestamp:
                    $ref: '#/components/schemas/dateTime'
                  package:
                    $ref: '#/components/schemas/packageReference'
                  leg:
                    $ref: '#/components/schemas/legReference'
                  assetLocation:
                    $ref: '#/components/schemas/placeReference'
                  userLocation:
                    description: >-
                      This field might lead to GDPR issues. Be aware, use it
                      with caution.
                    $ref: '#/components/schemas/placeReference'
                  currentCharge:
                    type: integer
                    minimum: 0
                    maximum: 100
                    description: percentage of charge available
                  time:
                    description: time to extend or postpone
                    $ref: '#/components/schemas/duration'
                  comment:
                    type: string
                    description: free text, should match Content-Language
                  evidence:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/link'
                  class:
                    $ref: '#/components/schemas/classOfUse'
    assetRequest:
      x-semantics:
        - transmodel: none
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                required:
                  - asset
                properties:
                  timestamp:
                    $ref: '#/components/schemas/dateTime'
                  package:
                    $ref: '#/components/schemas/packageReference'
                  leg:
                    $ref: '#/components/schemas/legReference'
                  asset:
                    $ref: '#/components/schemas/assetReference'
                  location:
                    $ref: '#/components/schemas/placeReference'
              subscriber:
                type: object
                required:
                  - successUrl
                properties:
                  successUri:
                    type: string
                    format: uri
                  inProgressUri:
                    type: string
                    format: uri
                  failedUri:
                    type: string
                    format: uri
    productRequest:
      x-semantics:
        - transmodel: none
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                required:
                  - package
                  - product
                properties:
                  timestamp:
                    $ref: '#/components/schemas/dateTime'
                  location:
                    $ref: '#/components/schemas/placeReference'
                  package:
                    $ref: '#/components/schemas/packageReference'
                  product:
                    $ref: '#/components/schemas/productReference'
    supportRequest:
      x-semantics:
        - transmodel: none
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                $ref: '#/components/schemas/supportTicket'
    redressOptionRequest:
      x-semantics:
        - transmodel: none
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                required:
                  - package
                  - guarantee
                  - option
                properties:
                  package:
                    $ref: '#/components/schemas/packageReference'
                  offer:
                    $ref: '#/components/schemas/offerReference'
                  guarantee:
                    $ref: '#/components/schemas/uuid'
                  option:
                    $ref: '#/components/schemas/uuid'
    refundDepositRequest:
      x-semantics:
        - transmodel: none
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                properties:
                  package:
                    $ref: '#/components/schemas/packageReference'
                  leg:
                    $ref: '#/components/schemas/legReference'
    confirmPaymentRequest:
      x-semantics:
        - transmodel: none
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                required:
                  - paymentId
                properties:
                  paymentId:
                    $ref: '#/components/schemas/uuid'
    packageRequest:
      x-semantics:
        transmodel: TRAVEL PACKAGE REQUEST
      content:
        application/json:
          schema:
            type: object
            required:
              - inputs
            properties:
              inputs:
                type: object
                properties:
                  package:
                    $ref: '#/components/schemas/packageReference'
              subscriber:
                type: object
                required:
                  - successUrl
                properties:
                  successUri:
                    type: string
                    format: uri
                  inProgressUri:
                    type: string
                    format: uri
                  failedUri:
                    type: string
                    format: uri
  headers:
    contentLanguage:
      description: >-
        The language/localization of user-facing content, One IETF BCP 47 (RFC
        5646) language tag (nl-NL)
      schema:
        type: string
        pattern: ^[a-zA-Z]+-[a-zA-Z]+$
      required: true
    expires:
      description: the offer expires at this timestamp
      schema:
        $ref: '#/components/schemas/httpDate'
      required: false
    version:
      description: the version used to format the response
      x-context:
        - '@id': http://schema.org/version
          '@type': xsd:string
      schema:
        type: string
      required: true
    digest:
      description: the hash of the body, SHA-256 ("SHA-256=3q2+7w==:")
      schema:
        type: string
      required: false
    publicKey:
      description: >-
        the public key of the sending party, can be used to validate the signed
        digest (it should deliver the digest)
      x-example: >-
        {"certificate": "-----BEGIN
        CERTIFICATE-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAnZ5...\n-----END
        CERTIFICATE-----"}
      schema:
        type: string
      required: false
    signedDigest:
      description: >-
        the signed hash of the offer (or package), using the private key,
        SHA-256 base64 encoded
      schema:
        type: string
      required: false
    rollbackExpires:
      description: >-
        until this timestamp the rollback of the purchase is allowed to perform
        without financial consequences
      schema:
        $ref: '#/components/schemas/httpDate'
      required: false
  securitySchemes:
    OpenData:
      type: http
      description: >-
        this data set is open. If it is one of the options, it is up to the
        implementing party whether it is open or not.
      scheme: none
    BearerAuth:
      type: http
      description: >-
        This authentication is the basic one. If you have obtained a JWT
        (somewhere), you can use this token to identify you at endpoints.
      scheme: bearer
      bearerFormat: JWT
    BasicAuth:
      type: http
      scheme: basic
    OAuth:
      type: oauth2
      description: >-
        This flow facilitates to get access tokens based on username/password.
        These can be obtained by the owner of the service, look at the landing
        page to find out how to contact it.
      flows:
        authorizationCode:
          authorizationUrl: /
          tokenUrl: /oauth/token
          scopes:
            processes: Access to /processes/
    OAuthPKI:
      type: oauth2
      description: >-
        OAuth 2.0 with PKI and mutual TLS for client authentication The client
        sends its X.509 during the handshake. The server validates and accepts
        the certificate. The call to the /oauth/token can use the provided
        credentials (O or CN) to provide a access_token (JWT).
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            processes: Access to /processes/
servers:
  - url: https://example.to.eu/tomp/v2
    description: example url
  - url: https://example.to.eu/tomp/v2
    description: example url
security:
  - BearerAuth: []
