    dataSourceResponse:
      description: >-
        a list of datasources, the 'rel' contains the prefix to use in data (to
        create a URN), like 'gps:' for coordinates ('gps' is always allowed).
        when referring to an external datasource, the 'href' should be used to
        retrieve the related data.
      headers:
        Version:
          $ref: '#/components/headers/version'
        Content-Language:
          $ref: '#/components/headers/contentLanguage'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/link'
          example:
            - rel: donkey:station
              href: >-
                https://stables.donkey.bike/api/public/gbfs/2/donkey_am/nl/station_information.json
              description: >-
                A datasource that contains all Donkey bike stations in
                Amsterdam, Netherlands.  It allows you to refer to a station by
                its ID, like 'donkey:station:1234'.
            - rel: ARR:ScheduledStopPoint
              href: >-
                https://data.ndovloket.nl/netex/arr/NeTEx_ARR_NL_20250626_20250627_1402.xml.gz
              description: >-
                A datasource that contains all scheduled stop points in the
                Netherlands used by Arriva,  it allows you to refer to a stop
                point by its ID, like 'ARR:ScheduledStopPoint:1234'.
  schemas:
    landingPage:
      type: object
      description: >-
        a complete endpoint description, containing all endpoints, their status,
        but also the served scenarios and implemented process flows. The
        identifiers for the process flows can be found at
        https://github.com/TOMP-WG/TOMP-API/wiki/ProcessIdentifiers<br>
      additionalProperties: false
      required:
        - title
        - description
        - links
      properties:
        title:
          type: string
        description:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
        processIdentifiers:
          type: array
          description: >-
            an array with 'care labels', indiacting how this implementation
            wants to be treated.
          maxItems: 10
          items:
            $ref: '#/components/schemas/processIdentifier'
    processIdentifier:
      type: object
      required:
        - module
        - identifiers
      properties:
        module:
          type: string
          enum:
            - offers
            - pre-sales
            - purchase
            - execute
            - support
            - after-sales
        identifiers:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/shortString'
    conformance:
      type: object
      required:
        - conformsTo
      properties:
        conformsTo:
          type: array
          items:
            type: string
    collection:
      type: object
      required:
        - id
        - links
      properties:
        id:
          description: identifier of the collection used, for example, in URIs
          type: string
        title:
          description: human readable title of the collection
          type: string
        description:
          description: a description of the features in the collection
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
        extent:
          $ref: '#/components/schemas/extent'
        crs:
          description: the list of coordinate reference systems supported by the service
          type: array
          items:
            type: string
          default:
            - http://www.opengis.net/def/crs/OGC/1.3/CRS84
    extent:
      type: object
      description: >-
        The extent of the features in the collection. In the Core only spatial
        and temporal

        extents are specified. Extensions may add additional members to
        represent other

        extents, for example, thermal or pressure ranges.
      properties:
        spatial:
          description: The spatial extent of the features in the collection.
          type: object
          properties:
            bbox:
              description: >-
                One or more bounding boxes that describe the spatial extent of
                the dataset.

                In the Core only a single bounding box is supported. Extensions
                may support

                additional areas. If multiple areas are provided, the union of
                the bounding

                boxes describes the spatial extent.
              type: array
              minItems: 1
              items:
                description: >-
                  Each bounding box is provided as four or six numbers,
                  depending on

                  whether the coordinate reference system includes a vertical
                  axis

                  (height or depth):


                  * Lower left corner, coordinate axis 1

                  * Lower left corner, coordinate axis 2

                  * Minimum value, coordinate axis 3 (optional)

                  * Upper right corner, coordinate axis 1

                  * Upper right corner, coordinate axis 2

                  * Maximum value, coordinate axis 3 (optional)


                  The coordinate reference system of the values is WGS 84
                  longitude/latitude

                  (http://www.opengis.net/def/crs/OGC/1.3/CRS84) unless a
                  different coordinate

                  reference system is specified in `crs`.


                  For WGS 84 longitude/latitude the values are in most cases the
                  sequence of

                  minimum longitude, minimum latitude, maximum longitude and
                  maximum latitude.

                  However, in cases where the box spans the antimeridian the
                  first value

                  (west-most box edge) is larger than the third value (east-most
                  box edge).


                  If the vertical axis is included, the third and the sixth
                  number are

                  the bottom and the top of the 3-dimensional bounding box.


                  If a feature has multiple spatial geometry properties, it is
                  the decision of the

                  server whether only a single spatial geometry property is used
                  to determine

                  the extent or all relevant geometries.
                type: array
                oneOf:
                  - minItems: 4
                    maxItems: 4
                  - minItems: 6
                    maxItems: 6
                items:
                  type: number
            crs:
              description: >-
                Coordinate reference system of the coordinates in the spatial
                extent

                (property `bbox`). The default reference system is WGS 84
                longitude/latitude.

                In the Core this is the only supported coordinate reference
                system.

                Extensions may support additional coordinate reference systems
                and add

                additional enum values.
              type: string
              enum:
                - http://www.opengis.net/def/crs/OGC/1.3/CRS84
              default: http://www.opengis.net/def/crs/OGC/1.3/CRS84
        temporal:
          description: The temporal extent of the features in the collection.
          type: object
          properties:
            interval:
              description: >-
                One or more time intervals that describe the temporal extent of
                the dataset.

                The value `null` is supported and indicates an unbounded
                interval end.

                In the Core only a single time interval is supported. Extensions
                may support

                multiple intervals. If multiple intervals are provided, the
                union of the

                intervals describes the temporal extent.
              type: array
              minItems: 1
              items:
                description: >-
                  Begin and end times of the time interval. The timestamps are
                  in the

                  temporal coordinate reference system specified in `trs`. By
                  default

                  this is the Gregorian calendar.
                type: array
                minItems: 2
                maxItems: 2
                items:
                  $ref: '#/components/schemas/dateTime'
            trs:
              description: >-
                Coordinate reference system of the coordinates in the temporal
                extent

                (property `interval`). The default reference system is the
                Gregorian calendar.

                In the Core this is the only supported temporal coordinate
                reference system.

                Extensions may support additional temporal coordinate reference
                systems and add

                additional enum values.
              type: string
              enum:
                - http://www.opengis.net/def/uom/ISO-8601/0/Gregorian
              default: http://www.opengis.net/def/uom/ISO-8601/0/Gregorian
    collections:
      type: object
      required:
        - links
        - collections
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
        collections:
          type: array
          items:
            $ref: '#/components/schemas/collection'
    processList:
      required:
        - links
        - processes
      type: object
      properties:
        processes:
          type: array
          items:
            $ref: '#/components/schemas/processSummary'
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
    process:
      allOf:
        - $ref: '#/components/schemas/processSummary'
        - type: object
          properties:
            inputs:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/inputDescription'
            outputs:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/outputDescription'
            subscriber:
              type: object
              properties:
                successUri:
                  $ref: '#/components/schemas/url'
                inProgressUri:
                  $ref: '#/components/schemas/url'
                failedUri:
                  $ref: '#/components/schemas/url'
    inputDescription:
      allOf:
        - $ref: '#/components/schemas/descriptionType'
        - required:
            - schema
          type: object
          properties:
            minOccurs:
              type: integer
              default: 1
            maxOccurs:
              oneOf:
                - type: integer
                  default: 1
                - type: string
                  enum:
                    - unbounded
            schema:
              type: object
    processSummary:
      allOf:
        - $ref: '#/components/schemas/descriptionType'
        - required:
            - id
            - version
          type: object
          properties:
            id:
              type: string
            version:
              type: string
            jobControlOptions:
              type: array
              items:
                $ref: '#/components/schemas/jobControlOptions'
            outputTransmission:
              type: array
              items:
                $ref: '#/components/schemas/transmissionMode'
            links:
              type: array
              items:
                $ref: '#/components/schemas/link'
    outputDescription:
      allOf:
        - $ref: '#/components/schemas/descriptionType'
        - required:
            - schema
          type: object
          properties:
            schema:
              type: object
    jobControlOptions:
      type: string
      enum:
        - sync-execute
        - async-execute
        - dismiss
    transmissionMode:
      type: string
      default: value
      enum:
        - value
        - reference
    descriptionType:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        keywords:
          type: array
          items:
            type: string
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/metadata'
        additionalParameters:
          allOf:
            - $ref: '#/components/schemas/metadata'
            - type: object
              properties:
                parameters:
                  type: array
                  items:
                    $ref: '#/components/schemas/additionalParameter'
    metadata:
      type: object
      properties:
        title:
          type: string
        role:
          type: string
        href:
          type: string
    additionalParameter:
      required:
        - name
        - value
      type: object
      properties:
        name:
          type: string
        value:
          type: array
          items:
            oneOf:
              - type: string
              - type: number
              - type: integer
              - type: array
                items:
                  type: object
              - type: object
    searchOfferRequest:
      type: object
      x-semantics:
        - transmodel: TRIP REQUEST
      required:
        - type
        - specification
      description: A package planning request, resulting in offers
      properties:
        type:
          type: string
          pattern: ^(searchOffer)$
        specification:
          oneOf:
            - $ref: '#/components/schemas/travelSpecification'
            - $ref: '#/components/schemas/tripPattern'
          discriminator:
            propertyName: type
            mapping:
              travel_specification: '#/components/schemas/travelSpecification'
              trip_pattern: '#/components/schemas/tripPattern'
        requirements:
          $ref: '#/components/schemas/travellerRequirements'
        travellers:
          type: array
          items:
            $ref: '#/components/schemas/traveller'
        places:
          description: >-
            Places that are not specified in an external data source (like a
            home address)
          type: array
          minItems: 0
          maxItems: 5
          items:
            $ref: '#/components/schemas/place'
        packageToExchange:
          $ref: '#/components/schemas/packageReference'
        customFields:
          $ref: '#/components/schemas/customProperties'
    tripPattern:
      x-semantics:
        - transmodel: TRIP PATTERN
      allOf:
        - $ref: '#/components/schemas/travelSpecification'
        - type: object
          properties:
            type:
              type: string
              pattern: ^(tripPattern)$
            serviceJourneys:
              type: array
              items:
                $ref: '#/components/schemas/serviceJourneyReference'
            travelDate:
              $ref: '#/components/schemas/date'
    offerCollection:
      allOf:
        - $ref: '#/components/schemas/geojson'
        - type: object
          description: a list of offers.
          x-semantics:
            - transmodel: TRIP DELIVERY
          properties:
            features:
              type: array
              items:
                $ref: '#/components/schemas/offerFeature'
            properties:
              $ref: '#/components/schemas/offerCollectionProperties'
    offerFeature:
      allOf:
        - $ref: '#/components/schemas/geojsonFeature'
        - type: object
          description: a single offer, the 'package' in a single feature
          required:
            - type
          properties:
            type:
              type: string
              pattern: ^(offer)$
            properties:
              $ref: '#/components/schemas/summary'
    offerCollectionProperties:
      allOf:
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              pattern: ^(OfferCollection)$
        - $ref: '#/components/schemas/geojsonCollectionProperties'
    assetCollection:
      description: a list of available assets.
      x-semantics:
        - transmodel: VEHICLEs, SPOTs, PARKING BAYs, RECHARGING STATIONs
      type: object
      properties:
        type:
          type: string
          pattern: ^(FeatureCollection)$
        features:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/geojsonFeature'
              - type: object
                properties:
                  properties:
                    $ref: '#/components/schemas/asset'
        properties:
          type: object
          additionalProperties: true
          properties:
            type:
              type: string
              pattern: ^(assetCollection)$
        numberMatched:
          type: number
        numberReturned:
          type: number
        links:
          type: array
          description: >-
            actions that can be performed on this package, but also alternative
            (rel=alternative+1, alternative+2) offers or references to other
            resources In case it is an alternative, specify clearly in the
            description what the financial consequences are.
          items:
            $ref: '#/components/schemas/link'
    ancillaryCollection:
      description: a list of available ancillaries.
      x-semantics:
        - transmodel: ANCILLARY PRODUCTs
      type: object
      properties:
        type:
          type: string
          pattern: ^(FeatureCollection)$
        features:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/geojsonFeature'
              - type: object
                properties:
                  properties:
                    $ref: '#/components/schemas/ancillary'
        properties:
          type: object
          required:
            - type
          additionalProperties: true
          properties:
            type:
              type: string
              pattern: ^(ancillaryCollection)$
        numberMatched:
          type: number
        numberReturned:
          type: number
        links:
          type: array
          description: >-
            actions that can be performed on this package, but also alternative
            (rel=alternative+1, alternative+2) offers or references to other
            resources In case it is an alternative, specify clearly in the
            description what the financial consequences are.
          items:
            $ref: '#/components/schemas/link'
    travelDocuments:
      x-semantics:
        - transmodel: TRAVEL DOCUMENTs
      type: object
      required:
        - type
      properties:
        type:
          type: string
          pattern: ^(FeatureCollection)$
        features:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                pattern: ^(Feature)$
              id:
                $ref: '#/components/schemas/uuid'
              properties:
                $ref: '#/components/schemas/travelDocument'
              links:
                type: array
                items:
                  $ref: '#/components/schemas/link'
    binaryTicket:
      x-semantics:
        - transmodel: none
      description: Binary information, like a image or certificate
      type: object
      required:
        - contentType
        - base64
      properties:
        contentType:
          description: the media type (IANA)
