    fareStructure:
      x-semantics:
        Transmodel:
          concepts:
          - FARE STRUCTURE ELEMENT (FS Fare Structure Element MODEL)
          definition: A sequence or set of CONTROLLABLE ELEMENTs to which rules for limitation of access rights and calculation of prices (fare structure) are applied.
          conditions:
          - 'Partial match: structure defining fare composition; FARE STRUCTURE ELEMENT contains access-right limitation and pricing rules'
        GBFS:
          concepts:
          - system_pricing_plans
          definition: Pricing plans offered by the system, each with a base price, per-km rate, per-minute rate, currency, and surge pricing indicator.
          conditions:
          - 'Partial match: TOMP fareStructure elements (base fee + per-minute/km intervals) correspond to GBFS system_pricing_plans pricing components.'
        GTFS:
          concepts:
          - fare_products.amount
          - fare_products.currency
          definition: The cost and ISO 4217 currency of a purchasable fare product, as defined in fare_products.txt.
          conditions:
          - 'Partial match: fareStructure amount and currency align with GTFS fare_products.amount and currency.'
      allOf:
      - $ref: '#/components/schemas/amountOfMoney'
      - type: object
        description: >-
          the total fare is the sum of all parts, except for the 'MAX'
          fareStructureElement. This one descripes the maximum price for the
          complete leg.
        required:
        - elements
        properties:
          id:
            $ref: '#/components/schemas/normalString'
            description: >-
              Identifier of a fare structure. Can be an external reference,
              but also a (internal) ID
          estimated:
            type: boolean
            description: is this fare an estimation?
          description:
            $ref: '#/components/schemas/normalString'
            description: >-
              user friendly description of the fare (e.g. 'full fare'), should
              match Content-Language
          userProfiles:
            type: array
            description: references to applicable user profiles
            items:
              $ref: '#/components/schemas/userProfileReference'
          temporalValidity:
            $ref: '#/components/schemas/dateTimeRange'
          yieldPriceUrl:
            $ref: '#/components/schemas/link'
            description: >-
              link to a retrieve the price dynamically, when for instance the
              price depends on real-time factors
            example:
              rel: price
              https://local-bike/api/price?fare=dynamic:
              type: application/json
          elements:
            type: array
            maxItems: 25
            items:
              $ref: '#/components/schemas/fareStructureElement'
    fareStructureElement:
      x-semantics:
        Transmodel:
          concepts:
          - FARE STRUCTURE ELEMENT (FS Fare Structure Element MODEL)
          definition: A sequence or set of CONTROLLABLE ELEMENTs to which rules for limitation of access rights and calculation of prices (fare structure) are applied.
          conditions:
          - 'Exact match: FARE STRUCTURE ELEMENT is a sequence/set of CONTROLLABLE ELEMENTs to which fare calculation rules are applied'
      description: >-
        this describes a part of the fare (or discount). It contains a for
        instance the startup costs (fixed) or the flex part (e.g. 1.25 EUR per
        2.0 MILES). The amount is tax included. In case of discounts, the values
        are negative. With 'MAX' you can specify e.g. a maximum of 15 euro per
        day. Percentage is mainly added for discounts. The `scale` properties
        create the ability to communicate scales (e.g. the first 4 kilometers
        you've to pay EUR 0.35 per kilometer, the kilometers 4 until 8 EUR 0.50
        and above it EUR 0.80 per kilometer).
      allOf:
      - $ref: '#/components/schemas/amountOfMoney'
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            description: >-
              type of fare structure element. If there is only one fare
              structure elements and this field is missing, it should be
              assumed it is 'FIXED'. In all other situations this field is
              mandatory.<br> _FIXED_ fixed element, independend on the
              duration or distance traveled. _FLEX_ flex element, dependend on
              the duration or distance of the package. Can be tiered. _MAX_
              capping mechanism. Calculate the price using the sum of the
              FIXED and FLEX elements, cap it using this rule. Max 1 per fare
              structure.
            enum:
            - FIXED
            - FLEX
            - MAX
          priceCondition:
            type: string
            description: >-
              is this the default price or is this an additional part
              (discount, price surge). <br> _DEFAULT_ the default price for
              this price part<br> _DISCOUNT_ the amount must always be
              negative <br> _SURGE_ the amount must always be positive <br>
              This also means, that when you're working with discounts or
              surges, you have to deliver 2 fare structure elements, one for
              the default price and one for the discount/surge. This can be
              used in combination with as well the fixed price parts as with
              the flex price parts.
            enum:
            - DEFAULT
            - DISCOUNT
            - SURGE
          units:
            type: string
            description: >-
              in case of 'FLEX' mandatory, otherwise not allowed. E.g. 0.5 EUR
              per HOUR
            enum:
            - KM
            - SECOND
            - MINUTE
            - HOUR
            - MILE
            - PERCENTAGE
            - ZONE
          amountOfUnits:
            $ref: '#/components/schemas/float'
            description: >-
              the number of km, seconds etc. Mandatory when the type is
              'FLEX', otherwise not allowed. In case of 0.5 EUR per 15
              MINUTES, the amount is 0.5, the `amountOfUnits` must contain 15
              and `units` MINUTES.
          scale:
            description: >-
              in case scales apply, this field can be used. E.g. when the 0.5
              EUR/15 minutes only applies on the first hour, the scale should
              contain 0..60 minutes
            $ref: '#/components/schemas/interval'
          priceInterval:
            description: >-
              The price range (min/max price), in the same currency as amount.
              Place in `amount` the most likely value.
            $ref: '#/components/schemas/interval'
          name:
            $ref: '#/components/schemas/normalString'
            description: an optional description of this fare structure element.
          appliesTo:
            type: string
            description: >-
              class of this fare structure element. Could be FARE or
              ANCILLARY<br> _FARE_ this fare structure element is related to
              the distance or time of usage.<br> _ANCILLARY_ this fare
              structure element is related to the rental of one or more
              ancillaries.
            default: FARE
            enum:
            - FARE
            - ANCILLARY
          assetCondition:
            type: string
            description: >-
              in case the fare is dependent on being in use or being paused,
              this field must be used. Default IN_USE
            enum:
            - IN_USE
            - PAUSED
            default: IN_USE
          customFields:
            $ref: '#/components/schemas/customProperties'
    interval:
      x-semantics:
        Transmodel:
          concepts:
          - GEOGRAPHICAL INTERVAL (FS Geographical Fare Structure MODEL)
          definition: 'A geographical interval specifying access rights for the FARE STRUCTURE ELEMENTs within the range of this interval: 0-5 km, 4-6 zones etc.'
          conditions:
          - 'Partial match: numeric interval with from/to/units; GEOGRAPHICAL INTERVAL defines zone fare ranges'
      type: object
      required:
