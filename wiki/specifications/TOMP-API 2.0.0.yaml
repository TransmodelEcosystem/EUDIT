  /processes/cancel-package/execution:
    post:
      operationId: cancelPackageOperation
      summary: Cancel a package in confirmed state for (technical issues).
      description: >-
        Cancel this package. This endpoint is only there to correct (technical)
        issues.<br> Normally, after purchase, you have to request redress
        options, claim it and confirm the claim.<br> <br> Before purchase you
        release a package.<br> During the purchase you rollback a package.<br>
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      tags:
      - after sales
      x-semantics:
        Transmodel:
          concepts:
          - "TRAVEL PACKAGE CANCELLATION REQUEST (Fare Management)"
          conditions:
          - "Exact match: cancellation of an already confirmed package (technical correction)"
      requestBody:
        $ref: '#/components/requestBodies/packageRequest'
      responses:
