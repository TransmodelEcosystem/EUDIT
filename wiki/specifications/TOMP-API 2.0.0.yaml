        it matches already with 'GPS' (no entry required in the datasources). In
        case of a custom place (like home address), you can use the 'P:' prefix
        and add the address to the **places** list of the request/offer/package.
      maxLength: 200
      x-example-format: ^(GPS:|GBFS:stations:)
      pattern: ^(GPS|gps|{datasource-prefix}|P):[a-zA-Z0-9\-_.]+$
    customerReference:
