openapi: 3.0.3
info:
  title: EUDIT Unified Mobility API – Support
  description: >
    Processes and collections for customer support, incident reporting, and
    operator notifications.

    This module covers the full lifecycle of support interactions: a traveller
    or operator reports an issue, support tickets are created and tracked, and
    notifications are pushed back to subscribed clients.

    Processes:
    - `request-support` — open a support ticket for any issue (damage, breakdown,
      unable to open/close, accident, question, etc.)
    - `report-damage` — specialised shorthand for REPORT_DAMAGE support type
    - `report-incident` — specialised shorthand for ACCIDENT / safety incident
    - `register-evidence` — attach photos or documents to an existing support ticket
    - `send-warning` — send a safety or operational warning to subscribed clients
      (operator-to-traveller push notification)

    Collections:
    - `support-tickets` — open and closed support tickets for a PACKAGE or LEG
    - `notifications` — push notifications and warnings sent to the traveller

    Transmodel references: CUSTOMER SERVICE, COMPLAINT, NOTICE.
    TOMP-API equivalents: POST /processes/request-support/execution,
    GET /collections/support-tickets/items.
  version: 0.1.0

servers:
  - url: https://api.eudit.example.com/v1

tags:
  - name: Support
    description: Customer support, incident reporting, and notifications

security:
  - BearerAuth: []
  - OAuth: [write]

components:

  securitySchemes:
    BearerAuth:
      $ref: './components.yaml#/components/securitySchemes/BearerAuth'
    OAuth:
      $ref: './components.yaml#/components/securitySchemes/OAuth'
    OAuthPKI:
      $ref: './components.yaml#/components/securitySchemes/OAuthPKI'
    OpenData:
      $ref: './components.yaml#/components/securitySchemes/OpenData'

  schemas:

    supportType:
      $ref: './components.yaml#/components/schemas/supportType'

    supportPriority:
      $ref: './components.yaml#/components/schemas/supportPriority'

    supportStatus:
      $ref: './components.yaml#/components/schemas/supportStatus'

    evidenceItem:
      $ref: './components.yaml#/components/schemas/evidenceItem'

    supportContext:
      $ref: './components.yaml#/components/schemas/supportContext'

    supportTicketInput:
      type: object
      description: >
        Input fields for opening a new support ticket.
        Transmodel: COMPLAINT submission.
        TOMP-API equivalent: supportTicket (subset used as request input).
      x-tm: COMPLAINT
      x-semantics:
        transmodel: COMPLAINT
        tomp: supportTicket
      required: [supportType, priority]
      properties:
        supportType:
          $ref: '#/components/schemas/supportType'
        priority:
          $ref: '#/components/schemas/supportPriority'
        context:
          $ref: '#/components/schemas/supportContext'
        location:
          $ref: './components.yaml#/components/schemas/geoJsonPoint'
          description: Location of the incident or issue.
        timestamp:
          $ref: './components.yaml#/components/schemas/dateTime'
          description: >
            Time of the incident. If omitted the server uses the current time.
        comment:
          $ref: './components.yaml#/components/schemas/longString'
          description: Free-text description of the issue from the reporter.
        contactInformation:
          $ref: './components.yaml#/components/schemas/normalString'
          description: >
            End-user contact information (phone or email) to be used by the
            support agent. Optional if already stored in the user profile.
        evidence:
          type: array
          description: Supporting evidence items (photos, videos, documents).
          items:
            $ref: '#/components/schemas/evidenceItem'

    supportTicket:
      $ref: './components.yaml#/components/schemas/supportTicket'

    supportTicketResult:
      type: object
      description: >
        Response returned after a support ticket is created or updated.
      required: [supportTicket]
      properties:
        supportTicket:
          $ref: '#/components/schemas/supportTicket'

    supportTicketCollection:
      type: object
      description: Paginated collection of support tickets.
      required: [numberMatched, numberReturned, supportTickets]
      properties:
        numberMatched:
          $ref: './components.yaml#/components/schemas/normalInt'
        numberReturned:
          $ref: './components.yaml#/components/schemas/normalInt'
        supportTickets:
          type: array
          items:
            $ref: '#/components/schemas/supportTicket'

    warningType:
      type: string
      description: >
        Classification of an operator-to-traveller warning or notification.
        Transmodel: NOTICE TYPE.
      x-tm: NOTICE
      enum:
        - SAFETY_ALERT
        - SERVICE_DISRUPTION
        - WEATHER_WARNING
        - OPERATIONAL_NOTICE
        - FRAUD_ALERT
        - OTHER

    warningSeverity:
      $ref: './components.yaml#/components/schemas/warningSeverity'

    warningInput:
      type: object
      description: >
        Input for sending a warning or operational notification to travellers.
        Transmodel: NOTICE / SITUATION.
        TOMP-API equivalent: send-warning (inferred; not in TOMP-API 2.0.0).
      x-tm: NOTICE
      x-semantics:
        transmodel: NOTICE
        siri: Situation
      required: [warningType, severity, message]
      properties:
        warningType:
          $ref: '#/components/schemas/warningType'
        severity:
          $ref: '#/components/schemas/warningSeverity'
        message:
          $ref: './components.yaml#/components/schemas/longString'
          description: Human-readable warning message (in the request language).
        affectedArea:
          $ref: './components.yaml#/components/schemas/geoJsonPoint'
          description: >
            Approximate location of the hazard or affected area. The server may
            broadcast this warning to all customers within a radius.
        affectedPackageIds:
          type: array
          description: >
            If the warning is targeted at specific PAKAGEs, list their IDs.
            If omitted, the warning is broadcast to all active packages in the
            affected zone.
          items:
            $ref: './components.yaml#/components/schemas/uuid'
        validFrom:
          $ref: './components.yaml#/components/schemas/dateTime'
        validUntil:
          $ref: './components.yaml#/components/schemas/dateTime'
        externalReference:
          $ref: './components.yaml#/components/schemas/normalString'
          description: >
            Reference to an external situation source (e.g. SIRI SX situation ID,
            NeTEx SITUATION element ID).

    warningResult:
      type: object
      description: Result of a send-warning operation.
      required: [warningId, recipientCount]
      properties:
        warningId:
          $ref: './components.yaml#/components/schemas/uuid'
          description: Server-assigned ID for this warning broadcast.
        recipientCount:
          type: integer
          description: Number of active customers/packages notified.
        validFrom:
          $ref: './components.yaml#/components/schemas/dateTime'
        validUntil:
          $ref: './components.yaml#/components/schemas/dateTime'

    notificationType:
      $ref: './components.yaml#/components/schemas/notificationType'

    notification:
      $ref: './components.yaml#/components/schemas/notification'

    notificationCollection:
      type: object
      description: Paginated collection of notifications for a traveller.
      required: [numberMatched, numberReturned, notifications]
      properties:
        numberMatched:
          $ref: './components.yaml#/components/schemas/normalInt'
        numberReturned:
          $ref: './components.yaml#/components/schemas/normalInt'
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/notification'

paths:

  # ─────────────────────────────────────────────────────────────────
  # Support Processes
  # ─────────────────────────────────────────────────────────────────

  /processes/request-support/execute:
    post:
      operationId: executeRequestSupport
      summary: Request Support
      description: >
        Opens a support ticket for any support type. The `supportType` field
        determines the category of the issue. This is the general-purpose
        endpoint; `report-damage` and `report-incident` are convenience wrappers
        that pre-set the type.

        The `priority` field indicates urgency:
        - `ERROR_CANNOT_CONTINUE` — traveller is stranded; requires immediate
          response.
        - `ERROR_CAN_CONTINUE` — issue affects the journey but travel can
          continue.
        - `DISTURBING_ISSUE` — quality issue (dirty vehicle, etc.).
        - `QUESTION` — informational query.

        Transmodel: COMPLAINT submission.
        TOMP-API equivalent: POST /processes/request-support/execution.
        OMSA equivalent: POST /processes/request-support/execute.
      tags: [Support]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  $ref: '#/components/schemas/supportTicketInput'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        '200':
          description: Support ticket created (synchronous).
          headers:
            Version:
              $ref: './components.yaml#/components/headers/Version'
            Content-Language:
              $ref: './components.yaml#/components/headers/Content-Language'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/supportTicketResult'
        '201':
          description: Job accepted for asynchronous processing.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Async callback — support ticket created
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/supportTicketResult'
              responses:
                '200':
                  description: Callback received.

  /processes/report-damage/execute:
    post:
      operationId: executeReportDamage
      summary: Report Damage
      description: >
        Convenience process for reporting vehicle or asset damage. Pre-sets
        `supportType: REPORT_DAMAGE`. Evidence photos should be attached via the
        `evidence` field.

        Transmodel: COMPLAINT of type DAMAGE.
        TOMP-API equivalent: POST /processes/request-support/execution with
        supportType: REPORT_DAMAGE.
        OMSA equivalent: POST /processes/report-damage/execute.
      tags: [Support]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  description: >
                    Same as `supportTicketInput` with `supportType` defaulted
                    to `REPORT_DAMAGE`.
                  required: [priority, context]
                  allOf:
                    - $ref: '#/components/schemas/supportTicketInput'
                  properties:
                    supportType:
                      type: string
                      enum: [REPORT_DAMAGE]
                      default: REPORT_DAMAGE
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        '200':
          description: Damage report filed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/supportTicketResult'
        '201':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Async callback — damage report filed
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/supportTicketResult'
              responses:
                '200':
                  description: Callback received.

  /processes/report-incident/execute:
    post:
      operationId: executeReportIncident
      summary: Report Incident
      description: >
        Convenience process for reporting a safety incident or accident.
        Pre-sets `supportType: ACCIDENT` and defaults `priority` to
        `ERROR_CANNOT_CONTINUE`. The process should trigger an immediate
        escalation workflow on the operator side.

        Transmodel: COMPLAINT of type INCIDENT/ACCIDENT.
        TOMP-API equivalent: POST /processes/request-support/execution with
        supportType: ACCIDENT.
        OMSA equivalent: POST /processes/report-incident/execute.
      tags: [Support]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  description: >
                    Same as `supportTicketInput` with `supportType` forced to
                    `ACCIDENT` and `priority` defaulted to
                    `ERROR_CANNOT_CONTINUE`.
                  allOf:
                    - $ref: '#/components/schemas/supportTicketInput'
                  properties:
                    supportType:
                      type: string
                      enum: [ACCIDENT]
                      default: ACCIDENT
                    priority:
                      type: string
                      enum: [ERROR_CANNOT_CONTINUE]
                      default: ERROR_CANNOT_CONTINUE
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        '200':
          description: Incident report filed and escalation triggered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/supportTicketResult'
        '201':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Async callback — incident report filed
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/supportTicketResult'
              responses:
                '200':
                  description: Callback received.

  /processes/register-evidence/execute:
    post:
      operationId: executeRegisterEvidence
      summary: Register Evidence
      description: >
        Attaches additional evidence items (photos, documents, videos) to an
        existing support ticket. This can be called multiple times to add more
        evidence as it becomes available (e.g. additional photos taken after the
        initial report).

        If `supportTicketId` is supplied, evidence is added to that ticket.
        If no ticket exists yet, a new ticket of type `EVIDENCE` is created.

        Transmodel: COMPLAINT ATTACHMENT.
        TOMP-API equivalent: POST /processes/request-support/execution with
        supportType: EVIDENCE.
        OMSA equivalent: POST /processes/register-evidence/execute.
      tags: [Support]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [evidence]
                  properties:
                    supportTicketId:
                      $ref: './components.yaml#/components/schemas/uuid'
                      description: >
                        Existing support ticket to attach evidence to. If omitted,
                        a new EVIDENCE-type ticket is created.
                    packageId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    legId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    evidence:
                      type: array
                      minItems: 1
                      items:
                        $ref: '#/components/schemas/evidenceItem'
                    comment:
                      $ref: './components.yaml#/components/schemas/longString'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        '200':
          description: Evidence registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/supportTicketResult'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /processes/send-warning/execute:
    post:
      operationId: executeSendWarning
      summary: Send Warning
      description: >
        Operator-side: broadcasts a safety or operational warning to travellers.
        The warning may be targeted at specific PAKAGEs or broadcast to all
        customers in a geographical area.

        Examples:
        - Severe weather alert affecting a ferry route
        - Road closure affecting an on-demand vehicle route
        - Safety recall affecting a specific e-scooter model
        - Service disruption on a rail line

        The server delivers the warning via all registered notification channels
        (push notification, SMS, in-app message). Notifications appear in the
        `notifications` collection.

        Transmodel: NOTICE / SITUATION.
        SIRI equivalent: SIRI SX (Situation Exchange).
        TOMP-API: no direct equivalent; this is an extension.
        OMSA equivalent: POST /processes/send-warning/execute (inferred).
      tags: [Support]
      security:
        - BearerAuth: []
        - OAuth: [write, admin]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  $ref: '#/components/schemas/warningInput'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        '200':
          description: Warning broadcast initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/warningResult'
        '201':
          description: Job accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/403Forbidden'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Async callback — warning sent
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/warningResult'
              responses:
                '200':
                  description: Callback received.

  # ─────────────────────────────────────────────────────────────────
  # Collections
  # ─────────────────────────────────────────────────────────────────

  /collections/support-tickets/items:
    get:
      operationId: getSupportTickets
      summary: Get Support Tickets
      description: >
        Returns support tickets associated with a PACKAGE or LEG.
        Supports filtering by support type, status, and date range.

        Transmodel: COMPLAINT list for TRANSPORT CUSTOMER.
        TOMP-API equivalent: GET /collections/support-tickets/items.
      tags: [Support]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - $ref: './components.yaml#/components/parameters/legId'
        - name: supportType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/supportType'
          description: Filter by support type.
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/supportStatus'
          description: Filter by ticket status.
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: List of support tickets.
          headers:
            Version:
              $ref: './components.yaml#/components/headers/Version'
            Content-Language:
              $ref: './components.yaml#/components/headers/Content-Language'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/supportTicketCollection'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'

  /collections/notifications/items:
    get:
      operationId: getNotifications
      summary: Get Notifications
      description: >
        Returns notifications and warnings delivered to the authenticated
        traveller. Results are sorted newest-first.

        Includes booking confirmations, leg updates, service disruption alerts,
        and operator warnings.

        Transmodel: NOTICE list for TRANSPORT CUSTOMER.
        OMSA equivalent: GET /collections/notifications/items.
      tags: [Support]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: If true, return only unread notifications.
        - name: notificationType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/notificationType'
          description: Filter by notification type.
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: List of notifications.
          headers:
            Version:
              $ref: './components.yaml#/components/headers/Version'
            Content-Language:
              $ref: './components.yaml#/components/headers/Content-Language'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notificationCollection'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
