openapi: 3.0.3
info:
  title: EUDIT Unified Mobility API – BoB-Specific
  description: >
    Processes and collections specific to the **BoB (Beskrivning och Biljett)**
    standard for interoperable mobile ticketing in Nordic public transport.

    BoB defines a binary ticket format (MTB — Machine-readable Ticket Binary),
    a key distribution mechanism (KDK — Key Distribution Key), a ticket
    lifecycle protocol (TICKLE — Ticket Lifecycle Events), and a trust hierarchy
    based on TLS client certificates mapped to JWT claims.

    This module exposes BoB operations as OGC API Processes / Collections,
    unified with the EUDIT PACKAGE model. The `bobAuthToken` (JWT with BoB
    claims `bobHok` and `bobAuthZ`) used in this module is obtained via the
    `01-auth.yaml` `obtain-token` process or the standard `/oauth/token` endpoint
    with `grant_type=urn:bob:mtls`.

    Processes:
    - `issue-ticket` — issue one or more MTB tickets from a manifest
    - `update-ticket` — update a ticket's token/device binding
    - `activate-ticket` — set a ticket's active status
    - `revoke-ticket` — revoke (invalidate) a ticket
    - `refund-ticket` — mark a ticket as refunded
    - `recover-ticket` — recover a ticket to a new device
    - `set-hindered` — record a passenger hindrance cause
    - `validate-ticket` — online ticket validation at a reader
    - `report-validation` — batch offline validation report
    - `fraud-check` — velocity-based fraud detection check
    - `add-to-blacklist` — add a token/ticket to the revocation blacklist
    - `add-to-whitelist` — add a token to the pre-authorization whitelist
    - `create-token-bundle` — bundle tickets for a device

    Collections:
    - `tickets` — issued BoB tickets with their MTB payloads and status
    - `token-bundles` — bundled ticket/MTB sets for device pre-loading
    - `ticket-events` — validation and inspection events for a ticket
    - `blacklist` — revoked token/ticket/traveller identifiers
    - `whitelist` — pre-authorized tokens with pre-loaded MTBs
    - `tickle-macros` — TICKLE macro sets (validity condition rules)

    Transmodel references: TRAVEL DOCUMENT, FARE PRODUCT, TRANSPORT CUSTOMER.
    BoB source specs: BoB Authentication.yaml, BoB Ticket.yaml,
    BoB Validation.yaml.
  version: 0.1.0

servers:
  - url: https://api.eudit.example.com/v1

tags:
  - name: BoB Tickets
    description: BoB ticket issuance, activation, and lifecycle management
  - name: BoB Validation
    description: BoB ticket validation, blacklist, whitelist, and fraud detection

security:
  - BearerAuth: []
  - OAuth: [write]

components:

  securitySchemes:
    BearerAuth:
      $ref: './components.yaml#/components/securitySchemes/BearerAuth'
    OAuth:
      $ref: './components.yaml#/components/securitySchemes/OAuth'
    OAuthPKI:
      $ref: './components.yaml#/components/securitySchemes/OAuthPKI'

  schemas:

    # ── BoB Auth Token ──────────────────────────────────────────────

    bobAuthToken:
      $ref: './components.yaml#/components/schemas/bobAuthToken'

    # ── Ticket Holder ───────────────────────────────────────────────

    ticketHolder:
      $ref: './components.yaml#/components/schemas/ticketHolder'

    # ── JWK Public Key ─────────────────────────────────────────────

    jwkPublicKey:
      type: object
      description: >
        A JSON Web Key (RFC 7517) representing a device's public key used for
        BoB Holder-of-Key (HoK) binding. The MTB is cryptographically bound to
        this key so it can only be used on the registered device.
        BoB: tokenPublicKey (JWK).
      x-semantics:
        bob: tokenPublicKey
      additionalProperties: true
      properties:
        kty:
          type: string
          description: Key type (e.g. `EC`, `RSA`, `OKP`).
        kid:
          type: string
          description: Key ID — used as the JWK thumbprint in whitelist entries.
        use:
          type: string
          description: Intended use (`sig` or `enc`).
        crv:
          type: string
          description: Curve name for EC keys (e.g. `P-256`).
        x:
          type: string
          description: Base64url-encoded x-coordinate (EC keys).
        y:
          type: string
          description: Base64url-encoded y-coordinate (EC keys).
        n:
          type: string
          description: Base64url-encoded modulus (RSA keys).
        e:
          type: string
          description: Base64url-encoded exponent (RSA keys).

    # ── Ticket Issue Request ────────────────────────────────────────

    issueTicketInputs:
      type: object
      description: >
        Inputs for issuing one or more BoB MTB tickets from a ticket manifest.
        The manifest is a base64url-encoded binary structure that specifies what
        journeys/products the tickets cover.
        BoB equivalent: manifestCall request body (POST /ticket).
        Transmodel: TRAVEL DOCUMENT issuance.
      x-tm: TRAVEL DOCUMENT
      x-semantics:
        transmodel: TRAVEL DOCUMENT
        bob: manifestCall
      required: [packageId, manifest]
      properties:
        packageId:
          $ref: './components.yaml#/components/schemas/uuid'
          description: EUDIT PACKAGE that these tickets belong to.
        manifest:
          type: string
          format: byte
          description: >
            Base64url-encoded BoB ticket manifest. The manifest specifies the
            product(s), validity period, passenger category, zones, and operator
            references for the tickets to be issued.
        ticketHolder:
          $ref: '#/components/schemas/ticketHolder'
        deviceId:
          $ref: './components.yaml#/components/schemas/normalString'
          description: >
            Identifier of the device that will store the ticket (used for
            device binding without a public key).
        tokenIssuer:
          $ref: './components.yaml#/components/schemas/url'
          description: >
            URL of the token issuer service. Tokens issued by this service are
            accepted during validation.
        tokenId:
          $ref: './components.yaml#/components/schemas/normalString'
          description: >
            Pre-assigned token identifier. If omitted, the server generates one.
        tokenPublicKey:
          $ref: '#/components/schemas/jwkPublicKey'
          description: >
            Public key of the device/holder for Holder-of-Key (HoK) binding.
            When present, the MTB is cryptographically bound to this key
            (the SHA-1 thumbprint appears as the `bobHok` JWT claim).
        deviceSignatureIssuer:
          $ref: './components.yaml#/components/schemas/url'
          description: >
            URL of the device-signature issuer. Used when the device signs its
            own token request.
        signatureLifetime:
          type: integer
          description: >
            Validity lifetime of the device signature in seconds.
        issueMtb:
          type: boolean
          default: true
          description: >
            Whether to issue the Machine-readable Ticket Binary (MTB) alongside
            the ticket record. Setting to `false` issues the ticket record only
            (for subsequent MTB generation by the operator).
        requestId:
          $ref: './components.yaml#/components/schemas/normalString'
          description: >
            Idempotency key. If the same `requestId` is submitted twice, the
            server returns the original ticket without re-issuing.
        startOfValidity:
          $ref: './components.yaml#/components/schemas/dateTime'
          description: >
            Override start of validity. If omitted, the manifest's validity
            period is used.
        recoverTicketId:
          $ref: './components.yaml#/components/schemas/normalString'
          description: >
            If this is a ticket recovery operation (re-issue to a new device),
            supply the original `ticketId` here. The original ticket is revoked
            and a new ticket with the same validity is issued.

    # ── Issued Ticket ──────────────────────────────────────────────

    bobTicket:
      $ref: './components.yaml#/components/schemas/bobTicket'

    issueTicketResult:
      type: object
      description: Result of a ticket issuance operation.
      required: [tickets]
      properties:
        tickets:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/bobTicket'

    bobTicketCollection:
      type: object
      description: Paginated collection of BoB tickets.
      required: [numberMatched, numberReturned, tickets]
      properties:
        numberMatched:
          $ref: './components.yaml#/components/schemas/normalInt'
        numberReturned:
          $ref: './components.yaml#/components/schemas/normalInt'
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/bobTicket'

    # ── Token Bundle ───────────────────────────────────────────────

    createTokenBundleInputs:
      type: object
      description: >
        Inputs for creating a BoB token bundle — a set of tickets pre-loaded
        onto a single device. Used for offline-capable validator devices and
        transport cards.
        BoB equivalent: POST /ticketbundle.
      required: [ticketIds, tokenId, tokenIssuer]
      properties:
        ticketIds:
          type: array
          minItems: 1
          items:
            $ref: './components.yaml#/components/schemas/normalString'
          description: IDs of the tickets to include in the bundle.
        tokenId:
          $ref: './components.yaml#/components/schemas/normalString'
        tokenIssuer:
          $ref: './components.yaml#/components/schemas/url'
        tokenPublicKey:
          $ref: '#/components/schemas/jwkPublicKey'
        deviceId:
          $ref: './components.yaml#/components/schemas/normalString'

    bobTokenBundle:
      $ref: './components.yaml#/components/schemas/bobTokenBundle'

    tokenBundleResult:
      type: object
      description: Result of a create-token-bundle operation.
      required: [tokenBundle]
      properties:
        tokenBundle:
          $ref: '#/components/schemas/bobTokenBundle'

    tokenBundleCollection:
      type: object
      description: Paginated collection of BoB token bundles.
      required: [numberMatched, numberReturned, tokenBundles]
      properties:
        numberMatched:
          $ref: './components.yaml#/components/schemas/normalInt'
        numberReturned:
          $ref: './components.yaml#/components/schemas/normalInt'
        tokenBundles:
          type: array
          items:
            $ref: '#/components/schemas/bobTokenBundle'

    # ── Ticket Event (Validation / Inspection) ─────────────────────

    bobTicketEvent:
      type: object
      description: >
        A validation or inspection event for a BoB ticket.
        BoB equivalent: ticketEvent schema (GET /ticket/{id}/event).
        Transmodel: TRAVEL DOCUMENT validation event.
      x-tm: TRAVEL DOCUMENT
      x-semantics:
        transmodel: TRAVEL DOCUMENT
        bob: ticketEvent
      required: [time, eventType]
      properties:
        eventId:
          $ref: './components.yaml#/components/schemas/uuid'
        localEventId:
          $ref: './components.yaml#/components/schemas/normalString'
          description: >
            UUIDv4 assigned by the validator device. Used by the server for
            deduplication (idempotency). A second submission with the same
            `localEventId` is a no-op and returns 303 See Other.
        ticketId:
          $ref: './components.yaml#/components/schemas/normalString'
        time:
          $ref: './components.yaml#/components/schemas/dateTime'
        eventType:
          type: string
          enum: [validation, inspection]
          description: >
            `validation` — automated gate/reader check.
            `inspection` — manual inspector check.
        eventResult:
          type: integer
          minimum: 0
          maximum: 9
          description: >
            Result code from the validator device (0–9). 0 = valid, non-zero
            = various failure codes. Present for offline/batch submissions;
            absent for online validation (server computes the result).
        mtbReference:
          $ref: './components.yaml#/components/schemas/normalString'
          description: Reference to the MTB used in this event.
        deviceReference:
          $ref: './components.yaml#/components/schemas/normalString'
          description: Identifier of the validator/inspector device.
        geo:
          $ref: './components.yaml#/components/schemas/geoJsonPoint'
          description: Location of the validation event.
        modeOfTransport:
          $ref: './components.yaml#/components/schemas/shortString'
        subModeOfTransport:
          $ref: './components.yaml#/components/schemas/shortString'
        zone:
          $ref: './components.yaml#/components/schemas/normalString'
        service:
          $ref: './components.yaml#/components/schemas/normalString'
          description: Service line reference (e.g. train number, route code).
        stopArea:
          $ref: './components.yaml#/components/schemas/normalString'
        validator:
          $ref: './components.yaml#/components/schemas/normalString'
          description: ID of the validating entity (operator/agent reference).
        inspector:
          $ref: './components.yaml#/components/schemas/normalString'
          description: ID of the human inspector (for inspection events).
        operatingDayDate:
          $ref: './components.yaml#/components/schemas/date'
        tokenTransaction:
          $ref: './components.yaml#/components/schemas/normalString'

    ticketEventResult:
      type: object
      description: >
        Server response to an online ticket validation event.
        BoB equivalent: ticketEventResult schema.
      properties:
        ticketEventPassengerMessage:
          $ref: './components.yaml#/components/schemas/normalString'
          description: Message shown to the passenger on the validator display.
        ticketEventInspectMessage:
          $ref: './components.yaml#/components/schemas/normalString'
          description: Message shown to the inspector.
        ticketEventStatus:
          type: integer
          minimum: 0
          maximum: 9
          description: >
            Result code (0 = valid; non-zero = failure). Mirrors the BoB
            `eventResult` code convention.
        ticketEvent:
          $ref: '#/components/schemas/bobTicketEvent'

    ticketEventCollection:
      type: object
      description: Paginated collection of validation/inspection events for a ticket.
      required: [numberMatched, numberReturned, events]
      properties:
        numberMatched:
          $ref: './components.yaml#/components/schemas/normalInt'
        numberReturned:
          $ref: './components.yaml#/components/schemas/normalInt'
        events:
          type: array
          items:
            $ref: '#/components/schemas/bobTicketEvent'

    # ── Blacklist / Whitelist ──────────────────────────────────────

    blacklistEntry:
      type: object
      description: >
        A revoked/blocked identifier in the BoB blacklist. Validator devices
        download this list periodically to enable offline revocation checking.
        BoB equivalent: blacklistEntry (GET /blacklist).
        Transmodel: TRAVEL DOCUMENT revocation record.
      x-tm: TRAVEL DOCUMENT
      x-semantics:
        transmodel: TRAVEL DOCUMENT
        bob: blacklistEntry
      required: [blacklistEntryId]
      properties:
        blacklistEntryId:
          $ref: './components.yaml#/components/schemas/normalString'
        ticketId:
          $ref: './components.yaml#/components/schemas/normalString'
        travellerId:
          $ref: './components.yaml#/components/schemas/normalString'
        tokenId:
          $ref: './components.yaml#/components/schemas/normalString'
        inception:
          $ref: './components.yaml#/components/schemas/dateTime'
        expire:
          $ref: './components.yaml#/components/schemas/dateTime'

    blacklistCollection:
      type: object
      description: Paginated blacklist of revoked identifiers.
      required: [numberMatched, numberReturned, entries]
      properties:
        numberMatched:
          $ref: './components.yaml#/components/schemas/normalInt'
        numberReturned:
          $ref: './components.yaml#/components/schemas/normalInt'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/blacklistEntry'

    addToBlacklistInputs:
      type: object
      description: >
        Inputs for adding an entry to the BoB blacklist. At least one of
        `ticketId`, `travellerId`, or `tokenId` must be supplied.
        BoB: PUT /blacklist (inferred; BoB Validation spec defines GET only;
        this is the EUDIT write extension).
      properties:
        ticketId:
          $ref: './components.yaml#/components/schemas/normalString'
        travellerId:
          $ref: './components.yaml#/components/schemas/normalString'
        tokenId:
          $ref: './components.yaml#/components/schemas/normalString'
        reason:
          $ref: './components.yaml#/components/schemas/normalString'
          description: Human-readable reason for blacklisting.
        expire:
          $ref: './components.yaml#/components/schemas/dateTime'
          description: >
            Optional expiry for the blacklist entry. If omitted, the entry is
            permanent until manually removed.

    whitelistEntry:
      type: object
      description: >
        A pre-authorized token with a pre-loaded MTB. Validator devices download
        whitelists for offline authorisation of trusted tokens (e.g. season
        pass holders, staff passes).
        BoB equivalent: whitelistEntry (GET /whitelist).
      x-semantics:
        bob: whitelistEntry
      required: [id, kid]
      properties:
        id:
          $ref: './components.yaml#/components/schemas/normalString'
        kid:
          $ref: './components.yaml#/components/schemas/normalString'
          description: JWK thumbprint of the token's public key.
        mtb:
          type: string
          format: byte
          description: >
            Base64url-encoded MTB pre-loaded for offline validation.
        priority:
          type: integer
          description: >
            Priority of this whitelist entry (higher = preferred when multiple
            entries match).
        val:
          $ref: './components.yaml#/components/schemas/normalString'
          description: >
            ISO 8601 time interval during which this whitelist entry is valid
            (e.g. `2024-01-01/2025-01-01`).
        ticketId:
          $ref: './components.yaml#/components/schemas/normalString'

    whitelistCollection:
      type: object
      description: Paginated whitelist of pre-authorized tokens.
      required: [numberMatched, numberReturned, entries]
      properties:
        numberMatched:
          $ref: './components.yaml#/components/schemas/normalInt'
        numberReturned:
          $ref: './components.yaml#/components/schemas/normalInt'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/whitelistEntry'

    addToWhitelistInputs:
      type: object
      description: >
        Inputs for adding a token to the BoB whitelist.
      required: [kid]
      properties:
        kid:
          $ref: './components.yaml#/components/schemas/normalString'
          description: JWK thumbprint of the token to whitelist.
        mtb:
          type: string
          format: byte
          description: Pre-loaded MTB for offline validation.
        priority:
          type: integer
        val:
          $ref: './components.yaml#/components/schemas/normalString'
        ticketId:
          $ref: './components.yaml#/components/schemas/normalString'

    # ── TICKLE Macros ─────────────────────────────────────────────

    tickleMacro:
      type: object
      description: >
        A TICKLE (Ticket Lifecycle Event) macro defining a validity condition
        rule in the TICKLE DSL. Validator devices apply these macros to
        determine ticket validity without online connectivity.
        BoB equivalent: tickleMacro schema (GET /ticklemacros).
      x-semantics:
        bob: tickleMacro
      required: [name, condition]
      properties:
        name:
          $ref: './components.yaml#/components/schemas/normalString'
        description:
          $ref: './components.yaml#/components/schemas/longString'
        condition:
          $ref: './components.yaml#/components/schemas/normalString'
          description: >
            TICKLE DSL expression (e.g. `@R/2016W016/P1W/P2D` for a weekly
            recurrence starting in week 16 of 2016, valid 2 days per week).

    tickleMacroSet:
      type: object
      description: >
        A versioned set of TICKLE macros distributed to validator devices.
        Devices download the macro set identified by its serial number.
        BoB equivalent: tickleMacroset (GET /ticklemacros/{serial}).
      required: [serial, macros]
      properties:
        serial:
          type: integer
          description: Version serial number of this macro set.
        macros:
          type: array
          items:
            $ref: '#/components/schemas/tickleMacro'
        validFrom:
          $ref: './components.yaml#/components/schemas/dateTime'
        validUntil:
          $ref: './components.yaml#/components/schemas/dateTime'

    tickleMacroSetCollection:
      type: object
      description: Collection of all available TICKLE macro sets.
      required: [numberMatched, numberReturned, macroSets]
      properties:
        numberMatched:
          $ref: './components.yaml#/components/schemas/normalInt'
        numberReturned:
          $ref: './components.yaml#/components/schemas/normalInt'
        macroSets:
          type: array
          items:
            $ref: '#/components/schemas/tickleMacroSet'

    # ── Fraud Check ───────────────────────────────────────────────

    fraudCheckInputs:
      type: object
      description: >
        Inputs for a velocity-based fraud check. The server computes the
        distance and time between the current validation event and the previous
        one for the same MTB reference, and returns the implied travel speed in
        km/h. Physically impossible speeds (e.g. >900 km/h) indicate cloned
        tickets.
        BoB equivalent: fraudcheckData (GET /fraudcheck with body).
      required: [geo, mtbReference, time]
      properties:
        geo:
          $ref: './components.yaml#/components/schemas/geoJsonPoint'
        mtbReference:
          $ref: './components.yaml#/components/schemas/normalString'
        time:
          $ref: './components.yaml#/components/schemas/dateTime'

    fraudCheckResult:
      type: object
      description: >
        Result of a fraud check. The `velocity` field is the km/h implied by
        the distance and time between the two most recent validation events for
        this MTB. A very high velocity indicates potential ticket cloning.
        BoB equivalent: fraudcheckResponse.
      required: [velocity]
      properties:
        velocity:
          type: number
          description: >
            Implied travel speed in km/h between the current and previous
            validation event for this MTB reference. 0 indicates this is the
            first recorded validation.
        previousValidationTime:
          $ref: './components.yaml#/components/schemas/dateTime'
        previousValidationGeo:
          $ref: './components.yaml#/components/schemas/geoJsonPoint'
        suspiciousActivity:
          type: boolean
          description: >
            Set to `true` by the server if velocity exceeds the configured
            fraud threshold (implementation-defined).

paths:

  # ─────────────────────────────────────────────────────────────────
  # Ticket Issuance Processes
  # ─────────────────────────────────────────────────────────────────

  /processes/issue-ticket/execute:
    post:
      operationId: executeIssueTicket
      summary: Issue BoB Ticket
      description: >
        Issues one or more BoB MTB tickets from a ticket manifest. The manifest
        specifies the product(s), validity, passenger category, and zones.

        The response contains the issued ticket record(s) including the base64url
        MTB payload ready for presentation to validator devices.

        If `requestId` is supplied, the operation is idempotent — duplicate
        submissions return the original tickets.

        Transmodel: TRAVEL DOCUMENT issuance.
        BoB equivalent: POST /ticket.
      tags: [BoB Tickets]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  $ref: '#/components/schemas/issueTicketInputs'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        '200':
          description: Ticket(s) issued successfully.
          headers:
            Version:
              $ref: './components.yaml#/components/headers/Version'
            Content-Language:
              $ref: './components.yaml#/components/headers/Content-Language'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/issueTicketResult'
        '201':
          description: Job accepted for asynchronous processing.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/403Forbidden'
        '409':
          description: >
            Conflict — ticket already issued for this manifest/requestId
            combination (idempotency collision).
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/errorResponse'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Async callback — tickets issued
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/issueTicketResult'
              responses:
                '200':
                  description: Callback received.

  /processes/activate-ticket/execute:
    post:
      operationId: executeActivateTicket
      summary: Activate / Deactivate BoB Ticket
      description: >
        Sets the active status of a BoB ticket. Deactivated tickets cannot be
        validated until re-activated.
        BoB equivalent: PUT /ticket/{ticketId}/active.
      tags: [BoB Tickets]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [ticketId, active]
                  properties:
                    ticketId:
                      $ref: './components.yaml#/components/schemas/normalString'
                    active:
                      type: boolean
                      description: >
                        `true` to activate the ticket; `false` to deactivate.
      responses:
        '200':
          description: Ticket active status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bobTicket'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /processes/revoke-ticket/execute:
    post:
      operationId: executeRevokeTicket
      summary: Revoke BoB Ticket
      description: >
        Revokes (permanently invalidates) a BoB ticket. The ticket is added to
        the blacklist automatically. Revocation is irreversible.
        BoB equivalent: PUT /ticket/{ticketId}/revoke.
      tags: [BoB Tickets]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [ticketId]
                  properties:
                    ticketId:
                      $ref: './components.yaml#/components/schemas/normalString'
                    reason:
                      $ref: './components.yaml#/components/schemas/normalString'
      responses:
        '200':
          description: Ticket revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bobTicket'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /processes/refund-ticket/execute:
    post:
      operationId: executeRefundTicket
      summary: Mark BoB Ticket as Refunded
      description: >
        Marks a BoB ticket as refunded. This is the BoB-layer refund flag;
        the actual financial refund is handled by the `06-aftersales.yaml`
        processes. Setting this flag prevents the ticket from being used after
        a refund has been processed.
        BoB equivalent: PUT /ticket/{ticketId}/refundStatus.
      tags: [BoB Tickets]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [ticketId]
                  properties:
                    ticketId:
                      $ref: './components.yaml#/components/schemas/normalString'
                    refundedAt:
                      $ref: './components.yaml#/components/schemas/dateTime'
      responses:
        '200':
          description: Ticket marked as refunded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bobTicket'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /processes/recover-ticket/execute:
    post:
      operationId: executeRecoverTicket
      summary: Recover BoB Ticket
      description: >
        Recovers a BoB ticket to a new device (e.g. after device loss or reset).
        The original ticket is revoked and a new ticket with identical product
        validity is issued to the new device. Equivalent to calling
        `issue-ticket` with `recoverTicketId`.
        BoB equivalent: POST /ticket with `recoverTicketId` in the manifest call.
      tags: [BoB Tickets]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [originalTicketId, tokenId, tokenIssuer]
                  properties:
                    originalTicketId:
                      $ref: './components.yaml#/components/schemas/normalString'
                      description: ID of the ticket to recover from.
                    tokenId:
                      $ref: './components.yaml#/components/schemas/normalString'
                      description: Token ID of the new device.
                    tokenIssuer:
                      $ref: './components.yaml#/components/schemas/url'
                    tokenPublicKey:
                      $ref: '#/components/schemas/jwkPublicKey'
                    deviceId:
                      $ref: './components.yaml#/components/schemas/normalString'
      responses:
        '200':
          description: Ticket recovered. New ticket is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/issueTicketResult'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
        '409':
          description: Ticket not recoverable (already revoked, already recovered, etc.).
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/errorResponse'

  /processes/set-hindered/execute:
    post:
      operationId: executeSetHindered
      summary: Set Passenger Hindered Status
      description: >
        Records that a passenger has been hindered (unable to travel due to
        operator, force majeure, or self-reported reason). The hindered cause
        affects refund eligibility.
        BoB equivalent: PUT /ticket/{ticketId}/hinderedStatus.
        Transmodel: PASSENGER RIGHTS — hindrance cause.
      tags: [BoB Tickets]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [ticketId, hindered, hinderedCause]
                  properties:
                    ticketId:
                      $ref: './components.yaml#/components/schemas/normalString'
                    hindered:
                      type: boolean
                    hinderedCause:
                      type: string
                      enum: [travellerHindered, operatorHindered, forceMajeure]
      responses:
        '200':
          description: Hindered status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bobTicket'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /processes/create-token-bundle/execute:
    post:
      operationId: executeCreateTokenBundle
      summary: Create BoB Token Bundle
      description: >
        Bundles multiple tickets into a single token bundle for pre-loading onto
        a device (e.g. NFC card or offline validator). The bundle binds the
        tickets to a specific token and device.
        BoB equivalent: POST /ticketbundle.
      tags: [BoB Tickets]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  $ref: '#/components/schemas/createTokenBundleInputs'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        '200':
          description: Token bundle created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenBundleResult'
        '201':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'

  # ─────────────────────────────────────────────────────────────────
  # Validation Processes
  # ─────────────────────────────────────────────────────────────────

  /processes/validate-ticket/execute:
    post:
      operationId: executeValidateTicket
      summary: Validate BoB Ticket (Online)
      description: >
        Performs an online ticket validation. The validator device posts the
        `ticketEvent` (without `eventResult`) and the server evaluates the
        ticket's validity, applies TICKLE macros, and returns the result code
        and passenger/inspector messages.

        If the same `localEventId` is submitted twice, the server returns
        HTTP 303 See Other pointing to the original event result.

        The optional `mtb` query parameter passes the MTB data when it is not
        embedded in the ticket record (e.g. for contactless card schemes where
        the MTB is stored separately).

        Transmodel: TRAVEL DOCUMENT validation.
        BoB equivalent: POST /validation/{ticketId}.
      tags: [BoB Validation]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: mtb
          in: query
          required: false
          schema:
            type: string
            format: byte
          description: >
            Base64url-encoded MTB data, provided when the MTB is not stored
            server-side against the ticket record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  $ref: '#/components/schemas/bobTicketEvent'
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ticketEventResult'
        '303':
          description: >
            Duplicate submission — this `localEventId` was already recorded.
            The `Location` header points to the original event result.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /processes/report-validations/execute:
    post:
      operationId: executeReportValidations
      summary: Report Batch Offline Validations
      description: >
        Reports a batch of offline validation events accumulated by a validator
        device during a connectivity outage. The batch is all-or-nothing: if any
        event fails basic schema validation, the entire batch is rejected (400).

        Each event in the batch must have a unique `localEventId`. Duplicate
        events within the batch are rejected.

        BoB equivalent: POST /validation (batch).
      tags: [BoB Validation]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [events]
                  properties:
                    events:
                      type: array
                      minItems: 1
                      items:
                        $ref: '#/components/schemas/bobTicketEvent'
      responses:
        '200':
          description: Batch recorded successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded:
                    type: integer
                    description: Number of events successfully recorded.
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'

  /processes/fraud-check/execute:
    post:
      operationId: executeFraudCheck
      summary: Fraud Check
      description: >
        Performs a velocity-based fraud check. Computes the implied travel speed
        in km/h between the current location/time and the previous validation
        event for the same MTB reference.

        A server MUST only respond once per validation event per client to
        prevent information leakage. The result is intended for operator fraud
        dashboards and is not shown to passengers.

        BoB equivalent: GET /fraudcheck (with request body, per BoB spec).
      tags: [BoB Validation]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  $ref: '#/components/schemas/fraudCheckInputs'
      responses:
        '200':
          description: Fraud check result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fraudCheckResult'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'

  /processes/add-to-blacklist/execute:
    post:
      operationId: executeAddToBlacklist
      summary: Add to Blacklist
      description: >
        Adds a ticket, token, or traveller identifier to the BoB revocation
        blacklist. Validator devices synchronise this list to perform offline
        revocation checks.

        At least one of `ticketId`, `travellerId`, or `tokenId` must be
        supplied.

        Transmodel: TRAVEL DOCUMENT revocation.
        BoB extension: write counterpart to GET /blacklist.
      tags: [BoB Validation]
      security:
        - BearerAuth: []
        - OAuth: [write, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  $ref: '#/components/schemas/addToBlacklistInputs'
      responses:
        '200':
          description: Blacklist entry created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blacklistEntry'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/403Forbidden'

  /processes/add-to-whitelist/execute:
    post:
      operationId: executeAddToWhitelist
      summary: Add to Whitelist
      description: >
        Adds a token (identified by JWK thumbprint `kid`) to the BoB whitelist
        with an optional pre-loaded MTB. Whitelisted tokens are authorised for
        offline validation without an online lookup.

        BoB extension: write counterpart to GET /whitelist.
      tags: [BoB Validation]
      security:
        - BearerAuth: []
        - OAuth: [write, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  $ref: '#/components/schemas/addToWhitelistInputs'
      responses:
        '200':
          description: Whitelist entry created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/whitelistEntry'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/403Forbidden'

  # ─────────────────────────────────────────────────────────────────
  # Collections
  # ─────────────────────────────────────────────────────────────────

  /collections/tickets/items:
    get:
      operationId: getBobTickets
      summary: Get BoB Tickets
      description: >
        Returns BoB ticket records for a PACKAGE, filtered by status flags.
        BoB equivalent: GET /ticket.
      tags: [BoB Tickets]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: active
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by active status.
        - name: refunded
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by refunded status.
        - name: revoked
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by revoked status.
        - name: travellerId
          in: query
          required: false
          schema:
            type: string
          description: Filter by passenger identifier.
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
      responses:
        '200':
          description: List of BoB tickets.
          headers:
            Version:
              $ref: './components.yaml#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bobTicketCollection'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'

  /collections/token-bundles/items:
    get:
      operationId: getTokenBundles
      summary: Get BoB Token Bundles
      description: >
        Returns token bundles for a PACKAGE or token.
        BoB equivalent: GET /ticketbundle/{id} (single); this returns multiple.
      tags: [BoB Tickets]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: tokenId
          in: query
          required: false
          schema:
            type: string
          description: Filter by token identifier.
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
      responses:
        '200':
          description: List of token bundles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenBundleCollection'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'

  /collections/ticket-events/items:
    get:
      operationId: getTicketEvents
      summary: Get Ticket Validation Events
      description: >
        Returns validation and inspection events for a specific BoB ticket.
        Results are in reverse-chronological order.
        BoB equivalent: GET /ticket/{ticketId}/event.
      tags: [BoB Validation]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - name: ticketId
          in: query
          required: true
          schema:
            type: string
          description: BoB ticket identifier.
        - name: eventType
          in: query
          required: false
          schema:
            type: string
            enum: [validation, inspection]
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
      responses:
        '200':
          description: List of ticket events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ticketEventCollection'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'

  /collections/blacklist/items:
    get:
      operationId: getBlacklist
      summary: Get BoB Blacklist
      description: >
        Returns the paginated blacklist of revoked token/ticket/traveller IDs.
        Validator devices download this periodically for offline revocation.
        BoB equivalent: GET /blacklist.
      tags: [BoB Validation]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - name: updatedSince
          in: query
          required: false
          schema:
            $ref: './components.yaml#/components/schemas/dateTime'
          description: >
            Return only entries updated after this timestamp (delta sync).
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
      responses:
        '200':
          description: Blacklist entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blacklistCollection'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'

  /collections/whitelist/items:
    get:
      operationId: getWhitelist
      summary: Get BoB Whitelist
      description: >
        Returns the paginated whitelist of pre-authorized tokens with MTBs.
        BoB equivalent: GET /whitelist.
      tags: [BoB Validation]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - name: updatedSince
          in: query
          required: false
          schema:
            $ref: './components.yaml#/components/schemas/dateTime'
          description: Return only entries updated after this timestamp.
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
      responses:
        '200':
          description: Whitelist entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/whitelistCollection'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'

  /collections/tickle-macros/items:
    get:
      operationId: getTickleMacros
      summary: Get TICKLE Macro Sets
      description: >
        Returns available TICKLE macro sets for distribution to validator devices.
        Devices use the `serial` parameter to check for updates.
        BoB equivalent: GET /ticklemacros.
      tags: [BoB Validation]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - name: serial
          in: query
          required: false
          schema:
            type: integer
          description: >
            Return only macro sets with a serial number greater than this value
            (for delta sync).
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
      responses:
        '200':
          description: TICKLE macro sets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tickleMacroSetCollection'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
