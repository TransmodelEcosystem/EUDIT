openapi: 3.0.3
info:
  title: EUDIT Unified Mobility API – Purchase
  description: >
    Processes for completing a purchase — converting a pre-sales PACKAGE
    into a confirmed, paid booking with issued travel documents.

    Processes:
    - `purchase-offers` — direct one-step purchase of offers (no prior basket)
    - `purchase-package` — purchase a pre-built PACKAGE (normal flow)
    - `2-phase-purchase` — initiate the two-phase commit (reserve + confirm)
    - `confirm-purchase` — confirm a two-phase reservation (phase 2)
    - `rollback-purchase` — roll back a two-phase reservation
    - `purchase-product` — purchase a non-trip FARE PRODUCT directly
    - `confirm-payment` — confirm payment after an external payment step

    Collections:
    - `travel-documents` — issued TRAVEL DOCUMENTs for confirmed bookings
  version: 0.1.0

servers:
  - url: https://api.eudit.example.com/v1

tags:
  - name: Purchase
    description: Payment and booking confirmation

paths:

  /processes/purchase-offers/execute:
    post:
      operationId: executePurchaseOffers
      summary: Purchase Offers
      description: >
        Direct one-step purchase: selects offers and immediately confirms
        the booking in a single call. Combines `select-offers` and
        `purchase-package` for simple flows.

        Transmodel: SALES TRANSACTION (direct purchase).
        OSDM equivalent: POST /bookings (with immediate payment).
        TOMP-API equivalent: POST /processes/purchase-offers/execution.
        OMSA equivalent: POST /processes/purchase-offers/execute.

        On success, the PACKAGE transitions to `confirmed` and TRAVEL
        DOCUMENTs are issued.
      tags: [Purchase]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
        - $ref: './components.yaml#/components/parameters/authorization'
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-async
        - name: Digest
          in: header
          required: false
          schema:
            type: string
          description: >
            SHA-256 digest of the request body for integrity checking
            (`SHA-256=<base64>`). Used by some operators for non-repudiation.
        - name: X-Signature
          in: header
          required: false
          schema:
            type: string
          description: >
            Digital signature over the request body (base64url-encoded).
            Required by operators demanding non-repudiation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [offerIds, travelParty, payment]
                  properties:
                    offerIds:
                      type: array
                      minItems: 1
                      items:
                        $ref: './components.yaml#/components/schemas/offerReference'
                    travelParty:
                      $ref: './components.yaml#/components/schemas/travelParty'
                    payment:
                      $ref: './components.yaml#/components/schemas/paymentInstruction'
                    currency:
                      $ref: './components.yaml#/components/schemas/currencyCode'
                    externalReference:
                      $ref: './components.yaml#/components/schemas/externalReference'
                    customProperties:
                      $ref: './components.yaml#/components/schemas/customProperties'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Purchase result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/purchaseResult'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Purchase completed synchronously.
          headers:
            Version:
              $ref: './components.yaml#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/purchaseResult'
        "201":
          description: Async job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "409":
          $ref: './components.yaml#/components/responses/409Conflict'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/purchase-package/execute:
    post:
      operationId: executePurchasePackage
      summary: Purchase Package
      description: >
        Purchases a pre-built PACKAGE (after `select-offers` and any
        pre-sales enrichment). The PACKAGE must be in `selected` state.
        On success, the PACKAGE transitions to `confirmed`.

        Transmodel: SALES TRANSACTION for PACKAGE.
        OSDM equivalent: PATCH /bookings/{id} (with payment).
        TOMP-API equivalent: POST /processes/purchase-package/execution.
        OMSA equivalent: POST /processes/purchase-package/execute.
      tags: [Purchase]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-async
        - name: Digest
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [packageId, payment]
                  properties:
                    packageId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    payment:
                      $ref: './components.yaml#/components/schemas/paymentInstruction'
                    externalReference:
                      $ref: './components.yaml#/components/schemas/externalReference'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Purchase result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/purchaseResult'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Purchase confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/purchaseResult'
        "201":
          description: Async job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "409":
          $ref: './components.yaml#/components/responses/409Conflict'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/2-phase-purchase/execute:
    post:
      operationId: execute2PhasePurchase
      summary: Two-Phase Purchase (Phase 1 — Reserve)
      description: >
        Phase 1 of the two-phase purchase protocol. Reserves the booking
        and returns a reservation token. Call `confirm-purchase` to
        complete (phase 2) or `rollback-purchase` to cancel.

        Used for scenarios where an external payment step must occur
        between reservation and confirmation (e.g. card authorisation,
        3DS challenge).

        Transmodel: SALES TRANSACTION (two-phase commit, phase 1).
        TOMP-API equivalent: POST /processes/2-phase-purchase/execution.
        OMSA equivalent: POST /processes/2-phase-purchase/execute.
      tags: [Purchase]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-async
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [packageId]
                  properties:
                    packageId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    paymentMethodHint:
                      type: string
                      enum: [CARD, BANK_TRANSFER, VOUCHER, CASH, WALLET, DIRECT_DEBIT, OTHER]
                    externalReference:
                      $ref: './components.yaml#/components/schemas/externalReference'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Phase 1 reservation callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/reservationResult'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Reservation created (phase 1 complete).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reservationResult'
        "201":
          description: Async job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "409":
          $ref: './components.yaml#/components/responses/409Conflict'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/confirm-purchase/execute:
    post:
      operationId: executeConfirmPurchase
      summary: Confirm Purchase (Phase 2)
      description: >
        Phase 2 of the two-phase purchase protocol. Confirms the reservation
        created in phase 1. The PACKAGE transitions from `pending` to
        `confirmed` and TRAVEL DOCUMENTs are issued.

        Transmodel: SALES TRANSACTION (two-phase commit, phase 2).
        TOMP-API equivalent: POST /processes/confirm-purchase/execution.
        OMSA equivalent: POST /processes/confirm-purchase/execute.
      tags: [Purchase]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-async
        - name: Digest
          in: header
          required: false
          schema:
            type: string
        - name: X-Signature
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [packageId, reservationToken]
                  properties:
                    packageId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    reservationToken:
                      $ref: './components.yaml#/components/schemas/normalString'
                      description: >
                        Token returned by `2-phase-purchase`. Proves
                        continuity between phases.
                    payment:
                      $ref: './components.yaml#/components/schemas/paymentInstruction'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Confirmation result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/purchaseResult'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Purchase confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/purchaseResult'
        "201":
          description: Async job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "409":
          $ref: './components.yaml#/components/responses/409Conflict'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/rollback-purchase/execute:
    post:
      operationId: executeRollbackPurchase
      summary: Rollback Purchase
      description: >
        Rolls back a phase-1 reservation (cancels before phase 2 confirm).
        The PACKAGE returns to `selected` state and inventory is freed.

        Transmodel: SALES TRANSACTION rollback.
        TOMP-API equivalent: POST /processes/rollback-purchase/execution.
        OMSA equivalent: POST /processes/rollback-purchase/execute.
      tags: [Purchase]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [packageId, reservationToken]
                  properties:
                    packageId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    reservationToken:
                      $ref: './components.yaml#/components/schemas/normalString'
                    reason:
                      $ref: './components.yaml#/components/schemas/normalString'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        "200":
          description: Rollback successful; PACKAGE returned.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/package'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "409":
          $ref: './components.yaml#/components/responses/409Conflict'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/purchase-product/execute:
    post:
      operationId: executePurchaseProduct
      summary: Purchase Product
      description: >
        Direct purchase of a non-trip FARE PRODUCT (pass, subscription,
        zone ticket) without a trip planning step.

        Transmodel: SALES TRANSACTION for FARE PRODUCT.
        TOMP-API equivalent: POST /processes/purchase-product/execution.
        OMSA equivalent: POST /processes/purchase-product/execute.
      tags: [Purchase]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-async
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [productId, travellers, payment]
                  properties:
                    productId:
                      $ref: './components.yaml#/components/schemas/normalString'
                    travellers:
                      type: array
                      minItems: 1
                      items:
                        $ref: './components.yaml#/components/schemas/individualTraveller'
                    validFrom:
                      $ref: './components.yaml#/components/schemas/dateTime'
                    payment:
                      $ref: './components.yaml#/components/schemas/paymentInstruction'
                    externalReference:
                      $ref: './components.yaml#/components/schemas/externalReference'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Product purchase result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/purchaseResult'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Product purchased.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/purchaseResult'
        "201":
          description: Async job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "409":
          $ref: './components.yaml#/components/responses/409Conflict'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/confirm-payment/execute:
    post:
      operationId: executeConfirmPayment
      summary: Confirm Payment
      description: >
        Confirms that an external payment step has succeeded (e.g. after a
        3DS redirect or offline payment). Triggers ticket issuance.

        Transmodel: PAYMENT confirmation.
        TOMP-API equivalent: POST /processes/confirm-payment/execution.
        OMSA equivalent: POST /processes/confirm-payment/execute.
      tags: [Purchase]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-async
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [packageId, paymentTransactionId]
                  properties:
                    packageId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    paymentTransactionId:
                      $ref: './components.yaml#/components/schemas/normalString'
                      description: External payment provider transaction ID.
                    paymentMethod:
                      type: string
                      enum: [CARD, BANK_TRANSFER, VOUCHER, CASH, WALLET, DIRECT_DEBIT, OTHER]
                    amountPaid:
                      $ref: './components.yaml#/components/schemas/amountOfMoney'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Payment confirmation result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/purchaseResult'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Payment confirmed; booking confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/purchaseResult'
        "201":
          description: Async job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "409":
          $ref: './components.yaml#/components/responses/409Conflict'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /collections/travel-documents/items:
    get:
      operationId: getTravelDocuments
      summary: Get travel documents
      description: >
        Returns TRAVEL DOCUMENTs issued for confirmed bookings.
        Requires a valid bearer token scoped to the customer or booking.

        Transmodel: TRAVEL DOCUMENT.
        OSDM equivalent: GET /fulfillments.
        BoB equivalent: GET /ticket.
      tags: [Purchase]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - $ref: './components.yaml#/components/parameters/legId'
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
        - name: type
          in: query
          required: false
          schema:
            $ref: './components.yaml#/components/schemas/typeOfTravelDocument'
          description: Filter by document carrier type.
        - name: validAt
          in: query
          required: false
          schema:
            $ref: './components.yaml#/components/schemas/dateTime'
          description: Return documents valid at the given date-time.
      responses:
        "200":
          description: Travel documents returned.
          headers:
            Expires:
              $ref: './components.yaml#/components/headers/Expires'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/travelDocumentCollection'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

components:

  securitySchemes:
    BearerAuth:
      $ref: './components.yaml#/components/securitySchemes/BearerAuth'
    OAuth:
      $ref: './components.yaml#/components/securitySchemes/OAuth'

  schemas:

    paymentInstruction:
      $ref: './components.yaml#/components/schemas/paymentInstruction'

    purchaseResult:
      type: object
      description: >
        Result of a successful purchase. Contains the confirmed PACKAGE,
        issued TRAVEL DOCUMENTs, and financial summary.
      required: [package]
      properties:
        package:
          $ref: './components.yaml#/components/schemas/package'
        travelDocuments:
          type: array
          items:
            $ref: './components.yaml#/components/schemas/travelDocument'
        financialDetail:
          $ref: './components.yaml#/components/schemas/financialDetail'
        paymentRedirectUrl:
          $ref: './components.yaml#/components/schemas/url'
          description: >
            Present when the payment requires a redirect (e.g. 3DS). The
            client must redirect to this URL and then call `confirm-payment`
            on return.

    reservationResult:
      type: object
      description: >
        Result of the two-phase purchase phase 1 (reservation).
        Contains the reservation token needed for phase 2.
      required: [packageId, reservationToken, expiresAt]
      properties:
        packageId:
          $ref: './components.yaml#/components/schemas/uuid'
        reservationToken:
          $ref: './components.yaml#/components/schemas/normalString'
        expiresAt:
          $ref: './components.yaml#/components/schemas/dateTime'
          description: >
            Time by which phase 2 must be called. After this point the
            reservation is automatically rolled back.
        totalAmount:
          $ref: './components.yaml#/components/schemas/amountOfMoney'
        paymentRedirectUrl:
          $ref: './components.yaml#/components/schemas/url'
