openapi: 3.0.3
info:
  title: EUDIT Unified Mobility API – Offers
  description: >
    Processes and collections for offer search and price enquiry.
    Covers trip-based offers, non-trip (on-demand / shared mobility) offers,
    offers at a geographic location, sailing search (ferry), and detailed
    price breakdown.

    Processes:
    - `search-offers` — multimodal trip offer search (OSDM trips+offers,
      TOMP bookingRequest, OMSA searchOffers)
    - `search-offers-at-location` — location-based offer search for
      shared/on-demand modes (TOMP-API, OMSA)
    - `search-non-trip-offers` — non-trip products (passes, subscriptions)
    - `get-offer-details` — retrieve full detail of a specific offer ID
    - `search-sailings` — ferry sailing search (FerryGateway)
    - `get-price` — live price calculation for a given combination

    Collections:
    - `offers` — transient offer results queryable by package/session context
  version: 0.1.0

servers:
  - url: https://api.eudit.example.com/v1

tags:
  - name: Offers
    description: Offer search, price enquiry, and offer detail

paths:

  /processes/search-offers/execute:
    post:
      operationId: executeSearchOffers
      summary: Search Offers
      description: >
        Searches for SALES OFFER PACKAGEs matching the given travel
        specification (origin, destination, date/time, travel party,
        preferred modes).

        Transmodel: SALES OFFER PACKAGE search.
        OSDM equivalent: POST /trips + POST /offers.
        TOMP-API equivalent: POST /processes/search-offers/execution.
        OMSA equivalent: POST /processes/search-offers/execute.

        Supports sync and async execution. For async, the offer collection
        is delivered to `subscriber.successUri`.
      tags: [Offers]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
        - $ref: './components.yaml#/components/parameters/authorization'
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [travelSpecification]
                  properties:
                    travelSpecification:
                      $ref: './components.yaml#/components/schemas/travelSpecification'
                    currencyPreference:
                      $ref: './components.yaml#/components/schemas/currencyCode'
                    classPreference:
                      $ref: './components.yaml#/components/schemas/classOfUse'
                    maxResults:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                    includeAlternatives:
                      type: boolean
                      default: false
                      description: >
                        If true, return alternative connections (e.g. via
                        different operators or with different change counts).
                    filterOperators:
                      type: array
                      items:
                        $ref: './components.yaml#/components/schemas/normalString'
                      description: Include only offers from these operator IDs.
                    filterModes:
                      type: array
                      items:
                        $ref: './components.yaml#/components/schemas/mode'
                    filterTags:
                      type: array
                      items:
                        type: string
                      description: >
                        Include only offers tagged with all of these tags
                        (e.g. ["refundable", "flexible"]).
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Offer search result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: './components.yaml#/components/schemas/offerCollection'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Offers returned synchronously.
          headers:
            Version:
              $ref: './components.yaml#/components/headers/Version'
            Content-Language:
              $ref: './components.yaml#/components/headers/Content-Language'
            Expires:
              $ref: './components.yaml#/components/headers/Expires'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/offerCollection'
        "201":
          description: Async job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/search-offers-at-location/execute:
    post:
      operationId: executeSearchOffersAtLocation
      summary: Search Offers at Location
      description: >
        Searches for SALES OFFER PACKAGEs available at or near a given
        geographic location. Used for shared/on-demand modes (bicycle,
        scooter, car, taxi, park-and-ride).

        Transmodel: SALES OFFER PACKAGE for VEHICLE (at stop/location).
        TOMP-API equivalent: POST /processes/search-offers-at-location/execution.
        OMSA equivalent: POST /processes/search-offers-at-location/execute.
      tags: [Offers]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [location]
                  properties:
                    location:
                      $ref: './components.yaml#/components/schemas/geoPosition'
                    radiusMeters:
                      type: integer
                      minimum: 50
                      maximum: 5000
                      default: 500
                    modes:
                      type: array
                      items:
                        $ref: './components.yaml#/components/schemas/mode'
                      example: [BICYCLE, SCOOTER, CAR, SELFDRIVE]
                    destination:
                      $ref: './components.yaml#/components/schemas/placeReference'
                      description: >
                        Optional destination for point-to-point shared rides.
                        When omitted, free-floating assets are returned.
                    travelParty:
                      $ref: './components.yaml#/components/schemas/travelParty'
                    maxResults:
                      type: integer
                      default: 20
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Location-based offer search result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: './components.yaml#/components/schemas/offerCollection'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Location-based offers returned.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/offerCollection'
        "201":
          description: Async job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/search-non-trip-offers/execute:
    post:
      operationId: executeSearchNonTripOffers
      summary: Search Non-Trip Offers
      description: >
        Searches for non-trip FARE PRODUCTs such as day passes, period
        passes, zone subscriptions, and entitlement products — i.e. products
        not tied to a specific journey.

        Transmodel: FARE PRODUCT (non-trip).
        OMSA equivalent: POST /processes/search-non-trip-offers/execute.
      tags: [Offers]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  properties:
                    zones:
                      type: array
                      items:
                        $ref: './components.yaml#/components/schemas/zoneReference'
                    lines:
                      type: array
                      items:
                        $ref: './components.yaml#/components/schemas/lineReference'
                    modes:
                      type: array
                      items:
                        $ref: './components.yaml#/components/schemas/mode'
                    operators:
                      type: array
                      items:
                        $ref: './components.yaml#/components/schemas/organisationReference'
                    travelParty:
                      $ref: './components.yaml#/components/schemas/travelParty'
                    currency:
                      $ref: './components.yaml#/components/schemas/currencyCode'
                    validFrom:
                      $ref: './components.yaml#/components/schemas/dateTime'
                    filterTags:
                      type: array
                      items:
                        type: string
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Non-trip offer search result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: './components.yaml#/components/schemas/offerCollection'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Non-trip offers returned.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/offerCollection'
        "201":
          description: Async job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/get-offer-details/execute:
    post:
      operationId: executeGetOfferDetails
      summary: Get Offer Details
      description: >
        Retrieves the full detail of one or more specific offers by their
        offer IDs. Used to refresh offer data (price, availability, conditions)
        before proceeding to pre-sales.

        Transmodel: SALES OFFER PACKAGE detail.
        TOMP-API equivalent: GET /collections/offers/items.
        OMSA equivalent: POST /processes/get-offer-details/execute.
      tags: [Offers]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [offerIds]
                  properties:
                    offerIds:
                      type: array
                      minItems: 1
                      items:
                        $ref: './components.yaml#/components/schemas/offerReference'
                    includeConditions:
                      type: boolean
                      default: true
                    includeAlternatives:
                      type: boolean
                      default: false
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Offer details result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: './components.yaml#/components/schemas/offerCollection'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Offer details returned.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/offerCollection'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/search-sailings/execute:
    post:
      operationId: executeSearchSailings
      summary: Search Sailings (Ferry)
      description: >
        Searches for available ferry sailings between two ports on a given
        date. Returns sailing schedules with capacity and availability
        information.

        Transmodel: SERVICE JOURNEY (ferry / WATER mode).
        FerryGateway equivalent: sailing search.
        OSDM equivalent: POST /trips (mode=FERRY).
      tags: [Offers]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [origin, destination, departureDate]
                  properties:
                    origin:
                      $ref: './components.yaml#/components/schemas/placeReference'
                    destination:
                      $ref: './components.yaml#/components/schemas/placeReference'
                    departureDate:
                      $ref: './components.yaml#/components/schemas/date'
                    returnDate:
                      $ref: './components.yaml#/components/schemas/date'
                      description: If provided, also search return sailings.
                    travelParty:
                      $ref: './components.yaml#/components/schemas/travelParty'
                    vehicles:
                      type: array
                      items:
                        type: object
                        properties:
                          vehicleType:
                            type: string
                            enum: [CAR, MOTORCYCLE, CARAVAN, TRUCK, BUS, BICYCLE, OTHER]
                          length:
                            type: number
                          height:
                            type: number
                    operator:
                      $ref: './components.yaml#/components/schemas/organisationReference'
                    requireCabin:
                      type: boolean
                      default: false
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Sailing search result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/sailingSearchResult'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Sailings returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sailingSearchResult'
        "201":
          description: Async job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/get-price/execute:
    post:
      operationId: executeGetPrice
      summary: Get Price
      description: >
        Calculates the live price for a specific combination of offer
        and travel party, optionally applying discount cards or entitlements.
        Returns an itemised price breakdown.

        Transmodel: FARE PRODUCT price calculation.
        OSDM equivalent: POST /offers (price enquiry).
        OMSA equivalent: POST /processes/get-price/execute.
      tags: [Offers]
      security:
        - BearerAuth: []
        - OAuth: [read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [offerIds, travelParty]
                  properties:
                    offerIds:
                      type: array
                      minItems: 1
                      items:
                        $ref: './components.yaml#/components/schemas/offerReference'
                    travelParty:
                      $ref: './components.yaml#/components/schemas/travelParty'
                    currency:
                      $ref: './components.yaml#/components/schemas/currencyCode'
                    discountCards:
                      type: array
                      items:
                        $ref: './components.yaml#/components/schemas/cardReference'
                    promoCode:
                      $ref: './components.yaml#/components/schemas/normalString'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Price calculation result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/priceResult'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Price calculated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/priceResult'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /collections/offers/items:
    get:
      operationId: getOfferItems
      summary: Get offer items (collection)
      description: >
        Returns offer items associated with a session or package context.
        Useful for polling offer availability without triggering a new search.

        Requires `packageId` or a session-scoped token.
        Transmodel: SALES OFFER PACKAGE.
      tags: [Offers]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
        - $ref: './components.yaml#/components/parameters/packageId'
        - name: mode
          in: query
          required: false
          schema:
            $ref: './components.yaml#/components/schemas/mode'
        - name: classOfUse
          in: query
          required: false
          schema:
            $ref: './components.yaml#/components/schemas/classOfUse'
      responses:
        "200":
          description: Offer items returned.
          headers:
            Expires:
              $ref: './components.yaml#/components/headers/Expires'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/offerCollection'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

components:

  securitySchemes:
    BearerAuth:
      $ref: './components.yaml#/components/securitySchemes/BearerAuth'
    OAuth:
      $ref: './components.yaml#/components/securitySchemes/OAuth'

  schemas:

    sailingSearchResult:
      type: object
      description: Result of a sailing search (outbound and optional return sailings).
      required: [outbound]
      properties:
        outbound:
          type: array
          items:
            $ref: '#/components/schemas/sailingWithOffers'
        return:
          type: array
          items:
            $ref: '#/components/schemas/sailingWithOffers'
        numberMatched:
          type: integer
        links:
          type: array
          items:
            $ref: './components.yaml#/components/schemas/link'

    sailingWithOffers:
      type: object
      description: A sailing with associated fare offers.
      allOf:
        - $ref: './components.yaml#/components/schemas/sailing'
      properties:
        offers:
          type: array
          items:
            $ref: './components.yaml#/components/schemas/offer'

    priceResult:
      type: object
      description: Itemised price calculation result.
      required: [totalPrice, offerPrices]
      properties:
        totalPrice:
          $ref: './components.yaml#/components/schemas/amountOfMoney'
        offerPrices:
          type: array
          items:
            type: object
            properties:
              offerId:
                $ref: './components.yaml#/components/schemas/uuid'
              price:
                $ref: './components.yaml#/components/schemas/amountOfMoney'
              components:
                type: array
                items:
                  $ref: './components.yaml#/components/schemas/priceComponent'
        discountsApplied:
          type: array
          items:
            type: object
            properties:
              cardId:
                $ref: './components.yaml#/components/schemas/uuid'
              discountAmount:
                $ref: './components.yaml#/components/schemas/amountOfMoney'
              discountRate:
                type: number
                format: float
        expiresAt:
          $ref: './components.yaml#/components/schemas/dateTime'
          description: >
            Expiry time of this price quote. The price is guaranteed until
            this timestamp; after that, a new price enquiry may return
            different amounts.
