openapi: 3.0.3
info:
  title: EUDIT Unified Mobility API – Ferry-Specific
  description: >
    Processes and collections specific to ferry transport, integrating
    **FerryGateway** semantics (the Nordic ferry booking XML standard) with
    the EUDIT unified API model.

    Ferry bookings differ from standard public transport in that passengers
    typically book accommodation (cabins), meals, onboard services (spa, shop,
    entertainment), and land-side services (car rental, hotel transfers) as part
    of a single reservation. This module exposes these as distinct processes on
    top of the base PACKAGE established by the `03-offers.yaml` sailing search
    and `05-purchase.yaml` purchase flows.

    Processes:
    - `book-cabin` — reserve a cabin or accommodation unit on a sailing
    - `update-cabin` — modify a cabin reservation (change cabin type, occupancy)
    - `book-meal` — reserve meals at the onboard restaurant
    - `book-onboard-service` — book onboard services (spa, entertainment, excursions)
    - `book-land-service` — book land-side services associated with a ferry port
    - `book-bus-transfer` — book a bus or shuttle transfer to/from the ferry terminal
    - `cancel-ferry-add-on` — cancel a specific add-on without cancelling the
      whole sailing package

    Collections:
    - `sailings` — available ferry sailings with offer details
    - `vessel-manifest` — passenger and vehicle manifest for a sailing
    - `cabin-types` — available cabin/accommodation types for a vessel
    - `onboard-services` — available onboard service products for a sailing
    - `land-services` — available land-side services at ferry ports

    Transmodel references: SERVICE JOURNEY (ferry), VEHICLE (vessel), PLACE OF
    BOARDING, BOARDING FACILITY, SALES OFFER PACKAGE.
    FerryGateway source: ferrygateway.xsd, wiki/use-cases/ferrygateway.md.
  version: 0.1.0

servers:
  - url: https://api.eudit.example.com/v1

tags:
  - name: Ferry Bookings
    description: Cabin, meal, and onboard service reservations
  - name: Ferry Collections
    description: Sailings, vessel manifest, and available service catalogs

security:
  - BearerAuth: []
  - OAuth: [write]

components:

  securitySchemes:
    BearerAuth:
      $ref: './components.yaml#/components/securitySchemes/BearerAuth'
    OAuth:
      $ref: './components.yaml#/components/securitySchemes/OAuth'
    OAuthPKI:
      $ref: './components.yaml#/components/securitySchemes/OAuthPKI'
    OpenData:
      $ref: './components.yaml#/components/securitySchemes/OpenData'

  schemas:

    # ── Vessel Reference ───────────────────────────────────────────

    vesselReference:
      $ref: './components.yaml#/components/schemas/vesselReference'

    # ── Sailing Reference ─────────────────────────────────────────

    sailingReference:
      type: object
      description: >
        Reference to a specific ferry sailing (departure).
        Transmodel: SERVICE JOURNEY for WATER mode.
        FerryGateway: sailing identifier.
      x-tm: SERVICE JOURNEY
      x-semantics:
        transmodel: SERVICE JOURNEY
        ferrygateway: sailingId
        gtfs: trip_id
      required: [sailingId]
      properties:
        sailingId:
          $ref: './components.yaml#/components/schemas/normalString'
          description: >
            Sailing identifier (e.g. departure date + vessel code +
            route code: `2026-06-15_MS-VIKING-GRACE_HEL-STO`).
        departureDate:
          $ref: './components.yaml#/components/schemas/date'
        departurePort:
          $ref: './components.yaml#/components/schemas/normalString'
          description: UN/LOCODE or operator port code for the departure port.
        arrivalPort:
          $ref: './components.yaml#/components/schemas/normalString'
          description: UN/LOCODE or operator port code for the arrival port.
        vessel:
          $ref: '#/components/schemas/vesselReference'

    # ── Cabin / Accommodation ─────────────────────────────────────

    cabinType:
      type: object
      description: >
        A type of cabin or accommodation unit available on a vessel.
        Transmodel: FACILITY SET / ACCOMMODATION FACILITY.
        FerryGateway: cabinType.
      x-tm: FACILITY SET
      x-semantics:
        transmodel: ACCOMMODATION FACILITY
        ferrygateway: cabinType
      required: [cabinTypeId, name, maxOccupancy, deckLevel]
      properties:
        cabinTypeId:
          $ref: './components.yaml#/components/schemas/normalString'
        name:
          $ref: './components.yaml#/components/schemas/normalString'
          description: >
            Human-readable name (e.g. "Deluxe Sea View Cabin", "Inside Cabin 2-bed").
        description:
          $ref: './components.yaml#/components/schemas/longString'
        maxOccupancy:
          type: integer
          minimum: 1
          description: Maximum number of passengers for this cabin type.
        deckLevel:
          $ref: './components.yaml#/components/schemas/shortString'
          description: Deck number or label (e.g. "7", "UPPER", "PROMENADE").
        amenities:
          type: array
          items:
            $ref: './components.yaml#/components/schemas/shortString'
          description: >
            List of amenity codes (e.g. `SEA_VIEW`, `BALCONY`, `ENSUITE`,
            `ACCESSIBLE`, `PET_FRIENDLY`).
        images:
          type: array
          items:
            $ref: './components.yaml#/components/schemas/url'
        priceFrom:
          $ref: './components.yaml#/components/schemas/amountOfMoney'
          description: Starting price for this cabin type on the sailing.
        availability:
          type: integer
          description: Number of cabins of this type still available.

    cabinTypeCollection:
      type: object
      description: Collection of available cabin types for a vessel/sailing.
      required: [numberMatched, numberReturned, cabinTypes]
      properties:
        numberMatched:
          $ref: './components.yaml#/components/schemas/normalInt'
        numberReturned:
          $ref: './components.yaml#/components/schemas/normalInt'
        cabinTypes:
          type: array
          items:
            $ref: '#/components/schemas/cabinType'

    bookCabinInputs:
      type: object
      description: >
        Inputs for reserving a cabin or accommodation unit on a ferry sailing.
        The sailing and package must already exist (established via
        `03-offers.yaml` search-sailings and `05-purchase.yaml` purchase).
        Transmodel: BOOKING of ACCOMMODATION FACILITY.
        FerryGateway: cabin booking.
      x-tm: BOOKING
      x-semantics:
        transmodel: ACCOMMODATION FACILITY
        ferrygateway: cabinBooking
      required: [packageId, sailingId, cabinTypeId, occupants]
      properties:
        packageId:
          $ref: './components.yaml#/components/schemas/uuid'
        sailingId:
          $ref: './components.yaml#/components/schemas/normalString'
        cabinTypeId:
          $ref: './components.yaml#/components/schemas/normalString'
        occupants:
          type: array
          minItems: 1
          description: List of passengers occupying this cabin.
          items:
            type: object
            required: [travellerRef]
            properties:
              travellerRef:
                $ref: './components.yaml#/components/schemas/uuid'
                description: Reference to a traveller already added to the PACKAGE.
              bedPreference:
                type: string
                enum: [LOWER_BUNK, UPPER_BUNK, DOUBLE, TWIN, SOFA_BED, ANY]
        specialRequests:
          $ref: './components.yaml#/components/schemas/longString'
          description: Free-text special requests (e.g. extra pillow, adjacent cabins).
        accessibilityRequirements:
          type: array
          items:
            $ref: './components.yaml#/components/schemas/shortString'
          description: >
            Accessibility requirement codes (e.g. `WHEELCHAIR`, `HEARING_LOOP`,
            `VISUAL_AID`).

    bookCabinResult:
      type: object
      description: Result of a cabin booking operation.
      required: [cabinBooking]
      properties:
        cabinBooking:
          $ref: './components.yaml#/components/schemas/cabinBooking'

    # ── Meal Booking ──────────────────────────────────────────────

    mealType:
      type: string
      description: >
        Type of meal service on a ferry.
        FerryGateway: mealType.
      enum:
        - BREAKFAST
        - LUNCH
        - DINNER
        - BUFFET
        - A_LA_CARTE
        - BREAKFAST_BUFFET
        - DINNER_BUFFET
        - SNACK
        - CHILDREN_MENU

    bookMealInputs:
      type: object
      description: >
        Inputs for reserving meals at the onboard restaurant.
        Transmodel: FARE PRODUCT for onboard catering.
        FerryGateway: meal booking.
      x-tm: FARE PRODUCT
      x-semantics:
        transmodel: FARE PRODUCT
        ferrygateway: mealBooking
      required: [packageId, sailingId, mealType, date, diners]
      properties:
        packageId:
          $ref: './components.yaml#/components/schemas/uuid'
        sailingId:
          $ref: './components.yaml#/components/schemas/normalString'
        mealType:
          $ref: '#/components/schemas/mealType'
        date:
          $ref: './components.yaml#/components/schemas/date'
          description: Date of the meal (relevant for multi-night sailings).
        preferredTime:
          $ref: './components.yaml#/components/schemas/shortString'
          description: >
            Preferred seating time (e.g. `18:00`, `20:30`). The server confirms
            availability.
        diners:
          type: array
          minItems: 1
          description: Passengers to book meals for.
          items:
            type: object
            required: [travellerRef]
            properties:
              travellerRef:
                $ref: './components.yaml#/components/schemas/uuid'
              dietaryRequirements:
                type: array
                items:
                  $ref: './components.yaml#/components/schemas/shortString'
                description: >
                  Dietary requirement codes (e.g. `VEGETARIAN`, `VEGAN`,
                  `GLUTEN_FREE`, `HALAL`, `KOSHER`, `NUT_ALLERGY`).
        restaurantRef:
          $ref: './components.yaml#/components/schemas/normalString'
          description: >
            Identifier of the specific restaurant if the vessel has multiple
            dining venues.

    bookMealResult:
      type: object
      description: Result of a meal booking operation.
      required: [mealBooking]
      properties:
        mealBooking:
          $ref: './components.yaml#/components/schemas/mealBooking'

    # ── Onboard Service Booking ───────────────────────────────────

    onboardServiceType:
      type: string
      description: Category of onboard service.
      enum:
        - SPA
        - MASSAGE
        - BEAUTY_TREATMENT
        - GYM
        - CINEMA
        - THEATRE
        - CASINO
        - KIDS_CLUB
        - EXCURSION
        - WIFI
        - PARKING_ON_DECK
        - LOUNGE_ACCESS
        - OTHER

    onboardService:
      type: object
      description: >
        An available onboard service product for a sailing.
        FerryGateway: onboardService.
        Transmodel: ANCILLARY SERVICE.
      x-tm: ANCILLARY SERVICE
      x-semantics:
        transmodel: ANCILLARY SERVICE
        ferrygateway: onboardService
      required: [serviceId, serviceType, name, price]
      properties:
        serviceId:
          $ref: './components.yaml#/components/schemas/normalString'
        serviceType:
          $ref: '#/components/schemas/onboardServiceType'
        name:
          $ref: './components.yaml#/components/schemas/normalString'
        description:
          $ref: './components.yaml#/components/schemas/longString'
        price:
          $ref: './components.yaml#/components/schemas/amountOfMoney'
        pricePerPerson:
          type: boolean
          description: >
            `true` if the price is per person; `false` if it is a flat booking fee.
        availability:
          type: integer
          description: Remaining slots/capacity for this service.
        requiresPreBooking:
          type: boolean
          description: Whether this service must be booked in advance (vs. walk-up).

    onboardServiceCollection:
      type: object
      description: Collection of available onboard services for a sailing.
      required: [numberMatched, numberReturned, services]
      properties:
        numberMatched:
          $ref: './components.yaml#/components/schemas/normalInt'
        numberReturned:
          $ref: './components.yaml#/components/schemas/normalInt'
        services:
          type: array
          items:
            $ref: '#/components/schemas/onboardService'

    bookOnboardServiceInputs:
      type: object
      description: >
        Inputs for booking an onboard service on a ferry sailing.
        Transmodel: BOOKING of ANCILLARY SERVICE.
        FerryGateway: onboardServiceBooking.
      x-tm: BOOKING
      x-semantics:
        transmodel: ANCILLARY SERVICE
        ferrygateway: onboardServiceBooking
      required: [packageId, sailingId, serviceId]
      properties:
        packageId:
          $ref: './components.yaml#/components/schemas/uuid'
        sailingId:
          $ref: './components.yaml#/components/schemas/normalString'
        serviceId:
          $ref: './components.yaml#/components/schemas/normalString'
        travellerRefs:
          type: array
          items:
            $ref: './components.yaml#/components/schemas/uuid'
          description: >
            Travellers to book the service for. If omitted, the booking is for
            the whole party.
        preferredDate:
          $ref: './components.yaml#/components/schemas/date'
        preferredTime:
          $ref: './components.yaml#/components/schemas/shortString'
        specialRequests:
          $ref: './components.yaml#/components/schemas/normalString'

    bookOnboardServiceResult:
      type: object
      description: Result of an onboard service booking.
      required: [serviceBooking]
      properties:
        serviceBooking:
          $ref: './components.yaml#/components/schemas/onboardServiceBooking'

    # ── Land Service Booking ──────────────────────────────────────

    landServiceType:
      type: string
      description: Category of land-side service.
      enum:
        - CAR_RENTAL
        - HOTEL
        - BUS_TRANSFER
        - TAXI_TRANSFER
        - AIRPORT_TRANSFER
        - TOUR
        - PARKING
        - LUGGAGE_STORAGE
        - OTHER

    landService:
      type: object
      description: >
        A land-side service available at a ferry port.
        FerryGateway: landService.
        Transmodel: SUPPLEMENTARY SERVICE.
      x-tm: SUPPLEMENTARY SERVICE
      x-semantics:
        transmodel: SUPPLEMENTARY SERVICE
        ferrygateway: landService
      required: [serviceId, serviceType, name, portRef]
      properties:
        serviceId:
          $ref: './components.yaml#/components/schemas/normalString'
        serviceType:
          $ref: '#/components/schemas/landServiceType'
        name:
          $ref: './components.yaml#/components/schemas/normalString'
        description:
          $ref: './components.yaml#/components/schemas/longString'
        portRef:
          $ref: './components.yaml#/components/schemas/normalString'
          description: Port where this land service is available.
        priceFrom:
          $ref: './components.yaml#/components/schemas/amountOfMoney'
        provider:
          $ref: './components.yaml#/components/schemas/normalString'
          description: Name of the service provider.

    landServiceCollection:
      type: object
      description: Collection of available land services at a port.
      required: [numberMatched, numberReturned, services]
      properties:
        numberMatched:
          $ref: './components.yaml#/components/schemas/normalInt'
        numberReturned:
          $ref: './components.yaml#/components/schemas/normalInt'
        services:
          type: array
          items:
            $ref: '#/components/schemas/landService'

    bookLandServiceInputs:
      type: object
      description: >
        Inputs for booking a land-side service associated with a ferry port
        (e.g. car rental, hotel, tour).
        FerryGateway: landServiceBooking.
      x-tm: SUPPLEMENTARY SERVICE
      x-semantics:
        transmodel: SUPPLEMENTARY SERVICE
        ferrygateway: landServiceBooking
      required: [packageId, sailingId, serviceId, portRef, serviceDate]
      properties:
        packageId:
          $ref: './components.yaml#/components/schemas/uuid'
        sailingId:
          $ref: './components.yaml#/components/schemas/normalString'
        serviceId:
          $ref: './components.yaml#/components/schemas/normalString'
        portRef:
          $ref: './components.yaml#/components/schemas/normalString'
          description: >
            Port where the land service is to be used (departure or arrival port).
        serviceDate:
          $ref: './components.yaml#/components/schemas/date'
        travellerRefs:
          type: array
          items:
            $ref: './components.yaml#/components/schemas/uuid'
        vehicleReg:
          $ref: './components.yaml#/components/schemas/shortString'
          description: Vehicle registration plate (for car rental/parking services).
        specialRequests:
          $ref: './components.yaml#/components/schemas/normalString'

    bookLandServiceResult:
      type: object
      description: Result of a land service booking.
      required: [serviceBooking]
      properties:
        serviceBooking:
          $ref: './components.yaml#/components/schemas/landServiceBooking'

    # ── Bus Transfer Booking ──────────────────────────────────────

    bookBusTransferInputs:
      type: object
      description: >
        Inputs for booking a bus or shuttle transfer to/from the ferry terminal.
        FerryGateway: bus transfer booking.
        Transmodel: CONNECTING JOURNEY.
      x-tm: CONNECTING JOURNEY
      x-semantics:
        transmodel: CONNECTING JOURNEY
        ferrygateway: busTransfer
      required: [packageId, sailingId, direction, portRef, passengers]
      properties:
        packageId:
          $ref: './components.yaml#/components/schemas/uuid'
        sailingId:
          $ref: './components.yaml#/components/schemas/normalString'
        direction:
          type: string
          enum: [TO_PORT, FROM_PORT]
          description: >
            `TO_PORT` — transfer from a city stop/hotel to the ferry terminal.
            `FROM_PORT` — transfer from the ferry terminal to a city destination.
        portRef:
          $ref: './components.yaml#/components/schemas/normalString'
          description: The ferry terminal port.
        pickupRef:
          $ref: './components.yaml#/components/schemas/normalString'
          description: >
            Identifier of the pick-up/drop-off location (bus stop, hotel, etc.).
        serviceDate:
          $ref: './components.yaml#/components/schemas/date'
        passengers:
          type: array
          minItems: 1
          items:
            $ref: './components.yaml#/components/schemas/uuid'
          description: Traveller references from the PACKAGE.

    bookBusTransferResult:
      type: object
      description: Result of a bus transfer booking.
      required: [serviceBooking]
      properties:
        serviceBooking:
          $ref: './components.yaml#/components/schemas/landServiceBooking'

    # ── Cancel Ferry Add-On ───────────────────────────────────────

    cancelFerryAddOnInputs:
      type: object
      description: >
        Inputs for cancelling a specific ferry add-on (cabin, meal, onboard
        service, or land service) without cancelling the whole sailing package.
        Transmodel: cancellation of individual ANCILLARY SERVICE or
        ACCOMMODATION booking.
      required: [packageId, addOnType, addOnBookingId]
      properties:
        packageId:
          $ref: './components.yaml#/components/schemas/uuid'
        addOnType:
          type: string
          enum: [CABIN, MEAL, ONBOARD_SERVICE, LAND_SERVICE, BUS_TRANSFER]
          description: Type of add-on to cancel.
        addOnBookingId:
          $ref: './components.yaml#/components/schemas/normalString'
          description: >
            Booking identifier of the specific add-on (returned in the
            `bookCabin`, `bookMeal`, etc. result).
        reason:
          $ref: './components.yaml#/components/schemas/normalString'

    cancelFerryAddOnResult:
      type: object
      description: Result of a ferry add-on cancellation.
      required: [cancelled, refundEligible]
      properties:
        cancelled:
          type: boolean
        addOnBookingId:
          $ref: './components.yaml#/components/schemas/normalString'
        refundEligible:
          type: boolean
        refundAmount:
          $ref: './components.yaml#/components/schemas/amountOfMoney'

    # ── Vessel Manifest ───────────────────────────────────────────

    vesselManifest:
      $ref: './components.yaml#/components/schemas/vesselManifest'

    # ── Ferry Booking Details ─────────────────────────────────────

    ferryBookingDetails:
      $ref: './components.yaml#/components/schemas/ferryBookingDetails'

    # ── Sailing Collection ─────────────────────────────────────────

    sailingCollection:
      type: object
      description: >
        Paginated collection of available ferry sailings with offer information.
        Transmodel: SERVICE JOURNEYs for WATER mode.
      required: [numberMatched, numberReturned, sailings]
      properties:
        numberMatched:
          $ref: './components.yaml#/components/schemas/normalInt'
        numberReturned:
          $ref: './components.yaml#/components/schemas/normalInt'
        sailings:
          type: array
          items:
            $ref: './components.yaml#/components/schemas/sailing'

paths:

  # ─────────────────────────────────────────────────────────────────
  # Ferry Booking Processes
  # ─────────────────────────────────────────────────────────────────

  /processes/book-cabin/execute:
    post:
      operationId: executeBookCabin
      summary: Book Cabin
      description: >
        Reserves a cabin or accommodation unit on a ferry sailing for the
        specified occupants. The sailing must already be part of a confirmed or
        pending PACKAGE.

        The server checks availability, assigns a specific cabin number if
        available, and returns the cabin booking record. An additional charge
        is added to the PACKAGE's financial detail.

        Transmodel: BOOKING of ACCOMMODATION FACILITY on SERVICE JOURNEY.
        FerryGateway: cabinBooking.
      tags: [Ferry Bookings]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  $ref: '#/components/schemas/bookCabinInputs'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        '200':
          description: Cabin reserved successfully.
          headers:
            Version:
              $ref: './components.yaml#/components/headers/Version'
            Content-Language:
              $ref: './components.yaml#/components/headers/Content-Language'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bookCabinResult'
        '201':
          description: Job accepted for asynchronous processing.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '409':
          description: >
            Conflict — no cabins of the requested type are available, or the
            PACKAGE is in a state that does not allow modifications.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/errorResponse'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Async callback — cabin booked
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/bookCabinResult'
              responses:
                '200':
                  description: Callback received.

  /processes/update-cabin/execute:
    post:
      operationId: executeUpdateCabin
      summary: Update Cabin Reservation
      description: >
        Modifies an existing cabin reservation (e.g. change cabin type, number
        of occupants, or special requests). Subject to availability and fare
        conditions. If a higher-grade cabin is selected, an additional charge
        applies.
        FerryGateway: cabin reservation update.
      tags: [Ferry Bookings]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [packageId, cabinBookingId]
                  allOf:
                    - $ref: '#/components/schemas/bookCabinInputs'
                  properties:
                    cabinBookingId:
                      $ref: './components.yaml#/components/schemas/normalString'
                      description: ID of the existing cabin booking to update.
      responses:
        '200':
          description: Cabin reservation updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bookCabinResult'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '409':
          description: No availability for the requested cabin change.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/errorResponse'

  /processes/book-meal/execute:
    post:
      operationId: executeBookMeal
      summary: Book Meal
      description: >
        Reserves meals at the onboard restaurant for the specified passengers
        and date. For multi-night sailings, one booking is required per dinner
        service.

        Transmodel: BOOKING of CATERING FACILITY.
        FerryGateway: mealBooking.
      tags: [Ferry Bookings]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  $ref: '#/components/schemas/bookMealInputs'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        '200':
          description: Meal reserved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bookMealResult'
        '201':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '409':
          description: Fully booked for the requested time.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/errorResponse'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Async callback — meal booked
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/bookMealResult'
              responses:
                '200':
                  description: Callback received.

  /processes/book-onboard-service/execute:
    post:
      operationId: executeBookOnboardService
      summary: Book Onboard Service
      description: >
        Reserves an onboard service (spa, entertainment, excursion, etc.) for
        the specified passengers. Subject to availability and advance booking
        requirements.

        Transmodel: BOOKING of ANCILLARY SERVICE.
        FerryGateway: onboardServiceBooking.
      tags: [Ferry Bookings]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  $ref: '#/components/schemas/bookOnboardServiceInputs'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        '200':
          description: Onboard service booked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bookOnboardServiceResult'
        '201':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '409':
          description: Service fully booked or not available for the requested time.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/errorResponse'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Async callback — onboard service booked
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/bookOnboardServiceResult'
              responses:
                '200':
                  description: Callback received.

  /processes/book-land-service/execute:
    post:
      operationId: executeBookLandService
      summary: Book Land Service
      description: >
        Reserves a land-side service at a ferry port (e.g. car rental, hotel,
        guided tour). The service is associated with the PACKAGE's sailing and
        charged to the same payment method.

        Transmodel: BOOKING of SUPPLEMENTARY SERVICE.
        FerryGateway: landServiceBooking.
      tags: [Ferry Bookings]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  $ref: '#/components/schemas/bookLandServiceInputs'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        '200':
          description: Land service booked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bookLandServiceResult'
        '201':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '409':
          description: Service unavailable for the requested date/passengers.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/errorResponse'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Async callback — land service booked
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/bookLandServiceResult'
              responses:
                '200':
                  description: Callback received.

  /processes/book-bus-transfer/execute:
    post:
      operationId: executeBookBusTransfer
      summary: Book Bus Transfer
      description: >
        Books a bus or shuttle transfer connecting the ferry terminal to a city
        location. Can be for arrival (`FROM_PORT`) or departure (`TO_PORT`).

        Transmodel: CONNECTING JOURNEY.
        FerryGateway: bus transfer booking.
      tags: [Ferry Bookings]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  $ref: '#/components/schemas/bookBusTransferInputs'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        '200':
          description: Bus transfer booked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bookBusTransferResult'
        '201':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '409':
          description: Transfer fully booked for the requested route/time.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/errorResponse'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Async callback — bus transfer booked
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/bookBusTransferResult'
              responses:
                '200':
                  description: Callback received.

  /processes/cancel-ferry-add-on/execute:
    post:
      operationId: executeCancelFerryAddOn
      summary: Cancel Ferry Add-On
      description: >
        Cancels a specific ferry add-on (cabin, meal, onboard service, land
        service, or bus transfer) without cancelling the whole sailing package.
        Subject to the fare conditions of the add-on. A refund may be applicable
        depending on the cancellation policy.

        Transmodel: cancellation of individual ANCILLARY SERVICE booking.
      tags: [Ferry Bookings]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  $ref: '#/components/schemas/cancelFerryAddOnInputs'
      responses:
        '200':
          description: Add-on cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cancelFerryAddOnResult'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'
        '409':
          description: Cancellation not permitted by fare conditions.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/errorResponse'

  # ─────────────────────────────────────────────────────────────────
  # Collections
  # ─────────────────────────────────────────────────────────────────

  /collections/sailings/items:
    get:
      operationId: getFerrySailings
      summary: Get Ferry Sailings
      description: >
        Returns available ferry sailings matching the specified route and date
        criteria. This is the read-only collection companion to the
        `search-sailings` process in `03-offers.yaml`.

        Results include vessel details, departure/arrival times, and summary
        pricing. Use `search-sailings` for the full offer search with
        passenger-specific pricing.

        Transmodel: SERVICE JOURNEYs for WATER mode.
        FerryGateway: sailing list.
      tags: [Ferry Collections]
      security:
        - OpenData: []
        - BearerAuth: []
      parameters:
        - name: departurePort
          in: query
          required: false
          schema:
            type: string
          description: UN/LOCODE or operator port code for departure port.
        - name: arrivalPort
          in: query
          required: false
          schema:
            type: string
          description: UN/LOCODE or operator port code for arrival port.
        - name: departureDate
          in: query
          required: false
          schema:
            $ref: './components.yaml#/components/schemas/date'
          description: Filter sailings departing on this date.
        - name: departureDateFrom
          in: query
          required: false
          schema:
            $ref: './components.yaml#/components/schemas/date'
        - name: departureDateUntil
          in: query
          required: false
          schema:
            $ref: './components.yaml#/components/schemas/date'
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: List of ferry sailings.
          headers:
            Version:
              $ref: './components.yaml#/components/headers/Version'
            Content-Language:
              $ref: './components.yaml#/components/headers/Content-Language'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sailingCollection'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'

  /collections/vessel-manifest/items:
    get:
      operationId: getVesselManifest
      summary: Get Vessel Manifest
      description: >
        Returns the passenger and vehicle manifest for a specific sailing.
        Access is restricted to operators and port authorities. The manifest
        lists all confirmed bookings with passenger names, cabin assignments,
        vehicle registrations, and special requirements.

        Transmodel: VEHICLE JOURNEY manifest / boarding list.
        FerryGateway: vesselManifest.
      tags: [Ferry Collections]
      security:
        - BearerAuth: []
        - OAuth: [admin]
      parameters:
        - name: sailingId
          in: query
          required: true
          schema:
            type: string
          description: Sailing identifier to retrieve the manifest for.
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
      responses:
        '200':
          description: Vessel manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vesselManifest'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/403Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/404NotFound'

  /collections/cabin-types/items:
    get:
      operationId: getCabinTypes
      summary: Get Cabin Types
      description: >
        Returns available cabin/accommodation types for a vessel or sailing,
        with pricing and availability.
        Transmodel: ACCOMMODATION FACILITY types.
        FerryGateway: cabinType catalog.
      tags: [Ferry Collections]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - name: sailingId
          in: query
          required: false
          schema:
            type: string
        - name: vesselId
          in: query
          required: false
          schema:
            type: string
        - name: accessible
          in: query
          required: false
          schema:
            type: boolean
          description: If true, return only wheelchair-accessible cabin types.
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: List of cabin types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cabinTypeCollection'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'

  /collections/onboard-services/items:
    get:
      operationId: getOnboardServices
      summary: Get Onboard Services
      description: >
        Returns available onboard service products for a sailing (spa, restaurant
        slots, entertainment, excursions, etc.).
        Transmodel: ANCILLARY SERVICE catalog.
        FerryGateway: onboard service catalog.
      tags: [Ferry Collections]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - name: sailingId
          in: query
          required: true
          schema:
            type: string
        - name: serviceType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/onboardServiceType'
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: List of available onboard services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/onboardServiceCollection'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'

  /collections/land-services/items:
    get:
      operationId: getLandServices
      summary: Get Land Services
      description: >
        Returns available land-side services at a ferry port (car rental,
        hotel packages, tours, transfers).
        Transmodel: SUPPLEMENTARY SERVICE catalog.
        FerryGateway: land service catalog.
      tags: [Ferry Collections]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - name: portRef
          in: query
          required: true
          schema:
            type: string
          description: Port code to retrieve land services for.
        - name: serviceDate
          in: query
          required: false
          schema:
            $ref: './components.yaml#/components/schemas/date'
        - name: serviceType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/landServiceType'
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: List of available land services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/landServiceCollection'
        '400':
          $ref: './components.yaml#/components/responses/400BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/401Unauthorized'
