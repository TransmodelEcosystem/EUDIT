openapi: 3.0.3
info:
  title: EUDIT Unified Mobility API – After Sales
  description: >
    Processes and collections for post-purchase operations: cancellation,
    refunds, exchanges, reimbursements, and financial overviews.

    Processes:
    - `cancel-package` — cancel a confirmed PACKAGE (full or partial)
    - `claim-redress-option` — claim a redress option after disruption
    - `confirm-redress-option` — confirm a claimed redress option
    - `exchange-package` — exchange a booking for a different service
    - `refund-deposit` — refund a deposit payment
    - `claim-refund-option` — request refund options for a cancellation
    - `confirm-refund-option` — confirm selected refund method
    - `reimbursement` — submit a reimbursement claim (EU Passenger Rights)

    Collections:
    - `refund-options` — available refund options for a cancelled/disrupted PACKAGE
    - `payment-overview` — financial summary of a PACKAGE
    - `invoices` — invoices and receipts for completed transactions
  version: 0.1.0

servers:
  - url: https://api.eudit.example.com/v1

tags:
  - name: After Sales
    description: Cancellation, refunds, exchanges, and reimbursements

paths:

  /processes/cancel-package/execute:
    post:
      operationId: executeCancelPackage
      summary: Cancel Package
      description: >
        Cancels a confirmed PACKAGE. The PACKAGE transitions to `cancelled`.
        If the fare conditions permit a refund, refund options are returned
        (or the customer may query `GET /collections/refund-options/items`).

        Partial cancellation (cancelling individual LEGs) is supported by
        supplying `legIds`.

        Transmodel: CANCELLATION of PACKAGE.
        OSDM equivalent: DELETE /bookings/{id} or DELETE /booked-offers/{id}.
        TOMP-API equivalent: POST /processes/cancel-package/execution.
        OMSA equivalent: POST /processes/cancel-package/execute.
      tags: [After Sales]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [packageId]
                  properties:
                    packageId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    legIds:
                      type: array
                      items:
                        $ref: './components.yaml#/components/schemas/uuid'
                      description: >
                        Specific legs to cancel. If omitted, the entire
                        PACKAGE is cancelled.
                    travellerIds:
                      type: array
                      items:
                        $ref: './components.yaml#/components/schemas/uuid'
                      description: >
                        Specific travellers to cancel for (group partial
                        cancellation). If omitted, all travellers are
                        cancelled.
                    reason:
                      type: string
                      enum:
                        - CUSTOMER_REQUEST
                        - MISSED_CONNECTION
                        - DISRUPTION
                        - STRIKE
                        - ILLNESS
                        - BEREAVEMENT
                        - OTHER
                    reasonDescription:
                      $ref: './components.yaml#/components/schemas/normalString'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Cancellation result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/cancellationResult'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Package cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cancellationResult'
        "201":
          description: Async job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "409":
          $ref: './components.yaml#/components/responses/409Conflict'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/claim-redress-option/execute:
    post:
      operationId: executeClaimRedressOption
      summary: Claim Redress Option
      description: >
        Claims a redress option (e.g. alternative journey, refund under
        EU Regulation 1371/2007 / 2021/782) following a service disruption.

        Transmodel: GUARANTEE claim / REFUND claim under passenger rights.
        TOMP-API equivalent: POST /processes/claim-redress-option/execution.
        OMSA equivalent: POST /processes/claim-redress-option/execute.
      tags: [After Sales]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [packageId, guaranteeType]
                  properties:
                    packageId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    legId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    guaranteeType:
                      type: string
                      enum:
                        - ALTERNATIVE_JOURNEY
                        - HOME_LEG
                        - RETURN_TO_ORIGIN
                        - REFUND_WHEN_CANCELLED
                        - REFUND_UNUSED_ANCILLARIES
                        - PASSENGER_SUPPORT
                        - MOBILITY_ASSISTANCE
                        - OTHER
                    disruption:
                      $ref: '#/components/schemas/disruptionInfo'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Redress option claim callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: './components.yaml#/components/schemas/refundOptionCollection'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Redress options returned.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/refundOptionCollection'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/confirm-redress-option/execute:
    post:
      operationId: executeConfirmRedressOption
      summary: Confirm Redress Option
      description: >
        Confirms a redress option selected by the customer. Triggers the
        chosen remedy (rebook, refund, voucher issuance, etc.).

        Transmodel: GUARANTEE confirmation.
        TOMP-API equivalent: POST /processes/confirm-redress-option/execution.
        OMSA equivalent: POST /processes/confirm-redress-option/execute.
      tags: [After Sales]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [packageId, redressOptionId]
                  properties:
                    packageId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    redressOptionId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    bankDetails:
                      $ref: '#/components/schemas/bankDetails'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        "200":
          description: Redress option confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/redressConfirmationResult'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "409":
          $ref: './components.yaml#/components/responses/409Conflict'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/exchange-package/execute:
    post:
      operationId: executeExchangePackage
      summary: Exchange Package
      description: >
        Exchanges a confirmed PACKAGE for a new booking on a different
        service. The original booking is cancelled and a new one created,
        with any exchange fee applied.

        Transmodel: EXCHANGE of PACKAGE.
        OSDM equivalent: POST /exchanges.
        OMSA equivalent: POST /processes/exchange-package/execute.
      tags: [After Sales]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-async
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [packageId, newTravelSpecification]
                  properties:
                    packageId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    legId:
                      $ref: './components.yaml#/components/schemas/uuid'
                      description: Specific leg to exchange. Omit for full exchange.
                    newTravelSpecification:
                      $ref: './components.yaml#/components/schemas/travelSpecification'
                    newOfferId:
                      $ref: './components.yaml#/components/schemas/uuid'
                      description: >
                        If provided, use this specific offer for the exchange.
                        Otherwise the system finds the best available offer.
                    payment:
                      $ref: './components.yaml#/components/schemas/paymentInstruction'
                      description: Payment for any exchange fee difference.
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Exchange result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/exchangeResult'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Exchange completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exchangeResult'
        "201":
          description: Async job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "409":
          $ref: './components.yaml#/components/responses/409Conflict'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/refund-deposit/execute:
    post:
      operationId: executeRefundDeposit
      summary: Refund Deposit
      description: >
        Refunds a deposit (security deposit, pre-authorisation) after the
        service has been completed without damage.

        Transmodel: REFUND of DEPOSIT.
        TOMP-API equivalent: POST /processes/refund-deposit/execution.
        OMSA equivalent: POST /processes/refund-deposit/execute.
      tags: [After Sales]
      security:
        - BearerAuth: []
        - OAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [packageId]
                  properties:
                    packageId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    legId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    amount:
                      $ref: './components.yaml#/components/schemas/amountOfMoney'
                      description: Amount to refund. If omitted, the full deposit is refunded.
                    reason:
                      $ref: './components.yaml#/components/schemas/normalString'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        "200":
          description: Deposit refund initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/refundTransactionResult'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "409":
          $ref: './components.yaml#/components/responses/409Conflict'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/claim-refund-option/execute:
    post:
      operationId: executeClaimRefundOption
      summary: Claim Refund Option
      description: >
        Requests the list of refund options available for a cancelled or
        eligible booking. Returns refund amounts, methods, and conditions.

        Transmodel: REFUND options query.
        OSDM equivalent: GET /refunds (options).
        OMSA equivalent: POST /processes/claim-refund-option/execute.
      tags: [After Sales]
      security:
        - BearerAuth: []
        - OAuth: [read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [packageId]
                  properties:
                    packageId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    legIds:
                      type: array
                      items:
                        $ref: './components.yaml#/components/schemas/uuid'
                    travellerIds:
                      type: array
                      items:
                        $ref: './components.yaml#/components/schemas/uuid'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        "200":
          description: Refund options returned.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/refundOptionCollection'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/confirm-refund-option/execute:
    post:
      operationId: executeConfirmRefundOption
      summary: Confirm Refund Option
      description: >
        Confirms the customer's chosen refund method and triggers the
        refund transaction. The PACKAGE transitions to `refund_claimed`
        and subsequently `refunded`.

        Transmodel: REFUND confirmation.
        OSDM equivalent: POST /refunds.
        OMSA equivalent: POST /processes/confirm-refund-option/execute.
      tags: [After Sales]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-async
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [packageId, refundOptionId]
                  properties:
                    packageId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    refundOptionId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    bankDetails:
                      $ref: '#/components/schemas/bankDetails'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Refund confirmation result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/refundTransactionResult'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Refund confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/refundTransactionResult'
        "201":
          description: Async job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "409":
          $ref: './components.yaml#/components/responses/409Conflict'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/reimbursement/execute:
    post:
      operationId: executeReimbursement
      summary: Reimbursement Claim
      description: >
        Submits a reimbursement claim under EU Passenger Rights regulations
        (e.g. Rail Reg. 2021/782, Air Reg. 261/2004, Maritime Reg. 1177/2010).
        Covers delays, cancellations, and missed connections.

        Transmodel: REIMBURSEMENT claim.
        OSDM equivalent: POST /reimbursement-management.
      tags: [After Sales]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-async
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [packageId, claimType]
                  properties:
                    packageId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    legId:
                      $ref: './components.yaml#/components/schemas/uuid'
                    claimType:
                      type: string
                      enum:
                        - DELAY_COMPENSATION
                        - CANCELLATION_REFUND
                        - MISSED_CONNECTION
                        - DENIED_BOARDING
                        - DOWNGRADE_REFUND
                        - OTHER
                    regulation:
                      type: string
                      enum:
                        - RAIL_2021_782
                        - AIR_261_2004
                        - MARITIME_1177_2010
                        - BUS_181_2011
                        - OTHER
                    delayMinutes:
                      type: integer
                      minimum: 0
                      description: Actual delay at destination in minutes.
                    evidenceUrls:
                      type: array
                      items:
                        $ref: './components.yaml#/components/schemas/url'
                      description: URLs of supporting evidence documents.
                    bankDetails:
                      $ref: '#/components/schemas/bankDetails'
                    contactEmail:
                      type: string
                      format: email
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Reimbursement claim result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/reimbursementResult'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Reimbursement claim submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reimbursementResult'
        "201":
          description: Async job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /collections/refund-options/items:
    get:
      operationId: getRefundOptions
      summary: Get refund options
      description: >
        Returns available REFUND OPTIONs for a cancelled or eligible PACKAGE.
        Transmodel: REFUND.
      tags: [After Sales]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
      responses:
        "200":
          description: Refund options returned.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/refundOptionCollection'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /collections/payment-overview/items:
    get:
      operationId: getPaymentOverview
      summary: Get payment overview
      description: >
        Returns the financial summary for a PACKAGE, including all
        transactions (payments, refunds, fees).
        Transmodel: SALES TRANSACTION summary.
      tags: [After Sales]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
      responses:
        "200":
          description: Payment overview returned.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/financialDetail'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /collections/invoices/items:
    get:
      operationId: getInvoices
      summary: Get invoices
      description: >
        Returns invoices and receipts for completed purchase transactions.
      tags: [After Sales]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/packageId'
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
      responses:
        "200":
          description: Invoices returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/invoice'
                  numberMatched:
                    type: integer
                  numberReturned:
                    type: integer
                  links:
                    type: array
                    items:
                      $ref: './components.yaml#/components/schemas/link'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

components:

  securitySchemes:
    BearerAuth:
      $ref: './components.yaml#/components/securitySchemes/BearerAuth'
    OAuth:
      $ref: './components.yaml#/components/securitySchemes/OAuth'

  schemas:

    cancellationResult:
      type: object
      description: Result of a package cancellation.
      required: [package]
      properties:
        package:
          $ref: './components.yaml#/components/schemas/package'
        refundOptions:
          $ref: './components.yaml#/components/schemas/refundOptionCollection'
        cancellationFee:
          $ref: './components.yaml#/components/schemas/amountOfMoney'

    disruptionInfo:
      type: object
      description: Information about a service disruption.
      properties:
        type:
          type: string
          enum: [CANCELLATION, DELAY, MISSED_CONNECTION, STRIKE, WEATHER, OTHER]
        delayMinutes:
          type: integer
          minimum: 0
        affectedLegId:
          $ref: './components.yaml#/components/schemas/uuid'
        operatorReference:
          $ref: './components.yaml#/components/schemas/normalString'
        description:
          $ref: './components.yaml#/components/schemas/longString'

    redressConfirmationResult:
      type: object
      description: Result of confirming a redress option.
      required: [status]
      properties:
        status:
          type: string
          enum: [processing, confirmed, rejected]
        newPackage:
          $ref: './components.yaml#/components/schemas/package'
          description: New PACKAGE created for an alternative journey redress.
        refundTransaction:
          $ref: '#/components/schemas/refundTransactionResult'
        guarantee:
          $ref: './components.yaml#/components/schemas/guarantee'

    exchangeResult:
      type: object
      description: Result of a package exchange.
      required: [newPackage]
      properties:
        originalPackageId:
          $ref: './components.yaml#/components/schemas/uuid'
        newPackage:
          $ref: './components.yaml#/components/schemas/package'
        exchangeFee:
          $ref: './components.yaml#/components/schemas/amountOfMoney'
        fareDifference:
          $ref: './components.yaml#/components/schemas/amountOfMoney'
        travelDocuments:
          type: array
          items:
            $ref: './components.yaml#/components/schemas/travelDocument'

    refundTransactionResult:
      type: object
      description: Result of a refund transaction.
      required: [status, amount]
      properties:
        transactionId:
          $ref: './components.yaml#/components/schemas/uuid'
        status:
          type: string
          enum: [initiated, processing, completed, failed]
        amount:
          $ref: './components.yaml#/components/schemas/amountOfMoney'
        method:
          type: string
          enum: [ORIGINAL_PAYMENT, BANK_TRANSFER, VOUCHER, CASH, CREDIT_NOTE, OTHER]
        estimatedProcessingDays:
          type: integer
        voucherCode:
          $ref: './components.yaml#/components/schemas/normalString'

    reimbursementResult:
      type: object
      description: Result of submitting a reimbursement claim.
      required: [claimId, status]
      properties:
        claimId:
          $ref: './components.yaml#/components/schemas/uuid'
        status:
          type: string
          enum: [submitted, under_review, approved, rejected, paid]
        claimAmount:
          $ref: './components.yaml#/components/schemas/amountOfMoney'
        estimatedDecisionDate:
          $ref: './components.yaml#/components/schemas/date'
        referenceNumber:
          $ref: './components.yaml#/components/schemas/normalString'

    bankDetails:
      type: object
      description: Bank account details for refund disbursement.
      properties:
        accountHolderName:
          $ref: './components.yaml#/components/schemas/normalString'
        iban:
          $ref: './components.yaml#/components/schemas/normalString'
        bic:
          $ref: './components.yaml#/components/schemas/shortString'
        bankName:
          $ref: './components.yaml#/components/schemas/normalString'

    invoice:
      type: object
      description: Invoice or receipt for a purchase transaction.
      required: [id, issuedAt, totalAmount]
      properties:
        id:
          $ref: './components.yaml#/components/schemas/uuid'
        packageId:
          $ref: './components.yaml#/components/schemas/uuid'
        invoiceNumber:
          $ref: './components.yaml#/components/schemas/normalString'
        issuedAt:
          $ref: './components.yaml#/components/schemas/dateTime'
        totalAmount:
          $ref: './components.yaml#/components/schemas/amountOfMoney'
        vatAmount:
          $ref: './components.yaml#/components/schemas/amountOfMoney'
        issuer:
          $ref: './components.yaml#/components/schemas/organisationReference'
        recipient:
          $ref: './components.yaml#/components/schemas/postalAddress'
        downloadUrl:
          $ref: './components.yaml#/components/schemas/url'
