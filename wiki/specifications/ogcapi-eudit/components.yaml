          items:
            $ref: '#/components/schemas/cabinBooking'
        meals:
          type: array
          items:
            $ref: '#/components/schemas/mealBooking'
        onboardServices:
          type: array
          items:
            $ref: '#/components/schemas/onboardServiceBooking'
        landServices:
          type: array
          items:
            $ref: '#/components/schemas/landServiceBooking'

    cabinBooking:
      type: object
      description: A booked cabin on a ferry.
      properties:
        cabinId:
          $ref: '#/components/schemas/normalString'
        cabinType:
          type: string
          enum: [INSIDE_2, INSIDE_4, OUTSIDE_2, OUTSIDE_4, SUITE, ACCESSIBLE]
        deckNumber:
          type: integer
        occupants:
          type: array
          items:
            $ref: '#/components/schemas/travellerReference'

    mealBooking:
      type: object
      description: A pre-booked meal on a ferry.
      properties:
        mealType:
          type: string
          enum: [BREAKFAST, LUNCH, DINNER, SNACK]
        restaurantId:
          $ref: '#/components/schemas/normalString'
        seating:
          $ref: '#/components/schemas/dateTime'
        numberOfCovers:
          type: integer
        dietaryRequirements:
          type: array
          items:
            type: string

    onboardServiceBooking:
      type: object
      description: A booked onboard service (spa, entertainment, etc.).
      properties:
        serviceId:
          $ref: '#/components/schemas/normalString'
        serviceName:
          $ref: '#/components/schemas/normalString'
        scheduledAt:
          $ref: '#/components/schemas/dateTime'
        occupants:
          type: array
          items:
            $ref: '#/components/schemas/travellerReference'

    landServiceBooking:
      type: object
      description: A booked land-side service associated with a ferry trip.
      properties:
        serviceId:
          $ref: '#/components/schemas/normalString'
        serviceType:
          type: string
          enum: [BUS_TRANSFER, CAR_RENTAL, HOTEL, EXCURSION, PARKING, OTHER]
        serviceDate:
          $ref: '#/components/schemas/date'
        pickupPoint:
          $ref: '#/components/schemas/placeReference'
        price:
          $ref: '#/components/schemas/amountOfMoney'

    # ── Support / notifications ───────────────────────────────────

    supportType:
      type: string
      description: >
        Classification of the support request.
        TOMP-API source: supportType enum. Transmodel: COMPLAINT TYPE.
      x-tm: COMPLAINT
      x-semantics:
        Transmodel: COMPLAINT
        TOMP: supportType
      enum:
        - BROKEN_DOWN
        - NOT_AT_LOCATION
        - MISSING_AFTER_PAUSE
        - NOT_CLEAN
        - NOT_AVAILABLE
        - UNABLE_TO_OPEN
        - UNABLE_TO_CLOSE
        - ACCIDENT
        - REPORT_DAMAGE
        - REQUEST_ASSISTANCE
        - EVIDENCE
        - OTHER

    supportPriority:
      type: string
      description: >
        Priority level of the support ticket.
        ERROR_CANNOT_CONTINUE means the traveller is stranded.
        TOMP-API source: priority enum.
      enum:
        - ERROR_CANNOT_CONTINUE
        - ERROR_CAN_CONTINUE
        - DISTURBING_ISSUE
        - QUESTION
        - OTHER

    supportStatus:
      type: string
      description: Lifecycle state of the support ticket.
      enum:
        - OPEN
        - IN_PROGRESS
        - RESOLVED
        - CLOSED
        - ESCALATED

    supportContext:
      type: object
      description: >
        References to the PACKAGE, LEG, ASSET, or PRODUCT that the support
        ticket relates to. TOMP-API equivalent: supportTicket.context.
      properties:
        packageId:
          $ref: '#/components/schemas/uuid'
        legId:
          $ref: '#/components/schemas/uuid'
        assetId:
          $ref: '#/components/schemas/uuid'
        productId:
          $ref: '#/components/schemas/uuid'

    evidenceItem:
      type: object
      description: >
        A piece of supporting evidence (photo, video, document) attached to
        a support ticket or registration event. TOMP-API equivalent: evidence
        array item { url, mimeType }.
      required: [url, mimeType]
      properties:
        url:
          $ref: '#/components/schemas/url'
          description: Publicly accessible URL of the evidence file.
        mimeType:
          $ref: '#/components/schemas/shortString'
          description: MIME type of the file (e.g. `image/jpeg`, `image/png`, `application/pdf`).
        description:
          $ref: '#/components/schemas/normalString'
          description: Optional description of the evidence item.
        capturedAt:
          $ref: '#/components/schemas/dateTime'
          description: Timestamp when the evidence was captured.

    notificationType:
      type: string
      description: Type of notification delivered to the traveller.
      enum:
        - BOOKING_CONFIRMED
        - BOOKING_CANCELLED
        - LEG_STARTED
        - LEG_ENDED
        - LEG_DELAYED
        - LEG_DISRUPTED
        - VEHICLE_ASSIGNED
        - SUPPORT_TICKET_UPDATED
        - WARNING
        - PAYMENT_RECEIVED
        - DOCUMENT_READY
        - OTHER

    warningSeverity:
      type: string
      description: Severity level of the warning.
      enum:
        - CRITICAL
        - HIGH
        - MEDIUM
        - LOW
        - INFORMATIONAL

    supportTicket:
      type: object
      description: >
        A support ticket created by a traveller or operator.
        Transmodel: COMPLAINT. TOMP-API equivalent: supportTicket schema.
      x-tm: COMPLAINT
      x-semantics:
        Transmodel: COMPLAINT
        TOMP: supportTicket
        OMSA: supportTicket
      required: [id, supportType, priority, status, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        supportType:
          $ref: '#/components/schemas/supportType'
        priority:
          $ref: '#/components/schemas/supportPriority'
        status:
          $ref: '#/components/schemas/supportStatus'
        context:
          $ref: '#/components/schemas/supportContext'
        comment:
          $ref: '#/components/schemas/longString'
        contactInformation:
          $ref: '#/components/schemas/normalString'
        location:
          $ref: '#/components/schemas/geoJsonPoint'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/evidenceItem'
        agentRef:
          $ref: '#/components/schemas/normalString'
          description: Internal reference of the support agent who handled this ticket.
        resolution:
          $ref: '#/components/schemas/longString'
          description: >
            Resolution text from the support agent. Present only when status
            is RESOLVED or CLOSED.
        timestamp:
          $ref: '#/components/schemas/dateTime'
          description: Time the incident actually occurred.
        createdAt:
          $ref: '#/components/schemas/dateTime'
        updatedAt:
          $ref: '#/components/schemas/dateTime'

    notification:
      type: object
      description: >
        A push notification or message sent to a traveller regarding a PACKAGE,
        LEG, or system event. Transmodel: NOTICE. OMSA equivalent: notification schema.
      x-tm: NOTICE
      x-semantics:
        Transmodel: NOTICE
        OMSA: notification
      required: [id, notificationType, message, sentAt]
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        notificationType:
          $ref: '#/components/schemas/notificationType'
        severity:
          $ref: '#/components/schemas/warningSeverity'
        message:
          $ref: '#/components/schemas/longString'
        packageId:
          $ref: '#/components/schemas/uuid'
        legId:
          $ref: '#/components/schemas/uuid'
        externalReference:
          $ref: '#/components/schemas/normalString'
        sentAt:
          $ref: '#/components/schemas/dateTime'
        read:
          type: boolean
          default: false
          description: Whether the traveller has acknowledged the notification.

