      description: Paginated collection of REFUND OPTIONs.
      required: [refundOptions]
      properties:
        refundOptions:
          type: array
          items:
            $ref: '#/components/schemas/refundOption'
        numberMatched:
          type: integer
        numberReturned:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'

    travelDocumentCollection:
      type: object
      description: Paginated collection of TRAVEL DOCUMENTs.
      required: [travelDocuments]
      properties:
        travelDocuments:
          type: array
          items:
            $ref: '#/components/schemas/travelDocument'
        numberMatched:
          type: integer
        numberReturned:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'

    ancillaryCollection:
      type: object
      description: Paginated collection of ANCILLARY items.
      required: [ancillaries]
      properties:
        ancillaries:
          type: array
          items:
            $ref: '#/components/schemas/ancillary'
        numberMatched:
          type: integer
        numberReturned:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'

    # ── Customisation ─────────────────────────────────────────────

    customProperties:
      type: object
      description: >
        Arbitrary key-value extension bag for system-specific metadata.
        Values must be JSON-serialisable.
      additionalProperties: true
      example:
        internalBookingRef: "XYZ-12345"
        loyaltyPoints: 500
