openapi: 3.0.3
info:
  title: EUDIT Unified Mobility API – Authentication
  description: >
    Authentication and participant registration processes.
    Covers OAuth 2.0 token issuance (OMSA/TOMP-API style) and
    BoB mTLS-based authentication.

    - `POST /oauth/token` — standard OAuth 2.0 token endpoint
    - `POST /processes/obtain-token/execute` — OGC process wrapper for token
      acquisition (machine-to-machine and user flows)
    - `POST /processes/register-participant/execute` — BoB participant
      on-boarding (issues credentials for a new entity in the BoB network)

    Security note: The `/oauth/token` endpoint itself is unauthenticated
    (credentials are in the request body). All other processes require a
    valid bearer token.
  version: 0.1.0

servers:
  - url: https://api.eudit.example.com/v1

tags:
  - name: Authentication
    description: Token issuance, refresh, and BoB participant registration

paths:

  /oauth/token:
    post:
      operationId: obtainOAuthToken
      summary: Obtain OAuth 2.0 access token
      description: >
        Standard OAuth 2.0 token endpoint (RFC 6749).
        Supports the following grant types:

        - `client_credentials` — machine-to-machine
        - `password` — resource owner password (legacy / backend use)
        - `refresh_token` — token refresh
        - `authorization_code` — interactive user flows (token exchange)

        Returns a JWT access token that must be passed as
        `Authorization: Bearer <token>` on all authenticated endpoints.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum:
                    - client_credentials
                    - password
                    - refresh_token
                    - authorization_code
                  example: client_credentials
                client_id:
                  type: string
                  description: OAuth 2.0 client identifier.
                client_secret:
                  type: string
                  description: OAuth 2.0 client secret (for confidential clients).
                username:
                  type: string
                  description: Resource owner username (password grant).
                password:
                  type: string
                  format: password
                  description: Resource owner password (password grant).
                refresh_token:
                  type: string
                  description: Refresh token (refresh_token grant).
                code:
                  type: string
                  description: Authorization code (authorization_code grant).
                redirect_uri:
                  type: string
                  format: uri
                  description: Redirect URI (authorization_code grant).
                scope:
                  type: string
                  example: "read write"
                  description: Space-separated list of requested scopes.
      responses:
        "200":
          description: Token issued successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenResponse'
              example:
                access_token: "eyJhbGciOiJSUzI1NiJ9..."
                token_type: Bearer
                expires_in: 3600
                refresh_token: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
                scope: "read write"
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/obtain-token/execute:
    post:
      operationId: executeObtainToken
      summary: Obtain Token (OGC process)
      description: >
        OGC API Processes wrapper around token acquisition.
        Allows token retrieval using the standard OGC `execute` pattern,
        enabling integration with OGC-native orchestration engines.

        Supports async execution: the token response is delivered to
        `subscriber.successUri` when `prefer: respond-async` is requested.
      tags: [Authentication]
      security: []
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
          description: >
            `respond-async` triggers async execution; the response will be a
            job status object and the result delivered via callback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [grantType]
                  properties:
                    grantType:
                      type: string
                      enum:
                        - client_credentials
                        - password
                        - refresh_token
                        - authorization_code
                      example: client_credentials
                    clientId:
                      $ref: './components.yaml#/components/schemas/normalString'
                    clientSecret:
                      $ref: './components.yaml#/components/schemas/normalString'
                    username:
                      $ref: './components.yaml#/components/schemas/normalString'
                    password:
                      $ref: './components.yaml#/components/schemas/normalString'
                    refreshToken:
                      $ref: './components.yaml#/components/schemas/normalString'
                    code:
                      $ref: './components.yaml#/components/schemas/normalString'
                    redirectUri:
                      $ref: './components.yaml#/components/schemas/url'
                    scopes:
                      type: array
                      items:
                        type: string
                      example: [read, write]
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Token acquisition result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/tokenResponse'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Token obtained synchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenResponse'
        "201":
          description: Async job accepted; result delivered via callback.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/register-participant/execute:
    post:
      operationId: executeRegisterParticipant
      summary: Register Participant (OGC process)
      description: >
        Registers a new participant (retailer, operator, validator) in the
        BoB trust network. This process on-boards an entity by:

        1. Validating the entity's TLS client certificate.
        2. Issuing a BoB auth token embedding the certificate fingerprint
           (`bobHok`) and authorisation group (`bobAuthZ`) as JWT claims.
        3. Storing the entity metadata in the participant directory.

        Transmodel concept: ORGANISATION (retailer or operator role).
        BoB reference: `POST /auth/{entityId}` (BoB Authentication 1.3.0).
      tags: [Authentication]
      security:
        - OAuthPKI: []
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [entityId, entityType, organisationName]
                  properties:
                    entityId:
                      $ref: './components.yaml#/components/schemas/normalString'
                      description: >
                        The entity identifier used in the BoB network.
                        Must be unique within the trust domain.
                    entityType:
                      type: string
                      enum: [RETAILER, OPERATOR, VALIDATOR, AUTHORITY, OTHER]
                      description: >
                        The role of this participant in the BoB network.
                        Determines the `bobAuthZ` group assigned in the JWT.
                    organisationName:
                      $ref: './components.yaml#/components/schemas/normalString'
                    contactEmail:
                      type: string
                      format: email
                    certificateFingerprint:
                      $ref: './components.yaml#/components/schemas/normalString'
                      description: >
                        SHA-1 fingerprint of the entity's TLS client
                        certificate (hex string). Embedded as `bobHok` claim.
                    authGroup:
                      $ref: './components.yaml#/components/schemas/normalString'
                      description: >
                        BoB authorisation group. If not provided, the server
                        assigns a default group based on `entityType`.
                    customProperties:
                      $ref: './components.yaml#/components/schemas/customProperties'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      callbacks:
        jobCompleted:
          '{$request.body#/subscriber/successUri}':
            post:
              summary: Registration result callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/participantRegistrationResult'
              responses:
                "200":
                  description: Callback acknowledged.
      responses:
        "200":
          description: Participant registered synchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/participantRegistrationResult'
        "201":
          description: Async job accepted.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "403":
          $ref: './components.yaml#/components/responses/403Forbidden'
        "409":
          $ref: './components.yaml#/components/responses/409Conflict'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/refresh-token/execute:
    post:
      operationId: executeRefreshToken
      summary: Refresh Token (OGC process)
      description: >
        Refreshes an expired or near-expiry access token using a refresh token.
        Returns a new access token (and optionally a new refresh token).
      tags: [Authentication]
      security:
        - BearerAuth: []
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum: [respond-sync, respond-async]
            default: respond-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [refreshToken]
                  properties:
                    refreshToken:
                      $ref: './components.yaml#/components/schemas/normalString'
                    clientId:
                      $ref: './components.yaml#/components/schemas/normalString'
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        "200":
          description: Token refreshed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenResponse'
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/revoke-token/execute:
    post:
      operationId: executeRevokeToken
      summary: Revoke Token (OGC process)
      description: >
        Revokes an access or refresh token (RFC 7009). After revocation the
        token is no longer accepted by any endpoint.
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  required: [token]
                  properties:
                    token:
                      $ref: './components.yaml#/components/schemas/normalString'
                    tokenTypeHint:
                      type: string
                      enum: [access_token, refresh_token]
                subscriber:
                  $ref: './components.yaml#/components/schemas/subscriber'
      responses:
        "200":
          description: Token revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
                    example: true
        "400":
          $ref: './components.yaml#/components/responses/400BadRequest'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

components:

  securitySchemes:
    BearerAuth:
      $ref: './components.yaml#/components/securitySchemes/BearerAuth'
    OAuth:
      $ref: './components.yaml#/components/securitySchemes/OAuth'
    OAuthPKI:
      $ref: './components.yaml#/components/securitySchemes/OAuthPKI'
    OpenData:
      $ref: './components.yaml#/components/securitySchemes/OpenData'

  schemas:

    tokenResponse:
      type: object
      description: OAuth 2.0 token response (RFC 6749 §5.1).
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
          description: The issued access token (JWT compact serialisation).
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Lifetime of the access token in seconds.
          example: 3600
        refresh_token:
          type: string
          description: Refresh token for obtaining new access tokens.
        scope:
          type: string
          description: Space-separated list of granted scopes.
          example: "read write"
        bobAuthToken:
          $ref: './components.yaml#/components/schemas/bobAuthToken'
          description: >
            BoB-specific auth token, present when the token was issued via
            BoB mTLS authentication (OAuthPKI scheme). Clients interacting
            with BoB-native systems should pass this as `X-BoB-AuthToken`.

    participantRegistrationResult:
      type: object
      description: Result of a participant registration in the BoB network.
      required: [entityId, status]
      properties:
        entityId:
          $ref: './components.yaml#/components/schemas/normalString'
        status:
          type: string
          enum: [registered, pending_verification, rejected]
        bobAuthToken:
          $ref: './components.yaml#/components/schemas/bobAuthToken'
        registeredAt:
          $ref: './components.yaml#/components/schemas/dateTime'
        message:
          $ref: './components.yaml#/components/schemas/normalString'
