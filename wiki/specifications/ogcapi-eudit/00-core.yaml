openapi: 3.0.3
info:
  title: EUDIT Unified Mobility API – Core / Discovery
  description: >
    OGC API Processes-compliant discovery and conformance endpoints for the
    EUDIT unified mobility API. These endpoints are unauthenticated and expose
    the API's capabilities, available processes, and available collections.

    Standards covered: OMSA, TOMP-API, OSDM, BoB, FerryGateway, InterMOD.
    Aligned to: Transmodel, OGC API Processes Part 1 (core + callback + json).
  version: 0.1.0
  contact:
    name: EUDIT Working Group (CEN TC278)
  license:
    name: European Union Public Licence (EUPL) 1.2
    url: https://joinup.ec.europa.eu/collection/eupl/eupl-text-eupl-12

servers:
  - url: https://api.eudit.example.com/v1
    description: Reference implementation server (example)

tags:
  - name: Discovery
    description: Landing page, API definition, and conformance declaration
  - name: Processes
    description: Process catalogue (read-only; execution in module files)
  - name: Collections
    description: Collection catalogue (read-only; items in module files)
  - name: Jobs
    description: Async job status and dismissal

paths:

  /:
    get:
      operationId: getLandingPage
      summary: Landing page
      description: >
        Returns the API landing page with links to the API definition,
        conformance declaration, processes list, and collections list.
      tags: [Discovery]
      security:
        - OpenData: []
      parameters:
        - $ref: './components.yaml#/components/parameters/f'
        - $ref: './components.yaml#/components/parameters/acceptLanguage'
      responses:
        "200":
          description: Landing page returned successfully.
          headers:
            Content-Language:
              $ref: './components.yaml#/components/headers/Content-Language'
            Version:
              $ref: './components.yaml#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/landingPage'
              example:
                title: EUDIT Unified Mobility API
                description: >
                  A unified OGC API Processes interface harmonising OSDM,
                  TOMP-API, BoB, FerryGateway, OMSA, and InterMOD under a
                  single Transmodel-compliant API.
                links:
                  - href: https://api.eudit.example.com/v1
                    rel: self
                    type: application/json
                    title: This document
                  - href: https://api.eudit.example.com/v1/api
                    rel: service-desc
                    type: application/vnd.oai.openapi+json;version=3.0
                    title: API definition
                  - href: https://api.eudit.example.com/v1/conformance
                    rel: http://www.opengis.net/def/rel/ogc/1.0/conformance
                    type: application/json
                    title: Conformance declaration
                  - href: https://api.eudit.example.com/v1/processes
                    rel: http://www.opengis.net/def/rel/ogc/1.0/processes
                    type: application/json
                    title: Processes
                  - href: https://api.eudit.example.com/v1/collections
                    rel: http://www.opengis.net/def/rel/ogc/1.0/data
                    type: application/json
                    title: Collections
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /api:
    get:
      operationId: getApiDefinition
      summary: API definition
      description: Returns the OpenAPI 3.0 definition of this API.
      tags: [Discovery]
      security:
        - OpenData: []
      parameters:
        - $ref: './components.yaml#/components/parameters/f'
      responses:
        "200":
          description: OpenAPI definition returned successfully.
          content:
            application/vnd.oai.openapi+json;version=3.0:
              schema:
                type: object
                description: OpenAPI 3.0 document.
            application/json:
              schema:
                type: object
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /conformance:
    get:
      operationId: getConformanceDeclaration
      summary: Conformance declaration
      description: >
        Declares the OGC API conformance classes implemented by this API.
      tags: [Discovery]
      security:
        - OpenData: []
      parameters:
        - $ref: './components.yaml#/components/parameters/f'
      responses:
        "200":
          description: Conformance declaration returned successfully.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/confClasses'
              example:
                conformsTo:
                  - "http://www.opengis.net/spec/ogcapi-processes-1/1.0/conf/core"
                  - "http://www.opengis.net/spec/ogcapi-processes-1/1.0/conf/callback"
                  - "http://www.opengis.net/spec/ogcapi-processes-1/1.0/conf/json"
                  - "http://www.opengis.net/spec/ogcapi-processes-1/1.0/conf/oas30"
                  - "http://www.opengis.net/spec/ogcapi-common-1/1.0/conf/core"
                  - "http://www.opengis.net/spec/ogcapi-common-2/1.0/conf/collections"
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes:
    get:
      operationId: getProcessList
      summary: List available processes
      description: >
        Returns a list of all processes available in this API deployment,
        grouped by module. Each entry includes the process ID, version,
        supported job-control options, and a self-link to the full process
        description.
      tags: [Processes]
      security:
        - OpenData: []
        - BearerAuth: []
      parameters:
        - $ref: './components.yaml#/components/parameters/f'
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
      responses:
        "200":
          description: Process list returned successfully.
          headers:
            Version:
              $ref: './components.yaml#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/processList'
              example:
                processes:
                  - id: search-offers
                    title: Search Offers
                    version: "1.0.0"
                    jobControlOptions: [sync-execute, async-execute]
                    links:
                      - href: https://api.eudit.example.com/v1/processes/search-offers
                        rel: self
                  - id: purchase-package
                    title: Purchase Package
                    version: "1.0.0"
                    jobControlOptions: [async-execute]
                    links:
                      - href: https://api.eudit.example.com/v1/processes/purchase-package
                        rel: self
                links:
                  - href: https://api.eudit.example.com/v1/processes
                    rel: self
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /processes/{processId}:
    get:
      operationId: getProcessDescription
      summary: Process description
      description: >
        Returns the full description of a single process, including its
        input schema, output schema, job-control options, and links.
      tags: [Processes]
      security:
        - OpenData: []
        - BearerAuth: []
      parameters:
        - $ref: './components.yaml#/components/parameters/processId'
        - $ref: './components.yaml#/components/parameters/f'
      responses:
        "200":
          description: Process description returned successfully.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/process'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /collections:
    get:
      operationId: getCollectionsList
      summary: List available collections
      description: >
        Returns the list of all data collections available in this API.
        Collections represent read-only resource sets (e.g. offers, assets,
        travel documents) queryable via `GET /collections/{collectionId}/items`.
      tags: [Collections]
      security:
        - OpenData: []
        - BearerAuth: []
      parameters:
        - $ref: './components.yaml#/components/parameters/f'
      responses:
        "200":
          description: Collections list returned successfully.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/collections'
              example:
                collections:
                  - id: offers
                    title: Offers
                    description: Transient SALES OFFER PACKAGEs from a search.
                    links:
                      - href: https://api.eudit.example.com/v1/collections/offers
                        rel: self
                      - href: https://api.eudit.example.com/v1/collections/offers/items
                        rel: items
                  - id: travel-documents
                    title: Travel Documents
                    description: Issued TRAVEL DOCUMENTs for confirmed bookings.
                    links:
                      - href: https://api.eudit.example.com/v1/collections/travel-documents
                        rel: self
                      - href: https://api.eudit.example.com/v1/collections/travel-documents/items
                        rel: items
                links:
                  - href: https://api.eudit.example.com/v1/collections
                    rel: self
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /collections/{collectionId}:
    get:
      operationId: getCollectionInfo
      summary: Collection metadata
      description: Returns metadata for a single collection.
      tags: [Collections]
      security:
        - OpenData: []
        - BearerAuth: []
      parameters:
        - $ref: './components.yaml#/components/parameters/collectionId'
        - $ref: './components.yaml#/components/parameters/f'
      responses:
        "200":
          description: Collection metadata returned successfully.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/collectionInfo'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /jobs:
    get:
      operationId: getJobList
      summary: List async jobs
      description: >
        Returns a list of async process jobs for the authenticated caller.
        Supports filtering by status.
      tags: [Jobs]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/offset'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [accepted, running, successful, failed, dismissed]
          description: Filter jobs by status.
        - name: processId
          in: query
          required: false
          schema:
            type: string
          description: Filter jobs by process ID.
      responses:
        "200":
          description: Job list returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: './components.yaml#/components/schemas/jobStatus'
                  links:
                    type: array
                    items:
                      $ref: './components.yaml#/components/schemas/link'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /jobs/{jobId}:
    get:
      operationId: getJobStatus
      summary: Get job status
      description: Returns the current status of an async job.
      tags: [Jobs]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/jobId'
      responses:
        "200":
          description: Job status returned successfully.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

    delete:
      operationId: dismissJob
      summary: Dismiss (cancel) an async job
      description: >
        Requests dismissal of an async job that is in `accepted` or `running`
        state. The job transitions to `dismissed` and no further callbacks
        will be sent.
      tags: [Jobs]
      security:
        - BearerAuth: []
        - OAuth: [write]
      parameters:
        - $ref: './components.yaml#/components/parameters/jobId'
      responses:
        "200":
          description: Job dismissed successfully.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "409":
          $ref: './components.yaml#/components/responses/409Conflict'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

  /jobs/{jobId}/results:
    get:
      operationId: getJobResults
      summary: Get async job results
      description: >
        Returns the results of a completed async job. Only available when
        `status == successful`.
      tags: [Jobs]
      security:
        - BearerAuth: []
        - OAuth: [read]
      parameters:
        - $ref: './components.yaml#/components/parameters/jobId'
      responses:
        "200":
          description: Job results returned successfully.
          content:
            application/json:
              schema:
                type: object
                description: >
                  Process-specific result payload. See the relevant module
                  YAML for the exact schema.
        "401":
          $ref: './components.yaml#/components/responses/401Unauthorized'
        "404":
          $ref: './components.yaml#/components/responses/404NotFound'
        "409":
          description: Job is not yet complete.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/jobStatus'
        "500":
          $ref: './components.yaml#/components/responses/500InternalError'

components:
  securitySchemes:
    BearerAuth:
      $ref: './components.yaml#/components/securitySchemes/BearerAuth'
    OAuth:
      $ref: './components.yaml#/components/securitySchemes/OAuth'
    OAuthPKI:
      $ref: './components.yaml#/components/securitySchemes/OAuthPKI'
    OpenData:
      $ref: './components.yaml#/components/securitySchemes/OpenData'
