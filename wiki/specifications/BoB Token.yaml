swagger: '2.0'
info:
  version: 1.5.0
  title: BoB.Token.API
  description: |
    The token API is used to fetch information about issued tokens. Information
    can be searched using a filter (e.g., pid and serial number) or directly
    looked up using the token thumbprint as primary key. The token API provides
    token revocation status, either per token or by fetching a complete token
    revocation list. The API can also be used for registering hints about where
    one can find tickets issued for the token as well as a registering a
    default payment service provider for the token.
basePath: /api/v1
schemes:
  - https
paths:
  '/token':
    get:
      summary: Get tokens matching query
      description: |
        Get tokenInformation on tokens matching the query. This method is used
        for retrieving the token public key from serial number.
      operationId: getMultipleTokenInformation
      produces:
        - application/json
      tags:
        - tokens
      parameters:
        - name: pid
          in: query
          description: Participant ID of token issuer
          required: true
          type: integer
          format: int64
        - name: serial
          in: query
          description: Token serial number
          required: true
          type: integer
          format: int64
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: false
          type: string
      responses:
        '200':
          description: Token information
          schema:
            type: array
            items:
              $ref: '#/definitions/tokenInformation'
  '/token/{thumbprint}':
    get:
      summary: Get token information by thumbprint
      description: |
        Get tokenInformation on token matching the query. This method is used
        for retrieving the token public key from the unique thumbprint of the
        key.
      operationId: getTokenInformation
      produces:
        - application/json
      tags:
        - tokens
      parameters:
        - name: thumbprint
          in: path
          description: JWK SHA-256 thumbprint of public key (RFC 7638)
          required: true
          type: string
          format: base64url
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: false
          type: string
      responses:
        '200':
          description: Token information
          schema:
            $ref: '#/definitions/tokenInformation'
  '/token/{thumbprint}/revoked':
    get:
      summary: Get token revocation status by thumbprint
      description: |
        Get the revocation status of a single token by its thumbprint. Will
        return a boolean value.
      operationId: getRevocationStatus
      produces:
        - application/json
      tags:
        - tokens
      parameters:
        - name: thumbprint
          in: path
          description: JWK SHA-256 thumbprint of public key (RFC 7638)
          required: true
          type: string
          format: base64url
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: false
          type: string
      responses:
        '200':
          description: Token public key revocation status
          schema:
            $ref: '#/definitions/revocationStatus'
  '/token/revocationlist':
    get:
      summary: Get token revocation list
      description: |
        Get the revocation list entries, either the full list or incremental
        starting from a revocation list entryId.
      operationId: getRevocationList
      produces:
        - application/json
      tags:
        - tokens
      parameters:
        - name: revocationListStartEntryId
          in: query
          description: Get all entries of revocation list after entry
          required: false
          type: integer
          format: int64
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: false
          type: string
      responses:
        '200':
          description: Token revocation list
          schema:
            $ref: '#/definitions/revocationList'
  '/token/{thumbprint}/hint':
    get:
      summary: Get token hints by thumbprint
      description: |
        Get tokenHints on token matching the query. This method is used for
        retrieving hints of tickets issued to the token.
      operationId: getTokenHints
      produces:
        - application/json
      tags:
        - tokens
      parameters:
        - name: thumbprint
          in: path
          description: JWK SHA-256 thumbprint of public key (RFC 7638)
          required: true
          type: string
          format: base64url
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: false
          type: string
      responses:
        '200':
          description: Token hints
          schema:
            $ref: '#/definitions/tokenHints'
    post:
      summary: Provide token hints by thumbprint
      description: |
        Provide tokenHints on token matching the query. This method is used for
        providing hints of tickets issued to the token.
      operationId: postTokenHints
      produces:
        - application/json
      tags:
        - tokens
      parameters:
        - name: thumbprint
          in: path
          description: JWK SHA-256 thumbprint of public key (RFC 7638)
          required: true
          type: string
          format: base64url
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - name: hint
          in: body
          description: Hint
          required: true
          schema:
            $ref: '#/definitions/hint'
      responses:
        '201':
          description: Created
          headers:
            location:
              description: URL of hint
              type: string
        '401':
          description: Unauthorised
  '/token/{thumbprint}/hint/{hintId}':
    get:
      summary: Get token hint
      description: |
        Get token hint matching the query. This method is used for
        retrieving a specific hint of tickets issued to the token.
      operationId: getTokenHint
      produces:
        - application/json
      tags:
        - tokens
      parameters:
        - name: thumbprint
          in: path
          description: JWK SHA-256 thumbprint of public key (RFC 7638)
          required: true
          type: string
          format: base64url
        - name: hintId
          in: path
          description: Hint identifier
          required: true
          type: string
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: false
          type: string
      responses:
        '200':
          description: Token hint
          schema:
            $ref: '#/definitions/hint'
    delete:
      summary: Delete token hint
      description: |
        Delete token hint matching the query. This method is used for
        deleting a specific hint of tickets issued to the token. Only the
        participant that created the hint may delete it.
      operationId: deleteTokenHint
      produces:
        - application/json
      tags:
        - tokens
      parameters:
        - name: thumbprint
          in: path
          description: JWK SHA-256 thumbprint of public key (RFC 7638)
          required: true
          type: string
          format: base64url
        - name: hintId
          in: path
          description: Hint identifier
          required: true
          type: string
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
      responses:
        204:
          description: Successfully deleted hint
        401:
          description: Unauthorised
  '/token/{thumbprint}/psp':
    get:
      summary: Get preferred payment service provider registered to token
      description: |
        Get preferred payment service provider registered to token. This method
        is used for retrieving a payment service which the traveller has selected
        as preferred, and which should be used for withdrawing funds as
        appropriate.
      operationId: getTokenPsp
      produces:
        - application/json
      tags:
        - tokens
      parameters:
        - name: thumbprint
          in: path
          description: JWK SHA-256 thumbprint of public key (RFC 7638)
          required: true
          type: string
          format: base64url
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: false
          type: string
      responses:
        '200':
          description: Registered preferred payment service provider
          schema:
            $ref: '#/definitions/psp'
        '204':
          description: No preferred payment service provider found
    put:
      summary: Set preferred payment service provider registered to token
      description: |
        Set preferred payment service provider registered to token. This method
        is used for setting the payment service which the traveller has selected
        as preferred, and which should be used for withdrawing funds as
        appropriate. There can be only one preferred PSP per token.
      operationId: putTokenPsp
      produces:
        - application/json
      tags:
        - tokens
      parameters:
        - name: thumbprint
          in: path
          description: JWK SHA-256 thumbprint of public key (RFC 7638)
          required: true
          type: string
          format: base64url
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
        - name: psp
          in: body
          description: Payment Service Provider
          required: true
          schema:
            $ref: '#/definitions/psp'
      responses:
        204:
          description: Successful operation
        401:
          description: Unauthorised
    delete:
      summary: |
        Delete preferred payment service provider registered to token
      description: |
        Delete preferred payment service provider registered to token.
      operationId: deleteTokenPsp
      produces:
        - application/json
      tags:
        - tokens
      parameters:
        - name: thumbprint
          in: path
          description: JWK SHA-256 thumbprint of public key (RFC 7638)
          required: true
          type: string
          format: base64url
        - name: X-BoB-AuthToken
          in: header
          description: JWT authentication token
          required: true
          type: string
      responses:
        204:
          description: Successfully deleted psp
        401:
          description: Unauthorised
definitions:
  jwkPublic:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "No direct Transmodel equivalent."
        conditions:
          - "No direct equivalent: a public JSON Web Key (RFC 7517) is cryptographic key material used for signature verification and token binding. Transmodel does not model cryptographic public keys."
    type: object
    description: Public JSON Web Key (RFC 7517)
    required:
      - kty
    properties:
      kty:
        description: JWA key type
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: cryptographic key type metadata is outside the Transmodel information model."
        type: string
        enum:
          - RSA
          - EC
        example: EC
      kid:
        description: JWK key identifier
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: key identifiers are cryptographic infrastructure with no Transmodel counterpart."
        type: string
        example: k2
      crv:
        description: Curve type (required for kty=EC)
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: elliptic curve type is cryptographic key material metadata with no Transmodel counterpart."
        type: string
        example: "P-256"
      x:
        description: EC x coordinate (required for kty=EC)
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: EC key coordinate is raw cryptographic material with no Transmodel counterpart."
        type: string
        format: byte
        example: "f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU"
      y:
        description: EC y coordinate (required for kty=EC)
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: EC key coordinate is raw cryptographic material with no Transmodel counterpart."
        type: string
        format: byte
        example: "x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0"
      n:
        description: RSA modulus parameter (required for kty=RSA)
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: RSA key parameter is raw cryptographic material with no Transmodel counterpart."
        type: string
        format: byte
      e:
        description: RSA exponent parameter (required for kty=RSA)
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: RSA key parameter is raw cryptographic material with no Transmodel counterpart."
        type: string
        format: byte
  serial:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "No direct Transmodel equivalent."
        conditions:
          - "No direct equivalent: the token serial number is a hardware-level identifier for a secure element (e.g. NFC token). Transmodel does not model hardware serial numbers for cryptographic tokens."
    description: Token serial number
    type: integer
    format: int64
    example: 42
  thumbprint:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "No direct Transmodel equivalent."
        conditions:
          - "No direct equivalent: a JWK SHA-256 thumbprint (RFC 7638) is a cryptographic fingerprint of a public key used for key identification and revocation. Transmodel does not model cryptographic key thumbprints."
    description: JWK SHA-256 thumbprint of public key (RFC 7638)
    type: string
    format: base64url
    example: "NzbLsXh8uDCcd-6MNwXF4W_7noWXFZAfHkxZsRGC9Xs"
  tokenInformation:
    x-semantics:
      Transmodel:
        concepts:
          - "MEDIUM ACCESS DEVICE (SD Medium Application MODEL)"
        definition: "A device used by a TRANSPORT CUSTOMER to access a service (e.g. a smart card or mobile phone)."
        conditions:
          - "Partial match to MEDIUM ACCESS DEVICE: tokenInformation describes a registered token device — its serial number, public key, revocation status, and key thumbprint. This corresponds to the registration record of a MEDIUM ACCESS DEVICE in Transmodel, which also carries identity and access credentials."
    type: object
    additionalProperties: true
    required:
      - serial
      - publicKey
    properties:
      serial:
        $ref: '#/definitions/serial'
      revoked:
        type: boolean
        x-semantics:
          Transmodel:
            concepts:
              - "VALIDITY CONDITION (ST Sales Transaction MODEL)"
            definition: "A condition that determines the validity of a SALES OFFER PACKAGE or CUSTOMER PURCHASE PACKAGE."
            conditions:
              - "Partial match to VALIDITY CONDITION invalidation: the revoked flag corresponds to the negation of a VALIDITY CONDITION — the token is no longer valid for use, analogous to a validity condition being invalidated."
        example: false
      thumbprint:
        $ref: '#/definitions/thumbprint'
      publicKey:
        $ref: '#/definitions/jwkPublic'
  tokenHints:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "No direct Transmodel equivalent."
        conditions:
          - "No direct equivalent: tokenHints is a list of compact participant identifiers used by validators to locate tickets tied to a token. This is a BoB-specific lookup optimisation with no counterpart in the Transmodel information model."
    description: Token hints are used to locate tickets (both valid and
      expired) which have been tied to a ticket. The hint only contains the
      participant identifier of the issuer of the ticket. To find out more
      details on the ticket(s), the issuer must be queried using the Ticket API.
    type: array
    items:
      $ref: '#/definitions/hintCompact'
  revocationStatus:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "No direct Transmodel equivalent."
        conditions:
          - "No direct equivalent: revocationStatus reports whether a specific token has been revoked. Transmodel does not model token revocation as a discrete concept; the closest analogy is a VALIDITY CONDITION being invalidated, but that is not a direct structural equivalent."
    type: object
    properties:
      revoked:
        type: boolean
  revocationList:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "No direct Transmodel equivalent."
        conditions:
          - "No direct equivalent: a revocation list is a security infrastructure construct (analogous to a CRL in PKI) used by validators to check token validity offline. Transmodel does not model revocation lists."
    type: array
    items:
      $ref: '#/definitions/revocationEntry'
  revocationEntry:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "No direct Transmodel equivalent."
        conditions:
          - "No direct equivalent: a revocation list entry records the thumbprint and expiry of a revoked token. This is security infrastructure with no Transmodel counterpart."
    type: object
    properties:
      entryId:
        description: Ever increasing revocation list entry identifier
        x-semantics:
          Transmodel:
            concepts:
              - "No direct Transmodel equivalent"
            definition: "No direct Transmodel equivalent."
            conditions:
              - "No direct equivalent: a monotonically increasing revocation entry identifier is a security list management mechanism with no Transmodel counterpart."
        type: integer
        format: int64
        example: 1
      thumbprint:
        $ref: '#/definitions/thumbprint'
      expire:
        description: |
          Expire time stamp as ISO 8601:2004 profile extended format
          (MTS8, chapter 2.3)
        x-semantics:
          Transmodel:
            concepts:
              - "VALIDITY CONDITION.ToDate (ST Sales Transaction MODEL)"
            definition: "The end of a validity period."
            conditions:
              - "Partial match to VALIDITY CONDITION.ToDate: the expire timestamp marks when the revocation entry should be purged, analogous to the end date of a validity condition."
        type: string
        format: date-time
        example: "1985-04-12T23:20:50.52Z"
  hint:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "No direct Transmodel equivalent."
        conditions:
          - "No direct equivalent: a hint records the participant identifier that issued a ticket to a token, plus an expiry for cache management. This is a BoB-specific routing optimisation with no Transmodel counterpart."
    type: object
    required:
      - pid
      - expire
    properties:
      pid:
        description: |
          Participant identifier which has issued a ticket to the token
        x-semantics:
          Transmodel:
            concepts:
              - "OPERATOR.Id (TP Transport Organisation MODEL)"
            definition: "Identifier of an OPERATOR."
            conditions:
              - "Partial match to OPERATOR.Id: the BoB participant identifier (pid) identifies the operator/participant that issued the ticket, structurally analogous to an OPERATOR identifier in Transmodel."
        type: integer
        format: int64
        example: 1
      expire:
        description: |
          Expire time stamp as ISO 8601:2004 profile extended format
          (MTS8, chapter 2.3) to indicate when the entry should be
          purged from the hint list
        x-semantics:
          Transmodel:
            concepts:
              - "VALIDITY CONDITION.ToDate (ST Sales Transaction MODEL)"
            definition: "The end of a validity period."
            conditions:
              - "Partial match to VALIDITY CONDITION.ToDate: the expire timestamp indicates when this hint entry should be purged, analogous to the end of a validity period."
        type: string
        format: date-time
        example: "1985-04-12T23:20:50.52Z"
  hintCompact:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "No direct Transmodel equivalent."
        conditions:
          - "No direct equivalent: hintCompact is a minimal version of hint, carrying only the participant identifier. It is a BoB-specific lookup optimisation with no Transmodel counterpart."
    type: object
    required:
      - pid
    properties:
      pid:
        description: |
          Participant identifier which has issued a ticket to the token
        x-semantics:
          Transmodel:
            concepts:
              - "OPERATOR.Id (TP Transport Organisation MODEL)"
            definition: "Identifier of an OPERATOR."
            conditions:
              - "Partial match to OPERATOR.Id: the participant identifier identifies the issuing operator, structurally analogous to an OPERATOR identifier in Transmodel."
        type: integer
        format: int64
        example: 1
  psp:
    x-semantics:
      Transmodel:
        concepts:
          - "No direct Transmodel equivalent"
        definition: "No direct Transmodel equivalent."
        conditions:
          - "No direct equivalent: a payment service provider (PSP) registration in BoB is a financial services participant record with no direct counterpart in the Transmodel information model, which does not model PSP registration."
    type: object
    required:
      - pid
    properties:
      pid:
        description: |
          Participant identifier which provides the payment service
        x-semantics:
          Transmodel:
            concepts:
              - "OPERATOR.Id (TP Transport Organisation MODEL)"
            definition: "Identifier of an OPERATOR."
            conditions:
              - "Partial match to OPERATOR.Id: the PSP participant identifier identifies the payment-service provider organisation, structurally analogous to an OPERATOR identifier in Transmodel."
        type: integer
        format: int64
        example: 1
